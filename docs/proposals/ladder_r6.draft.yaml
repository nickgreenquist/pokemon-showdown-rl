# LADDER R6 (DRAFT, 2026-09-21) — GEN1 LADDER #5, THE R6 OBJECT UNDER THE SPLIT SCHEDULE
# Status: DRAFT (agent). Ratification path = R5's: `git mv` to configs/eval/ladder_r6.yaml,
#   this line replaced, the M-R6-n markers cleared, rulings recorded in ratified_decisions
#   at the foot. NOT LAUNCHABLE: the object does not exist yet (the R6 fleet has not run) and
#   the maintainer has not ruled M-R6-1..7. tests/test_ladder.py runs on configs/eval/ladder_*
#   only, so this draft is untested until it moves; the invariants it will have to meet are
#   named in-line (glicko_rd_max 40, min_battles 200, max_battles_total > min_battles).
#
# WHAT THIS IS: R5 (ratified 2026-09-15; ENS3 of the W trio, greedy, agent-launched, ONE
#   continuous run: GXE 73.9 / Glicko-1 1697 +/- 25 / Elo 1457, n=200, LISTED) with THREE
#   changes, all ruled on 2026-09-20 ("agree with all"; STATUS, R6 prep plan section 5):
#   (1) the OBJECT is the committee rule R2 of configs/eval/r6_reads_offfp.yaml picks among
#       ENS3-A, ENS3-B, ENS6, ENS9 against the re-drawn R5 committee floor (M-R6-1, filled
#       from that readout, never chosen);
#   (2) the POLICY FORM carries the LOOP BREAKER (ruling #1; `loop_breaker: true`,
#       rl/common/loop_breaker.py, threshold 4) -- a policy-form change said on every number;
#   (3) the SCHEDULE is SPLIT (ruling #4; docs/CLEANUP.md L1): FOUR SESSIONS of ~50 battles at
#       different hours and on different days, its own stopping rule, an explicit
#       calendar-drift disclosure and the repeat-opponent census in the readout.
#   Everything else R4/R5 settled is INHERITED VERBATIM: /timer on, pacing, G-BLIND, the
#   do-not-kill rule, the resume rule, the barred-language list, the profile endpoint as the
#   only rating source, aggregators, the set-pool pin and its 24-h re-check, and the
#   comparison ruling (STANDALONE DESCRIPTIVE MEASUREMENT; no R1..R6 delta is an effect).
#
# THE GOAL IT SERVES (maintainer, 2026-09-15): "break top500 with self play" -- R5 LISTED
#   (Elo 1457 vs a 1354 cutoff). R6 measures whether the R6 object sits higher; it does not
#   project a rating (vs-SH and off-FP numbers are NOT ladder numbers; CLAUDE.md).
#
# journey_step: 11 ("Final gen1 ladder"), reached via 10 repeated under the 2026-09-20
#   ratification of docs/proposals/R6_PREP_PLAN_2026-09-19.md. Exit condition, verbatim
#   (JOURNEY.md step 11): "The number the story ends on." ... "Decide before launching whether
#   the laddered object is greedy or searched." DECIDED: greedy committee with the loop
#   breaker, no search (rulings #1 and #3).
#
# RULINGS (M-R6-n), each with a recommended default; "go with the recs" clears 2-7 and
#   M-R6-1 is filled from the reads readout:
#   M-R6-1 OBJECT -- filled from results/r6_reads_offfp/READOUT.txt rule R2 verbatim (the
#          candidate with the highest point estimate off FP@20; top two within 0.013 -> the
#          larger committee; none above the floor E3WR - 0.013 -> the R5 committee stays).
#          The maintainer ratifies the RULE's output, not a choice. Both FP@20 disclosures
#          travel with the selection number; nothing about it is a credit.
#   M-R6-2 ACCOUNT -- RECOMMENDED: reuse nickgen1rbrlbot (R5 M2 stands: multiple accounts
#          are against the rules and could get the IP banned). The account carries R1 + R4
#          + R5's 600 rated games; the headline discloses the warm-started rating and the
#          cumulative-profile denominators exactly as R4/R5 did.
#   M-R6-3 SCHEDULE -- RULED SPLIT (2026-09-20). RECOMMENDED SHAPE: four sessions with
#          cumulative targets 50 / 100 / 150 / 200, each a separate supervisor launch
#          (`scripts/ladder_supervise.sh <arm> <cumulative target> <prereg>`: --battles is
#          cumulative and the JSONL is the truth, so no code changes), on FOUR DIFFERENT
#          DAYS and at least two distinct time-of-day bands (e.g. a weekday evening, a
#          weekday morning, a weekend afternoon, a weekend night, local time), no two
#          sessions closer than 12 h, the whole run inside 14 calendar days. Each session
#          ends at its cumulative target (~3-4 h at R5's ~230 s/battle); session 4 ends
#          under the stopping rule below or at max_battles_total. Box: no fleet, no eval,
#          local Node STOPPED, a caffeinate bound to the supervisor (R5 M5).
#   M-R6-4 STOPPING RULE for a split schedule -- RECOMMENDED: keys unchanged (rd <= 40 AND
#          n >= 200 of THIS run's logged battles, read at the profile at the END of the
#          last session; tests/test_ladder.py pins both values), with the split-schedule
#          semantics stated: rd GROWS between sessions by inactivity, so it is recorded at
#          every session's end (the JSONL carries the pre-battle rating per battle) and the
#          rule is only evaluated once n >= 200; if rd > 40 at n=200, the licensed
#          continuation is a FIFTH session to n=250 (max_battles_total 250 -- never moves);
#          if still unmet, the run stops at 250 and the readout says so. G-BLIND: no board
#          polling before the cumulative n reaches 200 (rating snapshots at session ends
#          come from the profile, not the board).
#   M-R6-5 DECISION CAP -- RECOMMENDED band [1, 30] ms for a 3-9 member greedy committee
#          with the loop breaker (R5 smoke stamped 2.838 ms for ENS3; the breaker adds a
#          dictionary lookup per turn). The upper bound is the VOID (e) threshold, as R4/R5;
#          FINALIZED from the LG-6 smoke stamp at ratification.
#   M-R6-6 POLICY FORM -- RULED (loop breaker ON). RECOMMENDED: threshold 4 (the default
#          the R5 evals used); every quoted number carries "greedy committee, loop breaker
#          on"; the comparison ruling gains `policy_form_loop_breaker` in its confound list;
#          the readout reports `loop/*` counters (how often it fired) beside the outcome.
#   M-R6-7 ANCHOR BATTERY -- RECOMMENDED: the ladder run does not wait on the battery (R4
#          precedent); the README row WAITS on vs-SH (locked, results/r6_reads/) + FP@20
#          h2h (results/r6_reads_offfp/) + the BC-clone h2h (500; a leg that does not exist
#          reads PENDING and is never dropped).
#
# ENCODER (new in R6; the checkpoint loader enforces it): an R6 committee is c6-ON, so the
#   launch shell exports POKEMON_RL_ENCODER_C6=1 beside V2/IDS (LG-3); if M-R6-1 lands on the
#   R5 committee (the floor case) the flag stays UNSET; if it lands on ENS9 (mixed) the shell
#   also exports POKEMON_RL_ENCODER_C6_ALLOW_MISMATCH=1 and the object is disclosed as mixed
#   on every number. The LG-6 smoke's provenance line must show encoder_c6 matching the
#   object's generation -- a mismatch is an abort before the first rated game.
#   LOADER GAP (2026-09-21 pre-launch review, CONFIRMED): rl/common/checkpoint.py warns on a
#   MISSING meta.yaml c6 stamp only when the process flag is ON and loads silently when it is
#   OFF, so the floor case (flag unset) cannot detect a c6-on member whose meta.yaml is
#   unreadable. OWED BEFORE RATIFICATION (M-R6-8): the loader hard-fails on a missing stamp
#   under either flag state, or LG-6 asserts every member's meta.yaml stamp explicitly.
#
# M-R6-10 WHETHER TO LADDER AT ALL -- RATIFIED 2026-09-24 00:50Z AT >= +0.05. Maintainer, verbatim:
#   "i agree. i want to ladder again with a real winning gain. we already hit our 'goal' of this
#   project: reach the ladder. resources and time should be spent on step change" (in principle
#   2026-09-22: "if we dont see offline gains: why ladder").
#   RULE: LADDER R6 RUNS ONLY IF the object the reads readout's R2 rule picks beats E3WR (the
#   same-session re-drawn R5 committee, same form, loop breaker on) off FP@20 by a POINT DELTA
#   >= +0.05 (configs/eval/r6_reads_offfp.yaml; win-rate scale, ties as non-wins). Below it: no R6
#   ladder run and no exposure spent; the R6 finals become R7's base and the next ladder run is R7's.
#   WHAT IT IS: a bar for SPENDING LADDER EXPOSURE, not for detecting an improvement. R5 listed
#   top-500, which was the project's ladder goal; a further run is spent only on a real winning gain,
#   and time and compute go to the step change (R7).
#   WHY THE NUMBER HOLDS: one committee arm vs E3WR is 3000 vs 3000, se_diff ~0.0128 (the reads
#   pre-reg's own figure), so +0.05 is ~3.9 se_diff; that also absorbs the winner's curse of taking
#   the best of four correlated committees (at most ~+0.01).
#   WHAT IT COSTS, DISCLOSED: the R5 object cleared its own floor by +0.042 (E3WF 0.5987 vs E3HF
#   0.5570, n=3000 each, results/monster_reads_offfp/, 2026-09-15) and went on to list top-500;
#   this bar would have kept it off the ladder. Gains of +0.03..+0.05 are therefore real and go
#   UNLADDERED BY DESIGN -- they carry into R7's base, and "not now" is not "never": an R6 object
#   can still be laddered later, under its own ruling, if R7 stalls.
#   STRUCK 2026-09-24: the draft justified +0.05 as "about +50 Elo at the project's ~+0.10 win rate
#   per ~100 Elo calibration". That projects an FP@20 delta onto the ladder, which the reads pre-reg
#   forbids ("nothing here is a ladder projection in either direction"); the ratified threshold rests
#   on se_diff and on exposure, never on a conversion.
#
# LAUNCH GATES (R5's LG-2..LG-9, adapted; each checked and its evidence line quoted in the
#   readout): LG-2 the account's profile read BEFORE session 1 and BEFORE every later session
#   (any activity between sessions that is not ours is VOID (d) contamination); LG-3 .env
#   PS_USERNAME/PS_PASSWORD present, the encoder exports above; LG-4 pytest tests/test_ladder.py
#   green on the ratified file; LG-5 set-pool re-check within 24 h of session 1; LG-6
#   --local-smoke >= 2 battles on the object: kind=ensemble, `lanes` with every member sha,
#   obs_dim 828, encoder_c6 as expected, loop_breaker in the provenance, mean_decision_ms
#   stamped; LG-7 clean tree, docs committed, LOCAL SERVER STOPPED, nothing else on the box,
#   caffeinate bound to the supervisor -- re-checked before EVERY session; LG-8 build items:
#   BI-R6-1 the readout's split-schedule table (per-session n, dates, hours, rd at session
#   end, rating at session end) and the calendar-drift disclosure -- scripts/ladder_readout.py
#   already computes the distinct-opponent and rematch census; LG-9 the agent reads the
#   startup lines within 90 s of EVERY session's launch (kind, userid character by character,
#   member shas, obs_dim, encoder_c6, the starting rating showing the PARKED values).
#
# BABYSITTING (agent), per session: CPU-time deltas + socket checks hourly;
#   scripts/ladder_supervise.sh relaunches on exit within a session; scripts/ladder_watchdog.sh
#   kills a hung runner; ONE backup per session (scripts/backup_ladder.sh); readout via
#   scripts/ladder_readout.py after session 4 (interim reads after sessions 1-3 are LOG reads,
#   never quoted -- G-BLIND). Do-not-kill: a kill mid-battle forfeits a live rated game.
# ---------------------------------------------------------------------

