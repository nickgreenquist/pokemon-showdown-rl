credit_line_not_applicable: "R6 credits nothing and contains no arm pair a credit could attach to. For the record the line reads: 'a lever is credited iff pooled delta >= +0.025 AND >= 2*se_diff, where se_diff is the LARGER of the pooled-binomial se_diff and the seed-clustered se_diff, the latter computed from the per-seed finals at read time.' The R6 levers' credits live in configs/eval/r6_reads_offfp.yaml R1, off FP@20, never here."

