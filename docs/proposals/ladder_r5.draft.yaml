  descriptive_rates: "unweighted pooled proportion over ALL rated battles in the denominator named beside the rate (n_profile for the record; n_jsonl for bands and rates)"
  ties: "ties count as non-wins in every rate; the server's tie handling for the RATING is the server's and is reported as found"

