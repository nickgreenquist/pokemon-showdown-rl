#   1618 +/- 25 / Elo 1354, n=200) with ONE change of object -- the ladder seat is
#   the log-prob COMMITTEE of the 200M finals (kind: ensemble, which
#   scripts/ladder.py already supports: POLICY_KINDS = greedy | ensemble | search;
#   LADDER R1's object was the 4-lane EnsembleAgent). Everything R4 settled and the
#   maintainer ruled is INHERITED VERBATIM unless a line below says otherwise:
#   stopping rule (rd <= 40 AND n >= 200 of THIS run's logged battles), ONE
#   CONTINUOUS RUN, /timer on, pacing, G-BLIND (no board polling before
#   min_battles), the four G-BLIND stops and no fifth, the do-not-kill rule, the
#   resume rule, the barred-language list, the profile endpoint as the only
#   rating source, aggregators, and the comparison ruling (STANDALONE DESCRIPTIVE
#   MEASUREMENT; no R1/R3/R4/R5 delta may be quoted as an effect).
