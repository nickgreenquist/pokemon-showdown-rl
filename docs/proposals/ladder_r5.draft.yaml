# =====================================================================
# LADDER R5 (DRAFT) — GEN1 LADDER #4, THE COMMITTEE, GREEDY, AGENT-LAUNCHED
# Status: DRAFT 2026-09-15 (pre-filled by the agent during the monster reads;
#   supersedes the 2026-09-12 skeleton). NOT RATIFIED. Lives under
#   docs/proposals/ on purpose: tests/test_ladder.py globs
#   configs/eval/ladder_*.yaml and asserts the literal "Status: RATIFIED" and
#   the ABSENCE of << MAINTAINER n >> markers, so a draft at that path turns the
#   suite red. The ratifying commit `git mv`s this file to
#   configs/eval/ladder_r5.yaml, replaces line 3, clears the markers, fills
#   `arms.R5E.lanes` from the readout, and records the rulings in
#   ratified_decisions at the foot — exactly R4's path
#   (configs/eval/ladder_r4.yaml lines 1-12).
#
# WHAT THIS IS: R4 (ratified 2026-09-04; greedy s112 at 100M: GXE 65.2 /
#   Glicko-1 1618 +/- 25 / Elo 1354, n=200) with TWO changes: (1) the OBJECT is
#   the log-prob COMMITTEE (kind: ensemble; scripts/ladder.py POLICY_KINDS =
#   greedy | ensemble | search; R1's object was the 4-lane EnsembleAgent), its
#   members picked by the monster readout's pre-stated rule R1
#   (configs/eval/monster_reads_offfp.yaml); (2) the LAUNCH is AGENT-SIDE
#   (maintainer ruling 2026-09-14, in chat: "Ladder agent side? Yes but use
#   nickgen1rbrlbot (same account)") — R4's LG-9 human read of the startup lines
#   becomes a LOG read, stated below. Everything else R4 settled and the
#   maintainer ruled is INHERITED VERBATIM: stopping rule (rd <= 40 AND n >= 200
#   of THIS run's logged battles), ONE CONTINUOUS RUN, /timer on, pacing,
#   G-BLIND (no board polling before min_battles), the four G-BLIND stops and no
#   fifth, do-not-kill, the resume rule, the barred-language list, the profile
#   endpoint as the only rating source, aggregators, the set-pool pin and its
#   24-h re-check, and the comparison ruling (STANDALONE DESCRIPTIVE
#   MEASUREMENT; no R1/R3/R4/R5 delta may be quoted as an effect).
#
# THE GOAL IT SERVES (maintainer, 2026-09-15, verbatim): "The must have goal is
#   break top500 with self play" — and not "for more than just 40/200 visits".
#   R4 finished Elo 1354 against a 1358.999 cutoff and VISITED the top 500. This
#   file does not project a rating (vs-SH and off-FP numbers are NOT ladder
#   numbers; CLAUDE.md) — it fields the strongest offline object available and
#   measures. Sitting in the top 500 rather than visiting it needs a rating
#   comfortably above the cutoff (rank fluctuates by about the rating's noise);
#   whether R5 gets there is the run's finding, not a premise.
#
# journey_step: 11 ("the final gen-1 ladder"), reached via 10 (the monster).
#   Exit condition, verbatim from JOURNEY.md step 2 (the ladder steps share it):
#   "the run itself — not a rating, not top-500." The 11.5-before-11 ruling is
#   moot for a GREEDY object (11.5 asks about depth-2 search, a null twice over
#   in docs/search_relook/).
#
# RULINGS (M-R5-n). The maintainer did not know what "R5 rulings" meant
#   (2026-09-14) and was given each in plain words with a recommended default;
#   this file carries those defaults under markers. A one-line "go with the
#   recs" clears 2-6; M-R5-1 is filled from the readout.
#
#   M-R5-1 OBJECT << MAINTAINER 1 >> — which committee. FILLED FROM
#          results/monster_reads/READOUT.txt under the pre-stated rule R1 of
#          configs/eval/monster_reads_offfp.yaml: the candidate (E3WF / E3LF /
#          E6MF / E9F) with the highest off-FP@20 point estimate; top two within
#          0.013 -> the larger committee; none reaches the floor E3HF - 0.013 ->
#          the 100M ENS3 itself. Interim (2026-09-15 12:30Z, phase A done):
#          E3LF 0.496 vs the same-session 100M greedy 0.495 — the L2LAM committee
#          sits at the 100M SINGLE's level; E3WF / E6MF / E9F / E3HF pending.
#          Pins go in `arms.R5E.lanes`; every member's sha256 is below already.
#   M-R5-2 ACCOUNT — RULED 2026-09-14 (maintainer, in chat): REUSE
#          nickgen1rbrlbot. R4 M6 stands verbatim ("multiple accounts are
#          against the rules and could get my ip banned"). The headline
#          discloses the warm-started rating and the cumulative-profile
#          denominators exactly as R4 did.
#   M-R5-3 n << MAINTAINER 3 >> — RECOMMENDED 200, one run, then decide.
#          More battles tighten the estimate but do not raise it; rd converges
#          under 40 well before n=200 on a reused account; every battle is
#          exposure (ladder exposure is the scarce resource — memory
#          `ladder-ban-risk-budget`).
#   M-R5-4 DECISION CAP << MAINTAINER 4 >> — RECOMMENDED band [1, 30] ms for a
#          3-9 member greedy committee (R1's 4-lane ensemble 6.74 ms; R4's rule
#          of ~5x margin over the smoke's stamp). The standing "<= 5 s per
#          decision for a searched object" ruling is moot for greedy. The upper
#          bound IS the VOID (e) threshold, as R4. FINALIZED from the LG-6 smoke
#          stamp at ratification (R4 ADJ-5).
#   M-R5-5 SCHEDULE << MAINTAINER 5 >> — RECOMMENDED one continuous run, plan
#          12-16 h, budget 17 h, hard ceiling ~22 h (R4 M7 verbatim), on a box
#          that is NOT running a fleet or an eval (the committee's forwards are
#          cheap, but the ladder's 150 s/turn is wall-clock and the R2 stall
#          shape must not meet a rated game). Fleet 2 is SKIPPED (ruled
#          2026-09-14); the read queue must have printed QUEUE DONE.
#   M-R5-6 ANCHOR BATTERY << MAINTAINER 6 >> — RECOMMENDED: the ladder run
#          does not wait on the battery (R4 precedent); the README row WAITS on
#          vs-SH (locked protocol, phase C of the read queue) + BC-clone h2h
#          (500) + FP@20 h2h (phase A/B of the read queue). A leg that does not
#          exist is PENDING, never dropped. The committee's BC-clone leg does not
#          exist yet and is reported PENDING.
#
# LAUNCH GATES (R4's LG-2..LG-9, adapted for an agent launch; each is checked
#   and its evidence line quoted in the readout):
#   LG-2 ACCOUNT: nickgen1rbrlbot's profile read BEFORE launch and recorded
#        (rating values + n as found; rd as found). ANY activity on the account
#        since R4's stop (2026-09-04/05) is VOID (d) contamination.
#   LG-3 .env carries PS_USERNAME=nickgen1rbrlbot and PS_PASSWORD (present,
#        79 bytes, never printed); the launch shell exports
#        POKEMON_RL_ENCODER_V2=1 POKEMON_RL_ENCODER_IDS=1 (bare, the seat dies
#        at OBS_DIM 612 and burns relaunches doing it — R4 F17).
#   LG-4 pytest tests/test_ladder.py green on the ratified file, incl.
#        TestSetPoolIntegrity.
#   LG-5 set-pool upstream re-check within 24 h (pin below; unchanged since R4:
#        vendored 59da482e, data.json 85fc2743..., teams.ts 277d5a37...,
#        re-verified 2026-09-15 12:40Z).
#   LG-6 --local-smoke >= 2 battles on R5E against the LOCAL server: kind=
#        ensemble, `lanes` (plural) with every member sha, obs_dim 828, NO
#        dose/lane key, mean_decision_ms stamped (FINALIZES M-R5-4's threshold).
#   LG-7 clean tree, docs committed, LOCAL SERVER STOPPED (the ladder speaks to
#        sim.smogon.com; the fleet's watchdogs are gone, so nothing restarts
#        Node), nothing else on the box, a caffeinate bound to the supervisor.
#   LG-8 build items: none new; R4's BI-R4-2/5/6 readout items carry their
#        named fallbacks.
#   LG-9 (AGENT LAUNCH — replaces R4's human ~90 s at the terminal): the agent
#        reads the runner's startup lines from the log within 90 s of launch
#        and quotes them in the launch commit: kind=ensemble, the userid
#        character-by-character, the member sha256s, obs_dim, and the starting
#        rating line showing R4's PARKED values (an EMPTY "none yet" rating =
#        WRONG ACCOUNT — the fresh-account tell inverts under reuse). A mismatch
#        is an operational abort BEFORE the first rated game.
#
# BABYSITTING (agent): CPU-time deltas + socket checks each hour;
#   scripts/ladder_supervise.sh relaunches on exit, scripts/ladder_watchdog.sh
#   kills a hung runner (0% CPU, no TCP — the R3 n=10 shape); ONE mid-run
#   backup (scripts/backup_ladder.sh); readout via scripts/ladder_readout.py;
#   the docs commit. Do-not-kill: a kill mid-battle forfeits a live rated game.
# ---------------------------------------------------------------------

