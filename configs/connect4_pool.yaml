# Phase 4 pool arm: PPO self-play against the historical snapshot pool.
#
# One-key diff discipline: this file and connect4_naive.yaml differ ONLY in
# pool_size (and run_name), so the chunk-4 forgetting demonstration compares
# arms, never configs. Numbers are the locked Phase 4 config (PLAN.md).
#
# The divergences from the MinAtar PPO recipe, each with its locked reason:
#   gamma 1.0 — terminal-only +/-1 reward, so every reward is a delayed
#     reward and gamma < 1 would down-weight the only signal there is; the
#     critic learns exactly P(win) - P(loss).
#   lr 2.5e-4 CONSTANT, anneal off — experimental, not empirical: an lr
#     decaying to 0 freezes the policy late and would suppress the very
#     forgetting this phase exists to demonstrate.
#   clip_eps 0.2, not MinAtar's 0.1 — every self-play reference uses 0.2.
#
# Pool mechanics: opponent 'self' makes rl/train.py build a SnapshotPool and
# share the one object across all 8 sub-envs. A snapshot pushes every 20
# updates (1024 transitions each), eviction keeps the step-0 anchor and
# drops the second-oldest, and the 80/20 draw picks the latest snapshot or a
# uniform historical one per episode. eval_opponent must stay a FIXED
# external anchor: against its own pool a policy scores ~50% by
# construction, and 'self' there refuses to resolve.
env_id: Connect4-v0
seed: 0
total_steps: 2000000
eval_every: 50000
eval_episodes: 400   # at 100 the se on eval/return_mean is 0.093 — rungs closer than ~120 Elo are a coin flip
num_envs: 8
torch_threads: 1     # measured 3.9x faster than torch's default on this env
checkpoint_every: 200000  # the ladder the chunk-3 tournament plays
run_name: connect4_pool_s0
logger: wandb
eval_win_rate: true
selfplay:
  opponent: self
  eval_opponent: heuristic
  pool_size: 20
  push_every_updates: 20
  latest_prob: 0.8
agent:
  algo: ppo
  hidden_sizes: [128]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95    # 1.0 is the pre-registered probe arm at the pathfinder
  rollout_steps: 128  # 8 envs x 128 = 1024 per update -> ~1953 updates at 2M
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
