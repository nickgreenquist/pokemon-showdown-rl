# PPO on Hopper-v5 with NORMALIZATION OFF — the Phase 3 control arm.
#
# Byte-identical to configs/hopper_ppo.yaml except normalize_obs,
# normalize_reward and run_name. It exists because SAC runs raw (every
# published SAC number does), which would otherwise leave the SAC-vs-PPO
# headline confounded by the environment stack rather than the algorithm.
# Running PPO raw closes that by measurement: the headline compares SAC-raw
# against PPO-raw on an identical stack, and PPO-normalized is reported
# alongside to price what the stack is worth.
#
# Pre-registered: PPO may do BADLY here. Observation and reward normalization
# is one of the few PPO implementation details with positive published ablation
# evidence, and this track is where it stops being a no-op. If PPO-raw
# collapses, that is a finding — "PPO needs normalization on this track" — not
# a strawman to hide behind, and any "SAC beats PPO" claim must still hold
# against PPO-NORMALIZED, which is PPO's honest best.
#
# ~5 min for all 9 control runs, which is why this arm is cheap enough to be
# the right answer to the confound.
env_id: Hopper-v5
seed: 0
total_steps: 1000000
eval_every: 50000
eval_episodes: 10
run_name: hopper_ppo_raw
device: cpu
num_envs: 1
normalize_obs: false
normalize_reward: false
logger: wandb
agent:
  algo: ppo
  hidden_sizes: [64, 64]
  lr: 3.0e-4
  lr_anneal_steps: 1000000
  gamma: 0.99
  gae_lambda: 0.95
  rollout_steps: 2048
  epochs: 10
  minibatches: 32
  clip_eps: 0.2
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5
