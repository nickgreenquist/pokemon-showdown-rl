# P5 — rollout-length SNR probe (pre-registered 2026-08-03; a mechanism
# probe under the milestone-3 stop rule, NOT a bar-chaser).
#
# Needs the local Showdown server running:
#   cd showdown && node pokemon-showdown start --no-security
#
# One variable: rollout_steps 128 -> 512 on the showdown_heur_512 recipe,
# 8 envs x 512 = 4096 transitions/update (4x the Phase-4 cadence). Under
# terminal-only +/-1 reward at gamma=1, per-update advantage noise is
# dominated by episode-outcome variance — P3 (2026-08-03) prices how much
# of that outcome is decided by the server's team draw — and rollout length
# is the config's only true SNR knob: per-minibatch advantage normalization
# makes an lr test meaningless (explicitly rejected 2026-08-01). Same lr,
# same epochs x minibatches (minibatch grows 256 -> 1024), same everything
# else; 4x fewer updates at the same budget is part of what is being tested.
#
# Arms: 6M x 3 seeds (CLI --seed 0/1/2 --run-name showdown_r512_s{0,1,2}),
# Stage-0 concurrent. Control (evaluated BEFORE launch, 2026-08-03):
# heur_512 s{0,1,2} ckpt_006000000 under the locked 1000-battle protocol —
# same recipe, same budget, rollout_steps 128.
#
# Pre-registered read, locked before launch:
#   R0 gates: entropy in [0.2, 1.0] late, ties <= 4%, steps/s within ~25%
#     of the heur_512 2-wide 685 — outside => read HOLDS, mechanism first.
#   PRIMARY: pooled 3-seed finals (final ckpt, 1000 battles/seed, ties as
#     non-wins) vs the pooled 3-seed 6M control. CREDITED iff delta >=
#     +0.026 (2*se_diff at n=3000 each). At/below => NOT credited:
#     rollout-length SNR exonerated at this scale and budget.
#   SECONDARY (recorded, not gated): 4-6M rung band vs the baseline's
#     0.346/0.316-band lineage; approx_kl per update (4x batch at fixed lr
#     should move less per update); entropy trajectory.
#   AMENDMENT CONDITION (pre-stated per the stop rule): CREDITED => the
#     README "Where this goes next" paragraph gains the measured sentence
#     and a 12M-extension decision opens; NOT credited => session-log entry
#     only, the shipped section is untouched.
env_id: Showdown-v0
seed: 0
total_steps: 6000000
eval_every: 100000
eval_episodes: 100
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_r512_s0
logger: wandb
eval_win_rate: true
selfplay:
  opponent: heuristics
  eval_opponent: heuristics
agent:
  algo: ppo
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 512  # the one changed line vs showdown_heur_512_s0.yaml
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
