# Phase 5 milestone 1: PPO vs MaxBasePowerPlayer on gen1randombattle.
#
# Needs the local Showdown server running:
#   cd showdown && node pokemon-showdown start --no-security
#
# Collection is the zero-new-code path settled by the 2026-07-29 three-review
# design pass: SyncVectorEnv over Showdown-v0 (~1.2k decisions/s, so this 2M
# run is ~30 min wall). num_envs buys decorrelation and an 8-wide inference
# batch, NOT throughput — sub-envs step serially, each blocking on a server
# round trip. The lockstep facade is the named follow-up if the wall ever
# binds (PLAN.md, measurement (e) first).
#
# Numbers follow the locked Phase 4 recipe where the reasons transfer:
#   gamma 1.0 — terminal-only +/-1 reward (same shape as Connect 4); the
#     critic learns exactly P(win) - P(loss).
#   gae_lambda 0.95, clip_eps 0.2, entropy_coef 0.01 — the Phase 4 campaign
#     config; episodes here are ~33 decisions vs Connect 4's ~10-30, same
#     horizon regime.
#   hidden_sizes [64, 64] — vector obs (the 10-dim placeholder encoder), so
#     the CartPole-scale MLP, not Connect 4's conv net. The encoder-design
#     step revisits both together.
# eval_episodes 100 for in-training checkpoint selection only (eval runs
# serially at ~1.1k steps/s; 100 episodes ~ 3 s). The >=1000-battle headline
# number is a post-hoc scripts/eval_checkpoint.py pass, never in-training.
env_id: Showdown-v0
seed: 0
total_steps: 2000000
eval_every: 100000
eval_episodes: 100
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_maxbp_s0
logger: wandb
eval_win_rate: true
selfplay:
  opponent: max_power
  eval_opponent: max_power
agent:
  algo: ppo
  hidden_sizes: [64, 64]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128  # 8 envs x 128 = 1024 per update, the Phase 4 cadence
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
