# Milestone-3 Stage-0 probe: the self-play run-1 recipe at 100k steps,
# timing-only (evals suppressed, steps/s from meta.yaml -> checkpoint.pt
# mtimes — the showdown_probe_100k.yaml pattern). Run SOLO first, then the
# 3-wide shakeout (configs/showdown_sp_shakeout.yaml).
#
# What the solo read decides (pre-registered, 2026-07-31 design session):
# the systems review priced the seat-2 pool opponent at +0.04-0.14
# ms/step — the spread is one unmeasured quantity, the
# SimpleHeuristicsPlayer.choose_move cost the fixed-bot baseline already
# pays — predicting 760-825 steps/s solo vs the baseline's 840-859.
#   solo >= 700 steps/s => the batch-1 PoolPlayer path is confirmed and the
#     lockstep facade stays parked through milestone 3;
#   solo < 700 => re-open the facade question — but via measurement (e)
#     and simulator: 4 (showdown/config/config.js) first; the facade's own
#     measured ceiling is ~5%.
# MUST run in the maintainer's terminal (the 10x Claude-tooling slowdown
# rule is fatal to a throughput measurement).
env_id: Showdown-v0
seed: 0
total_steps: 100000
eval_every: 200000
eval_episodes: 10
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: sp_probe_solo
logger: tensorboard
eval_win_rate: true
init_from: runs/showdown_heur_512_s0/ckpt_012000000.pt
selfplay:
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 150
  latest_prob: 0.8
agent:
  algo: ppo
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
