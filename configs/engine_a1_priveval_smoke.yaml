# =====================================================================
# ENGINE PRIVILEGED-EVALUATOR SMOKE (design B) — engine_a1 + two agent keys
#
# THIS IS A SMOKE, NOT A PRE-REGISTRATION. It has no arms, no credit line, no
# PRIMARY read and no verdict. Nothing it produces is comparable to anything
# banked, and no README row may cite it. Its ONE job is to show that the seam
# built on 2026-09-10 carries REAL NUMBERS on the engine route — that the
# evaluator head is reading a live 408-block and not zeros, and that it fits
# something — before any pre-registered arm depends on it.
#
# journey_step: 7.5 (the engine port), build-and-smoke work INSIDE it. Step
#   7.5's exit condition, verbatim: "7.5 closes on A-1 re-run on the fixed
#   build". THIS FILE DOES NOT SERVE THAT EXIT and does not claim to; it is
#   the capability the JOURNEY-10 monster's arm B needs, staged early so the
#   monster's pre-reg is not also a first integration. STATUS.md:43-44 says
#   nothing 100M+ runs on the engine before 7.5 exits — a smoke read in its
#   first updates is not a 100M run, but LAUNCHING IT IS A MAINTAINER CALL.
#
# WHAT IT CHANGES against configs/engine_a1.yaml — four lines, no more:
#   agent.priv_eval_dim: 408    the emitter; ONLY the evaluator head reads it
#   agent.priv_eval_coef: 0.5   design B's separate evaluator head
#   run_name / env_kwargs.seat_tag   lane identity only
# Everything else — collector.mode/k/team_bank/min_bank_pairs/learner_seat,
# env_kwargs.opp_action, the whole selfplay block, every agent hyperparameter
# including total_steps and lr_anneal_steps — is engine_a1's, UNCHANGED. The
# horizon is deliberately not shortened: keeping lr_anneal_steps == the
# control's means the lr at update N is the control's lr at update N, so the
# first updates are readable against A-1's own curves instead of against a
# rescaled schedule. The smoke is READ IN ITS FIRST UPDATES AND KILLED.
#
# THIS IS DESIGN B ALONE, AND THAT IS THE POINT. The emitter and the two
# possible consumers of the block are independent keys:
#
#   agent.privileged_dim  D18 / DESIGN A: `self.critic` widens to obs || priv,
#                         so the block enters the ADVANTAGE channel. ABSENT
#                         from this file, deliberately.
#   agent.priv_eval_dim   DESIGN B: only `priv_eval_head` reads the block.
#
# Either key makes the collector emit. Only the first one changes what produces
# advantages. D18's falsifier fired on the ADVANTAGE channel — "EV rose on
# EVERY lane ... while win rate stayed flat" — so a lane that widened the
# critic to get a leaf evaluator would be carrying that hazard for nothing.
# Here `self.critic` is the ordinary D18-free critic: same width, same
# parameters, bit-identical init AND bit-identical updates to a lane with no
# privileged keys at all (pinned by tests/test_priv_eval_head.py). The head's
# construction rewinds the global RNG stream, so even the minibatch
# permutations match.
#
# ---------------------------------------------------------------------
# R0 GATES — what would be checked in the FIRST UPDATES
#
# Every gate in configs/engine_a1.yaml's R0 block still applies (entropy band,
# clip_frac != 0, the four aux/* gates, eval/win_rate in (0,1),
# collect/policy_version_lag_p99 <= 1, eval/no_outcome ABSENT). These are the
# ones this file adds. ACTION ON ANY FAIL: kill the lane; the seam is wrong.
#
#  S-1 NOT ZEROS.  The drained batch's `privileged` array: abs(x).sum() > 0 and
#      x.std() > 0, with more than a quarter of the 408 columns non-constant.
#      This is the entire content of the two refusals that were lifted ("the
#      wide critic would train on zeros"). Pinned offline by
#      tests/test_engine_privileged_seam.py (329/408 columns non-constant on
#      1,530 real rows).
#  S-2 SHAPE.  batch["privileged"].shape == (n_rows, 408) and n_rows ==
#      len(batch["obs"]) == lengths.sum(). A ragged block is refused Rust-side
#      by `rows2`; this is the Python-side pair.
#  S-3 THE CRITIC IS NARROW, THE HEAD IS WIDE.
#      agent.critic.ctx_net[0].weight.shape[1] == 5 * entity_dim (640 at
#      entity_dim 128) — the ORDINARY critic, unwidened — while
#      agent.priv_eval_head.ctx_net[0].weight.shape[1] == 8 * entity_dim
#      (1024). Critic params 494,849 (NOT D18's 642,305) and actor params
#      626,059; the actor never widens (entity_deepsets.py:356-357). A wide
#      critic here means `privileged_dim` leaked into the config and the lane
#      is running A+B.
#  S-4 THE NEW HEAD IS LEARNING.  `loss/priv_eval_value` FALLS and
#      `priv_eval/explained_variance` RISES over the first ~10 updates. Both
#      keys must be present from update 1; their absence means the head was
#      never built. Offline the head goes 18.92 -> 0.014 and EV -14.5 -> 0.988
#      over 20 updates on a fixed synthetic batch.
#      THE SECONDARY READ THIS LANE EXISTS FOR:
#      `priv_eval/explained_variance` against `loss/explained_variance` on the
#      SAME batch. The head sees the foe's own side and the critic does not, so
#      the gap between them is what a privileged leaf evaluator would buy. It
#      is DESCRIPTIVE — a smoke reads no verdict from it.
#  S-5 PARITY.  tests/test_engine_privileged_seam.py::test_the_engine_
#      privileged_block_is_the_python_block green in the pre-flight suite —
#      the Rust block equals the Python block BITWISE on real rows. A shifted
#      slice reaches the critic with no error anywhere.
#  S-6 THE ACTOR'S OTHER METRICS DID NOT MOVE.  `loss/entropy`,
#      `aux/labelled_frac`, `aux/illegal_label_frac` and `loss/clip_frac`
#      distributionally identical to a paired engine_a1 lane over the first
#      250k steps. The aux head's inputs are PROVABLY unchanged by
#      privileged_dim (tests/test_privileged_aux_seam.py), so drift here means
#      the lift was not minimal.
#      ON THIS FILE S-6 IS AN EQUALITY, NOT A BAND. Because `privileged_dim` is
#      absent, nothing widens and nothing moves the RNG stream: the actor's and
#      the critic's INITIAL weights, and every update they take on the same
#      rows, are BIT-IDENTICAL to an engine_a1 lane at the same seed. (The
#      collector's rows themselves are not identical — asking the Rust side for
#      the block does not change the battle sequence, but the two lanes still
#      diverge as soon as the policies do. The pinned equality is offline, on a
#      fixed batch: tests/test_priv_eval_head.py.)
#      THE RESIDUE THIS FILE AVOIDS, recorded so a later A+B arm expects it:
#      `privileged_dim` DOES move the actor's initial weights at a fixed seed —
#      actor param sum 334.851 at 0 vs 410.510 at 408, identical param count —
#      because `init_head` re-inits the whole net after the widened critic has
#      moved the RNG stream. An arm that sets `privileged_dim` is NOT paired at
#      initialisation with its control even at the same seed.
#
# UNMEASURED, and owed before any arm relies on this: the engine-route COST of
# the block. It is a SECOND full 828 encode per learner row inside the Rust
# step (env.rs:295-302). The ceiling from the banked profile is <= ~3% of wall
# (the entire Rust side is <= 8.7% of collection and collection is 34.9% of
# wall at k=8); the measurement is `scripts/engine_t1.py --leg b` run twice,
# flag off then on. Quote it as a bound until then, never as a measurement.
#
# ---------------------------------------------------------------------
# RUNTIME at k=8, width 1 (30,720 steps per update: rollout_steps 3840 x
# num_envs 8)
#
# Two measured rates, both at k=8, and they bracket what this lane will do:
#   * 2,390 steps/s — one lane, IDLE box, evals off (SPEEDUP.md maxout table).
#   * 1,502 steps/s — per lane on the LIVE A-1 fleet, 3 wide, 900 s conforming
#     window (NOTES.md T-1(d), 2026-09-09). This is the number to plan against
#     if anything else is running.
#
#   the R0 read (~10 updates = 307,200 steps):  2.1 min .. 3.4 min
#   the first eval tick (250,000 steps):        1.7 min .. 2.8 min
#   12,000,000 steps:                           1.40 h .. 2.22 h
#   the inherited 50,000,000 horizon:           5.8 h  .. 9.2 h
#
# Evals are EXCLUDED from both rates (eval_every 250,000, eval_episodes 100, on
# the server against SimpleHeuristicsPlayer) — budget them separately.
#
# CLAUDE.md rule 4: read-and-kill is minutes and is agent-side work. Running to
# 12M is 1.4-2.2 h — the "under 2 h / ask first" boundary. Running the inherited
# 50M horizon is over 5 h and the maintainer launches it.
#
# CLAUDE.md rule 2: a second lane needs a DISTINCT --seed. One lane is enough
# for a smoke. THE INHERITED seed 66 IS ALSO A-1's, and A-1's re-run is queued
# on 66/75/83 — `seat_tag: pe` keeps the EVAL seats apart (that is what the tag
# is for), but if this lane would run AT THE SAME TIME as an A-1 lane, override
# `--seed` rather than relying on the tag.
# =====================================================================
env_id: Showdown-v0
seed: 66                   # lanes 2/3 via --seed 75 / 83
total_steps: 50000000      # INHERITED from engine_a1 so lr_anneal_steps can
                           # match it; the SMOKE is read in its first updates
                           # and killed (see RUNTIME above)
eval_every: 250000
eval_episodes: 100
num_envs: 8                # x rollout_steps = the 30,720-step update budget
torch_threads: 1
checkpoint_every: 500000
run_name: engine_pe_smoke_s66   # a second lane needs a DISTINCT --seed (rule 2)
logger: wandb
eval_win_rate: true
collector:
  mode: engine             # THE TREATMENT
  k: 8                     # MATCHES the banked arm's concurrency 8 (see K)
  team_bank: data/engine/teams_a1_5000000.bin   # 5,000,000 pairs; EXISTS (built
                           # 2026-09-09). A smoke may point at any bank meeting
                           # min_bank_pairs below.
  min_bank_pairs: 1000000  # ENFORCED at launch (rl/train.py) — a floor in prose
                           # is not a floor; a lane pointed at the 50,000-pair
                           # bank would otherwise train and stamp a valid
                           # meta.yaml [R2-M4]
  learner_seat: p1
env_kwargs:
  opp_action: true
  seat_tag: pe             # eval-seat naming only; DISTINCT from a1's so this
                           # lane never shares a Showdown username with an A-1
                           # lane at the same seed (rule 2's failure shape)
selfplay:
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 5
  latest_prob: 0.8
agent:
  algo: ppo
  trunk: entity_deepsets
  aux_oppact_coef: 0.1
  aux_label_space: l6
  aux_scorer_sizes: [96]
  aux_head_gain: 0.01
  aux_max_grad_norm: 0.5
  trunk_kwargs:
    species_vocab: 152
    move_vocab: 166
    embed_dim: 64
    entity_dim: 128
    pool: max
    ctx_sizes: [384, 384]
    scorer_sizes: [256]
    value_sizes: [384, 384]
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  lr_anneal_steps: 50000000   # == total_steps; the CONTROL'S schedule (anneal trap)
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 3840
  epochs: 4
  minibatches: 120
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  # --- THE ONLY TWO ADDED KEYS -------------------------------------------
  priv_eval_dim: 408          # THE EMITTER, AND ONLY THE HEAD READS IT. The
                              # engine collector's `privileged` flag is derived
                              # from the agent's own need
                              # (PPOAgent.privileged_block_dim), so there is no
                              # collector.privileged key. 408 is the encoder's
                              # PRIV_DIM, asserted at compile time in
                              # engine/pkmn_gen1/src/encoder.rs and checked at
                              # launch; any other value is refused.
                              # NOTE WHAT IS *NOT* HERE: `privileged_dim`. That
                              # key is D18/design A and it widens self.critic,
                              # putting the block into the ADVANTAGE channel —
                              # the exact channel D18's falsifier fired on. This
                              # lane's critic is bit-identical to a lane with no
                              # privileged keys at all.
  priv_eval_coef: 0.5         # DESIGN B: a SEPARATE evaluator head beside the
                              # critic, regressing the SAME returns from
                              # obs || priv, with its own params, its own Adam
                              # group at the critic's lr, and its own gradient
                              # clip. It feeds NOTHING — advantages and the
                              # policy gradient still read self.critic. 0.5 is
                              # value_coef's scale and is NOT a tuned number:
                              # this is a smoke, and the coefficient a real arm
                              # runs is that arm's pre-reg to state.
  # priv_eval_max_grad_norm defaults to 0.5 (the aux head's budget) and is left
  # at its default on purpose — one unstated knob is one fewer thing a reader
  # has to check against the control.
