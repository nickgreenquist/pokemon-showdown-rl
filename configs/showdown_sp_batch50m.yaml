# Q2. DOSE-MATCHING, DECLARED BEFORE LAUNCH (discharges the D25-era rule
#   "decide up front whether dose is matched and how you'd know").
#   "Dose" is ambiguous for a batch lever, so every candidate quantity
#   is MATCHED, THE LEVER, or DISCLOSED — no third category, no unnamed
#   quantity. Every M-item is an arithmetic identity asserted by
#   tests/test_ch5_r2_prereg.py, not a claim.
#
#   MATCHED:
#   M1 Environment steps: 50,000,000 both arms (train.py stops at
#      step >= total_steps, step += num_envs, 8 | 50e6).
#   M2 Gradient steps: control 48,828 x 16 = 781,248; treatment
#      1,627 x 480 = 780,960 (-0.037%, entirely the discarded tail N6).
#      GRAD STEPS PER ENV STEP IDENTICAL: 16/1024 = 480/30720 = 1/64.
#   M3 Optimizer passes over each datum: epochs 4 both arms.
#   M4 Minibatch SIZE: 256 both arms. LOAD-BEARING, not cosmetic:
#      ppo.py:989 z-scores advantages PER MINIBATCH, so minibatch size
#      is an effective-step-size knob; letting it grow to 7,680 would
#      be a SECOND LEVER (see the marked correction beside §3b A4 in
#      the migrated CHAPTER5 §3 below).
#   M5 LR-anneal dose: ppo.py:965 computes steps_seen = updates *
#      horizon * num_envs — STEP-indexed, moves with the lever free.
#      lr at any step identical; granularity 1,024- -> 30,720-step
#      ticks (max one-tick lr difference 1.54e-7).
#   M6 Opponent-pool trajectory: push_every_updates 150 -> 5 holds
#      153,600 steps/push and EXACTLY 325 pushes, identical fill step
#      (pool_size 20 fills at the same env step); member generator
#      seeds 0..324 and eviction structure identical (both are
#      functions of the push index). Checkable worked example: both
#      arms have taken 26 pushes at 4M steps.
#   M7 Eval and checkpoint STEP GRID: train.py:677/682 test step
#      thresholds at 8-step granularity OUTSIDE the rollout branch —
#      200 evals at the 250k grid, 100 rungs at the 500k grid, both
#      arms, byte-identical cadence (verified: 200 eval rows / 100
#      rungs in the banked control). There is NO rollout quantization
#      on eval or checkpoints. (Latent trap recorded for future
#      levers: this safety rests on num_envs | eval_every.)
#
#   THE LEVER — one quantity, three inseparable mechanical consequences;
#   R2 claims them AS ONE LEVER ("episodes per update") and does not
#   attribute among them:
#   L1 Episodes averaged into each gradient estimate: ~32 -> ~959.
#   L2 Policy refreshes over the run: 48,828 -> 1,627.
#   L3 Within-update staleness: grad steps per behaviour-policy
#      snapshot 16 -> 480. PPO's clip is a trust region around pi_old;
#      L3 is the axis an over-large dose fails on, measured by
#      loss/clip_frac and loss/approx_kl (T1-T3 below).
#
#   DISCLOSED, NOT LEVERS:
#   N4 push_every_updates 150 -> 5 (the M6 key; listed here because it
#      IS a config diff — a lever-carrying key, not a second lever. At
#      150 the treatment would get 10 pushes over the whole run and the
#      pool would NEVER FILL: a different opponent curriculum, a
#      confound bigger than the lever).
#   N5/C-CAD LOGGING CADENCE: loss/* and time/* update rows fall
#      48,828 -> 1,627. time/collect_sec and time/update_sec are
#      per-rollout SUMS (30x larger per row); loss/* rows average 480
#      grad steps not 16 (~5.5x less noisy). In-loop curves are NOT
#      like-for-like vs the control; EVERY cross-arm log statistic in
#      this pre-reg is computed on 500k-STEP BINS, never raw rows (a
#      raw-row average weights the control 30:1). Eval numbers are
#      unaffected (final-checkpoint protocol). W&B volume ~unchanged
#      (97.4% of rows are per-episode; total rows fall ~3.3%).
#   N6 Discarded tail experience: control 128 steps (0.0004%);
#      treatment 18,560 steps (0.037%) — the named cause of M2's gap.
#   N7/C-GAE BOUNDARY-TRUNCATED ADVANTAGE TAILS (designer B; the
#      leading suspect on a POSITIVE read, the way C-1 was on a
#      negative one in the control's header): GAE's recursion starts
#      from A_T=0 at the rollout boundary, so the last episode per
#      env-slice has a truncated tail. At 32.047 decisions/episode the
#      control truncates 1 in 3.99 episodes = 25.0%; the treatment 1
#      in 119.8 = 0.83%. NOT separable from the batch; part of any
#      effect may be "30x fewer truncated tails", and the readout
#      names it rather than claiming it away.
#   C-EV EXPLAINED VARIANCE IS NOT CROSS-ARM COMPARABLE: EV's
#      denominator is estimated from ~32 episode clusters (control) vs
#      ~959 (treatment); the noisy-denominator bias inflates the
#      treatment's EV. CONSEQUENCE, BINDING: the lambda ruling (Q4)
#      reads the CONTROL's EV only and is NEVER reopened on the
#      treatment's EV.
