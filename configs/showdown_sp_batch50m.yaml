# Q4. LAMBDA: 0.95, HELD. A config choice on the explained-variance
#   diagnostic (STATUS next-action 2), decided under a rule stated
#   BEFORE the answer (designer A), and NOT an arm:
#   RULE: lambda moves off 0.95 only if BOTH (R1) the CONTROL's
#   bootstrap channel is broken — 3-lane mean of loss/explained_variance
#   over the final 20% of the run <= 0.25, or any lane negative /
#   collapsing in the final third — AND (R2) the change adds no second
#   differing key vs the banked control. R1 FAILS: the control reads
#   0.5913 / 0.5859 / 0.5824 (final-20% means; finals 0.6831 / 0.6438 /
#   0.5687; peaks 0.82-0.87; never negative). R2 FAILS by construction:
#   the control is banked, so a lambda change makes R2 a two-lever
#   stack (D29r2's own disclosure verbatim), un-dischargeable against
#   JOURNEY step 1's "the batch change is the lever; everything else
#   stays fixed", and buying attribution back costs a second 50M fleet.
#   HONEST COUNTER-ARGUMENT, RECORDED NOT SUPPRESSED: at gamma 1.0,
#   terminal-only reward, T=32.047, lambda 0.95 puts weight 0.95^31 =
#   0.203 on the actual outcome at t=0 — ~80% of early-turn advantage
#   signal is critic bootstrap at EV ~0.59 — and lambda 1.0's variance
#   cost is exactly what a 30x batch absorbs. Entered in the JOURNEY
#   step-8 ledger as a ONE-LEVER follow-up against R2's own treatment
#   as control; named now so it cannot be rediscovered post-hoc.
#   DIAGNOSTIC CAVEATS, BOTH BINDING: (i) EV is computed against the
#   lambda-return target (ppo.py:934) — a lambda-DEPENDENT statistic
#   that can answer "is the incumbent broken?" but cannot rank 0.95 vs
#   1.0; (ii) C-EV (Q2): the lambda call reads the CONTROL's EV and is
#   never reopened on the treatment's. Note C-GAE already moves most of
#   what a longer credit horizon would buy, free (designer B).
