# follow-up carries 0.02 unchanged (~3.9x stronger vs that budget's
# drift, where the pathology is worse). The "one e-fold per budget"
# convention is how 0.02 was picked once, not a per-budget rule.
# Cross-check: lr*lambda = 5e-6/step = half standard AdamW decay,
# anchored at theta0.
