# THE ONE LEVER. After every optimizer step, every covered parameter
# of BOTH nets decays toward its own initialization:
#
#     theta <- theta - group_lr * l2_init_decay * (theta - theta0)
#
# DECOUPLED (AdamW-style), NOT a loss term — measured reasons:
# (1) a coupled lambda*||theta-theta0||^2 under Adam is preconditioned
#     by 1/sqrt(v): the lambda at which the pull matches the task
#     gradient spans ~3 orders of magnitude across blocks (~1.5e-4
#     critic ctx to ~1.7e-1 critic head, s35/s36 Adam state; s37's
#     post-blowup state degenerate, excluded — ~1200x range), and for
#     near-zero-gradient (dormant) parameters Adam normalizes the pull
#     up to a full lr step: a coupled L2-init here IS a dormancy-
#     triggered soft reset, functionally adjacent to the CONFIRMED-
#     DECLINED ReDo/reset family. Decoupled decays every displacement
#     at the same fractional rate.
# (2) Adam eps 1e-5 is ~6-41% of measured RMS(sqrt(v)) across trunk
#     blocks (s35/s36) — a coupled term's strength would be part-set
#     by a numerical constant.
# (3) A coupled term rides inside clip_grad_norm_ and loss/grad_norm —
#     rescaled by a time-varying clip during exactly the pathology it
#     targets, and contaminating the D22-watch statistics vs every
#     control curve. Decoupled applies after the step: grad_norm /
#     clip_frac stay bit-comparable to Rung 2 / 50M / D18 curves
#     (verified against ppo.py's zero_grad->backward->clip->step
#     order, 4 epochs x 4 minibatches).
#
# COVERAGE: every parameter of actor AND critic EXCEPT those inside
# nn.LayerNorm modules. Basis: the _subnet stack (Linear-ReLU-Linear-
# LN) is APPROXIMATELY scale-invariant (ReLU positively homogeneous,
# LN kills scale up to eps; exact only where theta0=0 — biases are
# zero-init so their decay is exactly gauge, weights approximately).
# The LN gain is the compensating knob and stays free. CONSEQUENCE,
# drawn honestly: mon/move/field subnets (~45% of actor init squared
# norm) are gauge-protected, so GLOBAL norm statistics are ~half
# functionally inert — every functional read below therefore uses the
# LN-FREE blocks (species_emb, move_emb, ctx_net, scorer, slot_bias,
# head). slot_bias covered (bare nn.Parameter; an isinstance(Linear)
# filter would miss it). Frozen params skipped.
# theta0 = the seed's init, captured AFTER init_head() and
# .to(device), held as detached clones in a PLAIN LIST — never
# Parameters, never buffers, never in state_dict()'s module keys
# (guard: assert actor/critic state_dict keys identical to the
# l2_init_decay=0.0 build — a polluted state_dict breaks plain-828
# loading and crashes the d22 measurement scripts). theta0 IS
# regenerable for a fixed (seed, config) — construction is
# deterministic given both; R0-9 asserts it — the D18 header's
# "never claim init-match" was about DIFFERENT configs consuming
# different construction RNG. Stored once per run dir as theta0.pt
# with a hash stamped in every checkpoint (Q4 resolved: 60 identical
# 4.5 MB riders is strictly worse). LOAD GUARD, scoped to the
# TRAINING construction path only: resuming with l2_init_decay>0 and
# no theta0.pt (or hash mismatch) raises. The EVAL path never touches
# theta0 — score_ladder/eval_checkpoint on a D23 checkpoint must work
# unchanged (a guard in the shared loader would break the locked
# eval; scope it).
#
# COEFFICIENT, CLOSED-FORM (procedurally tuning-free; the target is a
# stated CONVENTION, not a forced choice): one anchor e-fold over the
# budget —
#     lambda = 1 / (lr * N_opt),  N_opt = floor(12e6/(128*8)) * 16
#            = 11,718 * 16 = 187,488  (matches s26's counted updates)
#     lambda = 1 / (2.5e-4 * 187,488) = 0.0213 -> OPERATIVE 0.02
