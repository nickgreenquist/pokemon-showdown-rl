# PPO on CartPole: Phase 2 chunk 3 — first real consumer of the vectorized
# collection path and the rollout buffer. Numbers are the locked chunk-3 spec
# (reference-validated under Tanh MLPs); the step budget matches the 150k
# REINFORCE run so the overlay comparison is honest. lr stays constant —
# annealing is deferred to the MinAtar benchmark configs.
env_id: CartPole-v1
seed: 0
total_steps: 150000
eval_every: 5000
eval_episodes: 20
run_name: cartpole_ppo
device: cpu
num_envs: 8
logger: wandb
agent:
  algo: ppo
  hidden_sizes: [64, 64]
  lr: 2.5e-4
  gamma: 0.99
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
