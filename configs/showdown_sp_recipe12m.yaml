#    latest_prob are unchanged so the pool refresh CADENCE is matched —
#    but late in the run the pushed policies are near-copies of a
#    frozen learner, so the opponent DISTRIBUTION's late diversity is
#    not. **Both anneal credits are against a STATIONARY scripted
#    opponent, where freezing is pure convergence; in self-play it
#    freezes the whole system. Unmeasured, disclosed, and it is the
#    mechanism by which a self-play anneal could underperform its
#    vs-SH credit.**
