env_id: Showdown-v0
seed: 38
total_steps: 6000000
eval_every: 250000
eval_episodes: 100
num_envs: 8
torch_threads: 1
checkpoint_every: 500000
run_name: showdown_br50m_s38
logger: wandb
eval_win_rate: true
selfplay:
  opponent: runs/showdown_sp_struct50m_s36/checkpoint.pt   # FROZEN target
  eval_opponent: heuristics                                # fixed anchor, free curve
agent:                       # the 50M winner's recipe, fresh init, verbatim
  algo: ppo
  trunk: entity_deepsets
  trunk_kwargs:
    species_vocab: 152
    move_vocab: 166
    embed_dim: 64
    entity_dim: 128
    pool: max
    ctx_sizes: [384, 384]
    scorer_sizes: [256]
    value_sizes: [384, 384]
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  lr_anneal_steps: 0
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
