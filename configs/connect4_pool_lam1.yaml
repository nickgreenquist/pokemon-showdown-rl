# Pathfinder probe arm: gae_lambda 1.0 — one of the two forks PLAN.md left
# open to be settled by measurement. With a terminal-only reward and an
# inaccurate critic, lambda 0.95 delivers only ~0.61 of the outcome to the
# opening move of a mean-length game; lambda 1.0 is pure Monte Carlo
# advantage. Diff vs connect4_pool.yaml: gae_lambda and run_name only.
env_id: Connect4-v0
seed: 0
total_steps: 2000000
eval_every: 50000
eval_episodes: 400
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: connect4_pool_lam1_s0
logger: wandb
eval_win_rate: true
selfplay:
  opponent: self
  eval_opponent: heuristic
  pool_size: 20
  push_every_updates: 20
  latest_prob: 0.8
agent:
  algo: ppo
  hidden_sizes: [128]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 1.0     # THE probe diff
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
