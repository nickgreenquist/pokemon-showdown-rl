# Milestone-3 shakeout: the self-play run-1 recipe at 500k steps, 3 seeds
# CONCURRENT (Stage-0 pattern), evals on — the last gate before the
# overnight campaign (~13 min for what 5+ hours will ride on). An 8k smoke
# cannot see entropy trajectory, tie rate, episode-length drift, pool
# growth, or 3-wide throughput; this can.
#
# Pass gates (pre-registered, 2026-07-31 design session) — ALL must hold
# or the overnight does not launch:
#   - steps/s >= 575 per run at 3-wide (0.833 x the Stage-0 probe's 691;
#     mtime read, meta.yaml -> checkpoint.pt);
#   - loss/entropy >= 0.20 at 500k (the 12M run held 0.29-0.36 all run);
#   - training tie fraction <= 4% and mean rollout/episode_length <= ~37
#     (1.5x the 12M run's ~24.5) — the R0 stall-equilibrium gate, read
#     early;
#   - selfplay/pool_size reaches 4 (step-0 anchor + 3 pushes at cadence
#     150 by update ~488);
#   - selfplay/winrate_anchor present and plausibly ~0.35-0.65 (the
#     learner vs the 0.408 policy it IS at step 0).
# MUST run in the maintainer's terminal.
env_id: Showdown-v0
seed: 0
total_steps: 500000
eval_every: 100000
eval_episodes: 100
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_sp_shakeout_s0
logger: wandb
eval_win_rate: true
init_from: runs/showdown_heur_512_s0/ckpt_012000000.pt
selfplay:
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 150
  latest_prob: 0.8
agent:
  algo: ppo
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
