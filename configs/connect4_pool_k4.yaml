# Pathfinder probe arm: kernel_size 4 — the receptive-field fork PLAN.md
# left open. A Connect 4 win is a line of FOUR; the inherited 3x3 kernel
# sees at most three of it and leaves composition to the FC layer, while a
# 4x4 unit sees a whole line (and the actor SHRINKS to 26,135 params).
# Diff vs connect4_pool.yaml: kernel_size and run_name only.
env_id: Connect4-v0
seed: 0
total_steps: 2000000
eval_every: 50000
eval_episodes: 400
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: connect4_pool_k4_s0
logger: wandb
eval_win_rate: true
selfplay:
  opponent: self
  eval_opponent: heuristic
  pool_size: 20
  push_every_updates: 20
  latest_prob: 0.8
agent:
  algo: ppo
  hidden_sizes: [128]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  kernel_size: 4      # THE probe diff (default 3)
