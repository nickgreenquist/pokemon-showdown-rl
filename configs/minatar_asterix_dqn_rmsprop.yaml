# Paper-optimizer arm: minatar_asterix_dqn.yaml with centered RMSprop
# (alpha=0.95, eps=0.01, hardcoded in dqn.py), same lr. RMSprop reproduced
# the paper on Seaquest/SpaceInvaders where Adam plateaued; Asterix (13.25
# Adam vs paper ~16.5) is the remaining gap game. Completes the 5-game
# replication with the paper's optimizer.
env_id: MinAtar/Asterix-v0
seed: 0
total_steps: 5000000
eval_every: 100000
eval_episodes: 20
run_name: minatar_asterix_dqn_rmsprop
device: cpu
logger: wandb
agent:
  algo: dqn
  hidden_sizes: [128]  # post-conv FC sizes; the conv trunk is fixed at 16@3x3
  lr: 2.5e-4
  optimizer: rmsprop
  gamma: 0.99
  buffer_capacity: 100000
  batch_size: 32
  learning_starts: 5000
  target_update_every: 1000  # gradient steps between hard target syncs
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_decay_steps: 100000
  double: false
  dueling: false
  n_step: 1
