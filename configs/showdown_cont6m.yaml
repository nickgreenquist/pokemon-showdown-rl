# Phase 5 milestone 3, run 1 (control arm): continued heuristics training
# from the SAME 12M capacity checkpoint at the SAME 6M budget as the
# self-play arm. configs/showdown_sp6m.yaml verbatim except the selfplay
# block (fixed heuristics opponent, no pool) and run_name — the two arms
# isolate the training distribution as the single variable. All
# pre-registered reads (R0-R5), gates and expected values live in the
# sp6m header; this arm supplies R1/R2's matched-budget baseline, R3's
# CT-final corner, and — as a 3-seed read of continued fixed-bot training —
# retires the n=1 status of the 0.408 lineage.
#
# Needs the local Showdown server running:
#   cd showdown && node pokemon-showdown start --no-security
# Launch: 3 seeds concurrent (Stage-0 pattern), after the self-play arm's 3.
env_id: Showdown-v0
seed: 0
total_steps: 6000000
eval_every: 100000
eval_episodes: 100
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_cont6m_s0
logger: wandb
eval_win_rate: true
init_from: runs/showdown_heur_512_s0/ckpt_012000000.pt
selfplay:
  opponent: heuristics
  eval_opponent: heuristics
agent:
  algo: ppo
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128  # 8 envs x 128 = 1024 per update, the Phase 4 cadence
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
