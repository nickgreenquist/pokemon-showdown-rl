# Every eval command needs BOTH env vars too.
env_id: Showdown-v0
seed: 26
total_steps: 12000000
eval_every: 100000
eval_episodes: 100
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_sp_struct12m_s26
logger: wandb
eval_win_rate: true
# LADDER RULE: as committed, this file is the Rung-1-NULL branch (gamma
# 1.0, no shaping, comparator 0.3890). If Rung 1 CREDITS, the one legal
# pre-launch edit is to add `env_kwargs: {hl_shaping: 1.0}` here and set
# `gamma: 0.95` below, and to read against Rung 1's pooled final instead.
selfplay:                # identical to showdown_sp12m_v2.yaml
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 150
  latest_prob: 0.8
agent:
  algo: ppo
  trunk: entity_deepsets   # THE TREATMENT. Default is "mlp" (bit-identical
                           # to today); this is the only structural change.
  trunk_kwargs:
    species_vocab: 152     # 151 gen-1 species + unknown
    move_vocab: 166        # 165 gen-1 moves + unknown
    embed_dim: 64          # H&L use 128; halved to hold the param ceiling
    entity_dim: 128        # per-mon / per-move subnet output
    pool: max              # DeepSets max-pool over each team (H&L's choice)
    ctx_sizes: [384, 384]
    scorer_sizes: [256]    # shared per-action scorer -> scalar
    value_sizes: [384, 384]  # separate stack; never masked; no shared trunk
  hidden_sizes: [512, 512]   # unused when trunk != mlp; kept so a
                             # trunk: mlp rerun of this file is exact
  lr: 2.5e-4
  lr_anneal_steps: 0
  gamma: 1.0               # Rung-1-NULL branch; -> 0.95 on the credit branch
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
