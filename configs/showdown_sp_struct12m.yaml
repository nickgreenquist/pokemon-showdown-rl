# chapter. Rung 1 is configs/showdown_sp_signal12m.yaml and MUST HAVE
# READ OUT before this launches (see THE LADDER RULE).
#
# POST-RATIFICATION AMENDMENTS (mirror of Rung 1's; D13a/D10a):
#   1. ENCODER: the chase runs on v2/808 (Stage-0 MUST_RECHARGE fix,
#      commit 0c83339). Every "807" below reads 808, "827" reads 828,
#      "vec[:807]" reads "vec[:808]"; fingerprints also expect
#      recharge_fix: true.
#   2. COMPARATOR: every "0.3890" below is DEAD (cross-semantics, D13).
#      The baseline is showdown_sp12m_v2r's pooled finals (v2/808, seeds
