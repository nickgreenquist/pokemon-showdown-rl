# P6 TREATMENT — annealed-lr 12M on the credited r512 recipe.
#
# Needs the local Showdown server running (simulator: 4):
#   cd showdown && node pokemon-showdown start --no-security
#
# The full pre-registration — arms, R0 gates, PRIMARY credit line, the
# confounded secondary, and the amendment condition — lives in the control
# config, configs/showdown_r512_12m.yaml. Read it there; it is locked for
# both arms and duplicating it invites the two copies to drift.
#
# One variable vs that control: lr_anneal_steps 0 -> 12000000 (linear
# 2.5e-4 -> 0 over the full budget, existing machinery, no code change).
# From scratch by necessity: rl/train.py refuses init_from with
# lr_anneal_steps, so P5b's 6M annealed checkpoints cannot be extended.
env_id: Showdown-v0
seed: 0
total_steps: 12000000
eval_every: 100000
eval_episodes: 100
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_r512_lra12m_s0
logger: wandb
eval_win_rate: true
selfplay:
  opponent: heuristics
  eval_opponent: heuristics
agent:
  algo: ppo
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  lr_anneal_steps: 12000000  # the one changed line vs showdown_r512_12m.yaml
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 512
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
