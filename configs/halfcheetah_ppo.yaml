# PPO on HalfCheetah-v5 — the annotated reference config for the continuous
# track. Hopper and Walker2d are this file with the env_id and run_name
# changed; one hyperparameter set for all three, per-env tuning is the probe
# tier, exactly as on the discrete track.
#
# RECIPE: CleanRL ppo_continuous_action, taken whole rather than assembled
# from parts. Every number below was verified against that source, and it is
# also the PPO paper's own MuJoCo setting (Table 3: horizon 2048, Adam 3e-4,
# 10 epochs, minibatch 64, gamma 0.99, lambda 0.95, 1M timesteps) with
# separate 64-64 tanh actor and critic nets (paper section 6.1). The chunk-4
# lesson is why it is taken whole: mixing knobs from two coherent recipes is
# how the MinAtar config ended up mis-tuned.
#
# ONE DELIBERATE DEVIATION: no value-loss clipping, where CleanRL ships
# clip_vloss=True. This keeps the chunk-3 lock, which rests on ablation
# evidence (Engstrom et al. 2020 found no benefit; Andrychowicz et al. 2021
# found it can hurt). SB3's shipped default also omits it.
#
# Divergences from our own discrete configs, stated per knob:
#   lr anneal is ON here (chunk 4 turned it off on MinAtar). That finding was
#     recipe-local: MinAtar's useful lr turned out to be 4-13x the reference
#     default, and annealing dragged the time-averaged lr into a documented
#     dead zone. CleanRL's MuJoCo numbers are anneal-on at 3e-4.
#   entropy_coef 0.0 vs 0.01. Exploration here rides on the learned log_std,
#     not on a bonus; the PPO paper uses no entropy bonus on MuJoCo. Entropy
#     is still logged, and loss/policy_std is the readable version of it.
#   clip_eps 0.2, the reference value (MinAtar uses 0.1 on our own evidence).
#   num_envs 1 x 2048 steps, where the discrete track runs 8 x 128.
#
# NORMALIZATION is on for both observations and rewards, and it is new harness
# surface rather than an agent setting: statistics are checkpointed with the
# policy, and eval reads them frozen. On MinAtar both were no-ops worth
# skipping (binary planes, 0/1 rewards); here observations are unbounded and
# returns grow with the policy.
#
# ANCHORS (directional, not a target). CleanRL's identical recipe at 1M on the
# v4 envs, 3 seeds: HalfCheetah 1442 +/- 46, Hopper 2383 +/- 272, Walker2d
# 2288 +/- 572. No credible published PPO-at-1M numbers exist for v5. v4->v5
# transfer differs per env: HalfCheetah is clean (no dynamics or reward
# change), Hopper near-clean (a healthy-reward fix worth about -1/episode),
# Walker2d directional only (right-foot friction 0.9 -> 1.9). The 5800-class
# HalfCheetah numbers in SB3-zoo and Tianshou come from differently tuned
# recipes -- landing near 1500 here is ON anchor, not a bug to hunt.
#
# Arithmetic: 1 env x 2048 steps = 2048 transitions per update; 1M / 2048 =
# 488 full updates (1,024 trailing transitions discarded mid-fill, ~0.1%).
# 50k evals divide evenly into 1M.
#
# Seeds 0 / 100 / 200 for cross-repo consistency (at num_envs 1 the sub-env
# seed fan-out that motivated the spacing cannot collide anyway).
env_id: HalfCheetah-v5
seed: 0
total_steps: 1000000
eval_every: 50000
eval_episodes: 10
run_name: halfcheetah_ppo
device: cpu
num_envs: 1  # top-level, never under agent: — make_agent injects num_envs itself
normalize_obs: true
normalize_reward: true
logger: wandb
agent:
  algo: ppo
  hidden_sizes: [64, 64]  # separate tanh actor and critic, chunk-3 architecture
  lr: 3.0e-4
  lr_anneal_steps: 1000000  # linear to ~0 over the full budget
  gamma: 0.99
  gae_lambda: 0.95
  rollout_steps: 2048
  epochs: 10
  minibatches: 32  # 2048 / 32 = minibatch 64
  clip_eps: 0.2
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5
