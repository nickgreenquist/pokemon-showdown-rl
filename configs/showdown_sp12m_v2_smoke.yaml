# Smoke for showdown_sp12m_v2.yaml (not an experiment; no pre-registration):
# 30k steps of the identical selfplay+v2 recipe to prove the integration
# (v2 encoder under the live env, fixed pool, fingerprint stamping) before
# the overnight lanes. Seed 13 per the seed allocation. Verify after:
# meta.yaml encoder block says v2/807, battles progress, no exceptions.
env_id: Showdown-v0
seed: 13
total_steps: 30000
eval_every: 15000
eval_episodes: 10
num_envs: 8
torch_threads: 1
checkpoint_every: 15000
run_name: showdown_sp12m_v2_smoke
logger: wandb
eval_win_rate: true
selfplay:
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 150
  latest_prob: 0.8
agent:
  algo: ppo
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  lr_anneal_steps: 0
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
