# PPO on Walker2d-v5 — continuous-track benchmark run. Every number is
# identical to configs/halfcheetah_ppo.yaml, which carries the full
# annotation: recipe provenance, the per-knob divergences from the discrete
# track, the anchor numbers and the v4->v5 caveats. One hyperparameter set for
# all three envs; per-env tuning is the probe tier, as it was in Phase 1.
#
# Env note: Walker2d terminates on falling, like Hopper, so episode length is
# again an early health readout. Its published anchor (2288 +/- 572) is the
# LEAST transferable of the three across the v4->v5 boundary: v5 changed the
# right foot's friction from 0.9 to 1.9 (the two feet were asymmetric by
# accident in v4) on top of the healthy-reward fix. Treat that number as
# directional only. Note also the widest seed spread of the three envs — with
# 3 seeds, a difference of a few hundred here is not a finding.
env_id: Walker2d-v5
seed: 0
total_steps: 1000000
eval_every: 50000
eval_episodes: 10
run_name: walker2d_ppo
device: cpu
num_envs: 1
normalize_obs: true
normalize_reward: true
logger: wandb
agent:
  algo: ppo
  hidden_sizes: [64, 64]
  lr: 3.0e-4
  lr_anneal_steps: 1000000
  gamma: 0.99
  gae_lambda: 0.95
  rollout_steps: 2048
  epochs: 10
  minibatches: 32
  clip_eps: 0.2
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5
