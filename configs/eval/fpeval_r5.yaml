# FOUL PLAY'S OWN EVALUATOR, IN OUR SEARCH — hacking, not a pre-reg
# (maintainer 2026-09-17: "pre-reg is for ladder runs. For hacking and trying
# ideas, keep going by yourself"). Nothing here is a headline number; if any of
# it becomes one it gets the full treatment first.
#
# THE QUESTION. JOURNEY 11.5 came back a null: depth-2 over depth-1 is -0.0007
# at matched override rate, for 3.27x the compute (RESULTS §22). The standing
# explanation is that our critic, fit by PPO only to states our own policy
# reaches, degrades on the lines a search visits — while Foul Play converts
# compute into strength with a 202-line heuristic because it is the SAME
# function everywhere and is scored as a DIFFERENCE FROM THE ROOT, so constant
# bias cancels and a deeper tree asks it no harder a question.
#
# So: swap ONLY the leaf evaluator (rl/search/fp_eval.py, verified against
# hand-computed values from poke-engine 0.0.48's Rust), keep the dose, the
# opponent model, the object and the selector SHAPE, and re-ask the depth
# question. If depth pays with their evaluator and not with ours, the evaluator
# is isolated as the cause and "search substitutes for a value function, and
# ours is the wrong shape for it" stops being a hypothesis.
#
# WHAT MUST STILL BE MATCHED, because these are the parts that stop us fooling
# ourselves rather than ceremony:
#   * OVERRIDE RATE. The heuristic's values spread wider: at delta 0.10 it
#     overrides 18.4% of decisions against our critic's 7.2% (measured, smoke
#     2026-09-17). An unmatched override rate turned a -0.0007 null into a
#     -0.053 "significant" result yesterday. Phase S sweeps delta; the read
#     matches D1's REALIZED read-phase rate of 0.0682.
#   * A SAME-SESSION GREEDY ANCHOR. The same frozen committee read 0.5987 on
#     09-15 and 0.5747 on 09-17. Session offset is ~0.02 on both FP instruments.
#   * COUNTERS ON DISK. heuristic/fired_rate must be ~1.0 or the vehicle did
#     not run and the arm says nothing.
#
# COST NOTE, to be reported rather than hidden: with this vehicle the ENCODER
# IS NOT RUN (it exists only to feed a critic nobody is asking), so depth-1 is
# ~30 ms/decision against our critic's ~88. The comparison is evaluator-vs-
# evaluator at EQUAL DOSE, not at equal wall clock, and the wall-clock gap is a
# finding in its own right.
#
# BANKED COMPARATORS, all off FP@20 on the same three checkpoints:
#   D1  depth-1, our critic, delta 0.10, override 0.0682 : 0.5687 (n=3000)
#   D2M depth-2, our critic, delta 0.20, override 0.0620 : 0.5680 (n=3000)
#   G0  greedy committee, 2026-09-17 session             : 0.5747 (n=1500)

