# THE OFF-FOUL-PLAY HALF of the monster's [RWL-3] SECONDARY read, and THE
# READ THAT PICKS LADDER R5's OBJECT (M-R5-1). Everything is off FP@20
# (search_time_ms 20 PER ARM; the MA-10 failure is a mis-set budget that
# yields an indistinguishable JSON), greedy or committee, n=3000 per arm
# ([RWL-3]: "greedy, n=3000/lane, the six finals vs the three 100M finals
# RE-DRAWN IN THE SAME SESSION on fresh usernames (never the 2026-09-03
# numbers)"), SEQUENTIAL: FP's budget is WALL-CLOCK; a second concurrent Foul
# Play would weaken both opponents and flatter both seats.
#
# TWO PHASES, BECAUSE THE TRIOS LAND ~12 h APART (maintainer 2026-09-14: the
# L2LAM reads may start while W trains "if it doesn't massively slow down
# train or break anything"; scripts/monster_reads_queue.sh holds phase A if
# the W trio's steps/s falls >10% under its post-L2LAM baseline):
#   PHASE A (L2LAM exited; W trio still training, 3 of 14 cores):
#     GL128F GL136F GL144F  greedy L2LAM finals
#     E3LF                  ENS3 of the L2LAM trio
#     G104R G112R G120R     greedy 100M finals, RE-DRAWN (the comparator)
#   PHASE B (W exited; idle box):
#     GW104F GW112F GW120F  greedy W finals
#     E3WF                  ENS3 of the W trio
#     E6MF                  ENS6 = W trio + L2LAM trio
#     E9F                   ENS9 = the six + the three 100M finals
#     E3HF                  ENS3 of the 100M trio, fresh -- THE FLOOR, same session
#     G112B                 greedy s112 again, n=1000: the LOAD BRIDGE (same
#                           object as G112R, phase A) -- diagnostic only
# LOAD DISCLOSURE, stated up front: phase A's Foul Play ran beside three
# training lanes, phase B's on an idle box. The bridge G112B-G112R reads the
# load term at se ~0.018; anything under that is invisible and is disclosed as
# such. Every L2LAM-vs-100M comparison is WITHIN phase A; every W-vs-100M
# comparison crosses phases and carries the bridge next to it.
#
# READS, stated before any arm runs. Unpaired two-proportion se: at p~0.5,
# se_diff ~0.0129 arm-vs-arm at n=3000; ~0.0105 arm-vs-pooled-9000.
#   R1 THE LADDER OBJECT (M-R5-1). Candidates: E3WF, E3LF, E6MF, E9F. FLOOR:
#      E3HF (the 100M ENS3, same session; banked 0.557 / 0.577 at n=1000,
#      2026-09-11/12). Rule: the candidate with the highest point estimate;
#      if the top two are within 1 se_diff (0.013), the LARGER committee
#      (members are the credited direction, STATUS "ensemble scaling"). If no
#      candidate reaches E3HF - 0.013, the ladder object is the 100M ENS3
#      itself (the floor is a floor). Committee cost at ladder speed is
#      1-30 ms per decision for 3-9 members (M-R5-4 band) -- no size penalty.
#   R2 STEPS PER RECIPE: mean(GW*F) - mean(G*R) and mean(GL*F) - mean(G*R),
#      each pooled n=9000 vs n=9000 (se_diff ~0.0074): does 200M under each
#      recipe beat the 100M greedy off FP@20? DESCRIPTIVE ([RWL-3]).
#   R3 RECIPE: mean(GW*F) vs mean(GL*F), pooled 9000 vs 9000, crossing phases
#      (bridge disclosed). The mechanism co-primary ([RWL-3] PRIMARY) is read
#      from the logged metrics, not here.
#   R4 COMMITTEE GAIN PER TRIO: E3WF - mean(GW*F), E3LF - mean(GL*F), vs the
#      100M's +0.067 (n=2000 vs 3000). Additive across horizon or not.
#   R5 MEMBERS: E9F vs E6MF vs the better ENS3: do the 100M finals still add
#      to a 200M committee? (ens_width read R2's twin at 200M.)
# Credit line, verbatim (CLAUDE.md), because the file must carry it: "a lever
# is credited iff pooled delta >= +0.025 AND >= 2*se_diff, where se_diff is
# the LARGER of the pooled-binomial se_diff and the seed-clustered se_diff,
# the latter computed from the per-seed finals at read time." NOTHING HERE IS
# A CREDIT ([RWL-3]). The ladder pick is a descriptive selection under R1.
#
# DISCLOSURES THAT TRAVEL WITH EVERY FP@20 NUMBER, FOREVER (CLAUDE.md): the
# equivalence test is weakly powered, and the point estimate flatters us. The
# budget is NAMED in every quote. FP@20 is an instrument, not a rung; nothing
# here is a ladder projection in either direction.

