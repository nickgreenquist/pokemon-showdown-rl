  BI4: "WAIVED FOR LAUNCH 2026-08-27, OWED AT READOUT — it is a readout instrument and touches nothing the run depends on. FALLBACK if it does not land: the band table is built by hand from the replays, still asserting sum(cell n) == n, and the readout says so. ladder_readout.py: add obligation (iv) the band table (from the REPLAYS, exhaustive, asserting sum(cell n) == n) and (v) the overlap cell. Already parameterised (--jsonl --replays --name --out)."
  BI5: "LANDED 2026-08-27 (D3). ch3_fp_h2h.py's max_concurrent_live tracker is in LadderPlayer.choose_move and stamped as `max_concurrent_live_battles`. EXPECTED 1; anything higher means the etiquette ruling's serial-play premise did not hold."
  BI6: "LANDED 2026-08-27 (D3). ladder.py's LadderPlayer now passes max_concurrent_battles=2, closing the poke-env deadlock. Does NOT license concurrent play — run() calls player.ladder(1) in a serial loop — and BI-5 now ASSERTS that from the artifact. The etiquette block's literal 'max_concurrent 1' is superseded by BI-5's observed value, which is the stronger claim."

