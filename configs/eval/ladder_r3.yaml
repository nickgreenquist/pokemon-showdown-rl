credit_line_not_applicable: "THIS FILE REGISTERS NO CREDITED COMPARISON. No A/B, no control, no paired comparator, no se_diff over anything. For the record the line reads: 'a lever is credited iff pooled delta >= +0.025 AND >= 2*se_diff, where se_diff is the LARGER of the pooled-binomial se_diff and the seed-clustered se_diff, the latter computed from the per-seed finals at read time.' Describing any R3 number as credited would be a category error. Stated rather than omitted."

