    why_refused: "RD is a within-system posterior SD with no term for pool drift between runs; R1's own band analysis shows its rating sat ~60 points above equilibrium and still falling, so a bar built from two RDs is ANTI-CONSERVATIVE about the object's strength; and RD is a function of n, so two runs stopped at the same n share it by construction."}
