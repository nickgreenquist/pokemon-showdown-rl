  D3_concurrency_deadlock:
    question: "Raise scripts/ladder.py max_concurrent_battles 1 -> 2 (BI-6), closing the poke-env deadlock that hung b81 and b82 twice each?"
    RULING: "RAISE TO 2 **AND** LAND BI-5. Both landed before launch, in the ratifying commit."
    why_it_mattered_more_once_D1_was_ruled: "An unattended run means a silent 0%-CPU hang goes unnoticed for hours while a live rated game times out. D1 and D3 are not independent; ruling D1 toward unattended is what made D3 load-bearing rather than precautionary."
    does_not_license_concurrency: "run() calls player.ladder(1) in a serial loop, so exactly one battle is ever queued. BI-5 stamps max_concurrent_live_battles so this is ASSERTED from the artifact, not read off a config value — strictly stronger than the 'max_concurrent 1' the etiquette block used to cite."
    honest_limit: "UNMEASURED on the ladder path. Reasoning from mechanism, and it stays labelled as such."
  D4_anchor_battery:
    question: "R3's object will have ONE of three anchors. Does the R3 README row wait on the other two?"
    RULING: "DEFERRED TO READOUT. It never gated the run (blocks_the_run: false) and it cannot be closed before launch under any answer — both anchors need the local server and contend for CPU with a live rated game, so buying them is only ever an AFTER."
    standing_recommendation: "Buy both (~2.2 h vs-SH at n=3000 search@M, ~0.5 h for a 500-battle clone h2h), AFTER the ladder, before the row lands. The alternative — land the row with the gap disclosed verbatim, as R1 did for L2's unmeasured off-SH cells — remains open."
  D5_comparison_ruling:
    question: "Ratify the comparison_ruling block: R3 standalone-descriptive, no R1-vs-R3 delta as an effect, the 76-Glicko bar REFUSED, [1300,1400) the only licensed cell and with no threshold."
    RULING: "RATIFIED AS DRAFTED, VERBATIM, including the barred_language list."
    what_it_costs: "'+N Elo from search on the real board' is not available at any n this design can buy, and is given up rather than manufactured. Accepted with the ruling."
  D6_search_reversal:
    question: "R3 deploys the arm that ladder_r1.yaml's POLICY CHOICE argued against and whose argument the maintainer accepted on 2026-08-25."
    RULING: "CONFIRMED, KNOWINGLY, on R1-B's evidence, with the ceiling intact."
    what_changed: "R1-B is off-FP@20 on the 50M fleet and positive (+0.1010, 3.6 se). R1's negatives were off-SH on the 12M lanes. Different objects, and the ceiling forbids setting them side by side."
    what_did_not_change: "MU-8 stands at z = -2.80. The BC-clone anchor for search-on-50M DOES NOT EXIST, so only HALF of R1's 'consistent sign across two off-SH opponents' has been re-tested at the new scale — the other half is untested, not overturned."
    consequence: "Whatever R3 reads, it neither vindicates search nor confirms MU-8 (see comparison_ruling)."
