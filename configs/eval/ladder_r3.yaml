# STOPPING RULE — INHERITED VERBATIM: **rd <= 40 AND n >= 200.**
#   Rating is PATH-DEPENDENT (matchmaking pairs by rating, so ladder games are
#   not iid and "n battles" does not have its usual meaning), which is why rd
#   and not n is the honest convergence signal and why n is a floor.
#   **WHY IT IS NOT CHANGED FOR R3:** n=200 is what makes R3 and R1
#   commensurable at all, and being a second point next to R1 is R3's entire
#   value. Cutting n to fit a night trades away the thing R3 is for.
#   **WHICH HALF BINDS, PREDICTED RESULT-BLIND: the n FLOOR.** Glicko RD
#   contracts ~n^(-1/2); R1's anchor is rd 26.57 at n=200, which extrapolates
#   to rd 40 at **n ~ 88**. So rd is expected to be satisfied long before the
#   floor, the first poll at n=200 is expected to find the rule already met,
#   and the run is expected to be BOUNDED at ~200 — which is what makes the
#   18 h budget a budget rather than an open commitment. (One anchor is one
#   anchor: RD also depends on opponent RD and the server's rating-period
#   handling. If rd > 40 at n=200 the rule keeps it running, bounded by
#   `max_battles_total: 300`. If 300 is reached with rd still above 40, STOP
#   AND REPORT with n and the observed rd stated. **Do not extend** — a fleet
#   whose rd will not converge in 300 rated games is saying something
#   structural, and the response is to think, not to grind 700 more games.)
#
#   **NEW IN R3, AND IT EXISTS ONLY BECAUSE OF A FIX LANDED TODAY: THE RULE
#   CAN NOW ACTUALLY EVALUATE.** `scripts/ladder.py` (commit 055cf96,
#   2026-08-27) previously read GXE/Glicko/rd ONLY from the top-500
#   leaderboard JSON, which by construction contains listed accounts only. R1
#   ran unlisted, so `stopping_rule_met` returned "not yet on the top-500
#   list" on every poll and the report recorded `stopped_by_rule: false` —
#   **while R1 sat at rd 26.57 / n 200 with the rule SATISFIED.** The runner
#   now reads `https://pokemonshowdown.com/users/<userid>.json`, which carries
#   gxe / rpr / rprd / elo / w / l for ANY rated account. Verified live
#   against R1's own account: elo 1292.25, gxe 59.6, rpr 1573.04, rprd 26.57,
#   w 95, l 105 — reproducing every corrected R1 number, and the rule now
#   reads "n 200 >= 200 AND rd 26.6 <= 40 (via profile)".
#
#   **G-BLIND — OPTIONAL STOPPING IS THE SHARPEST NEW VALIDITY THREAT, AND IT
#   IS CREATED BY THAT SAME FIX.** R1 was blind to its own rating for its
#   whole run and could not have stopped on it. R3 is not blind. Closing it:
#     - `ladder.py` polls ONLY at `len(records) >= min_battles`, so the
#       primary read is STRUCTURALLY invisible before the floor.
#     - **DO NOT open the profile, the replay list or the board before the
#       floor.** This is an honour-system blind, not an enforced one, and it
#       is disclosed as such.
#     - The per-battle log line DOES print a running raw W-L. Unavoidable,
#       disclosed, and not the primary read.
#     - **THE ONLY LICENSED STOPS: (1) the pre-registered rule fires; (2)
#       `max_battles_total`; (3) a VOID condition; (4) an operational abort —
#       crash, ban, moderator contact — logged with its cause AND the battle
#       index at which it happened.**
#     - **BARRED: stopping because the number looks good, or continuing
#       because it looks bad.** n is never trimmed to a round number and never
#       extended after looking. A run ended any other way reports as
#       **INCOMPLETE** and may not be quoted as R3's primary read.
#
#   IF THE PROFILE ENDPOINT IS UNREACHABLE — an OPERATIONAL case that must not
#   be confused with a result. `stopping_rule_met` keeps three outcomes
#   distinct (endpoint failure / reachable-but-unrated / rated) because
#   collapsing them is the original R1 bug in a new costume. Pre-registered
#   response, so it is not invented at 3am: (1) hand-pull the profile;
#   (2) if the hand pull works and shows rd <= 40 at n >= 200, **the rule IS
