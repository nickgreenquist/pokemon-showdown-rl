#       search arms took 4/5/8 auto-ties per 1000 where greedy took 1/0/0. At
#       n=200 expect ~1, and a 1000-turn game is an hours-long imposition on
#       one person. **`pacing.start_timer: true` STAYS ON** — it bounds a
#       staller and vindicated itself in R1 against an absent opponent.
#     - **A LINKED NAME.** The registered account shares R1's stem, so the two
#       are trivially connectable. Under a sequential-account ruling that is
#       the right side to err on — transparency is the argument, and obscuring
#       the link would be the smurf move. The cost is that it feeds obligation
#       (v)'s behavioural channel, which is why (v) measures it.
#   UNCHANGED: no chat; serial play only; sleep between games; hard total cap;
#   stopping rule around 200. **If a moderator makes contact or players
#   complain in chat: STOP AT THE NEXT BATTLE BOUNDARY, then ask. Do not argue
#   the rules.** That commitment is what makes an unattended 17-hour run
#   inadmissible.
# ---------------------------------------------------------------------
# ACCOUNT. **`nickgen1rbrlbot2`, REGISTERED BY THE MAINTAINER 2026-08-27** —
#   profile returns HTTP 200 with a registertime, and `ratings: {}` confirming
#   zero rated games. VOID (d) satisfied; the fresh-rating requirement is met.
#   The 18-char USERID rule passes: `nickgen1rbrlbot2` is 16.
#   **THE NAME IS NOT A CONTROL, AND THIS WAS RULED ON 2026-08-27.** Both
#   design reviewers flagged that `nickgen1rbrlbot2` is one character from
#   R1's `nickgen1rbrlbot` and recommended a more distinct name. **The
#   maintainer rejected that framing, correctly: a naming convention is a
#   habit, not a mechanism, and it fails exactly when someone is tired.** The
#   requirement handed down was to make SIMPLE UNIQUE USERNAMES WORK GOING
#   FORWARD. So the fix is in code, and near-identical names are now safe
#   forever — `...bot`, `...bot2`, `...bot3` are fine.
#
#   **WHAT WAS DANGEROUS, AND WHAT CLOSED IT** (commit landed 2026-08-27).
#   `scripts/ladder.py` used to resolve the seat as
#   `os.environ.get("PS_USERNAME") or arm["display_name"]` — **an environment
#   variable SILENTLY OVERRODE the pre-registration.** A stale
#   `PS_USERNAME=nickgen1rbrlbot` in a shell, a `.env` or a shell profile
#   would have laddered R3 on R1's account, burning rated games on it and
#   permanently contaminating the project's only published ladder rating. The
#   sole symptom was one line of startup output.
#   **NOW: THE PRE-REGISTERED NAME WINS.** `_resolve_display_name` accepts
#   `PS_USERNAME` only as a CONFIRMATION and **SystemExits if the two
#   disagree**, so the runner cannot be pointed anywhere the pre-reg did not
#   name. Comparison is on `to_id`, so punctuation and case are free
#   (`nick_gen1rb_rl_bot2` == `nickgen1rbrlbot2` — the same account, and not
#   worth aborting a 16-hour run over). Pinned by
#   tests/test_ladder.py::TestDisplayNameResolution, including the exact
#   one-character-apart case.
#   **CONSEQUENCE FOR THIS PRE-REG: the account decision is CLOSED.**
#   `nickgen1rbrlbot2` stands. The account identity is now enforced by the
#   runner rather than by the operator noticing, which is strictly stronger
#   than any name could be.
#   CREDENTIALS: `PS_PASSWORD` / `PS_USERNAME` env vars ONLY, NEVER HERE. The
#   maintainer stored them 2026-08-27 in a gitignored `.env` (mode 0600,
#   `.gitignore:35`), sourced at launch. Verified present without printing:
#   user=nickgen1rbrlbot2, pw_len=15, gitignored=YES.
# =====================================================================
primary_arm: R3S                 # the ONLY declared arm; see ARM STRUCTURE

# ** results_dir IS DECORATIVE — scripts/ladder.py NEVER READS IT. ** The JSONL
# and report land in `--out-dir` (CLI, default results/ladder), while
# `save_replays` IS read from this file. Two halves of one path set in two
# different places. The value here matches the intended --out-dir so the two
# cannot drift, but ONLY THE CLI FLAG ACTUALLY DECIDES.
#
# ** WHY R3 SHARES R1'S ROOT INSTEAD OF TAKING ITS OWN. ** A separate
# `results/ladder_r3/` reads cleaner and was the first choice here. It is the
# WRONG choice, and the reason is backup. `scripts/backup_ladder.sh` does
# `rsync -a results/ladder/ <mirror>/` and `tar czf ... -C results ladder` —
# both operate on `results/ladder` WHOLESALE. Anything under that root gets
# mirrored and archived with no code change; anything outside it gets NEITHER.
# **LADDER DATA IS UNREPEATABLE AND GITIGNORED, and the 3-copy rule is
# standing**, so a separate root would have left R3 with ONE copy until BI-3
# landed — i.e. a build item standing between us and the only protection an
# unrepeatable measurement has. Sharing the root gives R3 two of the three
# copies for free, and reduces BI-3 to extending the VERIFICATION lines
# (which count `L2.battles.jsonl` and `replays/` by name) rather than the
# copying. Filenames do not collide: the arm is R3S, so the runner writes
# `R3S.battles.jsonl` and `R3S.report.json` beside R1's `L2.*`, and the
# replays go in a sibling directory.
results_dir: results/ladder
save_replays: results/ladder/replays_r3

max_battles_total: 300           # R1's was 1000, which at ~300 s/battle is 83 h
                                 # and cannot bite. 300 is ~8 h of headroom past
