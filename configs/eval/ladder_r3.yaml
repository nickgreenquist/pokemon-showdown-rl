#         expected-score curve to an implied TRUE rating of ~1232 against a
#         displayed 1292 — the rating was ~60 points above its own equilibrium
#         and still falling. RD measures uncertainty about the CURRENT VALUE
#         of a moving quantity; it says nothing about the distance to the
#         asymptote. A bar built from two RDs is therefore ANTI-CONSERVATIVE.
#     (c) RD is a function of n, not of the object. Two runs stopped at the
#         same n share it by construction, so such a bar mostly measures the
#         stopping rule.
