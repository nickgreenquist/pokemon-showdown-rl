#   Glicko points**. Available, arithmetically correct, and NOT AN HONEST BAR:
#     (a) **RD is a WITHIN-SYSTEM posterior SD.** It quantifies uncertainty
#         about a rating inside one pool at one moment. It contains NO term
#         for pool drift between runs, and R1 and R3 are two accounts in a
#         pool that moved.
#     (b) **R1'S OWN DATA FALSIFIES THE ASSUMPTION THAT RD BOUNDS THE ERROR ON
