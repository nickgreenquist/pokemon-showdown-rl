  BI2: "LANDED 2026-08-27. tests/test_ladder.py parameterises `prereg_path` over configs/eval/ladder_*.yaml, so every pre-reg test now runs once per file (ids ladder_r1 / ladder_r3) and a future ladder_r4.yaml is covered with no test edit. Two assertions had to be generalised in the process and both are noted in place: `test_primary_arm_is_named_and_real` no longer pins the arm KIND (R1 ensemble vs R3 search), and `test_the_real_prereg_values_are_the_ones_pinned_here` checks the two keys `stopping_rule_met` reads instead of whole-dict equality, because R3 legitimately adds a `source:` key the rule function never touches. The marker test flipped to ABSENT for this file in the ratifying commit."
