# THE DEADLOCK THE LADDER SEAT WAS EXPOSED TO — **RULED 2026-08-27: RAISE TO
#   2 AND LAND BI-5. BOTH LANDED BEFORE LAUNCH** (`scripts/ladder.py`,
#   `LadderPlayer.__init__` and `choose_move`; `max_concurrent_live_battles`
#   is stamped in the report; `TestChooseMoveNeverRaises` pins the tracker).
#   The finding is kept in full below because the REASONING is what licenses
#   the change, and because the honest limit at the end of it still stands.
#   **THIS IS THE MOST CONSEQUENTIAL OPERATIONAL FINDING IN THIS FILE.**
#   `scripts/ch3_fp_h2h.py` was changed 2026-08-27 from
#   `max_concurrent_battles=1` to `=2` to fix a poke-env deadlock. The
#   mechanism, from that fix's own comment: `max_concurrent_battles` becomes
#   the maxsize of `Player._battle_count_queue`; in poke-env's `player.py` the
#   battle-init path does `await self._battle_count_queue.put(None)` BEFORE
#   the `if battle_tag in self._battles` check that would undo it. **So a
#   DUPLICATE `|init|battle` for a room already known, while a battle is live,
#   blocks on a FULL queue forever — and that await is inside the single
#   message-handling coroutine, so ALL message processing stops.** The seat
#   then sits at **0.0% CPU**, which reads as "slow", not "hung".
#   **MEASURED COST THERE: b81 hung at 639 then 611; b82 at 57 then 699.**
#   **THAT FIX'S OWN COMMENT NAMES SEARCH AS THE EXPOSED POLICY**, because
#   search plays 32-47% longer battles and therefore reaches the turn-1000
#   auto-tie — and the room churn around it — far more often. Confirmed here
#   from the arms' own tallies: greedy 1/0/0 auto-ties per 1000, search
#   4/5/8.
#   **`scripts/ladder.py` IS STILL `max_concurrent_battles=1` AT LINES 364
#   AND 594.** R3 is a ~16-19 h SEARCH run on that seat.
#   **ON THE LADDER THE CONSEQUENCE IS STRICTLY WORSE THAN IT WAS OFF FOUL
#   PLAY:** the seat hangs silently at 0% CPU while a LIVE RATED GAME against
#   a human times out. That forfeits a real rated battle and contaminates the
#   very rating R3 exists to measure — and unlike the local-server room
#   poisoning, it cannot be undone.
#   **RECOMMENDATION: raise it to 2 (BI-6), and land BI-5 so observed
#   concurrency is ASSERTED rather than assumed.** It does NOT license
#   concurrent play: `ladder.py` calls `player.ladder(1)` in a serial loop, so
#   exactly one battle is ever queued — the same argument the FP seat makes.
#   **It is flagged rather than done silently because the ETIQUETTE block
#   leans on the literal phrase "max_concurrent 1", and quietly changing a
#   value that an etiquette argument cites is not a thing to do unilaterally.**
#   With BI-5 the claim becomes "observed concurrency 1, asserted", which is
#   strictly stronger than "configured 1, unverified".
#   HONEST LIMIT: the deadlock is UNMEASURED on the ladder path. The mechanism
#   is generic to poke-env's `Player` and the exposure factor (long
#   search battles, auto-tie room churn) is present, but no ladder run has hit
#   it. This is reasoning from mechanism, and it is labelled as such.
