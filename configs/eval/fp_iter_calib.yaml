title: fp_iter_calib
status: "REGISTERED 2026-09-25 (agent; maintainer 'Go' 02:00Z for FP-parallel Phase 2). Instrument calibration: is FP@N (a FIXED MCTS iteration budget) the same opponent as FP@20? The maintainer rules on adoption; nothing here replaces the locked FP@20 anchor by itself."
journey_step: "off-arc eval ops (maintainer-prioritised over R7, 2026-09-25): serves every off-FP read, starting with R7's"
credits_nothing: true
results_dir: results/fp_iter_calib

# WHAT IS MEASURED. One seat object, two opponents, ONE session, CONTROL FIRST (CLEANUP L6):
#   CAL20        FP@20 exactly as every banked off-FP read ran it (wall-clock 20 ms, k=1, quiet
#                box), 3000 battles.
#   CALN1..8     FP@N: N = 25,000 iterations per full-budget search, 12,000 per early-game
#                (half-time) search -- the k=1 quiet-box MEDIANS of FP@20's own visits
#                (readouts/FP_PARALLEL_ROI_READOUT.md, side check) -- run the way it will be
#                used: 8 slices x 375 battles IN PARALLEL (scripts/fp_arms_parallel.py), 3000 total.
# FP@N's strength is fixed by construction, so its slices may share the box with each other.
# FP@20's may not, which is the whole point, and CAL20 runs alone.
# Both opponents are the SAME Foul Play copy (../foul-play-fpprobe = production
# + scripts/patches/foulplay_probe_visits.patch + the FP@N flag); they differ ONLY by
# --search-iterations/--search-iterations-early, which the runner takes from the arm and
# verifies from foul-play's own log.
#
# THE SEAT: the greedy W final s104 (c6 OFF), loop breaker ON -- R6's GW104R object.
#
# THE READ, stated before any battle. Our win rate vs each (ties = non-wins):
#   delta = WR(vs FP@N) - WR(vs FP@20), n 3000 vs 3000, unpaired binomial se_diff ~0.0128.
#   |delta| < 2 se_diff  -> no detectable difference at this power (a gap under ~0.026 is NOT
#                           excluded; this is not an equivalence proof) -> FP@N at 25k/12k is a
#                           candidate replacement for FP@20; the MAINTAINER rules.
#   delta >= +2 se_diff  -> FP@N is WEAKER than FP@20 (we beat it more): raise N and re-run.
#   delta <= -2 se_diff  -> FP@N is STRONGER: lower N and re-run.
#   Also reported: CAL20's same-session visits per branch (does 20 ms still buy ~25k/12k?);
#   CALN's realized visits (must be N rounded up to 1000; forced moves 1000); CALN's
#   per-arm s/battle at k=8 vs the Phase-1 projection (0.841x FP@20's k=1 turn rate);
#   relaunches and crash forfeits per arm (n_eff rule, verbatim from the R4 pre-reg).
# Pooling across the 8 slices is a plain sum of wins and n_eff. Every slice is the same
# object vs the same opponent, and slices are exchangeable.
#
# SECOND SEAT (added 2026-09-25 ~04:10Z, BEFORE it runs). The maintainer asked the three sessions
# for a consensus on tightening the bound ("80 extra min is trivial"). CONSENSUS (r6-runner's
# refinement, r7-runner and this session agreeing): spend the second 3000 vs 3000 on a STRONGER
# seat, not a second draw of GW104R. A constant FP@N-vs-FP@20 offset cancels in same-session
# deltas, but a SCALE change does not, and every read and bar lives on deltas.
#   CE20       the E6RF object of configs/eval/r6_reads_offfp.yaml (ENS6 of the six R6 finals, c6
#              ON, loop breaker ON; FP@20 0.6097 there) vs FP@20, k=1, quiet box, 3000. Control first.
#   CEN1..8    the same seat vs FP@N 25k/12k, 8 x 375 in parallel.
# THE READ, stated before any draw-2 battle. delta_s = WR(vs FP@N) - WR(vs FP@20) for each seat s.
#   OFFSET  = the mean of delta_GW and delta_E6; se = half the root-sum-square of their ses (~0.010).
#   SCALE   DiD = delta_E6 - delta_GW = (E6_N - GW_N) - (E6_20 - GW_20), i.e. how much FP@N changes
#           the gap between a weak and a strong seat (~+0.065 on FP@20); se ~0.018.
#   PASS both (|OFFSET| < 2 se AND |DiD| < 2 se) -> FP@N at 25k/12k is a candidate replacement;
#   the MAINTAINER rules. A failing DiD means the offset is seat-dependent and is itself the
#   finding: report it, do not average it away. Each seat's se is the larger of binomial and
#   slice-clustered, as in draw 1.
# A PASS IS NON-REJECTION, NOT EQUIVALENCE (r6-runner / r7-runner, agreed before launch). |DiD| <
# 2 se passes any true DiD under ~0.036, and 80% power needs a true DiD of ~0.05 (2.8 se): a pass
# says "no detectable slope distortion, MDE ~0.05", NOT "the gap is preserved to within the +0.025
# credit line" (that needs se ~0.0125, ~2x the battles per arm). The readout prints the 95% CI of
# the OFFSET and of the DiD beside every pass/fail, so the adoption ruling reads bounds, not a verdict.

