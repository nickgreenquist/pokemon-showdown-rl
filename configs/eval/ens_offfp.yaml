title: ens_offfp
status: "REGISTERED 2026-09-11, before any arm ran."
journey_step: "11.5"
credits_nothing: true
results_dir: results/ens_offfp

# WHY THIS EXISTS
#
# Every comparison between our own objects so far has been made vs
# SimpleHeuristicsPlayer, and that metric is SATURATED: the bare policy already
# beats SH 78% of the time and our candidates sit at 0.82-0.84, so a decision
# rule has almost no room to show. Worse, ENS3 and ENSG share ALL THREE
# checkpoints — vs SH the paired comparison is largely measuring their shared
# component, which is why it returned +0.01500 at 1.6 se, a null.
#
# Off Foul Play we sit near 0.50, which is where a selector has maximum
# leverage, and the asymmetry is already MEASURED rather than hoped for: the
# same depth-1 gate is worth +0.042 vs SH and +0.129 off-FP (0.39600 ungated ->
# 0.525 gated, BLM). A three-times-larger effect on the same dial.
#
# So the question this answers is the one that actually picks a ladder object:
# against an opponent that has nothing to do with our self-play policy, does
# the ensemble carrying the gate beat the ensemble alone?
#
# FOUR CELLS, two new and two banked, all off FP@20 on the same checkpoints:
#   greedy single lane   0.50167 (n=3000)  BANKED, results/ch5_100m/t112.json
#   gated search, single 0.525   (n=1000)  BANKED, BLM
#   ENS3F  ensemble, no search            NEW
#   ENSGF  ensemble + the same delta 0.10 NEW
#
# DISCLOSURES THAT TRAVEL WITH EVERY FP@20 NUMBER, FOREVER (CLAUDE.md):
#   (1) the equivalence test is weakly powered, and (2) the point estimate
#   flatters us. The budget is NAMED in every quote. FP@20 is an INSTRUMENT,
#   not a rung, and nothing here is a ladder projection in either direction.
#
# AND ONE THIS FILE ADDS: poke-engine commit bc843f7 records an MCTS
# exploration constant tuned at a 100 ms budget that INVERTED at ladder
# budgets. Our delta 0.10 is tuned at OUR budget against SH. A win here is
# evidence at FP@20 and is not transitive to the ladder.

fp:
  search_time_ms: 20

# Copied VERBATIM from configs/eval/search_s3_100m.yaml so ENS3F/ENSGF are
# provably the SAME objects that ENS3/ENSG were measured as vs SH -- the
# three lanes finish at DIFFERENT steps (…027 / …008 / …080) and guessing
# the filenames silently picks different checkpoints.
checkpoints:
  s104: {path: runs/showdown_sp_100m_s104/ckpt_100000027.pt, sha256: 16a6f02064e4c71ddecec08122a60f2ba363cea237761c9cda01a1c2ce5914ff, step: 100000027}
  s112: {path: runs/showdown_sp_100m_s112/ckpt_100000008.pt, sha256: 2ec16fbf85a9046d360328e50cdee5c732d8529599aafa2215a2a56128abcbb3, step: 100000008}
  s120: {path: runs/showdown_sp_100m_s120/ckpt_100000080.pt, sha256: db5d07d2096e021cb74deaf86c1feb2134954a35e042392680d568a185320287, step: 100000080}

usernames:
  scheme: "eof<arm><role>. Verified pairwise distinct AND prefix-free against every name issued in configs/eval/*.yaml (163 names checked at registration; no existing name is a prefix of these and none of these is a prefix of an existing name). A killed arm's pair is poisoned for hours -- re-run it LAST or on the rerun pair."
  never_reuse: [c4, r4anchor, ch3, ch4, ch5r1, ch5r2, ch5c1, fplad, s3fp, blfp]
  pairs:
    ENS3F: {seat: eofens3seat, fp: eofens3bot}
    ENSGF: {seat: eofensgseat, fp: eofensgbot}
  rerun_pairs:
    ENS3F: {seat: eofens3bseat, fp: eofens3bbot}
    ENSGF: {seat: eofensgbseat, fp: eofensgbbot}

arms:
  # The committee alone. `lanes` (not `seat`) is the ensemble_seat contract --
  # a `seat` key here would silently rate ONE lane, which is the exact
  # footgun ch3_fp_h2h.py asserts against.
  ENS3F:
    kind: ensemble_seat
    lanes: [s104, s112, s120]
    battles: 1000
    search_time_ms: 20        # PER-ARM, not just under `fp:` -- ch3_r4_fp_runner.sh
    seat_username: eofens3seat   # reads the budget from the ARM and otherwise falls
    fp_username: eofens3bot      # back to its 100 ms env default (the MA-10 failure:
                                 # a mis-set budget yields a JSON indistinguishable
                                 # from a correct one).
  # The committee carrying the gate. `ensemble_members` (NOT `lanes`) routes
  # the SEARCHED object through EnsembleSearchAdapter: log-pooled prior, mean
  # opponent model, mean critic at the leaves. `seat` stays s112 because the
  # seat lane is what seeds the decision RNG and pins the sha, and it must be
  # one of the members (asserted).
  ENSGF:
    kind: search_seat
    seat: s112
    ensemble_members: [s104, s112, s120]
    dose: M
    battles: 1000
    search_time_ms: 20
    margin_delta: 0.10
    seat_username: eofensgseat
    fp_username: eofensgbot
  # SMOKE on THROWAWAY usernames. The ensemble adapter has never run through
  # the FP seat path, and a crash there would poison the real pair for hours
  # (CLAUDE.md's foul-play runner ops). This burns the rerun pair instead, so
  # a failure costs nothing that matters.
  ENSGFS:
    kind: search_seat
    seat: s112
    ensemble_members: [s104, s112, s120]
    dose: M
    battles: 6
    search_time_ms: 20
    margin_delta: 0.10
    seat_username: eofensgbseat
    fp_username: eofensgbbot

comparators_banked:
  greedy_offfp20_t112:   {rate: 0.50167, n: 3000, source: results/ch5_100m/t112.json}
  gated_searchM_offfp:   {rate: 0.525,   n: 1000, source: results/search_budget_ladder_offfp/blm.json}
  ungated_searchM_offfp: {rate: 0.39600, n: 1000, source: results/search_s3_100m_offfp/f3m112.json}

# THE READ, stated before the arms run so it cannot be chosen afterwards.
#
# PRIMARY: ENSGF - ENS3F, off FP@20, n=1000 each. These are unpaired (two
# separate FP sessions, different battles), so the se is the two-proportion
# binomial: at p ~ 0.5 and n = 1000 per arm, se_diff ~ 0.0224. A delta needs
# >= 2*se_diff ~ 0.045 to separate, and n=1000 CANNOT resolve the +0.015 seen
# vs SH. That is stated up front rather than discovered afterwards: this arm
# pair is powered to detect a LARGE effect, which is exactly what the +0.129
# off-FP gate result predicts should be there if the composition works.
#
# SECONDARY, descriptive only: ENS3F vs banked greedy 0.50167 (does the
# ensemble transfer off-FP at all -- it has NEVER been measured off-FP), and
# ENSGF vs banked BLM 0.525 (does the committee add anything to the gate).
#
# BRANCHES:
#   ENSGF - ENS3F >= +0.045  -> the composition pays where it matters; ENSGF
#                               becomes the ladder candidate and gets a
#                               confirmatory arm at the rerun usernames.
#   |delta| < 0.045          -> no separation at this n. ENS3 stays the ladder
#                               object; do NOT read the sign of a sub-2-se
#                               delta as a direction.
#   ENSGF - ENS3F <= -0.045  -> search actively costs off-FP too; that closes
#                               the composition for gen 1 at this budget.
