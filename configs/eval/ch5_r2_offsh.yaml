  r4s_hours: 2.43                 # 3000 x 2.92 s
  vssh_hours: 0.15                # 3 x 3000 x ~0.051 s + startup
  clone_hours: 0.2                # 6 x 500, no search either side
  crossplay_hours: UNMEASURED     # rate set by the first pairing (Q6 R1i)

