#   output path is DECLARED at vssh_finals: below; the grader refuses
#   silence on a missing final) — these double as the WIRING read: the
#   FP seat loads through the same
#   eval_checkpoint shim, so the checkpoints have been loaded and
#   battled before any FP arm (R1's G-WIRING intent at full n); (3) the
#   sha ATTESTATION COMMIT (checkpoint_attestation below); (4) the FP
#   wave — T66, T75, T83, serial k=1; (5) R4S; (6) riders R3c, R1i,
#   R1ii. NOTHING overlaps: no FP arm runs beside training, another FP
#   arm, a vs-SH eval, or a rider battle (FP is TIME-BUDGETED; stolen
#   CPU inflates its effective thinking budget and flatters us —
#   wave-scoped VOID). scripts/ch5_r2_preflight.sh enforces the
#   no-training check mechanically (pgrep -f "rl\.train").
#   AGENT-SIDE PERMISSION (CLAUDE.md rule 4): every eval stage above is
#   DETACHED (nohup wave driver), RESUME-SAFE (skip-if-complete; a
#   partial arm re-runs whole) and RATE-READABLE (progress_rule below)
#   — all three conditions met, so length is not the issue.
#
# =====================================================================
# MACHINE-READABLE SECTION (the grader and the test read these keys;
# the prose above is the authority on meaning, these on values)
# =====================================================================

results_dir: results/ch5_r2_offsh

# The vs-SH finals' DECLARED home (r2_review_1 MF-3 / r2_review_2 MF-1:
# the draft grader read an undeclared path, and a missing file silently
# deleted the letter-bearing vs-SH axis, X3 and F1 from the verdict).
# The grader reads exactly this; a missing or short file is emitted as
# "UNGRADED (not passed)", never silence.
vssh_finals:
  dir: results/ch5_r2
  file_for_lane: "final_s<seed>.json"
  produced_by: "scripts/eval_checkpoint.py runs/showdown_sp_batch50m_s<N>/checkpoint.pt --episodes 3000 --out results/ch5_r2/final_s<N>.json"

fp:
  search_time_ms: 20

journey_step: 1

grading:
  credit_floor: 0.025
  tie_disclosure_band: 0.01
  aggregator: equal_weight_mean_of_lane_rates
  recorded_never_governing: [pooled_rate, per_lane_median, best_lane,
                             worst_lane, per_lane_deltas]
  se_rule: "max(pooled_binomial, seed_clustered), the LARGER-OF clause"
  clustered_formula: "sqrt(s_arm^2/k_arm + s_cmp^2/k_cmp)"
  credit_line_verbatim: "a lever is credited iff pooled delta >= +0.025 AND >= 2*se_diff, where se_diff is the LARGER of the pooled-binomial se_diff and the seed-clustered se_diff, the latter computed from the per-seed finals at read time."
  control_offfp:
    s80: {rate: 0.3960, n: 1000, source: results/ch5_r1_offsh/a80.json}
    s81: {rate: 0.3430, n: 1000, source: results/ch5_r1_offsh/a81.json}
    s82: {rate: 0.2730, n: 1000, source: results/ch5_r1_offsh/a82.json}
    mean: 0.33733
    sd: 0.0617
    k: 3
    rescore: NEVER (r9 if_GREEDY)
  control_vssh:
    s80: {rate: 0.7423333, n: 3000, source: results/d29r2/final_s80.json}
    s81: {rate: 0.7346667, n: 3000, source: results/d29r2/final_s81.json}
    s82: {rate: 0.6296667, n: 3000, source: results/d29r2/final_s82.json}
    mean: 0.70222
    sd: 0.06295
    k: 3
  treatment:
    lanes: [s66, s75, s83]
    n_per_lane_offfp: 3000
    n_per_lane_vssh: 3000
  planning_bar: 0.1007          # 2*sqrt(2*0.0617^2/3) = 0.100756; printed
                                # 0.1007 here (the settled ruling's own
                                # spelling) and 0.1008 in the reachability
                                # row — ONE quantity, two roundings, no
                                # discrepancy (r2_review_1 SF-3).
                                # REALIZED sds govern
  bar_floor_inert_min: 0.07124  # 2*sqrt(0.0617^2/3); test asserts > floor
  falsifier_F1_threshold: 0.580222   # frozen struct50m vs-SH pooled
  permutation:
    kind: exact_3v3
    combinations: 20
    min_p: 0.050
    fires_iff_every_treatment_lane_above: 0.3960
    tie_rule: NON-separation
    credits: never
  flat_licensed_in: []
  vs_sh_role:
    positive_side: descriptive          # ADJ-2; bar arithmetic in Q3
    negative_side: letter_bearing       # SN-L / SN-C cells in Q3
    named_cell_X3: "P1 and SN-C -> both sentences recorded; README row question to the maintainer WITH the numbers"

checkpoint_attestation:
  status: ATTESTED
  attested_at: '2026-08-31T12:50:45Z'
  attested_git_sha: b6594389a4026fadee6b87b9d994affea6739652
  rule: final_checkpoint_pt_at_step_50000000
  # The evaluated object is runs/showdown_sp_batch50m_s<N>/checkpoint.pt
  # — the file the training loop writes on exit at step == 50,000,000;
  # NOT best_checkpoint.pt, NOT any ckpt_*.pt rung (matches the
  # control's own pin). At eval launch, per lane: assert
  # ckpt["step"] == 50000000 (hard); RECORD ckpt agent updates
  # (expected 1627; a shortfall means a resume discarded a partial
  # rollout — disclosed, never failed); write the sha256, flip status
  # to ATTESTED (ALL lanes at once — the test refuses a half-filled
  # block), add attested_at/attested_git_sha, COMMIT before the wave
  # (G0). The wave provenance then stamps the amended file's sha.

checkpoints:
  s66: {path: runs/showdown_sp_batch50m_s66/checkpoint.pt, sha256: 8f9d67127c6cf9acad8bac53c59ef6b91865f90bb31a98045715caa7dd4a2d38, step: 50000000, updates_done: 1626}
  s75: {path: runs/showdown_sp_batch50m_s75/checkpoint.pt, sha256: 46f64ed79770fa6d69249199421553e118091b77bca0a721857af16d185142be, step: 50000000, updates_done: 1626}
  s83: {path: runs/showdown_sp_batch50m_s83/checkpoint.pt, sha256: a6ef4e8b2fdbd22cc5627739857bfb22bdff4b4ab02cad8769a6581c5a7e86e2, step: 50000000, updates_done: 1627}
  # Control checkpoints are NOT listed: the control is banked NUMBERS
  # (attested JSONs above), never re-scored, and no control checkpoint
  # is loaded by any R2 arm. Rider R1i loads s80/81/82 through its own
  # driver, whose pre-run pins live with the build item.

usernames:
  scheme: "ch5r2<armid><role>, role in {seat, fp}, arm ids lowercase; rerun pairs suffix the ARM ID (t66b), never the role (a role suffix would create a prefix violation). FULL-STRING distinct and NO name a prefix of any other, asserted pairwise by tests/test_ch5_r2_prereg.py over these 24 names PLUS all 28 names ever issued in ch5_r1_offsh.yaml (pairs, rerun_pairs_r9, burned_pairs_r10)."
  never_reuse: [c4, r4anchor, ch3, ch4]
  pairs:
    T66:  {seat: ch5r2t66seat,  fp: ch5r2t66fp}
    T75:  {seat: ch5r2t75seat,  fp: ch5r2t75fp}
    T83:  {seat: ch5r2t83seat,  fp: ch5r2t83fp}
    R4S66: {seat: ch5r2r4s66seat, fp: ch5r2r4s66fp}
    R4S75: {seat: ch5r2r4s75seat, fp: ch5r2r4s75fp}
    R4S83: {seat: ch5r2r4s83seat, fp: ch5r2r4s83fp}
  rerun_pairs:
    T66:  {seat: ch5r2t66bseat,  fp: ch5r2t66bfp}
    T75:  {seat: ch5r2t75bseat,  fp: ch5r2t75bfp}
    T83:  {seat: ch5r2t83bseat,  fp: ch5r2t83bfp}
    R4S66: {seat: ch5r2r4s66bseat, fp: ch5r2r4s66bfp}
    R4S75: {seat: ch5r2r4s75bseat, fp: ch5r2r4s75bfp}
    R4S83: {seat: ch5r2r4s83bseat, fp: ch5r2r4s83bfp}

wave_plan:
  k: 1
  rule: "any two arms entering a common comparison must run at the same k, or the comparison is VOID (void_k) and the ARMS SURVIVE with their k disclosed. All three T arms enter one comparison (each vs the banked A-arms), so k=1 is an obligation, not a preference."
  comparator_wave: "ch5_r1_offsh, serial k=1 (its wave.log is the artifact)"
  serial_evidence: "$OUT/wave.log arm start/done timestamps must not overlap; scripts/ch5_r2_grade.py asserts it (G-SERIAL)."
  order: [T66, T75, T83]
  order_r4s: "exactly one of R4S66/R4S75/R4S83, per the Q6 selection rule, AFTER the T arms"
  no_coscheduling: "no training lane, vs-SH eval, rider battle or second FP arm beside any FP arm — wave-scoped VOID; enforced by scripts/ch5_r2_preflight.sh (pgrep -f rl.train) and serial ordering"
  resume: "skip-if-complete on $OUT/<tag>.json with gate_all_challenges_resolved true and battles_finished > 0. A partial arm re-runs WHOLE; there is no mid-arm resume and none is claimed."
  retry_no_json_once: true          # torch lazy-init SIGSEGV landmine
  stall_polls: {greedy: 30, search: 60}
  # ARM-ID NOTE: stall_polls_for() in the copied runner globs B*|RS* ->
  # 60; T* correctly falls to 30; R4S* arms are search seats and are
  # given 60 explicitly by the R2 wave script (the glob would MISS them
  # — asserted by the test).
  max_relaunches: 10
  no_progress_relaunches: 3
  progress_instrument: "grep -c 'Winner:' $OUT/$TAG.fp.stdout, as a RATE over [T+2min, T+12min] — never a wall-clock ETA"
  expected_winners_per_min:
    greedy: 40.4        # realized A-arms 1.56/1.49/1.39 s/b -> mean 1.48
    search_M: 20.5      # 60 / RS80's realized 2.92 s/b (corrected in
                        # review from the draft's 22.4 calibration
                        # figure, which implied 2.68 s/b and disagreed
                        # with cost_ledger.r4s_hours); the arm's own
                        # first 100 battles set the stall reference,
                        # never this row
  progress_rule: "< 50% of the row -> investigate; < 20% -> STALLED, not slow. Post hoc: an arm whose realized sec_per_battle exceeds its row's implied cost by >50% is disclosed in the readout."
  killed_arm: "re-runs LAST or under its rerun_pairs pair via THE LICENSED PAIR-FLIP EDIT (blinding attestation, edit ii), never immediately on the same pair (poisoned-room; a pair can stay poisoned for hours). Kill FP's search-worker CHILDREN FIRST (pkill -9 -P), then sweep. Watch item carried from R1: foul-play can PANIC mid-battle (Invalid PokemonMoveIndex: 4, Rust); the TIE-CRASH WEDGE hangs the seat with no JSON — retry_no_json_once and the NO_PROGRESS sentinel exist for exactly that."
  ops_failure_rule: "a tag carrying .NO_PROGRESS or .USERNAME_DEADLOCK is an OPS FAILURE: re-run under the fresh rerun pair (the licensed pair-flip edit, its own commit), LAST; partial JSON renamed <tag>.opsfail.json and never enters a comparison; the grader REFUSES the sentinel. .TOO_MANY_CRASHES is a VOID of the arm (data disposition) and drops k_arm."

interrupt_policy:
  mvp: "T66+T75+T83 complete = the whole primary (3.70 h of battles at the realized 1.48 s/b). An interrupt mid-wave stops at an arm boundary and loses nothing; a partial wave at k<3 hits cell K exactly as a dead lane does and produces NO fleet verdict."
  standalone_floor: "any single completed T arm is a quotable per-lane number at its own n (descriptive; no fleet read)."

cost_ledger:
