# =====================================================================
# LADDER R1 — THE FIRST REAL-LADDER MEASUREMENT OF THIS AGENT
# Pre-registered 2026-08-25 BEFORE a single rated battle was played.
# Status: RATIFIED 2026-08-25 by the maintainer. All three open decisions
#   were resolved BEFORE any rated battle: PRIMARY ARM = L2 (ensemble),
#   ONE ARM (no A/B), STOPPING RULE = Glicko rd <= 40 AND n >= 200. The
#   maintainer's initial lean was L3 (search); the recommendation against
#   it, and the evidence, are recorded verbatim below and were accepted.
#   Remaining pre-launch step is manual: REGISTER THE ACCOUNT.
# Purity note: playing humans is purity-legal — no expert data enters
#   training, and the lane's exclusion is BOOTSTRAPPING (the
#   novelty-over-strength memory), the same footing as the Foul-Play
#   anchors. Ladder replays must never become training data.
# ---------------------------------------------------------------------
# QUESTION. Every number this project owns comes from three scripted
#   or self-derived opponents (SH, Foul Play, our own BC clone). The
#   real board has never been touched. prior_work/README.md's
#   conversion note is explicit that vs-SH 0.71825 (~+163 Elo vs SH)
#   CANNOT be projected to GXE in either direction — upward because
#   past parity vs-SH increasingly measures SH-exploitation, downward
#   because CH4 R1 excluded a hidden off-distribution deficit
#   (BT residual +0.005 +/- 0.013). This is the project's largest
#   unmeasured quantity and only the ladder settles it.
# ---------------------------------------------------------------------
# THE BOARD, measured 2026-08-25 (prior_work/README.md; re-pull before
#   quoting, it moves). gen1randombattle TOP-500 list: GXE 93.5 best /
#   82.3 p90 / 75.0 list-median / 58.8 at the 500th (= the cutoff to
#   be listed at all); Glicko 2022/1794/1712/1568. ACTIVITY: 93
#   players in 24 h, 173 in 7 d. Read "median 75.0" literally — it is
#   the median OF THE LEADERBOARD, not of the playerbase (ladder-wide
#   median GXE is ~50 by construction), so it is NOT a percentile.
# ---------------------------------------------------------------------
# POLICY CHOICE — the one decision with real evidence behind it, and
#   the evidence points AGAINST our best-vs-SH arm. Three candidates,
#   all deterministic, all sharing one act() interface:
#
#     arm  policy            vs SH      vs BC clone   vs Foul Play@100
#     L1   greedy (1 lane)   0.71825*   0.894         0.388
#     L2   ensemble (4-lane) 0.74633    unmeasured    unmeasured
#     L3   search@M          0.79283    0.860         0.368
#                                        (-0.034)      (-0.020)
#   * pooled over 4 lanes x 3000; per-lane 0.72967/0.71867/0.72167/
#     0.70300 for s62/s63/s64/s65.
#
#   SEARCH IS THE TRAP. Its +0.0746 vs SH is credited and real, but
#   BOTH off-SH point estimates are NEGATIVE, and MU-8's formal
#   transfer test is z = -2.80 against BT-commensurate transfer. The
#   ladder is off-SH. Search also runs battles ~40% longer (38.5 vs
#   27.6 mean turns vs FP), which on a thin ladder costs games per
#   hour and patience per opponent. Neither off-SH delta is
#   individually significant (clone -0.034 +/- 0.021, FP -0.020 +/-
#   0.043) — the case is the CONSISTENT SIGN plus z = -2.80, not any
#   one cell.
#   THE ENSEMBLE IS THE RECOMMENDATION: +0.036 over the greedy mean
#   (credited, R0), it is not a post-hoc lane pick (it uses all four
#   lanes, so no selection happens on the metric we distrust), and its
#   mechanism is averaging rather than opponent-model exploitation, so
#   it has no reason to be SH-specific. HONEST GAP: it is UNMEASURED
#   off-SH — that is an argument-from-mechanism, not evidence, and it
#   is disclosed as such wherever the ladder number is quoted.
# RESOLVED 2026-08-25: **PRIMARY ARM = L2, the 4-lane ensemble.** The
#   maintainer was leaning L3 (search) as "best vs SH but tad worse on
#   foul play"; the recommendation against it was accepted. Recording the
#   reason so a later reader does not re-open it: "tad worse on Foul Play"
#   understates the case — search is worse on BOTH off-SH opponents we
#   have ever measured, and the ladder is off-SH. L1 and L3 stay defined
#   and tested below, but DO NOT LAUNCH: this pre-reg runs L2 only.
# ---------------------------------------------------------------------
# ARM STRUCTURE. ONE arm goes out. A two-arm A/B (say L2 and L3 on two
#   accounts) is the ONLY way to learn whether search transfers to
#   humans — a genuinely novel result, since nobody has measured it —
#   but it doubles the bot footprint on a 93-player-a-day ladder and
#   the two accounts can be matched against each other. If it is ever
#   run, the primary MUST be named in advance; picking the better of
#   two ladder numbers after the fact is exactly the post-hoc
#   selection this repo's pre-reg culture exists to prevent.
# RESOLVED 2026-08-25: **ONE ARM.** The A/B is deferred, not killed — if
#   it is ever run it needs its own pre-reg naming its primary in advance.
# ---------------------------------------------------------------------
# STOPPING RULE. Rating is PATH-DEPENDENT — matchmaking pairs by
#   rating, so ladder games are NOT iid and "n battles" does not have
#   its usual meaning. Glicko rd is the honest stopping signal: the
#   board's listed players sit at rd 27-38, and a fresh account starts
#   near rd 130. PRE-STATED RULE: play until **rd <= 40 AND n >= 200**,
#   then stop and report. Rationale: rd <= 40 puts our uncertainty
#   inside the band the listed field occupies, and n >= 200 is a floor
#   so a lucky-streak convergence cannot end it early. Sessions may
#   span days; the JSONL is resumable and the rule is evaluated on the
#   PUBLIC board, not on our own tally.
# RESOLVED 2026-08-25: **ACCEPTED AS WRITTEN — rd <= 40 AND n >= 200.**
# ---------------------------------------------------------------------
# PRIMARY READ (pre-stated, DESCRIPTIVE — this credits no lever):
#   our GXE and Glicko-1 off the public top-500 JSON at the stopping
#   rule, quoted WITH n, WITH the policy kind, and WITH the board
#   percentile computed from the same pull. NOT a credit-line result:
#   there is no A/B here and no 0.025 bar to clear. Reporting it as
#   "credited" would be a category error.
# SECONDARY (descriptive, never governing): raw win rate; mean turns;
#   opponent rating distribution (this is the SH-matchmaking caveat in
#   reverse — a low starting rating pairs us with weak players, so the
#   early raw W-L is an UPPER bound and GXE is the number that
#   corrects for it); decision_errors; mean decision ms.
# VOID CONDITIONS: (a) the two tallies disagree (JSONL vs poke-env);
#   (b) decision_errors / total decisions > 0.005; (c) the live gen1
#   set pool no longer matches vendored 59da482 — the search
#   determinizer and randbats_prior are calibrated to that teams.ts;
#   **CHECKED 2026-08-25 AND IT PASSES**: both gen1 randbats files are
#   BYTE-IDENTICAL to smogon/pokemon-showdown master, and upstream has
#   0 commits touching data/random-battles/gen1 since we vendored. The
#   shas are pinned below and enforced by tests/test_ladder.py, so a
#   re-clone cannot drift this silently; (d) any battle played on an
#   unregistered name.
# ---------------------------------------------------------------------
# ETIQUETTE AND EXPOSURE (re-checked against primary sources
#   2026-08-25 — an earlier draft of this block overstated the case).
#   The account name declares the bot (maintainer's ruling). Findings:
#   (a) PS's written rules are FIVE items and bots/automation/scripts
#   appear in NONE of them; the nearest is rule 4 "don't game the
#   system", which is about intentionally losing and tricking
#   opponents into forfeiting. (b) **Naming an account as a bot is NOT
#   a documented safe harbor** — Smogon's own PS-bots article shows
#   identifying names are a CONVENTION, not a requirement or a
#   protection. Do not treat the name as what makes this legitimate.
#   (c) The operative rule is #5, "Moderators have discretion...  even
#   if it's not on this list", so this is governed by IMPACT, not by
#   compliance with a checklist. (d) A claimed admin policy ("bots
#   harming the human experience get permabanned") could NOT be
#   confirmed at its source — the thread is community proposals plus
#   an admin noting that verifying a user is a bot needs the site's
#   most restricted permission set (4 people). Enforcement is rare and
#   discretionary. (e) The main community objection in the 2024-25
#   ladder-bot threads is usage-stat/tiering distortion, which LARGELY
#   DOES NOT APPLY here: randbats has no team building and does not
#   feed usage-based tiering. (f) The field norm has still moved —
#   Metamon's repo says they became "a lot more cautious about
#   laddering", and prior_work records Metamon being accused of
#   botting in chat at this rating band.
#   CONSEQUENCE — what actually keeps this legitimate is a SMALL
#   BOUNDED FOOTPRINT, not the name: serial play only
#   (max_concurrent 1), a sleep between games, a hard total cap, a
#   stopping rule around 200 games, and no chat. **Anything that turns
#   this from a bounded measurement into a persistent ladder presence
#   — continuous running, multiple accounts, chasing a leaderboard
#   placement — is a DIFFERENT decision and warrants a courtesy note
#   to PS staff first.** If a moderator makes contact or players
#   complain in chat: stop, then ask. Do not argue the rules.
# USERNAME LIMIT: the cap is 18 chars on the USERID (display name
#   lowercased, non-alphanumerics stripped — server/users.ts:745).
#   'nick_gen1randbats_rl_bot' is a 21-char userid and IS REFUSED.
#   scripts/ladder.py enforces this before connecting.
# ACCOUNT: **nickgen1rbrlbot** — REGISTERED BY THE MAINTAINER 2026-08-25,
#   so VOID (d) is satisfied. The display_name below is set to the exact
#   registered string rather than a prettier punctuated variant: PS
#   authenticates on the USERID, so 'nick_gen1rb_rl_bot' would resolve to
#   the same account, but "would resolve" is not a thing to discover at
#   3am against a live ladder. Use what was registered.
# CREDENTIALS: PS_PASSWORD / PS_USERNAME env vars only. Never here.
# =====================================================================
primary_arm: L2                  # ratified; L1/L3 are defined but not launched
