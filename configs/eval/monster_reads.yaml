# the moment each trio's watchdog prints "DONE at step" for all three lanes
# (lanes finish at DIFFERENT steps; a name is never guessed): it writes the
# real filename, sha256 and step over the TBD placeholders below and commits.
# The three 100M finals are the ens_width pins, unchanged.
#
# READS, stated before any arm runs (unpaired two-proportion se; seeds do NOT
# pair battles -- docs/landmines.md 2026-09-11):
#   S1 GW pooled (n=9000) and GL pooled (n=9000) vs the banked 100M greedy
#      A0 0.78867 (results/search_s3_100m/a0_s1*, same-block-on-disk) and vs
#      each other: the 200M recipes' vs-SH level. DESCRIPTIVE: vs SH is the
#      saturated axis (STATUS: ENS3 of the 50M finals = 0.82233 vs 0.82356 at
#      100M), so a flat read here is expected and is not evidence about the
#      recipe -- the off-FP file carries the decision.
#   S2 E3W, E3L, E6M, E9 pooled (n=9000 each) vs the 100M ENS3 floor 0.82356
#      (banked, same block on disk) and vs E3H (the same floor object,
#      re-drawn today, 1 batch): the committee curve at 200M members.
#   S3 committee gain per trio: E3W - GW, E3L - GL, vs the 100M's +0.0349.
# Credit line, verbatim (CLAUDE.md), restated because the file must carry it:
#   "a lever is credited iff pooled delta >= +0.025 AND >= 2*se_diff, where
#   se_diff is the LARGER of the pooled-binomial se_diff and the seed-clustered
#   se_diff, the latter computed from the per-seed finals at read time."
#   NOTHING IN THIS FILE IS A CREDIT ([RWL-3]: "nothing here is a credit").
#
# Runs in the pokemon-showdown-rl env (scripts/monster_reads_queue.sh),
# SEQUENTIAL: ch3_eval derives seat names from (cfg.seed, seat_tag, role "e"),
# the SAME names each lane's own in-loop eval used, so a job may only run
# after its lane has EXITED (the queue waits on the watchdog's DONE lines),
# and two jobs on one seed collide (rule 2). Loader smoke 2026-09-14 12:4xZ:
# both trunk widths (384 / 1024 critic) and a mixed ensemble load and play
# under ch3_eval in this env with distinct seat names.

