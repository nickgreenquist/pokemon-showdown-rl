# (docs/proposals/DEEP_SEARCH_PATH_2026-09-25.md r2 §2 Step A; rl/search/tree_lop.py, rl/search/native_tree.py).
#
# A SMOKE, NOT A READ. It checks that the operator plays live battles off FP@N 25k/12k through the incident-hardened
# runner and that its arm JSON carries every counter -- the override rate, the dose in leaves AND depth (levels,
# engine updates, turns), worlds built/refused/errored by kind, fallbacks -- with fpn_counters_ok true. Its win rate
# is never read (n = 2). Hacking, so no pre-reg (maintainer 2026-09-17: "pre-reg is for ladder runs"); the
# anti-self-deception machinery stays: counters reach disk before any dial gets an arm.
#
# THE OBJECT: G2's committee (the three R5 W finals, sha256-pinned) and G2's greedy anchor, with G2's one-ply solve
# replaced by the tree at §35's budget -- 1,800 TOTAL simulations over the L-op's 8 belief worlds, br_prior, the root
# grid, depth cap 8, cols_k 4, chance_k 2, root rule soft_br at the L-op's tau 0.05, no margin gate (0.0): the tree's
# candidate plays whenever it moves. Checkpoint paths are ABSOLUTE because the runner cds into the checkout it
# lives in, and this runs from the Step A worktree (fp_arms_parallel.py exports PYTHONPATH=<its checkout>, so the
# seat imports the worktree's rl; the JSON stamps rl_package).
#
# ENV: PY=/opt/anaconda3/envs/pkmn-engine-r7/bin/python (pkmn_gen1 + poke-env), as G2's native_seat arms.
# LAUNCH (bash, never a niced shell; FP@N may share the box with training):
#   bash -c 'cd <worktree> && PY=/opt/anaconda3/envs/pkmn-engine-r7/bin/python nohup /opt/anaconda3/bin/python
#     scripts/fp_arms_parallel.py --prereg configs/eval/deep_tree_smoke.yaml --arms DTS --slots 1 > <log> 2>&1 &'
