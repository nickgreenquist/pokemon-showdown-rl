# THE OFF-FOUL-PLAY READS OF THE R7 FLEET. The rules are the fleet header's, quoted there in full and never
# restated differently here; this file only names the arms that carry them out.
#
# PRIMARY READ (the credit read): each lane's FINAL, GREEDY, loop breaker OFF, n 6000 per lane, off FP@N 25k/12k,
#   ONE scheduler session (scripts/fp_arms_parallel.py), launched in the PINNED order C1, S1, C2, S2, S3 (control first
#   in each pair). delta = the equal-weight mean of the SEARCHED finals minus the equal-weight mean of the CONTROL
#   finals; se_diff = the LARGER of the pooled-binomial and the seed-clustered se_diff (k 3 vs 2: the fleet is 3 + 2,
#   B0 FAIL). CREDIT LINE, verbatim (CLAUDE.md): "a lever is credited iff pooled delta >= +0.025 AND >= 2*se_diff,
#   where se_diff is the LARGER of the pooled-binomial se_diff and the seed-clustered se_diff, the latter computed from
#   the per-seed finals at read time." STRICT: a delta EXACTLY +0.025 or EXACTLY 2*se_diff reads as NOT met. Cells
#   X-POS / X-GAIN / X-COST / X-NEG / X-FLAT and X-FLAT's mechanism route: the header's, computed by
#   scripts/r7_reads_readout.py.
# OBJECT RULE (after the primary in launch order, same session): the R6 ladder object as R6's readout names it
#   (E6RF, readouts/R6_READS_READOUT.md R2: all six R6 finals) re-drawn, the donors' ENS3 (E3BF: trio B's three finals,
#   the R7 donors) re-drawn, ENS3-S (the three searched finals) and ENS-C (the TWO control finals: under 3 + 2 the
#   control committee has two members, a disclosed deviation from "ENS3-C" -- the vs-SH leg's "the control pools two
#   lanes" is the same deviation), n 3000 each, ALL FOUR IN THE R6 OBJECT'S POLICY FORM (loop breaker ON). The fleet
#   committee with the higher point estimate becomes the object iff it reaches the re-drawn R6 object minus 0.013;
#   otherwise the R6 object stays.
# NOT HERE: the BIG-BUDGET leg (G4, ENS3-S and ENS-C at FP@500's own CALIBRATED FP@N, n 250 each) waits for
#   fp-speedup's calibration on the quiet box after these reads and gets its arms when that N exists; the anchors
#   (before any README row) likewise.
#
# VALIDITY (every arm, the header's rule): VALID only if its runner JSON carries fpn_counters_ok TRUE (realized
#   iterations == N on 100% of non-forced searches; timer / forfeit losses <= the arm's crash forfeits). An INVALID arm
#   is re-run LAST on its rerun pair, never pooled. The house runner gates travel too (scripts/r7_g2_readout.py's, the
#   G2 precedent): n_eff = finished - crash forfeits with wins reduced by the same count, Foul Play's own Winner: tally
#   agreeing with the seat JSON exactly, relaunches < the runner cap, every challenge resolved, one program.
#
# ENCODER: every R7 final is a c6-ON checkpoint (the fleet's contract: its donors, trio B's finals, are c6 on), and so
#   are the R6 finals: every arm here is c6 on (arm_encoder below; the loader refuses a mismatch).
#
# DISCLOSURES THAT TRAVEL WITH EVERY FP@N NUMBER (CLAUDE.md): the budget is NAMED (FP@N 25k/12k); its calibration
#   against FP@20 travels (two seats, NON-REJECTION, offset CI95 [-0.026, +0.011], gap-change CI95 [-0.042, +0.033],
#   MDE 0.054); the equivalence test is weakly powered, and the point estimate flatters us. Never differenced across
#   instruments: every comparator here is re-drawn on FP@N in this session. FP@N is fixed-budget, so the read may run
#   beside other work: load costs time, never strength.

fp:
  search_time_ms: 20             # kept beside the iteration budget: the patched Foul Play reads it to pick 25k vs 12k
  search_iterations: 25000
  search_iterations_early: 12000
  search_parallelism: 1

