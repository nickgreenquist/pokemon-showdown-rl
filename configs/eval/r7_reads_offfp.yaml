# The fleet's lanes by donor pair (the header's START): f1 = s376 + c400 (donor b328), f2 = s384 + c408 (donor b336),
# f3 = s392 alone (donor b344; its control was dropped by R-F2's 3 + 2).
lanes:
  searched: {f1: s376, f2: s384, f3: s392}
  control: {f1: c400, f2: c408}
  run_dirs: {s376: runs/r7_fleet_searched_f1_s376, s384: runs/r7_fleet_searched_f2_s384, s392: runs/r7_fleet_searched_f3_s392,
             c400: runs/r7_fleet_control_f1_s400, c408: runs/r7_fleet_control_f2_s408}

usernames:
  scheme: "r7rd<arm><role>; RERUN pairs insert r after the arm (r7rdc1rseat / r7rdc1rbot). The prefix r7rd is issued to NO existing name in configs/eval/*.yaml (checked 2026-09-26 against 677 names; the only r7 names are r7g2*), and the queue re-checks pairwise prefix-freeness before any arm."
  pairs:
    C1F:  {seat: r7rdc1seat,  fp: r7rdc1bot}
    S1F:  {seat: r7rds1seat,  fp: r7rds1bot}
    C2F:  {seat: r7rdc2seat,  fp: r7rdc2bot}
    S2F:  {seat: r7rds2seat,  fp: r7rds2bot}
    S3F:  {seat: r7rds3seat,  fp: r7rds3bot}
    E6RR: {seat: r7rde6seat,  fp: r7rde6bot}
    E3BR: {seat: r7rde3seat,  fp: r7rde3bot}
    ES3F: {seat: r7rdessseat, fp: r7rdessbot}
    EC2F: {seat: r7rdecseat,  fp: r7rdecbot}
  rerun_pairs:
    C1F:  {seat: r7rdc1rseat,  fp: r7rdc1rbot}
    S1F:  {seat: r7rds1rseat,  fp: r7rds1rbot}
    C2F:  {seat: r7rdc2rseat,  fp: r7rdc2rbot}
    S2F:  {seat: r7rds2rseat,  fp: r7rds2rbot}
    S3F:  {seat: r7rds3rseat,  fp: r7rds3rbot}
    E6RR: {seat: r7rde6rseat,  fp: r7rde6rbot}
    E3BR: {seat: r7rde3rseat,  fp: r7rde3rbot}
    ES3F: {seat: r7rdessrseat, fp: r7rdessrbot}
    EC2F: {seat: r7rdecrseat,  fp: r7rdecrbot}

# `seat` on greedy_seat, `lanes` on ensemble_seat (scripts/ch3_fp_h2h.py asserts both). The primary is GREEDY with the
# loop breaker OFF (the header's POLICY FORM); the four object-rule committees carry loop_breaker: true (the R6
# object's form).
arms:
  C1F:  {kind: greedy_seat,   seat: c400, battles: 6000, search_time_ms: 20, search_iterations: 25000, search_iterations_early: 12000, loop_breaker: false, seat_username: r7rdc1seat, fp_username: r7rdc1bot}
  S1F:  {kind: greedy_seat,   seat: s376, battles: 6000, search_time_ms: 20, search_iterations: 25000, search_iterations_early: 12000, loop_breaker: false, seat_username: r7rds1seat, fp_username: r7rds1bot}
  C2F:  {kind: greedy_seat,   seat: c408, battles: 6000, search_time_ms: 20, search_iterations: 25000, search_iterations_early: 12000, loop_breaker: false, seat_username: r7rdc2seat, fp_username: r7rdc2bot}
  S2F:  {kind: greedy_seat,   seat: s384, battles: 6000, search_time_ms: 20, search_iterations: 25000, search_iterations_early: 12000, loop_breaker: false, seat_username: r7rds2seat, fp_username: r7rds2bot}
  S3F:  {kind: greedy_seat,   seat: s392, battles: 6000, search_time_ms: 20, search_iterations: 25000, search_iterations_early: 12000, loop_breaker: false, seat_username: r7rds3seat, fp_username: r7rds3bot}
  E6RR: {kind: ensemble_seat, lanes: [a304, a312, a320, b328, b336, b344], battles: 3000, search_time_ms: 20, search_iterations: 25000, search_iterations_early: 12000, loop_breaker: true, seat_username: r7rde6seat, fp_username: r7rde6bot}
  E3BR: {kind: ensemble_seat, lanes: [b328, b336, b344], battles: 3000, search_time_ms: 20, search_iterations: 25000, search_iterations_early: 12000, loop_breaker: true, seat_username: r7rde3seat, fp_username: r7rde3bot}
  ES3F: {kind: ensemble_seat, lanes: [s376, s384, s392], battles: 3000, search_time_ms: 20, search_iterations: 25000, search_iterations_early: 12000, loop_breaker: true, seat_username: r7rdessseat, fp_username: r7rdessbot}
  EC2F: {kind: ensemble_seat, lanes: [c400, c408], battles: 3000, search_time_ms: 20, search_iterations: 25000, search_iterations_early: 12000, loop_breaker: true, seat_username: r7rdecseat, fp_username: r7rdecbot}

arm_encoder:
  C1F:  {c6: true}
  S1F:  {c6: true}
  C2F:  {c6: true}
  S2F:  {c6: true}
  S3F:  {c6: true}
  E6RR: {c6: true}
  E3BR: {c6: true}
  ES3F: {c6: true}
  EC2F: {c6: true}

# The PINNED order: the primary first (C1, S1, C2, S2, S3 -- control first in each pair), then the object rule's four.
run_order: [C1F, S1F, C2F, S2F, S3F, E6RR, E3BR, ES3F, EC2F]
primary: {searched: [S1F, S2F, S3F], control: [C1F, C2F], pairs: {f1: [S1F, C1F], f2: [S2F, C2F]}}
# LANE LOSS is a TRAINING-side cell (the header's R0 gates): a lane that failed a gate or could not be resumed to 100M is
# listed here by its primary arm name, with the gate it failed, BEFORE the readout runs; it is dropped with its pair.
# An INVALID FP arm is NOT lane loss: it re-runs LAST on its rerun pair. THE RE-RUN PROCEDURE (an amendment, committed
# before the re-run launches): add an arm `<ARM>R` that copies <ARM>'s kind, seat / lanes, battles, budget and
# loop_breaker, takes `rerun_of: <ARM>` and <ARM>'s pair from usernames.rerun_pairs, and add `<ARM>R: {c6: true}` to
# arm_encoder (without it the scheduler leaves C6 unset and the c6-on checkpoint is refused at load); then
#   bash -c 'PY=/opt/anaconda3/envs/pokemon-showdown-rl/bin/python /opt/anaconda3/bin/python scripts/fp_arms_parallel.py \
#     --prereg configs/eval/r7_reads_offfp.yaml --arms <ARM>R --slots 1'
# The readout substitutes a VALID re-run for its original and discloses the second scheduler session.
lost_lanes: []
object_rule: {incumbent: E6RR, donors_ens3: E3BR, fleet: [ES3F, EC2F], tolerance: 0.013}
