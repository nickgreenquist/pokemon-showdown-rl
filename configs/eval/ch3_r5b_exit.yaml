kill_rule: "delta <= 0 AND d_i <= 0 on >= 3 of 4 lanes -> the ACTOR expert-iteration line is CLOSED WITHIN THIS CHAPTER (no policy+value, no multi-iteration, no temperature re-sweep, no larger-n retest) absent evidence from OUTSIDE this chapter; search@M recorded as an inference-time lever that does not compile into weights. On B3+KILL the closure sentence is the ONLY licensed narration. SCOPED TO THE ACTOR FAMILY: it does not close design A's critic-value family."
null_meaning: "a B3 refutes 'one iteration of actor expert iteration at this dose clears the credit line over these four checkpoints', NOT 'expert iteration is dead' — SUPPRESSED when KILL co-fires."
readme_status_obligation: "B1a + ANCHOR-TRANSFER-POSITIVE: headline row moves, caveat narrowed and naming both anchor deltas with n, provenance qualifier and C7 disclosure verbatim, no 'new best agent', no ladder-readiness. B1a + other anchor cell: headline number updates, R2 caveat VERBATIM AND STRENGTHENED, same qualifiers. B1b: additive row, 'new best' explicitly declined, F-T value quoted. B2: additive row, verdict phrase verbatim, governing se term named BY NAME, anchor cell as a descriptive column. B3/B4/B5: additive row, verdict phrase verbatim, headline unchanged (B3 quotes the power table and the non-exclusion clause with numbers). KILL: README records the closure sentence verbatim and STATUS records the line as closed for this chapter. PL-STRUCK: the information claim is removed from the README row in the same edit that lands the number, and the struck sentence is recorded in SESSION_LOGS. PL-UNCONFIRMED / PL-SURVIVE: the PL number and cell travel with the README row. ANY VOIDING GATE: STATUS ONLY, README UNTOUCHED (design B's standing rule). PURITY INCIDENT: retraction, not caveat. ALWAYS: M2 (D26 critic ctx srank99 49/51/35/52 of 384) recorded in STATUS and SESSION_LOGS independently of every branch — design B's U2, 'the highest value-per-minute item in the whole memo'."
named_successor: "design A's iterated critic-value distillation is recorded ONLY AS A POINTER to results/design_critic/design_input_A.md (complete design: E2 bridge with its caveats, MG gates, roots-only, its own 1.00x placebo). **IT IS GRANTED NO STATUS BY THIS FILE, and no branch of this file opens or closes it — it requires its own pre-registration, its own ratification and its own build.** The r1 draft's conditional-launch clause ('runs only on [T-GATE pass AND B3 with headroom unresolved] or independent maintainer buy; T-GATE FAIL closes it too') is WITHDRAWN: 'B3 with headroom unresolved' was defined nowhere, it collided with KILL, and its two adjacent clauses contradicted each other on maintainer override. PRICES RECORDED, BOTH SIDES: A priced its lever at ~8-11 h offline build, ~2.8 h target CPU, ~1.3 h/round fitting, ~5.8 h of battles (+2.2 h anchors), and wrote 'IT DOES NOT FIT ONE EVENING AND I WILL NOT PRETEND IT DOES.' B REJECTED the family on the L5 ceiling ('a better critic changes nothing about greedy play, so the read moves to search@M, where the measured headroom is the committee's +0.0224 < floor') and rejected multi-iteration because 'each iteration costs a fresh 2.8 h collection because the teacher's state distribution moves.' A's escape is the round-2 extra-ply term, which A itself prices at only +0.006-0.012. Both positions stand; neither is adopted here."
seconds_best_named: "design B's U1, carried verbatim: 'my named second-best is none, and I say so explicitly.'"
code_change_policy: "design B's U6, carried verbatim: 'A code change here is a new lever and a new pre-reg. ... I recommend holding the line.'"
ladder_consequence: "NONE on any branch — readiness is the maintainer's judgment (2026-08-23 ruling). Every number here is a vs-SH number and vs-SH is ~40% GXE territory."
burns_training_seeds: false
burns_training_seeds_basis: "the fit is offline supervised on .npz and never constructs a poke-env player or calls set_seed; ch3_eval.py / ch3_r4_anchors.py likewise never call set_seed (fact-checked 2026-08-23). 66/67, 75/76, 83/84, 93/94 ALL HELD. Verified anyway at every wave start by F-U."
obs_dim_untouched: "OBS_DIM stays 828 by construction — actor-only fit, base cfg carried verbatim, 828-d obs recorded and replayed. No checkpoint is invalidated."
execution_delegation: "eval execution is delegated to the agent by the 2026-08-23 R4 ratification ('you can run what you need yourself'); CLAUDE.md otherwise routes >5-minute runs to the maintainer's terminal. Every wall number is a maintainer-terminal-grade number either way. A STANDING DELEGATION, not a property of this design."
