provenance_qualifier_mandatory: "every licensed sentence on every branch carries, verbatim: 'the actor was fitted offline to its own search's decisions, backed up through poke-engine from the checkpoint's own self-play.' Plus C7's model-bias disclosure and the vs-SH scope limit."
placebo:
  arm: PL
  construction: "cross-BATTLE pairing within the same lane and the FIT split, restricted to partner rows with an IDENTICAL legal-action count, target index-aligned onto the current row's legal set; the target is the SAME temperature tau applied to the PARTNER's row_ev vector (a shuffled DISTRIBUTION — design A's shuffled-scalar analogue, so 'same temperature' is true and the target FORM matches the treatment's). Every target is LEGAL BY CONSTRUCTION; there is no illegal-target case."
  dropped_rows_rule: "rows with no partner at their legal count are DROPPED; the dropped fraction is reported; >2% -> PL disclosed as ROW-MISMATCHED and the falsifier reported as WEAKENED."
  information_claim: "NO STATE-CORRECT INFORMATION BEYOND THE LEGAL-ACTION-COUNT MARGINAL. Not 'zero information' — legal count is itself a weak function of state. The r1 draft's same-battle pairing preserved both teams, the usually-identical active Pokemon, slot semantics and strong temporal autocorrelation, and its 'ZERO state-correct information' claim was false."
  fit: result_blind_prelaunch
  battles_run_iff: "cell in {B1a, B1b, B2}"
  comparator: "X0, paired by base lane, same larger-of-three se law"
  dose_rule: "MEASURED, not asserted: flip(PL vs X0) on the GATE split, required flip(PL)/flip(X1) in [0.80, 1.25]; PL's step count adjusted result-blind until in band, search transcribed. UNMATCHABLE -> PL is DOSE-UNMATCHED and NON-BINDING (strikes nothing) and the a-fortiori branch is recorded UNREACHABLE — the D25-P sentence: 'a generic actor perturbation of matched size would move greedy play' survives UNTESTED."
  cells:
    PL-STRIKE: "delta(PL) >= 0.6*delta(X1) AND delta(PL) >= 2*se_gov(PL) -> information claim STRUCK IN FULL; licensed sentence 'any actor perturbation of this magnitude moves greedy play'"
    PL-UNCONFIRMED: "delta(PL) >= 0.6*delta(X1) BUT < 2*se_gov(PL) -> information claim DISCLOSED AS UNCONFIRMED, not struck; both numbers and both se terms quoted"
    PL-SURVIVE: "delta(PL) < 0.6*delta(X1) -> information claim STANDS; licensed sentence names delta(PL) and the construction"
  false_strike_rate_precomputed: "under a TRULY NULL placebo at delta(X1)=+0.028 (threshold 0.0168), s_C=0.0199: P(PL-STRIKE) 0.003 / 0.006 / 0.015 and P(PL-UNCONFIRMED) 0.012 / 0.037 / 0.096 at sd_d = 0.010 / 0.016 / 0.025"
anchors_run_iff: "cell in {B1a, B1b, B2} and no VOIDing gate fired"
