# Q8. THE PLACEBO (PL) — REBUILT
# ---------------------------------------------------------------------
# **THE r1 CONSTRUCTION WAS A BLOCKER (review 1 findings 20/38). Its
#   targets were "the search action of a RANDOMLY PAIRED state from the
#   SAME BATTLE", claimed as "ZERO state-correct information". Within
#   one gen1randombattle a random other decision point shares the same
#   two teams, usually the same active Pokemon, the same move-slot and
#   switch-slot semantics, and heavy temporal autocorrelation in what
#   search picks — a noisy but GENUINELY INFORMATIVE teacher. The
#   falsifier would then be biased toward striking a TRUE claim. Second,
#   the paired action could be ILLEGAL under the current row's mask, and
#   masked cross-entropy to an out-of-mask target is degenerate against
#   the -1e8 sentinel; the r1 draft said nothing about it. Third, the
#   target FORM differed from the treatment's (hard action vs
#   temperature-shaped row_ev), which is precisely what made design A's
#   "dose ratio 1.00" true in A's own construction (a shuffled SCALAR).**
# THE REBUILT CONSTRUCTION, adopting review 1's option (a) plus finding
#   38's form fix:
#   * PAIRING IS CROSS-BATTLE, WITHIN THE SAME LANE, within the FIT
#     split: each row is paired with a row drawn uniformly from a
#     DIFFERENT battle_id of the same lane.
#   * PARTNERS ARE RESTRICTED TO ROWS WITH AN IDENTICAL LEGAL-ACTION
#     COUNT, and the target is INDEX-ALIGNED onto the current row's
#     legal set: the k-th legal action of this row receives the k-th
#     component of the partner's target. **EVERY TARGET IS THEREFORE
#     LEGAL BY CONSTRUCTION — there is no illegal-target case, and the
#     rule is stated rather than left to the implementer.**
#   * THE TARGET IS THE SAME TEMPERATURE tau APPLIED TO THE PARTNER'S
#     row_ev VECTOR — a shuffled DISTRIBUTION, the direct analogue of
#     A's shuffled scalar, so "same temperature" is TRUE again and the
#     target form matches the treatment's.
#   * Rows with no available partner at their legal count are DROPPED
#     and the dropped fraction is reported; > 2% -> PL is disclosed as
#     ROW-MISMATCHED and the falsifier is reported as WEAKENED.
#   * Same optimizer, same LR, same batch, same FIT rows (minus drops).
# THE INFORMATION CLAIM, RESTATED HONESTLY: **NO STATE-CORRECT
#   INFORMATION BEYOND THE LEGAL-ACTION-COUNT MARGINAL.** Not "zero
#   information" — matching on legal count is itself a weak function of
#   state, and the marginal over action indices conditional on legal
#   count is genuinely state-correlated (e.g. 4-move no-switch
#   positions). The residual is named, and it is far smaller than the
#   r1 construction's team/active-Pokemon/autocorrelation leakage.
# DOSE IS MEASURED, NOT ASSERTED (review 1 finding 21, review 2
#   MAJOR-7 — the r1 draft wrote `dose_ratio: 1.00` as an input claim,
#   which is EXACTLY the D25-P failure it was grafted in to close: D25-P
#   ran at 3-31% of the trunk band): F(PL vs X0) is measured on the GATE
#   split at fit time, RESULT-BLIND, and REQUIRED in
#   F(PL) / F(X1) in [0.80, 1.25]. Outside -> PL's STEP COUNT (its only
#   knob, result-blind) is adjusted until it is in band and the search
#   is transcribed into this header beside the temperature grid. **IF IT
#   CANNOT BE MATCHED, PL IS REPORTED AS DOSE-UNMATCHED AND
#   NON-BINDING — it strikes nothing — and the a-fortiori branch is
#   recorded as UNREACHABLE, in the D25-P sentence: "a generic actor
#   perturbation of matched size would move greedy play" survives
#   UNTESTED.**
# THE FALSIFIER IS se-AWARE AND ITS SURVIVE-SIDE IS NAMED (review 1
#   finding 22; review 2 MAJOR-6.3 — the r1 draft had a bare point
#   comparison with a "strikes IN FULL" consequence and no branch for
#   the < 0.6 side). delta(PL) is computed against X0, paired by base
#   lane, with the same larger-of-three se law:
#   PL-STRIKE      delta(PL) >= 0.6*delta(X1) AND
#                  delta(PL) >= 2*se_gov(PL)
#                  -> the information claim is STRUCK IN FULL and the
#                  licensed sentence becomes "any actor perturbation of
#                  this magnitude moves greedy play".
#   PL-UNCONFIRMED delta(PL) >= 0.6*delta(X1) BUT < 2*se_gov(PL)
#                  -> the information claim is DISCLOSED AS UNCONFIRMED,
#                  NOT struck; both numbers and both se terms quoted.
#   PL-SURVIVE     delta(PL) < 0.6*delta(X1)
#                  -> the information claim STANDS and the licensed
#                  sentence is "the gain requires state-correct search
#                  targets: a dose-matched perturbation carrying no
#                  state-correct information beyond the legal-count
#                  marginal moved greedy play by delta(PL) = <value>".
#   RESIDUAL FALSE-STRIKE RATE, PRE-COMPUTED under a TRULY NULL placebo
#   at delta(X1) = +0.028 (strike threshold 0.0168), s_C = 0.0199:
#   P(PL-STRIKE) = 0.003 / 0.006 / 0.015 at sd_d = 0.010 / 0.016 /
#   0.025, with P(PL-UNCONFIRMED) = 0.012 / 0.037 / 0.096. The bare
#   point rule of the r1 draft would have struck a true result 5-12% of
