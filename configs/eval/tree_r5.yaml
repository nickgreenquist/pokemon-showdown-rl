# OUR CRITIC INSIDE A REAL TREE -- the "RL500" question, in two steps.
# Hacking run, 2026-09-18. Maintainer: "If our evaluator is better than FP
# heuristic: I'm confused why we can't do like an RL500 and let it search same
# way as FP and beat FP500?"
#
# THE ANSWER SO FAR IS THAT NOBODY BUILT IT AND RAN IT. `rl/search/tree.py` is
# decoupled UCT with OUR policy as the PUCT prior, OUR critic at the leaves,
# real chance nodes and real depth (mean simulation depth ~3.05 measured
# 2026-09-11) -- i.e. structurally what Foul Play does, with a better evaluator
# in it. It has only ever been run vs SimpleHeuristics at n=300, BEFORE the
# override-rate confound was understood, on the saturated axis. It could not be
# run off Foul Play at all until 2026-09-17, because the seat silently dropped
# the `tree` kwarg (4441e30).
#
# WHY IT IS WORTH RUNNING NOW, when depth-1 search is a null and depth-2 hurts:
# §24 measured that OUR CRITIC IS THE ROBUST EVALUATOR -- tripling how often
# search acts on it costs 0.006, while doing the same to Foul Play's heuristic
# costs 0.088 at 5.6 se. The standing reason to expect a tree over our critic to
# fail was that the critic would misjudge off-policy lines. That is now
# measured false at depth 1. The matrix's depth-2 failure has a DIFFERENT and
# identified cause: `_look_further` maxes over our replies with no min over the
# opponent's, which inflates exactly the rows search overrides into. A real tree
# does not make that error -- it backs up through both players.
#
# STEP 1 (this file): does a real tree beat GREEDY at all, off FP@20?
# STEP 2 (only if step 1 clears greedy): scale the budget and put it against
# FP@500 head to head. Running step 2 first would spend ~7 h to learn something
# step 1 answers in 90 minutes.
#
# THE BAR IS GREEDY, NOT THE DEPTH-1 SEARCH. Three independent greedy draws on
# this object read 0.5747 / 0.5720 / 0.5827, pooling to 0.5765 (n=4500). Every
# search configuration measured so far is level with or below that.
#
# THREE DECISION RULES, because the rule mattered more than the tree last time:
#   TV  decide=visits -- Foul Play's and AlphaZero's rule. No gate. Caveat
#       measured 2026-09-11: our prior is sharp enough that 90.9% of root visits
#       landed on one action at a small budget, so visit share IS nearly the
#       prior unless the budget is large enough to overrule it.
#   TQ  decide=q + margin, swept to match D1's 6.8% override. This is EXACTLY
#       the shape of the banked depth-1 selector on the same value scale, so
#       TQ vs D1 differs in DEPTH and in nothing else -- the comparison
#       tree.py's own docstring says is the one worth having.
#   TG  decide=gumbel (Danihelka et al., ICLR 2022 App. C.2.2): a policy
#       improvement for ANY monotone sigma, with one knob. Two caveats travel:
#       the guarantee is against SAMPLING from pi, not against argmax pi (and
#       our protocol is deterministic), and it holds only as far as q is
#       correct. §24 is the first evidence that our q IS relatively correct.
#
# BATCHING IS ON (batch 16): leaf-parallel descents under a virtual loss share
# one forward, measured 224 -> 113 ms/decision at equal iterations. It is what
# makes depth affordable and it does not change what the tree searches.

