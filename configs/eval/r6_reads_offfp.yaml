  GW112R: {kind: greedy_seat,   seat: w112, battles: 3000, search_time_ms: 20, loop_breaker: true, seat_username: r6gw112seat, fp_username: r6gw112bot}
  GW120R: {kind: greedy_seat,   seat: w120, battles: 3000, search_time_ms: 20, loop_breaker: true, seat_username: r6gw120seat, fp_username: r6gw120bot}
  GA304F: {kind: greedy_seat,   seat: a304, battles: 3000, search_time_ms: 20, loop_breaker: true, seat_username: r6ga304seat, fp_username: r6ga304bot}
  GA312F: {kind: greedy_seat,   seat: a312, battles: 3000, search_time_ms: 20, loop_breaker: true, seat_username: r6ga312seat, fp_username: r6ga312bot}
  GA320F: {kind: greedy_seat,   seat: a320, battles: 3000, search_time_ms: 20, loop_breaker: true, seat_username: r6ga320seat, fp_username: r6ga320bot}
