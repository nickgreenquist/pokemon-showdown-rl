title: r6_reads_offfp
status: "DRAFT 2026-09-21 (agent, under the six R6 rulings of 2026-09-20). REGISTERED the moment scripts/monster_reads_pin.py pins the six R6 finals (the queue does it). THE PRIMARY READ of configs/showdown_r6_trio_{a,b}.yaml (their credit line, verbatim below) AND the read that PICKS LADDER R6's OBJECT."
journey_step: "10"
