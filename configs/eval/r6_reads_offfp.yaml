# THE OFF-FOUL-PLAY READ of the R6 fleet (R6 prep plan section 2; the trio headers'
# PRIMARY READ). Everything is off FP@20 (search_time_ms 20 PER ARM), n=3000 per arm,
# GREEDY singles and committees, ONE session, SEQUENTIAL (FP's budget is wall-clock: a
# second concurrent Foul Play weakens both opponents and flatters both seats), fresh
# prefix-free usernames (scheme r6<arm><role>; rerun pairs for a poisoned pair).
#
# POLICY FORM: EVERY arm carries loop_breaker: true (ruling #1 of 2026-09-20 -- the R6
# ladder object's form), the re-drawn R5 W floor included, so every comparison here is
# matched in form; that form is a change relative to every BANKED number, which is one
# more reason the floor is RE-DRAWN in this session and never quoted from the bank.
#
# ENCODER: the six R6 finals are c6-ON checkpoints (the fleet's observation contract;
# rl/common/checkpoint.py refuses a c6 mismatch at load), the three R5 W finals are
# c6-OFF. The queue sets POKEMON_RL_ENCODER_C6 PER ARM from the `c6` key below; E9RF
# mixes both generations and is built under POKEMON_RL_ENCODER_C6_ALLOW_MISMATCH=1 with
# the flag ON (the six R6 members are the majority and the object's future is c6-on) --
# a MIXED object, measured rather than assumed, and disclosed on its number.
#
# CHECKPOINT PINS: the six R6 finals are pinned BY scripts/monster_reads_pin.py --trio a /
# --trio b the moment each trio's watchdog prints "DONE at step" for all three lanes
# (lanes finish at DIFFERENT steps; a name is never guessed). The three W finals are the
# monster_reads pins, copied verbatim.
#
# READS, stated before any arm runs. Unpaired two-proportion se at p~0.55:
# se_diff ~0.0128 arm-vs-arm at 3000 vs 3000; ~0.0074 pooled 9000 vs 9000.
#   R1 THE PRIMARY, per trio (the trio headers' credit line): mean over the trio's three
#      greedy finals (GA304F GA312F GA320F -> pooled n=9000; GB328F GB336F GB344F likewise)
#      MINUS the mean over the three re-drawn R5 W finals (GW104R GW112R GW120R, pooled
#      n=9000). se_diff = the LARGER of the pooled-binomial se_diff and the seed-clustered
#      se_diff (k=3 vs k=3, from the per-lane rates at read time). CREDIT LINE, verbatim
#      (CLAUDE.md): "a lever is credited iff pooled delta >= +0.025 AND >= 2*se_diff, where
#      se_diff is the LARGER of the pooled-binomial se_diff and the seed-clustered se_diff,
#      the latter computed from the per-seed finals at read time." Boundary: a delta
#      EXACTLY +0.025 or EXACTLY 2*se_diff reads as NOT met. Cells (trio headers): X-POS
#      credited; X-NEG (<= -0.025 and |delta| >= 2*se_diff) credited negative; X-FLAT null,
#      closes nothing. C6 is common-mode and confounded with each lever by construction
#      (no c6-off R6 arm) -- stated, uncredited.
#   R2 THE LADDER OBJECT (LADDER R6): candidates E3AF, E3BF, E6RF, E9RF; FLOOR E3WR (the
#      R5 committee, re-drawn in this session under the same form). Rule: the candidate
#      with the highest point estimate; if the top two are within 1 se_diff (0.013), the
#      LARGER committee; if no candidate reaches E3WR - 0.013, the R5 committee stays the
#      object. Committee cost at ladder speed is 1-30 ms/decision for 3-9 members.
#   R3 COMMITTEE GAIN PER TRIO: E3AF - mean(GA*), E3BF - mean(GB*), E3WR - mean(GW*R),
#      each 3000 vs 9000 -- additive with the lever or not (R5's W trio read +0.0417 over
#      its 100M floor; the gain is what the committee monetises).
#   R4 MEMBERS: E9RF vs E6RF (do the c6-off W finals still add inside a c6-on committee?)
#      and E6RF vs the better ENS3.
#   R5 (descriptive) the six singles' spread within each trio, as the seed-clustered se's
#      own witness.
#
# DISCLOSURES THAT TRAVEL WITH EVERY FP@20 NUMBER, FOREVER (CLAUDE.md): the equivalence
# test is weakly powered, and the point estimate flatters us. The budget is NAMED in every
# quote. FP@20 is an instrument, not a rung; nothing here is a ladder projection in either
# direction. The whole block runs on an IDLE box (no training lane, no second FP process);
# anything else that ran beside an arm is logged by the queue and disclosed in the readout.

