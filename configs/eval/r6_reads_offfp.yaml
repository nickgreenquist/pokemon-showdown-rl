  E3BF:   {kind: ensemble_seat, lanes: [b328, b336, b344], battles: 3000, search_time_ms: 20, loop_breaker: true, seat_username: r6e3bseat, fp_username: r6e3bbot}
  E6RF:   {kind: ensemble_seat, lanes: [a304, a312, a320, b328, b336, b344], battles: 3000, search_time_ms: 20, loop_breaker: true, seat_username: r6e6rseat, fp_username: r6e6rbot}
  E9RF:   {kind: ensemble_seat, lanes: [a304, a312, a320, b328, b336, b344, w104, w112, w120], battles: 3000, search_time_ms: 20, loop_breaker: true, seat_username: r6e9rseat, fp_username: r6e9rbot}

# Per-arm encoder setting for the queue (the checkpoint loader enforces it): c6 on for
# every arm holding an R6 final, off for the pure-W arms, mixed for E9RF.
arm_encoder:
  GW104R: {c6: false}
  GW112R: {c6: false}
  GW120R: {c6: false}
  E3WR:   {c6: false}
  GA304F: {c6: true}
  GA312F: {c6: true}
  GA320F: {c6: true}
  GB328F: {c6: true}
  GB336F: {c6: true}
  GB344F: {c6: true}
  E3AF:   {c6: true}
  E3BF:   {c6: true}
  E6RF:   {c6: true}
  E9RF:   {c6: true, allow_mismatch: true}

# The floor and the primary first, so an early stop still leaves the credit read; the
# committees (the object pick) after.
run_order: [GW104R, GW112R, GW120R, GA304F, GA312F, GA320F, GB328F, GB336F, GB344F, E3WR, E3AF, E3BF, E6RF, E9RF]

comparators_banked:
