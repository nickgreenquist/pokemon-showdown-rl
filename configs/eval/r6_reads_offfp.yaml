  GB336F: {kind: greedy_seat,   seat: b336, battles: 3000, search_time_ms: 20, loop_breaker: true, seat_username: r6gb336seat, fp_username: r6gb336bot}
  GB344F: {kind: greedy_seat,   seat: b344, battles: 3000, search_time_ms: 20, loop_breaker: true, seat_username: r6gb344seat, fp_username: r6gb344bot}
