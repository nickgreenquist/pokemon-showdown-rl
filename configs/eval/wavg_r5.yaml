# committee against the committee of the finals. HACKING RUN (2026-09-19; pre-reg
# is for ladder runs and headline claims). CREDITS NOTHING. R6 prep plan item 2
# (docs/proposals/R6_PREP_PLAN_2026-09-19.md section 3): it decides whether the
# R6 OBJECT RULE takes each lane's averaged checkpoint or its final as the member.
#
# THE TENSION IT RESOLVES (IDEAS 2.12): the average sits ~35% of the way back
# along the tail in parameter space, and RESULTS section 29 measured that the
# annealed tail is where 3-6 points of in-loop win rate are made -- while the
# consecutive-displacement cosine (-0.05..-0.07, stable) says there IS noise to
# cancel. Neither dominates on paper; this is the one-hour eval the row asks for.
#
# ANTI-SELF-DECEPTION, unrelaxed: the control (E3WA, the finals) runs FIRST and in
# the SAME session (CLEANUP L6; the ~0.02 session offset on this instrument is
# UNRESOLVED, RESULTS 30.1 retraction); the banked 0.5987 is never differenced;
# both FP@20 disclosures travel (weakly powered equivalence; the point estimate
# flatters us); ties are non-wins; counters reach disk before any verdict.
