arms:
  G2SM: {kind: native_seat,   seat: w112, ensemble_members: [w104, w112, w120], battles: 2,    search_time_ms: 20, seat_username: r7g2smkseat, fp_username: r7g2smkbot, lop: {worlds: 8, margin_gate: 0.01, seed: 20260925, solve: {cols_k: 4, chance_s: 2, tau: 0.05}}}
  G2G:  {kind: ensemble_seat, lanes: [w104, w112, w120], battles: 3000, search_time_ms: 20, seat_username: r7g2grseat, fp_username: r7g2grbot}
  G2L:  {kind: native_seat,   seat: w112, ensemble_members: [w104, w112, w120], battles: 3000, search_time_ms: 20, seat_username: r7g2lseat, fp_username: r7g2lbot, lop: {worlds: 8, margin_gate: 0.01, seed: 20260925, solve: {cols_k: 4, chance_s: 2, tau: 0.05}}}
phases:
  smoke: [G2SM]
  R: [G2G, G2L]
decision_rule:
  primary: "G2L minus G2G, off FP@20, n=3000 per arm, one session, SEQUENTIAL arms, the control (G2G) FIRST"
  credit_line_verbatim: >-
    a lever is credited iff pooled delta >= +0.025 AND >= 2*se_diff, where se_diff is the
    LARGER of the pooled-binomial se_diff and the seed-clustered se_diff, the latter computed
    from the per-seed finals at read time. (Each arm here is ONE object -- the three-member
    committee -- so there are no per-seed finals to cluster and se_diff is the pooled binomial
    se_diff, 3000 vs 3000, ~0.0127; stated so the clause is not read as silently dropped.)
    Boundary: a delta EXACTLY +0.025 or EXACTLY 2*se_diff reads as NOT met.
  clears: >-
    delta >= +0.025 AND >= 2*se_diff -> JOURNEY 14's exit condition is MET at this budget: search
    with our evaluator beats the same committee greedy off FP@20. The R6 ladder pre-reg gets an
    addendum offering the L-op as the object under a disclosed policy form (plan §6), and gen9
    gets MCTS (JOURNEY 13/14).
  does_not_clear: >-
    otherwise and not negative -> the ladder stays greedy; the training side proceeds anyway
    (plan §6: G0 said the prize exists and the evaluator is what the fleet trains). NOT the
    real-budget null: the next L-op arm raises the budget (B >= 16 worlds, rollout leaves on
    close calls) before anything is concluded about search at the ladder.
  negative: >-
    delta <= -0.025 AND |delta| >= 2*se_diff -> the L-op at this budget is a measured COST off FP
    (as §30's ungated arms were); same action as does_not_clear, and the next budget arm must
    argue against it.
  also_recorded: "search/override_rate (the landmine: beside every number), lop/argmax_moved_rate, lop/margin_mean, lop/worlds_built_rate, lop/refused by family, lop/no_world, lop/mask_mismatch, search/ms_mean and ms_p99, decisions_per_sec on BOTH arms"
disclosures:
  - "FP@20: the equivalence test is weakly powered, and the point estimate flatters us; FP@20 is an instrument, not a rung"
  - "the per-turn budget in every quote: B 8 worlds x k 4 x S 2 at depth 1 (~540 leaves a decision), ms_mean and decisions/sec from the arm's own JSON"
  - "the /timer line (every seat sends /timer on)"
comparators:
  g1_true_world: {delta: 0.0504, se: 0.0050, note: "readouts/R7_G1_READOUT.md -- the ENGINE MIRROR, true world + exact foe prior; a different instrument, never differenced"}
  g1b_belief: {note: "results/r7_g1b -- the same operator on belief worlds in the mirror; PENDING at drafting; never differenced"}
R0_gates:
  - name: G_QUIET_BOX
    check: "no training lane, no R7 job, no other FP arm alive (the reads queue's HOT/ENV nets); FP@20's budget is wall-clock"
  - name: G_CONTROL_FIRST
    check: "G2G's json predates G2L's"
  - name: G_OPERATOR_RAN
    check: "G2L: search/searched > 0.5 x search/decisions; lop/worlds_built_rate >= 0.9 (R1-E refused 256 of 13,396 roots); lop/mask_mismatch == 0 (R1-E: mask parity exact); lop/no_world <= 0.02 x decisions; search/override_rate in [0.02, 0.25] (G1 0.096, G1b's belief arms ~0.09) -- outside it the operator did not run as measured and the read says nothing"
  - name: G_MATCHED_GREEDY
    check: "tests/test_lop.py green at the launch commit (the gate-shut L-op plays the ensemble_seat's action)"
  - name: G_SESSION
    check: "no difference against any banked number; the delta is G2L - G2G only"
  - name: G_TIES
    check: "ties are non-wins and are reported beside n"
  - name: G_CONCURRENCY
    check: "max_concurrent_live_battles == 1 and concurrent_decision_rate <= 0.01 on both arms"
