# R7 G2 -- JOURNEY 14's EXIT CONDITION at the L-op's first budget: the belief-sampled, gated
# L-op vs THE SAME COMMITTEE GREEDY, off Foul Play at 20 ms. DRAFT 2026-09-23, NOT RATIFIED --
# it runs only after the maintainer ratifies it, on the IDLE box (after the R6 reads queue;
# never beside a training lane or an R7 job: FP@20's budget is wall-clock).
#
# journey_step: "14". Exit condition, verbatim from JOURNEY.md: "one comparison at a REAL
#   budget, on the strongest gen-1 object we have. Search-with-our-evaluator vs the same
#   checkpoint greedy, pooled under the standing credit line, with decisions/sec reported for
#   both arms and the per-turn budget named in every quote." Plan §6 G2, verbatim: "L-op with
#   belief samples vs greedy, off FP@20, n=3,000 per arm, in-session anchor (the R5 greedy
#   committee re-drawn), the standing credit line verbatim (pooled delta >= +0.025 AND >=
#   2*se_diff, se_diff the larger of binomial and seed-clustered), decisions/sec and the
#   per-turn budget in every quote, both FP@20 disclosures."
#
# WHAT THIS READ IS, AND IS NOT. The L-op here is DEPTH 1, B = 8 belief worlds, k 4 foe
#   replies, S 2 chance samples (~540 leaves a decision; ms and decisions/sec stamped): the
#   operator G1 measured at +0.0504 +- 0.0050 over its own greedy in the engine mirror in its
#   BEST case (true world + the foe's exact prior; readouts/R7_G1_READOUT.md) and G1b measures
#   without the peek. It is NOT the "real budget" JOURNEY 14 names -- the ladder allows ~150 s
#   a turn and this spends milliseconds -- so a non-clear here does NOT close the search
#   question (rule 6 in spirit: a small-budget null is not the budget-ceiling null); it sends
#   the next L-op arm to a larger budget (more worlds; rollout leaves, whose depth-1 ceiling G0
#   measured at +0.0236 per decision against the critic leaf's +0.0040). What changes vs G1 is
#   exactly what the ladder changes: the world is sampled (B6's bridge + the determinizer; gate
#   R1-E) and the foe is FOUL PLAY, not our committee -- the opponent model is our committee's
#   guess at a search bot.
#
# THE OBJECT: the R5 W committee (w104/w112/w120, the three 200M finals every R7 measurement
#   used). If Friday's R6 read makes an R6 committee the ladder object, a second G2 on THAT
#   committee, under this same protocol, is the addendum's input.
# POLICY FORM: both arms WITHOUT the loop breaker (matched; the R6 ladder object carries it, so
#   an L-op addendum there would disclose the form difference or re-read with it).
# MATCHED GREEDY: the L-op's action when it does not override is EnsembleAgent's over the same
#   members, bit for bit (tests/test_lop.py: gate shut -> the ensemble_seat's action on every
#   harvested decision), so G2L - G2G isolates the search.
