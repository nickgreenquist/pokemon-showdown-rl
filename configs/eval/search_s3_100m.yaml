#        whether the n_det axis is worth extending.
#   P-L  delta_L = S3L(s112) - S3M(s112). Sign only, one lane, +-0.02.
#   P-E  delta_E = equal-weight mean over lanes of (A1E - S3M), paired.
#        Same cells as P-M. POS -> "a better evaluator pays on the 100M
#        object" — the monster train's evaluator lever (IDEAS 8.2 / 4.7)
#        moves to the top of its config decisions. NEG/FLAT -> the
#        ensemble form does not move the 100M object; 8.2 (a critic
#        trained as an evaluator) stays untested — different mechanism.
#   Timing: search/ms_mean, leaves_mean, decisions/s recorded per arm.
#        The box carries up to 7 concurrent eval processes (torch_threads
#        1 each): timing here is DESCRIPTIVE AND CONTENDED, never the
#        clean decisions/sec JOURNEY 11.5's exit condition asks for.
# Credit line, restated verbatim so the cells above are the standing
# ones: "a lever is credited iff pooled delta >= +0.025 AND >= 2*se_diff,
# where se_diff is the LARGER of the pooled-binomial se_diff and the
# seed-clustered se_diff, the latter computed from the per-seed finals at
