#
# PRIMARY READ — P-ENS = ENS3(n=9000) - A0 pooled (0.78867, n=9000, fresh this
# session). Aggregator: pooled over batches, equal weight (batches are equal
# size). Two-sided.
#
# CREDIT LINE, restated verbatim: a lever is credited iff pooled delta
# >= +0.025 AND >= 2*se_diff, where se_diff is the LARGER of the
# pooled-binomial se_diff and the seed-clustered se_diff, the latter computed
# from the per-seed finals at read time. HERE THE CLUSTERED TERM IS NOT
# AVAILABLE and that is a DISCLOSED LIMITATION, not an omission: three lanes
# make exactly ONE committee, so there is no across-committee replication and
# the batch spread measures EVAL noise only. The binomial se_diff therefore
# governs by default, which is the ANTI-CONSERVATIVE direction — so a credited
# ENS3 licenses "ensembling THESE three checkpoints", never "ensembling helps".
# That is the identical limitation LADDER R1's object carried (RESULTS §16.1),
# and it is repeated here deliberately rather than quietly dropped.
#
# R0 SANITY GATES: mask_desyncs_delta == 0 on every chunk; ensemble_decisions
# and ensemble_flips recorded per chunk (flip_rate = ensemble argmax differing
# from the MODAL member argmax — a rate of 0 means the wrapper is inert and the
# arm is a single member in disguise, which voids it).
#
# BRANCHES: credited positive -> ENS3 is a ladder-object candidate and the
# ensemble-as-PRIOR composition with the gate becomes worth the engineering
# (SearchAgent cannot consume an EnsembleAgent today). Null -> the 12M B1
# credit did NOT carry to 100M; record it, because a lever that decays with
# scale is itself a finding, and per the 2026-09-06 ruling a null closes
# nothing. Credited negative -> report; the ensemble is discredited at 100M.
#
# WHAT IT DOES NOT LICENSE: one committee, one recipe, one budget. It says
# nothing about ensembling as a leaf EVALUATOR (that is EG10) and nothing about
# a larger committee.
# =====================================================================
