#   A1E  dose M with the leave-one-out CRITIC ENSEMBLE as the leaf
#        evaluator (R4's E3 form — the only search dial that ever moved:
#        +0.036 screen, +0.0224 at credit grade, B3 FLAT), lanes
#        s104/s112/s120, pool = the other two 100M lanes. Runs LAST, held
#        behind a sentinel, because R4's F5 assert was written for a
#        4-lane pool (peers == 3) and the 100M fleet has three lanes
#        (peers == 2): the assert is generalised to `loo_pool_expected`
#        with the default unchanged, and R4-13 (evaluator discrimination,
#        serverless) must PASS before the arm launches. Intent of F5
#        (own lane excluded by identity; every other lane in) unchanged.
#
# PRE-STATED READS (vs SH is the ONLY verdict axis; this run credits
# nothing — the reads route the relook, they do not land a README row):
#   P-M  delta_M = equal-weight mean over lanes of (S3M - A0), paired by
#        lane. Cells: NEG iff pooled <= 0 AND per-lane <= 0 in >= 2 of 3;
#        POS iff pooled >= +0.025 AND >= 2*se_diff (larger-of clause);
#        FLAT otherwise. NEG or FLAT -> depth-1@M does not pay on the 100M
