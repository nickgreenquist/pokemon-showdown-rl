# designer A §5.3b, ADOPTED VERBATIM. Pre-committed HERE because it is what
# makes Q6's winner's-curse figure refer to anything: r3-r5 quoted a bias over
# a candidate set the file never named.
r3_deployment_rule:
  candidates: [E4_incumbent, E3, E7, best_single_50M_greedy_from_R1A, R1B_search_object]
  rule: "argmax of the R1 FP@20 equal-weight score"
  default: "THE INCUMBENT (E4/L2) WINS TIES AND WINS THE MIDDLE CELL. A challenger replaces the incumbent only if it clears +0.025 AND 2*se_diff(3000,3000)=0.0246, i.e. +0.025."
  rationale: "switching the deployed model on noise is the post-hoc hazard in its purest form. The default must be no-change."
  # AMENDMENT (assistant, not A): A priced the m=5 winner's curse at +0.010
  # assuming ALL FIVE candidates are scored at n=3000. They are scored at TWO
  # different n here, so the per-candidate se differs and E[max]*se is not one
  # number. The realized mix is stated so the bias can be recomputed.
  candidate_n_is_not_uniform:
    E4_incumbent: 3000                        # C0
    E3: 3000                                  # CE3, funded 2026-08-26
    E7: 3000                                  # CE7, funded 2026-08-26
    best_single_50M_greedy_from_R1A: 1000
    R1B_search_object: 1000
  winners_curse_at_the_n_of_the_score: {m5_n3000: 0.0101, m5_n1000: 0.0175, best_k_of_7_n3000: 0.0235}
  bias_recomputed_at_readout: "E[max of m standard normals] * se, with se per candidate at its REALIZED n_eff. Recorded beside the selection score, never subtracted from it."

# designer A §5.3a, ADOPTED VERBATIM. Named so they cannot be smuggled in.
barred_rosters:
  best_k_of_7: "BARRED. Score-based roster construction is selection INSIDE the object; it contaminates even a fresh re-score, because the roster itself was fit to R1's scores. A held-out construction (build the roster on battles 0-1499, score on 1500-2999) is defensible and is a SEPARATE pre-registration. Named here so it is not smuggled in — and so the escape hatch is not rediscovered at readout and run inline."
  any_roster_containing_the_BC_clone: "BARRED ON PURITY, not on statistics. The clone is trained on Foul Play data; a deployed ensemble containing it breaches the pure self-play lane, which is this project's entire novelty claim. Also 808-dim. THE RULE IS ON PURITY because a re-encoded clone would satisfy any shape rule."

