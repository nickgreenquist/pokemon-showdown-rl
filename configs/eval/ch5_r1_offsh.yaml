# Q5. GRADING — r3. **THE ACTION COLUMN IS THE POINT** (review 1 BL-1:
#   r2 had nine verdict cells and zero actions).
#   bar = max(0.025, 2 * max(se_binomial, se_clustered)), and
#   **se_clustered = sqrt(s_arm^2/k_arm + s_cmp^2/k_cmp) — k-GENERAL, not
#   the hardcoded /3 of r2** (review 1 BL-3: at k=2 that understated the
#   se by 22%). s_* are TOTAL lane sds, not sigma_seed; r2 quoted one and
#   formula'd the other. **At k_arm = 1 there is NO clustered term** —
#   one lane yields no sd — so a k=1 read is binomial-only and is
#   DESCRIPTIVE, never a verdict. AGGREGATOR = EQUAL-WEIGHT MEAN of lane
#   rates, BINDING; **MEDIAN IS BARRED** (at k=3 the median IS one lane,
#   i.e. maximally robust to the very one-lane collapse that is the
#   signal). Disclosure: at k=3 Welch df ~2.2, so "2 se" is ~82%
#   coverage, not 95% — say 82% wherever the bar is quoted.
#
#   VERDICT-S (one-sided each; WITHIN is the COMPLEMENT, never an
#   equivalence claim): ABOVE d >= +bar | WITHIN otherwise | BELOW d <= -bar.
#   VERDICT-P (is the bar informative at all):
#     RESOLVING bar <= 0.030 | WEAK 0.030-0.060 | NON-RESOLVING > 0.060.
#
#   **THE 3x3 ACTION TABLE. Every cell routes; no cell is silent.**
#     ABOVE  x RESOLVING      -> scale is alive AND the model is on disk.
#                                R3 ladders the 50M fleet; R2 training is
#                                OPTIONAL. Past-50M stays out of chapter.
#     ABOVE  x WEAK           -> same direction, weaker warrant. R3 may
#                                ladder 50M, but the readout says WEAK and
#                                quotes the bar. No R2 lever is credited.
#     ABOVE  x NON-RESOLVING  -> **CANNOT OCCUR BY CONSTRUCTION** at any
#                                plausible fleet mean (see the O-4 cliff
#                                table). If it somehow fires, VOID and
#                                re-examine the arm — it means the bar and
#                                the delta were both enormous.
#     WITHIN x RESOLVING      -> the ONLY cell licensing the word "flat".
#                                Scale genuinely does nothing off-FP at
#                                50M. R2 = C2 (more seeds) unless R1-C
#                                already delivered; then a structure lever.
#     WITHIN x WEAK           -> no "flat" sentence. Report the interval.
#                                R2 = C2, chosen on cost not on evidence,
#                                and the readout says the scale question
#                                is UNRESOLVED rather than answered.
#     WITHIN x NON-RESOLVING  -> **k=3 CANNOT ANSWER THIS QUESTION.** The
#                                action is NOT more battles (binomial is
#                                not what binds here) and NOT "flat". It
#                                is: stop buying battles, and either buy
#                                LANES or drop the scale question for the
#                                chapter. Pre-committed so the tempting
#                                "just run more" is closed off in advance.
#     BELOW  x RESOLVING      -> scale actively hurts this recipe. C1/C3
#                                CLOSED for the chapter. R2 = C2 (more 12M
#                                seeds + widest ensemble); R3 ladders the
#                                best 12M-family object.
#     BELOW  x WEAK           -> same action as above, stated as weak. Do
#                                not publish "scale hurts".
#     BELOW  x NON-RESOLVING  -> same as WITHIN x NON-RESOLVING: the
#                                instrument, not the world, is the limit.
#
#   **R1-B's BAR (review 1 BL-2: r2 graded only R1-A).** R1-B is a
#   WITHIN-LANE difference d_i = search_i - greedy_i on the SAME three
#   lanes, so the seed LEVEL cancels. **"Paired" was the wrong word in r2
#   — the covariance is zero (different battles); the benefit is the
#   cancelling level term.** Governing se = max(binomial, sd(d_i)/sqrt(k))
#   — the repo already has this instrument, R5b's `paired_clustered_sd_d`.
#   At 1000/lane the binomial term is 0.0123, so bar = max(0.025, 0.0246,
#   2*sd(d_i)/sqrt(3)). One-sided ABOVE only: the pre-registered question
#   is "does search help on a better-trained net", and a NEGATIVE result
#   reproduces the banked sign rather than discovering anything.
#   **R1-C's BAR.** Each composition is scored against C0 (L2's own
#   number), both new, both n=3000, single arms: se_diff 0.0123 -> bar
#   0.0246, which meets the 0.025 floor. Two-sided (a composition may be
#   worse than L2 and that matters for deployment).
