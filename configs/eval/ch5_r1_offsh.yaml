# Q1. THE CORRECTION THAT REORGANISED THIS PRE-REG (designer A, verified
#   independently before being believed).
#   Decompose every banked lane spread into binomial + seed:
#     12M off FP@20  k=4  s_T 0.00771  binomial-only 0.00870 -> sigma_seed = 0
#     12M vs SH      k=4  s_T 0.01118  binomial-only 0.00821 -> sigma_seed = 0.0076
#     50M vs SH      k=3  s_T 0.06295  binomial-only 0.00835 -> sigma_seed = 0.0624
#   **The 50M fleet's seed spread is 8.2x the 12M fleet's, driven by the
#   one lane at 0.6297.** Consequences, both load-bearing:
#   (a) **"50M IS FLAT vs SH" IS NOT A WEAK CLAIM, IT IS NOT A CLAIM.**
#       delta -0.01603 against a clustered 2-se bar of **0.0735** = 0.44
#       se. (r1 said 0.0725 — computed from sigma_seed while Q5's stated
#       formula uses the TOTAL sd s_T. Review 1 caught the file
#       contradicting its own formula; 0.0735 is the Q5-consistent value
#       and the verdict is unchanged either way.)
#       CHAPTER5 §3 C1 has been corrected. Nobody may quote "scale is
#       flat" from this repo, on either axis, until R1 reads out.
#   (b) **R1-A CANNOT BE A CREDIT-GRADE SCALE READ AND MUST NOT CLAIM TO
#       BE.** If the 50M family's off-FP sigma_seed resembles its vs-SH
#       0.0624, the clustered bar is ~0.073 at k=3 and NO battle count
#       fixes it — only more lanes would, and we have three.
#   **R1-A's PRIMARY READ — REPLACED r1->r2 BY REVIEW 1, whose version is
#   better and is adopted.** r1 said "measure the 50M family's off-FP
#   sigma_seed". **That is not well-posed at k=3:** an sd on 2 df carries
#   a 95% CI spanning x[0.52, 6.28] — a factor of TWELVE — so 0.0624
#   would come back as [0.033, 0.392]. In-repo proof it is not academic:
#   re-measuring the SAME four 12M seeds gives sigma_seed 0.00758 vs
#   0.01121, 48% apart at k=4. r1 also mis-attributed it to designer A,
#   who named it a CONDITIONAL FALLBACK, not a primary.
#   **PRIMARY (r2): does s82's collapse REPRODUCE off-FP?** The whole 50M
#   variance story is one lane (0.6297 against 0.7423/0.7347). That is a
#   sharp binary question with real power — at n=1500/lane, se_diff
#   between {s80,s81} and s82 is 0.0166, so a vs-SH-sized collapse (0.11)
#   lands at **6.6 se**. If it reproduces, the 50M fleet has a genuine bad
#   seed and k=3 cannot support a scale claim. If it does NOT, the vs-SH
#   spread was SH-specific and the off-FP fleet may be tight enough to
#   read. Either answer is decisive; "estimate an sd from three points"
#   is decisive on neither. sigma_seed is still REPORTED, as a screen with
#   its CI attached, never as the primary.
#   (Hopeful sign, not evidence: for the 12M family sigma_seed is SMALLER
#   off-FP (0) than vs SH (0.0076).)
