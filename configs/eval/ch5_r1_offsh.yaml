#   O-6 **RULED. THREE MORE DESIGNER SPLITS HAD BEEN DECIDED SILENTLY;
#       each now has a recorded ruling, and all three are the assistant's,
#       flagged as such.**
#     (i) **R1-A's n -> 1000/lane, and there is NO stage 2 for the
#         fleet-mean read.** A wanted staged 1000->3000; B wanted 1500;
#         r4 carried 1500, which followed from NEITHER designer once B's
#         basis sqrt(3.51/1.485) died with the cost recalibration (the
#         same rule on the real costs gives 1343). **Then the deciding
#         fact, which neither designer had and which the assistant nearly
#         missed too: n DOES NOT BIND THIS BAR AT ALL.** 2*binomial falls
#         below the 0.025 floor from ~750/lane up, and the clustered term
#         has no n in it — so past ~750 no battle count can move the
#         fleet-mean bar. What binds is s_50. n=1000 is chosen because it
#         clears the s82 PRIMARY at 6.3 se (that read IS binomial), not
#         because it buys anything on the fleet mean. **Cost 1.24 h, down
#         from 1.86 h, and the "extend to 3000" branch is deleted as
#         incoherent rather than merely expensive.**
#     (ii) **R1-C composition -> BOTH, in their proper roles. Designer B's
#         disposition sharpened the decline, and its reason is better than
#         mine: R1's PRIMARY read IS "does s82's collapse reproduce
#         off-FP?", so a roster that DROPS s82 on its vs-SH score
#         PRE-ANSWERS the primary in its own construction.** B
#         recommended CW-6 (drop s82, soft-AND mechanism); A's membership
#         rules force s82 in; r4 ran A's side and recorded neither. They
#         are not actually in conflict once this file's own
#         deployment-vs-credit line is applied: **dropping s82 is
#         selection on a score already seen, so CW-6 cannot be a
#         pre-registered roster — but it CAN be a named DEPLOYMENT
#         candidate, re-scored fresh before any number is published.**
#         E3/E7 stay as the rule-fixed rosters; CW-6 is added as a
#         deployment candidate with B's mechanism recorded.
#     (iii) **What R1-A IS -> B's per-lane framing, adopted properly.**
#         r4 took B's premise ("cannot be credit-grade") and A's
#         conclusion (fleet-mean verdict). Now that the PRIMARY is the
#         s82 question — per-lane by nature — B's per-lane read is what
#         the primary actually needs. **PRIMARY = per-lane; the
#         fleet-mean delta is SECONDARY and DESCRIPTIVE.**
#     (iv) **G-DESYNC reverts to the designers' rule.** r3 set
#         `mask_desyncs == 0` as a VOID; **both** designers specified a
#         0.5% RATE (A's V8, B's G5) and the tightening was never flagged
#         as a change. VOID at > 0.5%; any non-zero count is REPORTED.
#     ORIGINAL FINDING, kept for the record: Q4 claimed R1-B was "THE ONE
#     PLACE THE DESIGNERS SPLIT". It was not. Q4 claims R1-B is "THE ONE PLACE THE DESIGNERS SPLIT".
#       It is not. (i) R1-A's n: A wanted a staged 1000->3000, B wanted
#       1500; r3 took 1500 and called it "three power calculations that
