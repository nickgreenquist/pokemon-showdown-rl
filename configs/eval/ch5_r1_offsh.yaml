# =========================================================================
# AMENDMENT r9 (RATIFIED 2026-08-28): the R2 policy-form decision.
# Process: two independent Opus design memos (decision-first / power-first),
# synthesis, two independent Opus reviews (adversarial arithmetic; repo
# consistency — ran the merged config against the suite, 40/40). All
# MUST/SHOULD findings applied before ratification.
policy_form_decision:
  decides: "EXACTLY ONE thing: whether R2's (batch) arms are scored GREEDY
    or SEARCHED at eval. Credits nothing; does not grade the equalisation
    hypothesis (2-df wall: the sigma CI multiplier [0.52, 6.29] is n-free);
    touches nothing about R3 or its deployed object."
  credit_line_restated: "A lever is credited iff pooled delta >= +0.025 AND
    >= 2*se_diff, where se_diff is the LARGER OF the binomial and the
    seed-clustered term (grading.se_rule; clustered_formula
    sqrt(s_arm^2/k_arm + s_cmp^2/k_cmp)). These arms credit nothing; the
    line is restated because a routing threshold looser than the credit
    threshold it routes to is a laundering path (bar_rationale)."
  # THE BAR R2 ACTUALLY FACES (verified twice, r9 reviews). R1-A's
  # realized 0.0717 = 2*sqrt(0.0617^2/3 + 0.0077^2/4): its 12M
  # comparator's clustered term (0.0039) was negligible. R2's control is
  # s80/81/82 (k=3, s=0.0617), so BOTH sides carry it: planning bar at
  # s_batch = s_ctrl is 2*sqrt(2*0.0617^2/3) = 0.1007. Sensitivity: that
  # is the WORST case — s_batch halved gives 0.0797, s_batch=0 gives
  # 0.0712. Realized sds govern at readout. STATUS.md and CHAPTER5.md's
  # "0.0717 for R2" were corrected in the ratifying commit.
  bar_R2_greedy_planning: 0.1007
  aggregators:
    governing: [sd_of_the_three_fresh_searched_lane_rates,
                transmission_slope_beta_searched_on_greedy]
    recorded_never_governing: [equal_weight_mean, pooled_rate, range,
                               best_lane, worst_lane, per_lane_deltas]
  inputs:
    x80: 0.4390                          # RS80, fresh, n=3000, banked
    x81: FROM_RS81
    x82: FROM_RS82
    greedy_x: {s80: 0.3960, s81: 0.3430, s82: 0.2730}   # A-arms, n=1000
    se_bin_n3000: 0.00906
    se_diff_two_n3000_arms: 0.0128
  key_A:
    statistic: "s3 = sample sd{x80,x81,x82} (ddof=1); s3_adj = sqrt(max(0,
      s3^2 - 0.00906^2)); bar_search = max(0.025, 1.633 * s3_adj)"
    threshold: "bar_search <= 0.030"
    sidedness: ONE_SIDED_UPPER           # only a bar REDUCTION justifies
    power: "ASYMMETRIC BY CONSTRUCTION, disclosed rather than tuned away
      (MC 200k + analytic, review-verified): under H0-equalised (all true
      rates 0.4390, binomial only) P(key_A fails) = 0.6%; under
      H1-random-effects (true lane rates ~ N(0.4390, 0.0597), greedy's
      dispersion net of its floor) P(key_A passes) = 10.8%; under
      H1-fixed-spread (three rates AT sd 0.0597) ~0%. THE H1 FORM IS
      NAMED because the answer depends on it. The error-equalizing cut
      (0.0199 unfloored) sits BELOW the 0.025 credit floor and is
      unreachable; 0.030 is kept because key_B binds in every scenario
      (expected_branch) and a false key_A pass alone switches nothing."
  key_B:
    statistic: "beta = OLS slope of (x80,x81,x82) on greedy_x, k=3 (1 df),
      DISATTENUATED for the x-axis n=1000 binomial noise: per-lane se
      0.01547/0.01501/0.01409 (rms 0.01487), factor 1.0616. Closed form:
      beta_raw = (0.05867*(x80-xbar) + 0.00567*(x81-xbar)
      - 0.06433*(x82-xbar)) / 0.0076127; beta = 1.0616 * beta_raw. ALL
      COMPARISONS AGAINST THE FLOOR USE THE DISATTENUATED beta."
    threshold: "beta >= bar_search / bar_R2_greedy_planning   (0.2481 at
      the floor bar_search = 0.025)"
    sidedness: ONE_SIDED_LOWER
    meaning: "switch only when searched TIES the greedy read under the
      pessimistic reading (lever transmits like seed noise) and wins 3-4x
      under the optimistic one (beta ~ 1 if batch acts on the policy
      head). Switch only when it cannot lose."
    disclosure: "beta is a 1-df plug-in from SEED variation; valid for
      batch ONLY IF batch acts through the channel seed noise does. Quoted
      as a plug-in, never a tested quantity."
  rule: "SEARCHED iff key_A AND key_B. GREEDY otherwise. GREEDY is the
    default and wins every tie, VOID, and ambiguity."
  # ADJUDICATED between the design memos: routing SEARCHED on tight
  # dispersion alone is mechanism-blind — signal and noise scale together
  # under any transfer slope, so MDE in greedy units is invariant (~0.10)
  # and the credit floor makes OVER-compression strictly destroy power.
  # Perfect equalisation (beta ~ 0) argues AGAINST switching. key_B stays;
  # dropping it is the named rejected alternative.
  # Cells: computed EXPOSITION of the total keys-rule. Partition on SIGNED
  # d_i = x_i - 0.4390, half-open: EQ is -0.0256 <= d < +0.0256 (the
  # 2*se_diff(3000,3000) convention band, i.e. indistinguishable from
  # RS80 — NOT the floor-exit point: bar_search leaves the 0.025 floor at
  # |d| = 0.0308 one-lane / 0.0178 opposite-sign, stated so nobody
  # rederives the band wrong). LOW is d < -0.0256; OVER is d >= +0.0256.
  cells:
    EQ_EQ: "GREEDY — grid-verified: NO point in the EQ box satisfies both
      keys (max disattenuated beta where key_A holds is 0.246 vs floor
      0.248; margin 0.002, so the FORMULA governs, not this sentence). THE
      STRONGEST EQUALISATION RESULT IS THE STRONGEST ARGUMENT AGAINST
      SWITCHING. Report the equalisation descriptively with its 2-df CI
      (two-sided, descriptive only). The emptiness argument uses
      bar >= 0.025 as a NECESSARY condition (bar is not constant inside
      the cell)."
    EQ81_LOW82_window: "THE LIVE CELL, the only region that can switch:
      at x81 = 0.4390 both keys pass for x82 in ~[0.4035, 0.4113] (key_A
