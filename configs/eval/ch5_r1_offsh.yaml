  VOID_wave_scoped:
    - "a G8 provenance break VOIDS EVERYTHING DOWNSTREAM OF IT, not just its arm"
  OPS_FAILURE_rerun_never_graded:
    - "$TAG.USERNAME_DEADLOCK (runner exit 3)"
    - "$TAG.NO_PROGRESS (runner exit 4, designer B §5.4, BUILT r6)"
  ops_failure_rule: "An arm carrying either sentinel is RE-RUN under a FRESH username pair from the reserved ch5 space. Its partial JSON, if any, is renamed to $TAG.opsfail.json and never enters a comparison. The grader REFUSES to grade a tag whose sentinel file exists."

