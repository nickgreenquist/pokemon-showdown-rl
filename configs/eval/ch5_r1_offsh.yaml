#
#   **R1-B's BAR (review 1 BL-2: r2 graded only R1-A).** R1-B is a
#   WITHIN-LANE difference d_i = search_i - greedy_i on the SAME three
#   lanes, so the seed LEVEL cancels. **"Paired" was the wrong word in r2
#   — the covariance is zero (different battles); the benefit is the
#   cancelling level term.** Governing se = max(binomial, sd(d_i)/sqrt(k))
#   — the repo already has this instrument, R5b's `paired_clustered_sd_d`.
