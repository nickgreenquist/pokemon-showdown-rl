#      visibility. If A's one-arm form is taken,
#      `grading.arms.R1B.object_selection_rule_if_one_arm` already fixes
#      the object, so it cannot be chosen after C0 reads out.)
#   3. R1-C's membership rule (below) — it is the deployment/credit line.
#   4. Reviews are OWED on this draft before launch.
#   5. **A-BR-4 — CHAPTER5 §3 C1 was EDITED by this process (25256b8).
#      RULED 2026-08-26: RETRO-RATIFIED.** The 0.0724-vs-0.0735 conflict
#      is settled at 0.0735 (the Q5-consistent value; 0.0724 was computed
#      from sigma_seed while Q5's formula uses the total sd s_T).
#   6. **A-BR-1 — buy a 4th D29r2 50M lane (~12.5 h training)? It is the
#      only purchase that improves R1-A's INFERENTIAL quality (sd df 2->3)
#      rather than its precision. A recommends NO: let WITHIN/WEAK route
#      to C2, which buys the lane as the LEVER, not as a measurement tax.**
#      STILL OPEN.
#   7. **A-BR-3 — pre-register the TOST? RULED 2026-08-26: NO, and the
#      reason is arithmetic rather than taste. At the ratified n=1000 the
#      TOST is UNREACHABLE at any sigma_seed (it needs s_50 <= 0.01324;
#      the per-lane binomial sd alone is 0.01507). It is recorded as
#      pre-registered-and-unreachable in `grading.r1a_tost` — the D25-P
#      lesson is that an unreachable branch is declared, not discovered —
#      and the word "flat" is BARRED on every branch.**
#   8. **A-BR-5 — CHAPTER5 §1 motivation 2 still needs its sentence fixed
#      (ZERO complete (proxy, ladder) pairs on FP@20, not one). Same
#      authority question as A-BR-4.** STILL OPEN.
#   9. **R1-C SCOPE — RULED 2026-08-26: FUND BOTH ROSTERS, E7 LAST.**
#      E3_50m and E7_all are now real `arms:` entries (CE3, CE7) with
#      usernames and budget lines; R1-C is 2 x 3000 = 2.73 h and
#      `r1c_delivered_iff`'s max(E3, E7) is defined over a fully budgeted
#      set. See `grading.r1c_scope_escalation`.
# =====================================================================

results_dir: results/ch5_r1_offsh
prereg: configs/eval/ch5_r1_offsh.yaml

fp:
  search_time_ms: 20        # G-BUDGET: never omit this key
  # rev 2 MA-10 / BL-1b: CH4's `fp:` carried all four of these and CH5's
  # dropped them, so each was silently supplied by a runner env default.
  budget_source: this_file_never_environment
  search_parallelism: 1
  format: gen1randombattle
  patch: scripts/patches/foulplay_gen1_local.patch
  patch_sha256: 8234a15d7382cfeec0cb0129646af2701bd7a576ac0eedf55f1bd9a0ca775348
  budget_disclosures:
    - "FP@20's equivalence test is weakly powered: its PASS band is tighter than its own noise."
    - "The point estimate has FP@20 marginally WEAKER than FP@100 (1.9 points), i.e. the direction that flatters us."

# designer B §7.7 + review 2 MA-3/MA-11. `results/` is GITIGNORED and
# single-copy, and FP's stdout is not a log — it is G2's SECOND TALLY, the
# only independent witness to every arm's W/L. Retention is an OBLIGATION.
artifacts:
  out_dir_rule: "OUT == results_dir on EVERY arm. The runner defaults OUT to
    results/ch3_r4_fp_anchor; a CH5 arm that takes the default splits G2's
    second tally from the arm JSON it must be checked against.
    scripts/ch5_r1_wave.sh exports OUT explicitly AND asserts it equals this
    file's results_dir; the grader asserts $OUT/$TAG.fp.stdout exists."
  fp_stdout_is_evidence: true
  retention_rule: "$TAG.fp.stdout, $TAG.seat.stdout, $TAG.runner.json and
    $TAG.runner.log MAY NOT be deleted, truncated, rotated or moved until
    scripts/ch5_r1_grade.py has recorded G2.tallies_agree == true for that
    tag. After that the raw fp.stdout is gzip -9'd IN PLACE, never deleted:
    the derived three-way tally in the grade JSON is a SUMMARY, and a summary
    cannot re-adjudicate a disputed number. The grader reads .gz in place."
  scratch_is_not_retention: "No CH5 number may be quoted whose fp.stdout lives
    only in an agent scratch dir. DISCHARGED 2026-08-26: the four calibration
    logs backing the 1.60/2.68 marginals and the G2-exact smokes
    (smoke_ch5_ens, price_ens, price_search, cal_search) were rescued from a
    scratch dir into results/ch5_r1_offsh/ (39 MB -> 2.1 MB gzipped, still
    greppable) and mirrored to the d25 backup."
  measured_kb_per_battle: {greedy_ensemble: 236, search: 275}
  projected_wave_bytes: "16,000 battles ~= 3.9 GB; 174 GB free at pre-reg time"
  mirroring: "results/ch5_r1_offsh/*.json (arm + runner + grade) mirror to
    ../pokemon-showdown-rl-d25-backup-20260815/ at each readout and are NAMED
    in the SESSION_LOGS entry — CH4's obligation,
    ch4_r1_offsh_instrument.yaml:442. The gzipped fp.stdout files are NOT
    mirrored (designer B: 'mirror the arm JSONs, not the 700 MB logs')."

# rev 2 MA-2a: `results/`, `runs/` and `data/` are ALL gitignored with zero
# tracked files, so a grader script is the ONLY committed provenance. CH5
# named none until r6. Naming a script that does not exist is worse than
# naming none, so anything unbuilt is flagged as owed.
instruments:
  wave: scripts/ch5_r1_wave.sh              # BI-2; G-SERIAL's artifact. BUILT r6.
  grader: scripts/ch5_r1_grade.py           # BI-4; --selftest is a launch gate. BUILT r6.
  preflight: scripts/ch5_preflight.sh       # BI-6. BUILT r6.
  equivalence: scripts/ch5_seat_equiv.py    # G-EQUIV
  runner: scripts/ch3_r4_fp_runner.sh       # NO_PROGRESS abort added r6
  readout: SESSION_LOGS.md

# `instruments:` is role -> PATH ONLY: tests/test_ladder.py's
# test_every_declared_instrument_exists walks every key of every
# configs/eval/*.yaml instruments block and asserts the value is a file on
# disk. Everything else about the instruments lives here.
instrument_contract:
  equivalence_invocation: "scripts/ch5_seat_equiv.py --prereg configs/eval/ch5_r1_offsh.yaml"
  build_items_still_owed: []
  selftest_must_assert:
    - "G-TERMINAL-RACE against results/ch4_r1_offsh/l64.runner.json: raw
       crash_forfeits 1, crash_points [3000], battles_requested 3000 ->
       effective forfeits 0, n_eff 3000. A grader that returns 2999 FAILS."
    - "G2 three-way on results/ch4_r1_offsh/l64.{json,fp.stdout}: 1067 / 1927 / 6
       summing to 3000, agreeing with our_wins / foulplay_wins / ties."
    - "G-BUDGET on l64's own log: every `Sampling N battles at Mms each` line
       satisfies N*M == 2*declared; an FP@100 log FAILS a declared-20 arm."
    - "every bar in grading.arms is RE-DERIVED from n and the file's own
       bar = max(0.025, 2*max(se_bin, se_clustered)); a stored constant that
       does not reproduce is a FAIL, not a warning. (The r3 test asserted the
       OPPOSITE — bar < credit_floor — and locked in a breach for a whole draft.)"
    - "an UNGRADED gate returns pass: null and is never counted as passed."
  grade_runs_before_any_number_is_quoted: true

# Review 2 MAJOR: r2's entire grading apparatus lived in COMMENTS. CH4
# duplicated every constant into real keys so a grader reads the file
# rather than a human paraphrase of it. These keys are AUTHORITATIVE and
# the comments above are commentary.
grading:
  credit_floor: 0.025
  # designer A §2.4, ADOPTED VERBATIM. Without this the file reads as
  # smuggling credit arithmetic into a rung that credits nothing; with it,
  # the choice is principled.
  bar_rationale: "R1 credits nothing. The credit-line arithmetic is used anyway because R1-A ROUTES R2, and a routing threshold looser than the credit threshold it routes to is a laundering path. 'Materially' therefore means 'would have credited, had this been a credit claim'."
  # rev 2 MI-8. True by construction (our_win_rate = our_wins / finished);
  # CH4 stated it anyway.
  ties: non_wins_in_numerator_counted_in_denominator
  tie_disclosure_band: 0.01     # 5x l64's banked 0.002; DISCLOSE, never void
  # rev 2 MI-8's neighbour, which is worse: the file never stated the POLICY
  # FORM either. CLAUDE.md's landmine is explicit — MATCH THE POLICY FORM to
  # the rating you compare against, or the comparison manufactures an effect
  # (~26 implied rating points in the clone case). ladder.py:203,215 and
  # ch3_fp_h2h.py:154 are both deterministic=True, so they match TODAY — but
  # `sampled_seat` is a live ARM_KIND that flips it.
  seat_policy: deterministic
  sampled_seat_barred: true     # assert kind != sampled_seat on every arm
  # A-F6, adopted. NOTE the exemption: a literal F6 would self-void this
  # file's own n=300 G-WIRING screen, so screens are exempted explicitly
  # rather than by silence. Delete the exemption if G-WIRING is restored
  # to designer A's n=3000 form.
  min_n_eff_for_any_comparison: 1000
  min_n_eff_rule: "no number with n_eff < 1000 enters any comparison, ever, including in prose"
  min_n_eff_screen_exemption: [G-WIRING]
  # A-§2.2c, and it is newly LOAD-BEARING: the primary read IS the
  # one-lane collapse, so dropping the outlier would delete the finding.
  outlier_rule: "NO LANE IS EVER DROPPED. Not for being 0.10 low, not for any reason short of a named VOID gate. The one-lane collapse is the finding, not contamination."
  # Only a NAMED gate (G-SHA, G2, G3, G-WIRING after its one re-run,
  # G-DESYNC) may remove a lane, and removal MOVES k_arm — it never "cleans"
  # the data. r4 had two mechanisms that could launder a drop (G-WIRING can
  # flag a lane; G-K silently accommodates k<3), so the rule has live surface.
  lane_removal_requires: [G-SHA, G2, G3, G-WIRING_after_one_rerun, G-DESYNC]
  # A-§9b. Without these two keys the "headline UNTOUCHED" sentence is
  # unenforced prose.
  crediting: false
  headline_may_move: false
  on_every_branch:
    - "R1 credits no lever on any branch."
    - "D26 12M 0.71825 is UNTOUCHED."
    - "R0 ensemble 0.74633 is UNTOUCHED."
    - "CH3 R2 search@M 0.79283 is UNTOUCHED."
    # CORRECTED 2026-08-29: this line originally read "Elo 1311" — the
    # pre-battle rating of the last battle (L2.battles.jsonl trap, corrected
    # 2026-08-26). The final rating is 1292; GXE/Glicko exist on the profile.
    - "LADDER R1 final Elo 1292 (GXE 59.6%, Glicko-1 1573±27, n=200) / 0.475 is UNTOUCHED."
    - "No FP@20 number is ever quoted without both budget disclosures."
  # A-BR-4, escalated rather than assumed: CHAPTER5 §3 C1 was EDITED by
  # this session (commit 25256b8) on designer A's finding. A reserved that
  # edit to the maintainer. It stands as a factual correction and is
  # flagged for retro-ratification.
  chapter5_s3c1_edit: {status: RETRO_RATIFIED_2026_08_26, commit: 25256b8,
                       settles: "0.0724 vs 0.0735 -> 0.0735, the Q5-consistent value (0.0724 was computed from sigma_seed while Q5's formula uses the total sd s_T)"}
  # Designer A's disposition, escalated: R1-C is UNDER-SCOPED. E3 and E7
  # are declared in `ensembles:` but appear in no arm, nothing budgets
  # them, and `r1c_delivered_iff` needs two compositions while Q3 priced
  # one. Honest cost is ~5.3 h more, or a cut candidate list.
  r1c_scope_escalation:
    status: RULED_2026_08_26
    ruling: fund_both_rosters
    consequence: "E3_50m and E7_all are real `arms:` entries (CE3, CE7) with usernames and budget lines. R1-C is 2 x 3000 = 2.73 h and `r1c_delivered_iff`'s max(E3, E7) is defined over a FULLY BUDGETED set. The alternative — leaving max() defined over a set with unbudgeted members — was the unnamed-cell defect the definition was adopted to fix, and is `not_an_option`."
    rationale: "the cut is only reversible in the WRONG direction. CE7 runs LAST, so an evening that runs short stops before it and loses nothing (the wave is skip-if-complete and arms are individually resumable); an E7 that was never pre-registered cannot be added afterwards without being post-hoc. A's reverse-priority cut order, if one is ever needed, is E7 first, then R1-B, then E3 — NEVER E4/C0."
    not_an_option: "leaving max(E3, E7) defined over a set with unbudgeted members."

  aggregator: equal_weight_mean_of_lane_rates
  median_barred: true            # at k=3 the median IS one lane
  # designer A §2.2b, ADOPTED VERBATIM. CLAUDE.md pre-reg lesson 1 is "name
  # the across-lane aggregator"; naming ONE is half the fix, naming what else
  # is recorded (so it can never be swapped in at readout) is the other half.
  recorded_never_governing: [pooled_over_battles_rate, per_lane_median, worst_lane, best_lane]
  best_lane_note: "RECORDED because C2/deployment cares about the max; NEVER governing, because the max of k noisy scores is upward-biased (the winner's-curse arithmetic in Q6)."
  # designer A §2.2e. Crash-forfeits are a LIVE mechanism here — l64.runner.json
  # already carries one — so this is not hypothetical.
  aggregator_note: "equal-weight mean and pooled-over-battles coincide ONLY when n_eff is equal across lanes. The crash-forfeit rule reduces n_eff per arm, so they WILL diverge. Equal-weight mean of lane rates governs; the pooled rate is recorded and never governs."
  # designer A §3.3c. r4 mandated serial k=1 and named no cell for what
  # happens when the rule breaks. The non-obvious half is ARMS SURVIVE.
  void_k: "dose mismatch — any two arms entering a COMMON COMPARISON at different k. The COMPARISON is VOID; the arms survive and their numbers stand with their k disclosed. (A §3.3 / V4; CH4 R1 Q2b verbatim.)"
  # designer A §3.3d. Q7's blanket "each VOIDs its arm unless stated" is half
  # the rule and gets G-SHA wrong: a sha mismatch is NOT arm-scoped.
  void_scoping:
    default: "VOID-<gate> is PER-ARM: the arm's number is unusable, k_arm drops, and every quote says which k it was computed at."
    exception_G_SHA: "a sha256 mismatch at load voids EVERYTHING DOWNSTREAM OF THE BREAK, not just its arm (A V1, inheriting CH4's G8 rule)."
    wave_scope: "a VOID arm does NOT void the wave. Remaining arms are graded at the reduced k, and G-K governs whether a VERDICT-S may fire at all."
    interaction_with_outlier_rule: "a lane leaves the fleet ONLY via a named gate. `outlier_rule` forbids every other removal."
  # designer A §4b, count RE-DERIVED for this revision rather than
  # transcribed: R1-A fleet-mean, the s82 primary, R1-B, two R1-C
  # compositions, three G-WIRING lanes = 8.
  multiplicity: "R1 takes 8 reads at a 2-se bar (R1-A fleet-mean, the s82 primary, R1-B, two R1-C compositions, three G-WIRING lanes) — 9 if the era pin is restored. At ~4.55% two-sided each, P(>=1 spurious fire) = 0.31 (0.34 at 9). DO NOT BONFERRONI: at k=3 it makes every directional cell unreachable and MANUFACTURES A NULL. The structural answer instead: A SINGLE FIRE IS A ROUTING SIGNAL, NEVER A FINDING; every route terminates in its own pre-registration and ratification. (A §4; CH4 R1 did this for its three era pins.)"
  se_rule: max(binomial, clustered)
  clustered_formula: sqrt(s_arm^2/k_arm + s_cmp^2/k_cmp)   # k-GENERAL
  clustered_undefined_at_k: 1    # one lane yields no sd -> descriptive only
  coverage_disclosure: "at k=3 Welch df ~2.2, so 2*se is ~82% coverage, not 95%"
  # sweep: r3's bands OVERLAPPED at 0.030 and 0.060, and r3 promoted that
  # overlap out of prose into the AUTHORITATIVE keys. Half-open now.
  verdict_p_bands: {resolving: "[0.000, 0.030]", weak: "(0.030, 0.060]", non_resolving: "(0.060, inf)"}
  verdict_s: {above: one_sided_positive, below: one_sided_negative, within: complement_not_equivalence}
  # RV1-MA-11, a LIVE REGRESSION until now: r3/r4 licensed "flat" as a
  # bare equivalence claim while TOST was dropped. WITHIN is the COMPLEMENT
  # of two one-sided tests — it is a failure to resolve, not evidence of
  # equivalence. The bare word is barred; only the power-conditioned
  # sentence may be written, and it must quote the REALIZED bar.
  # designer A §5.4 / D8, ADOPTED VERBATIM. r3/r4 imported the phrase
  # "unless R1-C already delivered" into the AUTHORITATIVE 3x3 table with NO
  # definition — an unnamed trigger inside the grading apparatus, which is
  # CLAUDE.md pre-reg lesson 2 (R-4's silent gap at (A1+0.02, A1+0.05]).
  r1c_delivered_iff: "max(E3, E7) - E4 >= +0.025 AND >= 2*se_diff(3000,3000) = 0.0246 -> i.e. >= +0.025.  ONE-SIDED POSITIVE. Incumbent wins otherwise."
  # These two look contradictory and are not. Stated so nobody adjudicates
  # it at readout.
  r1c_sidedness_reconciled: "arms.R1C.sidedness two_sided governs the READOUT — a composition may read materially WORSE than L2, and that is reportable and matters for deployment. DELIVERY, the routing trigger in WITHIN x RESOLVING, is ONE-SIDED POSITIVE and the incumbent wins ties AND the middle. Different questions, not a contradiction."
  # designer A §5.4 / R5k, ADOPTED VERBATIM. Free — every input is banked or
  # produced by R1-A — and it is the FIRST question anyone will ask of an
  # ensemble number, so pre-registering it stops it being computed post-hoc
  # and read as a verdict.
  secondary_recorded_only: "roster score minus the equal-weight mean of its own members' single-lane greedy scores — the 'does combining beat a random member' question. DESCRIPTIVE; does not govern deployment."
  # designer A §7b / R_AX, ADOPTED VERBATIM. It needs NO gate output: the
  # statistic uses the BANKED Delta_vsSH, so shrinking G-WIRING to n=300 does
  # not block it. The pre_stated_context is the guard that stops an off-SH
  # ABOVE being written up as a dramatic axis disagreement when it is merely
  # resolving an unresolved question.
  R_AX_axis_disagreement:
    statistic: "sign(Delta_offSH) vs sign(Delta_vsSH), where Delta_vsSH = 0.70222 - 0.71825 = -0.01603"
    pre_stated_context: "Delta_vsSH is 0.44 se_seed_clustered against its own bar of 0.0735. The vs-SH side is NOT a resolved negative; it is UNRESOLVED. An off-SH ABOVE would therefore NOT constitute an axis disagreement — it would resolve an open question."
    read: DESCRIPTIVE_ONLY
    uses_banked_vs_sh: true
  # designer A §3.4 / bracket A-BR-3. RECORDED AS PRE-REGISTERED-AND-
  # UNREACHABLE rather than dropped: the D25-P lesson is that an unreachable
  # branch is DECLARED up front, not discovered afterwards. The reachability
  # was recomputed at the ratified n=1000 rather than pasted from A's n=3000.
  r1a_tost:
    status: "NOT PRE-REGISTERED AS A LIVE READ. Maintainer ruled 2026-08-26: keep n=1000 and bar the word 'flat'. Recorded here with its arithmetic so the ruling is reproducible."
    margin: 0.025                    # the credit floor, pinned before data
    test: "90% CI for Delta (t_{0.95,df_welch} * se_seed_clustered) lies entirely inside (-0.025, +0.025) -> EQUIVALENT at the credit-floor margin"
    requires_se_clustered_at_most: 0.00856     # t_.95 at df=2 is 2.920
    requires_s50_at_most: 0.01324
    reachability_at_the_ratified_n: "UNREACHABLE AT n=1000 AT ANY sigma_seed. The per-lane binomial sd alone is 0.01507 at n=1000, which EXCEEDS the whole s_50 budget of 0.01324. The implied sigma_seed ceiling exists only at larger n: <= 0.0049 at n=1500, <= 0.0100 at n=3000 (designer A's figure, which assumed n=3000)."
    consequence: "the ONLY construction that would license 'scale is flat off-FP' cannot fire at this arm's n. `flat_licensed_in: []` follows from arithmetic, not from taste."
  flat_bare_word_barred: true
  flat_licensed_sentence: "At the realized bar of <BAR>, no difference of that size or larger was detected between 50M and 12M off FP@20. This is a failure to resolve, not evidence of equivalence."
  # RV1-MA-11 + r6's TOST arithmetic: NO cell licenses "flat". WITHIN is the
  # COMPLEMENT of two one-sided tests — a failure to resolve, not evidence of
  # equivalence — and the TOST that would supply the missing construction is
  # unreachable at n=1000. The licensed sentence, which MUST quote the
  # REALIZED bar, is the only thing that may be written.
  flat_licensed_in: []
  flat_realized_bar_must_be_quoted: true
  arms:
    # sweep: r3 said two_sided while verdict_s, Q5's prose and designer A's
    # §4 all say one-sided each. verdict_s governs.
    # O-6(i): n does not bind this bar. 2*binomial is under the 0.025 floor
    # from 552/lane and the clustered term has no n in it. 1000 is set by
    # the s82 PRIMARY (5.9 se, null-referenced), not by the fleet mean.
    R1A: {sidedness: one_sided_each_per_verdict_s, k_arm: 3, k_cmp: 4,
          n_per_lane: 1000, role: secondary_descriptive,
          # REGRESSION FIXED: 750 was where I read it off a coarse table;
          # the true crossover is 552 battles/lane.
          n_does_not_bind_above: 552, stage_2: none}
    # designer B §2.3 / rev 1 BL-5d, RESTORED: r3 adopted B's PREMISE (Q1b,
    # "R1-A cannot be a credit-grade scale read") and dropped B's
    # CONSTRUCTIVE replacement. The two reads answer different questions and
    # neither substitutes for the other — A's fleet-mean read ROUTES the
    # chapter (the 3x3 table), B's per-lane read PICKS THE R3 OBJECT.
    # B wrote n=1500; the ratified n is 1000 and the note says so.
    R1A_DEPLOYMENT:
      question: "which single 50M lane, if any, is the best off-FP object on disk?"
      construction: "per-lane rate at n=1000, binomial se only (0.01507), k=1"
      grade: DESCRIPTIVE_ONLY
      note: >-
        k=1 has no clustered term (grading.clustered_undefined_at_k), so this
        NEVER returns a VERDICT-S and never credits anything. It is what
        CHAPTER5 §5's "the better model is already on disk" simplification
        actually needs, and it is the only R1-A read the clustering cannot
        veto. Selecting on it to DEPLOY is free; quoting the selected score as
        a lever's effect is not (Q6). The max of k noisy lanes is
        upward-biased — see best_lane_note, and the winner's-curse figure AT
        THIS n, which for m=5 at n=1000 is +0.0175.
    R1A_POOLED:
      grade: DESCRIPTIVE
      note: >-
        the equal-weight fleet mean IS the 3x3 table's input. It carries the
        clustered se, the k it was computed at, and the 82% coverage
        disclosure.

    R1B:
      sidedness: one_sided_positive
      k_arm: 3
      n_per_lane: 1000
      se_instrument: paired_clustered_sd_d
      note: "within-lane d_i; covariance is ZERO, the LEVEL term cancels"
      # binomial term at n=1000 both sides over 3 lanes = 0.0123, so
      # 2*se = 0.0246 and the FLOOR governs at launch. The REALIZED bar is
      # max(0.025, 2*sd(d_i)/sqrt(3)) and may be larger.
      se_diff_at_n1000: 0.0123
      bar: 0.025
      bar_note: "floor-governed at launch; RE-DERIVE from sd(d_i) at readout and quote the realized value."
      # designer A §8, ADOPTED VERBATIM but for "One arm" -> "R1-B" (this
      # file runs three lanes, not A's single s80 arm). Review 1 MA-8c calls
      # it the load-bearing half of the Q4 reconciliation: without it a
      # positive R1-B reads as reversing a result graded at z = -2.80.
      ceiling_pre_committed: >-
        R1-B POSITIVE DOES NOT REVERSE MU-8 (pooled transfer z = -2.80). R1-B
        licenses search as an R3 DEPLOYMENT CANDIDATE and nothing else. A
        positive 50M delta may not be set beside the negative 12M cell in any
        sentence. The "why did search fail" archaeology is a separate,
        currently unaffordable question, named here and deferred so it is not
        answered by implication.
      # designer A §8, ADOPTED VERBATIM (sweep row A-R6e).
      anchoring_disclosure: >-
        the 2026-08-26 smoke read 0.650 on s62 at n=20 — 2.8 se ABOVE the
        banked greedy value and in the direction this arm's hypothesis wants.
        It is n=20, it is not a prior, and the arm is graded against the bar
        above regardless.
      # designer A §8 / R6b. CONDITIONAL: applies only if the maintainer takes
      # A's one-arm form (OPEN FOR THE MAINTAINER #2). Recorded NOW so the
      # object cannot be chosen after C0 reads out.
      object_selection_rule_if_one_arm: >-
        s80 — the 50M lane with the highest BANKED vs-SH final (0.74233),
        fixed before any R1 datum. Selecting on an already-banked,
        ORTHOGONAL-TO-THE-CONTRAST axis biases the LEVEL of both cells equally
        and leaves the search-minus-greedy CONTRAST unbiased. This is not
        selection on the outcome.
    # sweep: 0.0246 BREACHED this file's own bar = max(0.025, 2*se) — and
    # the r3 test ENFORCED the breach. Both fixed.
    R1C: {sidedness: two_sided, comparator: C0, n_per_arm: 3000,
          two_se: 0.0246, bar: 0.025}
    # sweep: THE PRIMARY READ HAD NO GRADING RULE AT ALL. r3 closed "no
    # action column" for the fleet-mean delta, R1-B and R1-C — i.e. for
    # every read EXCEPT the one Q1 declares primary. Closed here.
    R1A_PRIMARY_s82:
      question: "does s82's collapse reproduce off-FP?"
      role: PRIMARY
      n_per_lane: 1000
      # REGRESSION FIXED (reviewer disposition): r4 wrote
      # sidedness one_sided_NEGATIVE with REPRODUCES iff d <= -bar. But a
      # REPRODUCED collapse is POSITIVE: mean{s80,s81} = 0.73850 and
      # s82 = 0.62967, so d = +0.10883. As written the rule returned
      # DOES_NOT on a genuine reproduction. Sign inverted in the PRIMARY
      # read's own grading rule — the class this repo has been burned by.
      construction: "d = mean{s80,s81} - s82"
      sidedness: one_sided_positive
      # REGRESSION FIXED: r4's se mixed p=0.35 (the pair) with p=0.25
      # (s82) — an ALTERNATIVE-referenced se used to set a NULL bar. Under
      # the null both sides sit at ~0.35, giving se = 0.0185 at n=1000.
      se_reference: null_hypothesis_common_p
      se_diff_at_n1000: 0.0185
      # REGRESSION FIXED: r4 set bar 0.025, breaching this file's own
      # bar = max(floor, 2*se) — the exact defect r4 had just fixed on
      # R1C, reintroduced on the PRIMARY. The test only checked
      # bar >= floor, so it passed. Test strengthened to equality.
      bar: 0.0369
      se_diff_at_n1500: 0.0151              # reference only; n IS 1000
      separation_if_it_reproduces: 5.9      # 0.10883 / 0.0185
      power: >-
        a vs-SH-sized collapse (+0.10883) lands at 5.9 se at n=1000 and 7.2 se
        at n=1500. This is the power OF THIS CONTRAST; review 1's "~9.6 se"
        was for a DIFFERENT contrast (BT-predicted 0.2762 vs ~0.39) and does
        not transfer to it.
      # RV1-BL-5c: G-K is written for VERDICT-S and said nothing about THIS
      # read, which is the one the file calls primary.
      k_rule: >-
        if s80 or s81 is VOID the pair becomes one lane, se rises to 0.0213
        (bar 0.0426) and the read is DESCRIPTIVE ONLY per G-K. If s82 is VOID
        the read DOES NOT EXIST and R1-A is secondary-only.
      verdicts:
        REPRODUCES: "d >= +bar: the 50M fleet has a genuine bad seed. k=3 cannot support a scale claim; report it, stop buying battles, route as WITHIN x NON-RESOLVING."
        DOES_NOT: >-
          d < +bar: NO REPRODUCTION AT THIS POWER. This is NOT an equivalence
          claim — the bar is 0.0369, so a real collapse of up to ~0.037 would
          not have been detected. The vs-SH spread may have been SH-specific
          and the off-FP fleet may be tight enough to read. Proceed to the 3x3
          table.
  # sweep: r3's cliff used s_cmp = 0.01118, the 12M **vs-SH** sd, where the
  # comparator is the 12M **off-FP** fleet at 0.00771 — a number stated
  # three lines into Q1 of this same file. Recomputed; the crossover row
  # moves too: clustered overtakes binomial at s_50 = 0.0128, not 0.0206.
  comparator_total_sd_off_fp: 0.00771
  # RECOMPUTED AT THE RATIFIED n=1000 (r6). r4 built this at n=1500 and its
  # "true crossover" row was the n=1500 value. The bar COLUMN survives the n
  # change (verified row by row); the annotation did not. r4's recomputation
  # also DELETED the decision-relevant row — the s_50 at which the bar leaves
  # the 0.025 floor, which is n-INDEPENDENT and is designer A's number.
  above_reachability_cliff:      # O-4, declared result-blind
    n_per_lane: 1000
    se_binomial_of_the_difference: 0.00973   # 3x1000 vs the comparator's 12000
    s50_0.0000: {bar: 0.0250, fleet_mean_above_needs: 0.3737}
    s50_0.0155: {bar: 0.0250, fleet_mean_above_needs: 0.3737}   # clustered overtakes binomial; n-DEPENDENT (0.0128 at n=1500)
    s50_0.0206: {bar: 0.0250, fleet_mean_above_needs: 0.3737}   # the bar LEAVES the 0.025 floor here; n-INDEPENDENT
    s50_0.0300: {bar: 0.0355, fleet_mean_above_needs: 0.3842}
    s50_0.0450: {bar: 0.0525, fleet_mean_above_needs: 0.4012}
    s50_0.0650: {bar: 0.0755, fleet_mean_above_needs: 0.4241}
    best_12m_lane_ever_off_fp20: 0.3557
    note: "if s_50(off-FP) resembles its vs-SH 0.0624, ABOVE is UNREACHABLE"

# designer A §2.5b, ADOPTED. A made the STAGING optional ("If B prefers the
# simpler flat 3000x3, I do not object") and the ATTESTATION a REQUIREMENT
# ("whichever design is chosen"). This file runs flat, so there is no interim
# stop rule to protect — but the bar itself READS s_50 from data and the arms
# run SEQUENTIALLY, so the hazard survives in a different and arguably worse
# shape: nothing else stops the n, the roster or the cliff table from moving
# after C0 reads out.
blinding_attestation:
  required_in_readout: true
  precedent: "CH4 R1 Amendment A1"
  attests:
    - "no arm's n, roster, seat, sidedness or bar FORMULA changed after any off-FP datum was seen"
    - "the grading block, the reachability cliff and the licensed sentences were frozen at launch_git_sha"
    - "s_50 is read from data as a NUISANCE parameter only; the formula that consumes it was pre-committed"
    - "who looked at which arm's result, and in what order"
  forfeit_rule: "A's V11 form: an unattestable wave is NOT void. R1-A reports at whatever n it has, with the bar computed there, and the readout states that the attestation could not be made. Honest disclosure, not a void."

# designer A §9, ADOPTED. CH4 R1 Q6b's rule: the deliverable is INLINE, never
# a pointer into an untracked memo. A's sentences are carried verbatim EXCEPT
# for the substitutions named below — A wrote them against HIS design and this
# file runs a different one, so pasting verbatim would import wrong numbers
# into the deliverable. [slots] fill at readout.
licensed_sentences:
  adaptations_from_A:
    - "A wrote R1-A at n_eff=3000/lane and the disposition rewrote it to 1500. THE RATIFIED n IS 1000. Every n_eff in the R1-A sentences is 1000, and the per-lane binomial se is 0.01507."
    - "A's WITHIN/NON-RESOLVING sentence hardcodes a fleet mean of 0.421 from his 0.0725 bar. The cliff was recomputed against the 12M OFF-FP sd 0.00771: quote the realized row of grading.above_reachability_cliff (0.4241 at s_50=0.0650), never 0.421."
    - "A wrote R1-B as ONE arm on s80 at n=3000; this file runs three lanes at n=1000. The R1-B sentence is rewritten to the 3-lane within-lane form. The MU-8 ceiling clause is untouched and is the point of the sentence."
    - "A's R1A_PRIMARY sentence quoted bar 0.025, se_diff 0.0142 and ONE-SIDED NEGATIVE. All three were wrong: the bar is 0.0369, the null-referenced se is 0.0185, and the sidedness is ONE-SIDED POSITIVE (a reproduced collapse is +0.10883)."
    - "A's DESCRIPTIVE-ONLY sentence fires at k<3 and r4's G-K fired it at k=1. RESOLVED in favour of A at k<=2 for the FLEET-MEAN read (see G-K's k=2 ruling); the sentence below is A's, with the 1-df CI factor corrected to 0.45x-31.9x."
    - "A's WITHIN x RESOLVING sentence offered an equivalence claim behind a TOST. The TOST is UNREACHABLE at n=1000, so the word 'flat' and the sentence 'the two fleets are equivalent' are BARRED on every branch (RV1-MA-11)."
  R1A_ABOVE: >-
    Across three D29r2 50M lanes at n_eff=1000 each, the equal-weight mean off Foul
    Play@20 ("FP + our patches", --search-time-ms 20) is [X], against the D26 12M
    four-lane mean of 0.34867 at n=12,000 — a difference of +[D], clearing the
    pre-registered bar of [B] (max(0.025, 2*se_diff); governing term =
    [binomial|seed-clustered]; se = [S]; at k=3 a 2*se band covers ~82%, not 95%).
    This is the first evidence in this project that scale helps on the off-anchor
    axis. It credits nothing; the routing action is [3x3 cell].
  R1A_WITHIN_RESOLVING: >-
    ...difference of [D], inside a REALIZED bar of [B] <= 0.030. At the realized bar
    of [B], a fleet-mean effect of that size or larger would have been detected; none
    was. THIS IS A FAILURE TO RESOLVE, NOT EVIDENCE OF EQUIVALENCE: WITHIN is the
    complement of two directional cells and asserts nothing, and the TOST that would
    license an equivalence claim is unreachable at this n. The word "flat" is not
    used. Quoting the realized bar is mandatory — at the 0.025 floor, WITHIN can be
    declared with 2*se as low as 0.0167, which does not support "+/-0.030 was excluded".
  R1A_WITHIN_WEAK_OR_NON_RESOLVING: >-
    ...difference of [D] against a bar of [B]. The 50M fleet's off-SH lane spread is
    s_50 = [S], implying sigma_seed = [G]; at three seeds this gives a bar of [B], and
    THE MEASUREMENT CANNOT DISTINGUISH "scale does nothing" FROM "scale helps by up to
    [B]". [If NON-RESOLVING:] the "materially above" cell required a fleet mean of
    [realized cliff row] against a best-ever single-lane 0.3557 and was not reachable.
    THE WORD "FLAT" IS NOT LICENSED BY THIS RESULT, on any branch. The routing action
    is C2 (more seeds), which is the correct response to the seed heterogeneity this
    arm measured.
  R1A_BELOW: >-
    ...difference of -[D], clearing the bar of [B] on the negative side. Scale hurts
    this recipe on the off-anchor axis as well; C1 and C3 are closed for the chapter.
  DESCRIPTIVE_ONLY: >-
    Fewer than three 50M lanes survived; at k=2 the seed sd has ONE degree of freedom
    (95% CI multipliers 0.45x-31.9x, a factor of 72) and no scale verdict is licensed.
    The surviving lane rates are [list] at n_eff [list].
  R1A_PRIMARY_s82: >-
    Across the three D29r2 50M lanes off Foul Play@20 at n_eff=1000 each,
    mean{s80,s81} minus s82 is [d] against a pre-registered bar of 0.0369
    (null-referenced se_diff 0.0185, ONE-SIDED POSITIVE; a reproduced collapse is
    POSITIVE). [REPRODUCES:] the 0.11 vs-SH collapse reproduces off-FP; the 50M fleet
    has a genuine bad seed and k=3 cannot support a scale claim. [DOES NOT:] no
    reproduction at this power — a real collapse of up to ~0.037 would not have been
    detected, so this is not an equivalence claim; the vs-SH spread may have been
    SH-specific.
  R1B: >-
    On the three D29r2 50M lanes, search@M off Foul Play@20 reads [X] at n=1000/lane
    against the SAME lanes' greedy [Y] at n=1000/lane — a within-lane mean delta of
    [D] against a bar of [B] (one-sided positive; se = max(binomial 0.0123,
    sd(d_i)/sqrt(3))). [HELPS:] search is licensed as an R3 deployment candidate. THIS
    DOES NOT REVERSE MU-8's pooled transfer result (z = -2.80), which stands, and this
    delta is not set beside the 12M cell in any sentence. [HURTS/NULL:] search is not
