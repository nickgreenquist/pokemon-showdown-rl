# Membership RULES, fixed before any score is seen (Q6). Not a menu to pick
# from after the fact. **THE RULE IS: every lane of the two PRODUCTION-ERA
# 828-dim fleets — D26-12M (s62-s65) and D29r2-50M (s80-s82).** That rule
# reproduces the seven-lane list EXACTLY.
#   r4's "every 828-d lane on disk" did NOT (rev 2 MA-8): struct50m s35-s37
#   and stack50m s90-s92 are also entity_deepsets and also load and play at
#   828 — OBS_DIM comes from the ENCODER FLAGS, not the checkpoint (designer
#   B §4.1: `opp_action` only writes info["opp_choice"]/info["opp_member"]
#   for aux supervision in SinglesEnv.step) — so that rule selected THIRTEEN
#   lanes while the list had seven. r5 then replaced it with an ENUMERATION,
#   which is a menu wearing a rule's label; this is the rule.
# Exclusions, with reasons, declared before any off-FP datum:
#   struct50m s35-s37 — excluded on STRENGTH (0.5087/0.5727/0.6593 vs SH),
#     NOT on shape; they are obs-COMPATIBLE. Saying "shape" would have been a
#     false reason for a right call. They also lack `aux_head`, so they could
#     never be search seats (designer B §4.6, verified by torch.load).
#   stack50m s90-s92 — the VOID D29r fleet; s90 stopped at 35M.
# **`ensembles:` IS DOCUMENTATION ONLY — no script reads it**
# (`ch5_seat_equiv.py:87` reads `arms.<X>.lanes`). Every roster that runs
# becomes an ARM before it runs, or it cannot be gated by G-EQUIV or
# G-DECLARED. As of r6 all three rosters ARE arms: E4->C0, E3->CE3, E7->CE7.
ensembles:
  E4_ladder: [s62, s63, s64, s65]     # exactly L2, the object that laddered
  E3_50m:    [s80, s81, s82]          # the whole 50M fleet, no selection
  E7_all:    [s62, s63, s64, s65, s80, s81, s82]
  # designer B §4.2, pre-committed BEFORE any off-FP datum so the readout may
  # invoke it without it looking retrofitted (RV1-MA-12).
  aggregator: masked_logprob_mean
  aggregator_mechanism: "A masked log-prob MEAN is a GEOMETRIC mean of probabilities — a SOFT AND. A member assigning near-zero probability to the ensemble's choice effectively VETOES it, so a weak member is worse here than in a vote, and a wide roster can score BELOW its own best member. E3_50m and E7_all both contain s82 (0.6297 vs SH, 0.06-0.11 below every other member) BY MEMBERSHIP RULE, not by oversight."
  licensed_if_a_roster_reads_low: "If E3_50m or E7_all scores below C0 by >= its bar, the readout MAY name the soft-AND veto as a candidate explanation, because it was pre-registered here. It may NOT then re-score an s82-excluding roster and quote the result — that is selection on the read's own metric. The pre-registered follow-up is CW-6 as an R2/R3 arm (designer_splits.R1C_composition)."

# designer B §5.2 + rev 2 MA-5. Written BEFORE the six arms were added,
# because that is the only moment the rule can bind. kill_fp() sweeps
# `run.py .*--ps-username $FP_USER( |$)`; the `( |$)` guard is belt,
# non-prefixing names are braces, and the S1 deadlock (3.6 h at zero
# progress, and it LOOKS like slow progress) is what happens when both fail.
usernames:
  scheme: "ch5<arm><role>, role in {seat, fp}, arm ids lowercase. FULL-STRING distinct, and NO name may be a prefix of any other — asserted pairwise by tests/test_ch5_prereg.py over all 24 pair names (the '18' went stale when r8 added RS80; rerun_pairs_r9 adds 4 more, swept by the r9-T hardening)."
  never_reuse: [c4, r4anchor, ch3, ch4]   # an orphan holding a name is the S1 shape
  pairs:
    C0:  {seat: ch5c0seat,  fp: ch5c0fp}
    A80: {seat: ch5a80seat, fp: ch5a80fp}
    A81: {seat: ch5a81seat, fp: ch5a81fp}
    A82: {seat: ch5a82seat, fp: ch5a82fp}
    B80: {seat: ch5b80seat, fp: ch5b80fp}
    B81: {seat: ch5b81seat, fp: ch5b81fp}
    B82: {seat: ch5b82seat, fp: ch5b82fp}
    CE3: {seat: ch5ce3seat, fp: ch5ce3fp}
    CE7: {seat: ch5ce7seat, fp: ch5ce7fp}
    RS80: {seat: ch5rs80seat, fp: ch5rs80fp}   # r8
    RS81: {seat: ch5rs81bseat, fp: ch5rs81bfp}  # r10: b-pair promoted; r9 pair BURNED (engine panic + stale room)
    RS82: {seat: ch5rs82seat, fp: ch5rs82fp}   # r9
  # r9: ops_failure_rule re-run pairs. A plain suffix on the seat name
  # would violate the no-prefix rule, hence the arm-id-suffix spelling.
  # All 28 names verified pairwise clean (r9 repo review, 2026-08-28).
  rerun_pairs_r9:
    # RS81's reserve was PROMOTED to the live pair at r10 and is no longer
    # a reserve; listing it here too would double-issue the same names.
    RS82: {seat: ch5rs82bseat, fp: ch5rs82bfp}   # unused; RS82 completed on its r9 pair
  burned_pairs_r10:
    # never re-issue: a poisoned room can outlive the process by hours (a2/a3)
    RS81_r9: {seat: ch5rs81seat, fp: ch5rs81fp}

# rev 2 §4-7: a KEY, not a sentence — G-SERIAL asserts wall clocks and
# needs something to assert against.
wave_plan:
  k: 1
  rule: "any two arms entering a common comparison must run at the same k, or the comparison is VOID (grading.void_k) and the ARMS SURVIVE. In CH5 EVERY arm enters one (A vs the banked 12M fleet; B vs A per lane; E3/E7 vs C0), so k=1 is not a preference."
  comparator_wave: "ch4_r1_offsh, serial k=1 (wave.log: 'WAVE START serial k=1')"
  serial_evidence: "$OUT/wave.log arm start/done timestamps must not overlap; scripts/ch5_r1_grade.py asserts it. THIS IS G-SERIAL'S ARTIFACT."
  order: [C0, A80, A81, A82, B80, B81, B82, CE3, CE7, RS80]
  order_rationale: "C0 first (both designers, independently): it creates the repo's FIRST complete (proxy score, ladder rating) pair and de-risks brand-new ensemble code at scale in hour one. CE7 last: widest and dearest, so an interrupt costs the least."
  order_r9: [RS81, RS82]   # DOCUMENTATION ONLY — the runner ignores
                           # wave_plan.order; launch is the ARMS override
  ops_r9:
    launch: 'bash scripts/ch5_preflight.sh && ARMS="RS81 RS82" nohup bash scripts/ch5_r1_wave.sh > results/ch5_r1_offsh/r9.nohup.log 2>&1 &'
    preflight: "ch5_preflight.sh enforces: Showdown server on :8000, simulator: 4 in the gitignored showdown config, no stale fp seat, CLEAN TREE (G0) — so the amendment commits BEFORE launch (CLAUDE.md rule 3). Env: the runner hardcodes the pokemon-showdown-rl bin/python."
    cost: "2 x 3000 x 2.92 s/battle (RS80 realized) = 4.87 h, serial."
    progress: "grep -c 'Winner:' vs RS80's REALIZED 20.6/min (the plan row said 22.4; per progress_rule the transferred rate may not be the threshold). <50% investigate; <20% STALLED, not slow."
    stall_polls_note: "BUILD ITEM r9-R (APPLIED in the ratifying commit): stall_polls_for() gave RS* the 30-poll default where stall_polls.search pre-registers 60; the case is now B*|RS*). RS80 ran at 30 and survived; the patch aligns code with the pre-reg."
    killed_arm: "re-runs LAST or under its rerun_pairs_r9 pair, never immediately under the same pair (poisoned-room, a3). Kill FP's search-worker CHILDREN FIRST (pkill -9 -P), then sweep."
    cost_ledger_note: "cost_ledger.agent_side_battle_hours (7.53) is test-pinned against a rate table that predates RS80 and is NOT touched; r9's 4.87 h is recorded here."
    dose_evidence: "the YAML echo is a tautology (BL-1 class); the artifact evidence for dose M is search/leaves_mean vs node_cap 1500 and search/ms_mean (RS80: 322.79 leaves, 65.78 ms), stamped per arm."
  resume: "skip-if-complete on $OUT/<tag>.json with gate_all_challenges_resolved true. A partial arm re-runs WHOLE; there is no mid-arm resume and none is claimed."
  retry_no_json_once: true          # designer B §7.3: torch lazy-init SIGSEGV
  stall_polls: {greedy: 30, ensemble: 30, search: 60}
  max_relaunches: 10                # CH4 base rate: 1 relaunch in 20,500 battles
  no_progress_relaunches: 3         # BUILT r6 in ch3_r4_fp_runner.sh
  progress_instrument: "grep -c 'Winner:' $OUT/$TAG.fp.stdout, measured as a RATE over the window [T+2min, T+12min] — NEVER a wall-clock ETA (the CLAUDE.md landmine: the S1 deadlock was invisible for hours because the projection was computed from elapsed time)."
  expected_winners_per_min:      # 60 / s_per_battle, at THIS session's calibration
    greedy: 40.4                 # 1.485 s/b, banked l62-l65
    ensemble_m3: 38.5            # 1.56 modelled (designer B §1.2)
    ensemble_m4: 37.5            # 1.60 MEASURED
    ensemble_m7: 34.9            # 1.72 modelled
    search_M: 22.4               # 2.68 MARGINAL, from the n=100 calibration --
                                 # NOT designer B's 13-17, which used the
                                 # 3.51-4.3 estimates the calibration killed
  progress_rule: "< 50% of the row above -> investigate; < 20% -> treat as STALLED, not slow. Also asserted POST HOC: an arm whose realized sec_per_battle exceeds its row by >50% is disclosed in the readout. NOTE the search row is a TRANSFERRED rate (Q3) and may NOT be the stall threshold — R1-B's own first 100 battles set its reference."

interrupt_policy:                # designer B §0.6 / §8
  mvp: "C0 (n=3000) + A80/A81/A82 (n=1000 each) = 1.33 + 1.24 = 2.57 h of battles. Fully resolves CHAPTER5 §5's branch-table row: at 3x1000 against the banked 12M n=12,000, 2*se_binomial is 0.0195, already under the 0.025 credit floor, so nothing about the branch decision improves at a larger n."
  standalone_floor: "C0 ALONE (1.33 h) is a complete, quotable, standalone result — the first off-FP number for the object that laddered, and the repo's FIRST complete (proxy score, ladder rating) pair. If the wave is interrupted after any completed arm, nothing is wasted."
  what_an_interrupt_may_not_do: "A partially-completed WAVE never produces a fleet-mean read at k <= 2 that claims a VERDICT-S. See G-K's k=2 ruling."

