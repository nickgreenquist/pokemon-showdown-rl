# Q5. GRADING — r3. **THE ACTION COLUMN IS THE POINT** (review 1 BL-1:
#   r2 had nine verdict cells and zero actions).
#   bar = max(0.025, 2 * max(se_binomial, se_clustered)), and
#   **se_clustered = sqrt(s_arm^2/k_arm + s_cmp^2/k_cmp) — k-GENERAL, not
#   the hardcoded /3 of r2** (review 1 BL-3: at k=2 that understated the
#   se by 22%). s_* are TOTAL lane sds, not sigma_seed; r2 quoted one and
#   formula'd the other. **At k_arm = 1 there is NO clustered term** —
#   one lane yields no sd — so a k=1 read is binomial-only and is
#   DESCRIPTIVE, never a verdict. AGGREGATOR = EQUAL-WEIGHT MEAN of lane
#   rates, BINDING; **MEDIAN IS BARRED** (at k=3 the median IS one lane,
#   i.e. maximally robust to the very one-lane collapse that is the
#   signal). Disclosure: at k=3 Welch df ~2.2, so "2 se" is ~82%
#   coverage, not 95% — say 82% wherever the bar is quoted.
#
#   VERDICT-S (one-sided each; WITHIN is the COMPLEMENT, never an
#   equivalence claim): ABOVE d >= +bar | WITHIN otherwise | BELOW d <= -bar.
#   VERDICT-P (is the bar informative at all):
#     RESOLVING bar <= 0.030 | WEAK 0.030-0.060 | NON-RESOLVING > 0.060.
#
#   **THE 3x3 ACTION TABLE. Every cell routes; no cell is silent.**
#     ABOVE  x RESOLVING      -> scale is alive AND the model is on disk.
#                                R3 ladders the 50M fleet; R2 training is
#                                OPTIONAL. Past-50M stays out of chapter.
#     ABOVE  x WEAK           -> same direction, weaker warrant. R3 may
#                                ladder 50M, but the readout says WEAK and
#                                quotes the bar. No R2 lever is credited.
#     ABOVE  x NON-RESOLVING  -> **CANNOT OCCUR BY CONSTRUCTION** at any
#                                plausible fleet mean (see the O-4 cliff
#                                table). If it somehow fires, VOID and
#                                re-examine the arm — it means the bar and
#                                the delta were both enormous.
#     WITHIN x RESOLVING      -> the only cell whose interval is tight
#                                enough to say anything about SIZE. **THE
#                                WORD "flat" IS BARRED ON EVERY BRANCH**
#                                (RV1-MA-11): WITHIN is the COMPLEMENT of
#                                two directional cells and asserts nothing
#                                (designer A's D1). The LICENSED SENTENCE
#                                is power-conditioned and quotes the
#                                REALIZED bar — see
#                                `grading.flat_licensed_sentence`.
#                                Quoting the realized bar is MANDATORY: at
#                                the 0.025 floor WITHIN can be declared
#                                with 2*se as low as 0.0167, which does
#                                not support "+/-0.030 was excluded".
#                                The only construction that would license
#                                "flat" is a TOST at margin 0.025, and
#                                **it is UNREACHABLE at n=1000 at any
#                                sigma_seed** (`grading.r1a_tost`): it
#                                needs s_50 <= 0.01324 and the per-lane
#                                binomial sd alone is 0.01507. Maintainer
#                                ruled 2026-08-26: keep n, bar the word.
#                                R2 = C2 (more seeds) UNLESS R1-C
#                                DELIVERED as defined by
