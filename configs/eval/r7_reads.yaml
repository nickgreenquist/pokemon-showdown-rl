# THE vs-SH HALF of the R7 reads, as the fleet header states it: "vs SH under the LOCKED protocol (final, 3000
# battles/lane, lanes pooled per arm, ties non-wins, deterministic; saturated; under 3+2 the control pools two lanes,
# a disclosed deviation from "3 seeds pooled")".
# POLICY FORM: the LOCKED form -- NO loop breaker -- so these numbers stay comparable with every banked vs-SH number.
# ENCODER: every R7 final is c6 ON (the queue exports POKEMON_RL_ENCODER_C6=1 for every job here).
# SEATS: ch3_eval derives each job's poke-env names from the checkpoint's own (seed, seat_tag) -- the names the lane's
#   in-loop eval used -- so these jobs run only after every lane has EXITED (the queue's WAIT phase).
# READS (descriptive): GS pooled (3 x 3000) and GC pooled (2 x 3000), their difference with the unpaired se; each
#   lane's final beside its pair's.

