# DOES THE GATE, RATHER THAN THE EVALUATOR OR THE DEPTH, SET THE CEILING?
# Hacking run, 2026-09-17 (maintainer: "Run what you want next").
#
# WHAT IS ESTABLISHED. Depth is a null with BOTH evaluators at ~6.5% override
# (§22 -0.0007, §23 -0.0087). Foul Play's heuristic is no better than our critic
# there, and both are level with greedy. But at that override rate the search
# changes the played action on ~2 decisions of a 30-turn battle, which MECHAN-
# ICALLY BOUNDS how much any leaf-value improvement can move a win rate. The one
# thing measured to move the number is opening the gate: our critic at depth 2
# went 0.5687 -> 0.5160 when its override rate went 6.8% -> 16.3% (D2N, §22).
#
# THE QUESTION. Is that collapse a property of OUR CRITIC -- which PPO fit only
# to states our own policy reaches, so it misjudges exactly the lines a search
# wants to override into -- or of the SEARCH CONSTRUCTION, in which case a static
# evaluator with no training distribution collapses the same way?
#
#   collapses too   -> the construction is the ceiling; the matrix-family search
#                      story closes, and the next lever is not a better leaf value.
#   holds up        -> the evaluator difference lives on the axis where it can
#                      matter, and OUR critic's off-distribution behaviour is real
#                      after all -- just invisible at a 6.5% override rate.
#
# DEPTH IS HELD AT 1 on purpose: it is a measured null, and depth-1 arms cost a
# third as much, so the budget buys n instead of plies.
#
# MATCHING. Target is D2N's realized 16.3% override. Both arms are swept to it
# by a rule that reads `search/override_rate` and never a win rate -- the same
# rule that turned a -0.053 artifact into a -0.0007 null yesterday.
#
# ANCHOR. GA/G0 (greedy, same object) read 0.5720 and 0.5747 in the two most
# recent blocks; a third greedy draw runs here because session offset is ~0.02
# on this instrument and two readouts this week would have been wrong without one.

