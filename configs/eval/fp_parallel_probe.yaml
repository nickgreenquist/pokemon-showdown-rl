title: fp_parallel_probe
status: "THROUGHPUT PROBE 2026-09-24 (agent, maintainer's FP-parallel ROI task, Phase 1). NOT a pre-reg and NOT a strength read: it credits nothing, no win rate from it is quoted anywhere, and FP@20 here is a load generator. Measures aggregate battles/hour vs Foul Play at k = 1, 2, 4, 6 concurrent arms on a quiet box, plus Foul Play's per-search MCTS iteration count (Phase 2's calibration input)."
journey_step: "off-arc ops (eval throughput); serves every future off-FP read (the R6/R7 reads queues)"
credits_nothing: true
results_dir: results/fp_parallel_probe

# WHAT RUNS. k identical arms at once, each its own (seat, Foul Play) username pair on the one
# :8000 server. The seat is the E3WR object of configs/eval/r6_reads_offfp.yaml (ENS3 of the
# three W finals, c6 OFF, loop breaker ON), so each arm costs what a committee arm of the reads
# queue costs. 150 battles per arm (the maintainer's brief). Foul Play runs from a SEPARATE copy
# (../foul-play-fpprobe) = production FP (upstream 25c976f + scripts/patches/foulplay_gen1_local.patch,
# sha-matched) + scripts/patches/foulplay_probe_visits.patch (logging only: every search's
# total_visits, in the PARENT). Same command line as scripts/ch3_r4_fp_runner.sh
# (--search-time-ms 20 --search-parallelism 1, format gen1randombattle, challenge_user).
# Driver: scripts/fp_parallel_probe.py; read: scripts/fp_parallel_probe_read.py.
#
# USERNAMES: fpk<k>a<i>{seat,bot}; rerun pairs fpk<k>a<i>r2{seat,bot}; smoke fpksmoke{,2}{seat,bot}.
# Prefix-free against every name in configs/eval/*.yaml (checked 2026-09-24 with the reads
# queue's own regex). The arms block below is GENERATED, never typed.

