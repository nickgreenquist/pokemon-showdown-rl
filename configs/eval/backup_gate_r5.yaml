  B2O: {kind: search_seat, seat: w112, ensemble_members: [w104, w112, w120], dose: M, margin_delta: 0.12, depth2: {our_k: 3, cap: 6000, plies: 1, opp_k: 1}, battles: 1000, search_time_ms: 20, seat_username: bkb2oseat, fp_username: bkb2obot}
  B2R: {kind: search_seat, seat: w112, ensemble_members: [w104, w112, w120], dose: M, margin_delta: PINB, depth2: {our_k: 3, cap: 6000, plies: 1, opp_k: 2}, battles: 1000, search_time_ms: 20, seat_username: bkb2rseat, fp_username: bkb2rbot}
