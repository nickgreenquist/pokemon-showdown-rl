  GC:  {kind: ensemble_seat, lanes: [w104, w112, w120], battles: 1000, search_time_ms: 20, seat_username: bkgcseat, fp_username: bkgcbot}

phases:
  S: [B2A, B2B, B2C, GV]
  R: [D1O, B2O, B2R, DGV, DRV, DUM, GC]

# D1O and DUM are the SAME CONFIGURATION (dose M, delta 0.05, ungated), run as
# two arms on two username pairs. That is deliberate and it is not waste: it is
# an in-session replicate of the one arm both halves lean on, and one rung of
# this instrument is worth +/-0.02 (three re-draws of one checkpoint spread
# 0.0200). If D1O and DUM differ by more than that, the block's own noise floor
# is larger than the effects it is looking for and every delta here is read
# against that, not against the binomial.

comparators:
  target_override: 0.193     # D1O's banked realized rate (§24's CN1, n=1500)
  cn1:    {rate: 0.5627, n: 1500, override: 0.1930, note: "our critic, depth 1, gate OPEN (§24)"}
  d2n:    {rate: 0.5160, n: 1500, override: 0.1626, note: "depth 2, OLD backup, gate OPEN (§22)"}
  d1:     {rate: 0.5687, n: 3000, override: 0.0682, note: "depth 1, gate tight (§22)"}
  greedy: {rate: 0.5765, n: 4500, note: "three draws pooled -- THE BAR"}

R0_gates:
  - name: G_OPPK_FIRED
    check: "B2R reports depth2/opp_replies_mean > 1.2 and depth2/minimax_drop > 0; a 1.0 means the minimax backup NEVER FIRED whatever the config asked for, and the arm is VOID"
  - name: G_GATE_FIRED
    check: "DGV and DRV report 0.05 < disagree/search_rate < 0.95; 1.0 is a uniform-dose arm wearing a gated label and 0.0 is greedy"
  - name: G_RATE_MATCHED
    check: "|disagree/search_rate(DGV) - disagree/search_rate(DRV)| <= 0.03; unmatched, DGV vs DRV measures the FRACTION searched, not the SELECTION"
  - name: G_OVERRIDE_MATCHED
    check: "|search/override_rate(B2R) - search/override_rate(D1O)| <= 0.03 and same for B2O; unmatched, the comparison is the 2026-09-17 artifact again"
  - name: G_CAP
    check: "B2R reports depth2/grandchildren_per_decision < 0.5 * depth2.cap AND roughly 2x B2O's; if the cap BINDS, the two arms differ in how many of OUR replies they saw and not only in the backup"
  - name: G_COMPUTE
    check: "search/ms_mean(DGV) ~= search/ms_mean(DUM) within 15% -- all three gate arms are dose M, so the ONLY difference is WHICH decisions were searched; if the per-decision cost differs the arms are not the same search"
  - name: G_REPLICATE
    check: "|our_win_rate(D1O) - our_win_rate(DUM)| reported beside every delta as this block's realized noise floor"
