# TWO FIXES, ONE SESSION: does a CORRECT depth-2 backup pay, and does the
# committee know WHERE to spend the budget?
# Hacking run, 2026-09-18 (maintainer, 2026-09-17: "pre-reg is for ladder runs.
# For hacking and trying ideas, keep going by yourself"). CREDITS NOTHING.
#
# WHY BOTH IN ONE BLOCK. Session offset on this instrument is ~0.02 (measured
# twice this week), so every number here needs a SAME-SESSION anchor, and an
# anchor costs an hour whether it serves one question or two. GC is that anchor
# and it serves both halves.
#
# ---------------------------------------------------------------- HALF ONE
# IDEAS 2.10. RESULTS §24 measured depth-2 -0.047 at 2.57 se WORSE than depth-1
# once the gate is open, and named the cause in our own code: `_look_further`
# maxed over OUR replies with the opponent PINNED to its column, so rows with
# more escape hatches inflated most -- and those are the rows the root then
# overrides into. `depth2.opp_k` (built 2026-09-18) gives the opponent answers
# and backs up max-of-min, which at plies=1 is exactly minimax.
#
#   D1O  depth 1, gate open        the control (§24's CN1 re-drawn here)
#   B2O  depth 2, opp_k 1, open    the OLD backup, same session -- without this
#                                  arm the fix would be a cross-session delta,
#                                  which is the error the ~0.02 offset forbids
#   B2R  depth 2, opp_k 2, open    the fix
#
# MATCHING IS MANDATORY AND IT IS THE WHOLE REASON §22 EXISTS. The min-backup
# LOWERS values, so the same `margin_delta` lets a different number of overrides
# through and an unmatched comparison would measure the gate again (-0.0007 read
# as -0.053 on 2026-09-17). Phase S sweeps B2's delta to D1O's target rate and
# `scripts/backup_gate_pin.py` reads ONLY `search/override_rate`.
#
# THE CAP IS NOT A HIDDEN DOSE DIFFERENCE, and it was checked rather than
# assumed. `opp_k` multiplies grandchildren by ~opp_k, so if `cap` bound, B2R
# would explore HALF as many of OUR replies as B2O before capping and the two
# arms would differ in more than the backup. Measured on the banked depth-2
# arms (D2M, D2N): 881.1 and 866.3 grandchildren per decision against a cap of
# 6000, so B2R's ~1760 is still far under it. G_CAP below reads it back.
#
# READ: B2R - B2O is the FIX. B2R - D1O is whether depth pays once the backup
# is honest. A null on B2R - D1O is a real null for THIS vehicle; it still does
# not close MCTS (`rl/search/tree.py` is a different algorithm) and it does not
# close depth for a vehicle whose backup is a true minimax at every ply.
#
# ---------------------------------------------------------------- HALF TWO
# IDEAS 8.5. Every dose this project has measured raised the budget on EVERY
# decision, which is why depth-2's 3.27x cost bought -0.0007. The ladder allows
# ~150 s/turn and we spend 20 ms. The committee already computes, free, a signal
# for which decisions are close.
#
#   DGV  votes >= 1/3 (any member dissents), dose M
#   DRV  a COIN at the same realized rate, dose M        <- isolates SELECTION
#   DUM  ungated, dose M, every decision                 <- isolates SKIPPING
#
# ALL THREE AT DOSE M, AND THAT IS A CORRECTION MADE MID-BLOCK (2026-09-18,
# after the smoke). The original design put the gated arms at dose L on the
# arithmetic that "dose L is 4x M on n_det, so ~25% of decisions at L costs what
# 100% at M costs". THE SMOKE MEASURED THE RATE AND IT IS NOT 25%: the gate at
# threshold 0.30 searched 45.2% of decisions, so dose L would have cost ~1.8x
# DUM and DGV-DUM would have been confounded by COMPUTE -- the exact class of
# error this whole block exists to avoid. With three members `votes` takes only
# {0, 1/3, 2/3}, so there is no continuous knob to tune the rate back to 25%.
#
# HOLDING THE DOSE INSTEAD IS BETTER SCIENCE AND CHEAPER. At dose M every arm
# costs the SAME PER SEARCHED DECISION, so the only difference between DGV and
# DUM is WHICH decisions were searched, and DGV spends ~45% of DUM's compute.
# The questions become:
#   DGV - DUM   does SKIPPING the decisions the committee agrees on cost
#               anything? A null here is a ~2x saving for free, and it is the
#               first evidence about WHERE search matters rather than how much.
#   DGV - DRV   does the COMMITTEE know where, or would any 45% have done?
#
# And it follows the day's own evidence. §24 and §26 measured that MORE search
# does not pay uniformly -- every dose increase has read flat or negative. So
# "spend more, but targeted" bets on the lever that keeps failing; "spend less,
# targeted" tests the selection claim directly. If selection carries signal,
# THEN a bigger dose on the selected decisions is the natural follow-up (IDEAS
# 8.6's budget ladder is the same question for the tree).
#
# WHY `votes` AT 1/3 RATHER THAN A SWEPT THRESHOLD: with three members `votes`
# takes only {0, 1/3, 2/3}, so 1/3 is the NATURAL cut (any dissent) and there is
# nothing to sweep. DRV's threshold is then pinned ARITHMETICALLY from DGV's
# realized rate -- a uniform coin searches (1 - t) by construction -- so the
# control is matched rather than screened, which costs a phase-S cell.
#
# ANCHOR. Three greedy draws on this object read 0.5747 / 0.5720 / 0.5827,
# pooled 0.5765 (n=4500). GC is the fourth, in THIS session. THE BAR IS GREEDY.

