  s112: {path: runs/showdown_sp_100m_s112/ckpt_100000008.pt, sha256: 2ec16fbf85a9046d360328e50cdee5c732d8529599aafa2215a2a56128abcbb3, step: 100000008}
  s120: {path: runs/showdown_sp_100m_s120/ckpt_100000080.pt, sha256: db5d07d2096e021cb74deaf86c1feb2134954a35e042392680d568a185320287, step: 100000080}
  # The clone, sha identical to the ch3_r4 and ch5_100m pins — the SAME frozen
  # opponent those banked numbers were measured against.
  clone: {path: runs/bc_fp_v2r_soft_180k_s0/checkpoint.pt, sha256: 5e490adecf70b480edcde9a6080ffc34049c16bf77b295c0e2a8bd43299a0683}

anchor_arms:
  # THE LEG THAT WAS OWED: the committee itself, as an ensemble seat. `lanes`,
  # never `seat1` — the runner asserts both directions, because an ensemble arm
  # carrying a `seat1` key would silently rate ONE lane and its JSON would be
  # indistinguishable from a correct one.
  CEW:   {kind: ensemble_h2h, lanes: [w104, w112, w120], seat2: clone, battles: 500}
  # The three W singles, so the committee's number has a within-fleet reference
  # and the leg is reported the way the anchor battery asks (the PAIR {lane
  # value, fleet pooled value}, never a lone lane).
  CW104: {kind: greedy_h2h, seat1: w104, seat2: clone, battles: 500}
  CW112: {kind: greedy_h2h, seat1: w112, seat2: clone, battles: 500}
  CW120: {kind: greedy_h2h, seat1: w120, seat2: clone, battles: 500}
  # The 100M singles, RE-DRAWN IN THIS SESSION. Without these the only
  # comparator is a number from another session against the same frozen clone,
  # and the monster header already rules that the era bar is not transferable.
  CH104: {kind: greedy_h2h, seat1: s104, seat2: clone, battles: 500}
  CH112: {kind: greedy_h2h, seat1: s112, seat2: clone, battles: 500}
  CH120: {kind: greedy_h2h, seat1: s120, seat2: clone, battles: 500}

run_order: [CEW, CW104, CW112, CW120, CH104, CH112, CH120]

reads:
  # Stated before any arm runs. Unpaired two-proportion se everywhere: seeds do
  # NOT pair battles (docs/landmines.md, 2026-09-11).
  A1: "CEW (the R5 committee) vs the clone, n=500. THE LEG ITSELF. Reported with n, with the policy kind (ensemble, three members) and with the clone disclosure. This is the number the README row was waiting for."
  A2: "CW104/112/120 pooled (n=1500) — the fleet-pooled W value, reported as the PAIR {lane values, pooled} per the anchor battery's rule."
  A3: "CH104/112/120 pooled (n=1500), THIS SESSION — the comparator. The banked 2026-09-04 values (lane s112 0.930, pooled 0.9233) are quoted alongside as the cross-session reference and are NEVER differenced against a 2026-09-16 number without saying so."
  A4: "committee minus its own singles (A1 - A2): does the committee help against a weak fixed opponent at all? Expected near zero at a ceiling-ish win rate; a null here is EXPECTED and is not evidence about the committee."
  ceiling_note: "These win rates sit near 0.9. At n=500 the binomial se at p=0.93 is 0.0114, so this leg cannot resolve anything under ~2.3 points, and at a ceiling most of the remaining loss mass is variance in the clone's own sampling. State it; do not narrate small differences."

protocol:
  battles: 500              # the anchor battery's number for this leg
  chunks: 5                 # 100 per chunk, resumable (a death costs one chunk)
  seat1: "deterministic (the locked-eval convention)"
  seat2: "the clone as a SAMPLING PoolPlayer — asymmetric BY PROTOCOL, exactly as the 100M leg ran it; one orientation only, as that leg did, and the asymmetry is disclosed rather than corrected for"
  ties: "non-wins in every rate, as everywhere in this repo"
  sequential: true          # one arm at a time, rule 2
  server: "the local Showdown server must be up; simulator: 4 (CLAUDE.md rule 5)"
  env: "POKEMON_RL_ENCODER_V2=1 POKEMON_RL_ENCODER_IDS=1 — bare, the seat dies at OBS_DIM 612 otherwise"
  command: "python scripts/ch3_r4_anchors.py --prereg configs/eval/monster_bcclone.yaml --arm <ARM> --out-dir results/monster_bcclone"
  rate_check: "--battles 20 --smoke on CEW before the 500s, as the 100M leg did"

disclosures_that_travel:
  - "a clone number is never style evidence (CLAUDE.md, anchor battery)"
  - "anchors are DESCRIPTIVE and never verdict inputs"
  - "the clone was cloned from FP tapes collected before the FP@20 budget was pinned"
  - "seat 2 samples and seat 1 does not; one orientation only"
  - "n=500 per arm cannot resolve differences under ~2.3 points at these win rates"
