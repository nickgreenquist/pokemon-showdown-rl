# =====================================================================
# MONSTER BC-CLONE ANCHOR LEG — the one missing leg of the gen-1 anchor
# battery for the LADDER R5 object. REGISTERED 2026-09-16 (agent).
#
# WHAT THIS IS. CLAUDE.md's anchor battery says every headline-grade gen-1
# result reports vs-SH (the only verdict input) PLUS a BC-clone h2h (500) and
# a Foul Play h2h @20 before its README row lands, and that "a leg that does
# not exist yet is reported as PENDING and the README row WAITS for it". For
# the R5 committee (ENS3 of the 200M W trio) vs-SH (0.8386) and FP@20 (0.5987)
# are in hand; the BC-clone leg is the one that was PENDING. It was pending
# for a reason nobody had checked: `scripts/ch3_r4_anchors.py` has been
# UNRUNNABLE since 2026-09-05 (it passed `_opponent_from_checkpoint`'s
# (player, env_id) pair as the opponent), and the runner had no ensemble seat
# at all. Both fixed 2026-09-16; this file is the pre-reg those fixes unblock.
#
# ANCHORS ARE DESCRIPTIVE, NEVER VERDICT INPUTS (CLAUDE.md). Nothing here is
# a credit, nothing here changes RESULTS §20/§21, and the one standing
# disclosure travels with every number below:
#   **A CLONE NUMBER IS NEVER STYLE EVIDENCE** — "match the policy form to the
#   rating you compare against". This clone is a 180k-step behavioural clone
#   of 7,200 FOUL PLAY battles collected BEFORE the FP@20 budget was pinned,
#   so it is a fixed, weak, imitation opponent; beating it measures that our
#   policy is not losing to a frozen imitator, and nothing else.
#
# THE COMPARISON THAT IS LICENSED. The 100M fleet's banked clone numbers
# (results/ch5_100m/bcclone, ca104/ca112/ca120) are the reference: lane s112
# 0.930, fleet pooled 0.9233 (n=3x500). Those were measured in a DIFFERENT
# SESSION on the same frozen clone, so the pairing is fair in kind but not
# same-session; `configs/showdown_monster200m.yaml` (lines ~1449) already
# records that the 0.894 +/- 0.04 tripwire is a ch3/s65-era bar and NOT a
# cross-era one. Accordingly the W arms below are run in the SAME SESSION as
# a re-draw of the 100M lanes, exactly as the off-FP read did, so any
# difference is read against a same-session comparator or not at all.
#
# journey_step: "11" (the final gen-1 ladder) — this leg completes that step's
#   anchor battery; it does not open a new step. Exit condition, verbatim from
#   JOURNEY.md step 2 (the ladder steps share it): "the run itself — not a
#   rating, not top-500."
#
# CREDIT LINE, restated verbatim because every pre-reg must carry it, and
# INAPPLICABLE here because an anchor is descriptive:
#   "a lever is credited iff pooled delta >= +0.025 AND >= 2*se_diff, where
#   se_diff is the LARGER of the pooled-binomial se_diff and the seed-clustered
#   se_diff, the latter computed from the per-seed finals at read time."
#   NO ARM IN THIS FILE MAY BE DESCRIBED AS CREDITED.
# =====================================================================

results_dir: results/monster_bcclone

# ch3_r4_anchors.py preflight (R5b BI-7a): sha-assert every pin below.
expected_pins: 7

