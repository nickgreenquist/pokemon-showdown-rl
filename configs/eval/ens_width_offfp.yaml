# THE OFF-FOUL-PLAY TWIN of configs/eval/ens_width.yaml, and the repair of a
# number the review flagged: "ENS3F 0.557, +0.055 at 3.0 se over greedy" was
# read against a greedy comparator banked 2026-09-03 (results/ch5_100m/t112,
# n=3000). The opponent is UNCHANGED (every foul-play edit is dated Aug 6,
# poke-engine 0.0.48 installed Aug 6, same runner, 239 vs 241 KB of FP log per
# battle, 1.55 vs 1.64 s/battle) and the comparator ran ten hours after the
# 100M fleet ended, so the number probably stands -- but this repo's own rule
# (search_s3_100m.yaml: "R3 measured a same-checkpoint era_diff of 0.0148
# between a banked A0 and a fresh one") says a banked greedy is NOT the
# comparator, and ens_offfp.yaml itself files that read as SECONDARY. Tonight
# re-draws it in ONE session, on fresh usernames, so the ensemble's off-FP
# transfer is verdict-grade and so the monster's own off-FP read (200M finals
# vs 100M finals) has its comparator protocol rehearsed.
#
# ARMS, all off FP@20 (search_time_ms 20 PER ARM; the MA-10 failure is a
# mis-set budget that yields an indistinguishable JSON), n=1000 each,
# SEQUENTIAL (FP's budget is WALL-CLOCK; a second concurrent FP would weaken
# both opponents and flatter both seats):
#   G104F/G112F/G120F  greedy 100M singles, fresh         (the comparator ENS3F lacked)
#   G66F/G75F/G83F     greedy 50M finals, fresh           (banked: 0.4740/0.4827/0.4670)
#   E350F              ENS3 of the 50M finals             (3 members at 50M)
#   E6MIXF             100M trio + the three 50M finals   (6 members)
#   ENS3FR             ENS3 of the 100M trio, FRESH PAIR   (same object as ENS3F 0.557:
#                                                          the era/replicate term)
#
# THE READ, stated before any arm runs. Unpaired two-proportion binomial se;
# at p~0.5 and n=1000 per arm, se_diff ~0.0224 arm-vs-arm, ~0.018 arm-vs-3000.
#   R1 ENS3F (0.557, banked 2026-09-11 16:55) and ENS3FR vs G100F = mean of
#      G104F/G112F/G120F: the same-session version of "+0.055". Also
#      |ENS3FR - ENS3F| is the same-object replicate spread at n=1000 and is
#      reported next to every off-FP delta from now on.
#   R2 E6MIXF vs the pooled ENS3F+ENS3FR (n=2000; se_diff ~0.0194):
#      >= +0.039 (2 se) -> three weaker extra members still pay off-FP; the
#          monster buys WIDTH first. Below that: unresolved at this n, and NOT
#          evidence of saturation (the extra members are 50M objects).
#   R3 gain@50M = E350F - mean(G66F,G75F,G83F) vs gain@100M = pooled ENS3F/
#      ENS3FR - G100F. Equal -> additive; smaller at 100M -> substitutes.
#
# DISCLOSURES THAT TRAVEL WITH EVERY FP@20 NUMBER, FOREVER (CLAUDE.md): the
# equivalence test is weakly powered, and the point estimate flatters us. The
# budget is NAMED in every quote. FP@20 is an instrument, not a rung; nothing
# here is a ladder projection in either direction.

