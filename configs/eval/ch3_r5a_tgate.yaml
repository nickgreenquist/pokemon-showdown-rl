# Q4. SCHEDULE, PAIRING, AND THE HONEST PRICE
# ---------------------------------------------------------------------
# THROUGHPUT, MEASURED, WITH ITS PROVENANCE. From results/ch3_r4 chunk
#   timestamps: greedy vs SH 20.8 battles/s per lane 4-wide (0.048
#   s/battle); search@M vs SH 0.40 battles/s per lane 4-wide (2.5
#   s/battle). PRICED HERE, CONSERVATIVELY: **0.16 s per greedy battle**
#   (3.3x the measured rate) and **3.2 s per search battle** (1.28x the
#   measured rate) — the search margin because seat 2 is a NETWORK
#   opponent (extra forward passes per decision) rather than SH. These
#   are planning numbers with margin, not point estimates.
#   T_S: 1000 x 3.2 s = 53.3 min per lane. T_M: 1000 x 0.16 s = 2.7 min
#   per lane.
# WAVES — LANE-PAIRED, 4-WIDE, THE R4 PATTERN (review 1 finding 10: the
#   r1 draft had NO pairing discipline on Stage 1 while its own headline
#   argument prices session drift at 30% of the threshold):
#     WAVE_T1 = {ts_s62, tm_s62, ts_s63, tm_s63}
#     WAVE_T2 = {ts_s64, tm_s64, ts_s65, tm_s65}
#   Each wave is 4 concurrent jobs, 30 s start stagger. Wall per wave =
#   T_S's 53.3 min (T_M finishes inside it). TOTAL BATTLE WALL ~1.8 h.
#   **T_M LAUNCH RULE, MECHANICAL: that lane's T_M starts when the same
#   lane's ts_s6N.chunk04.json exists** — i.e. at the midpoint of T_S's
#   window, so T_M's span sits inside T_S's span rather than at its
#   edge. This is the pairing gate's teeth, not a preference.
# THE MEASURED SESSION NUISANCE THIS IS PROTECTING AGAINST: R2's fresh
#   A0 read 0.72358 vs R3's fresh A0 read 0.70875 — the SAME four
#   checkpoints one day apart, -0.01483 = 59.3% of the 0.025 floor and
#   30% of this gate's +0.05 threshold. Battles are SERVER-ROLLED
#   (ch3_r4_ensemble_critic.yaml: "battle-level replay determinism is
#   UNAVAILABLE in this env"), so cross-session comparison redraws the
#   whole opponent-team distribution.
# NOT PRICED AS "29 MINUTES". The r1 draft and the synthesis both sold
#   this gate as "one 29-minute gate". THE HONEST PRICE IS ~1.8 h OF
#   BATTLES PLUS ~1.5 h OF OFFLINE BUILD (Q6). Said here so it is not
#   discovered at launch.
# EXECUTION IS DELEGATED, NOT FREE (review 2 MAJOR-9). CLAUDE.md routes
#   runs longer than ~5 minutes to the maintainer's terminal because
