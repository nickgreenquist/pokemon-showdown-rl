# Q2. WHY +0.05, ON THE RIGHT NUMBER
# ---------------------------------------------------------------------
# THE THRESHOLD IS ARGUED FROM THE POOLED TEACHER EDGE, NOT FROM ONE
#   LANE. **CORRECTION ON THE RECORD (review 1 BLOCKER 7): the r1 draft
#   argued +0.05 against "+0.0746". +0.0746 is s63's SINGLE-LANE R2
#   delta. The teacher's vs-SH edge is the POOLED +0.06925.** Every
#   occurrence is corrected here and the ratio is restated honestly:
#   **0.05 is 72% of the teacher's pooled vs-SH edge (0.05 / 0.06925 =
#   0.722), NOT "~2/3".**
# THE ARGUMENT. Distillation is lossy in three named ways: (a) the
#   student is a 2-layer MLP fitting a search operator, (b) the fit is
#   on self-play states while the read is on vs-SH states (a deliberate,
#   purity-required mismatch that biases toward the null), (c) one
#   iteration only. A teacher margin equal to the +0.025 credit floor
#   would leave a lossy student with no headroom at all. +0.05 = 2x the
#   floor, and simultaneously ~72% of the teacher's own measured vs-SH
#   edge, is the smallest margin at which a lossy one-iteration student
#   has a defensible shot at the floor. THE NUMBER IS A JUDGMENT, STATED
#   BEFORE DATA, AND IT IS THE MAINTAINER'S TO OVERRULE AT RATIFICATION
#   (U-A2 below) — but it is not moved after the data are seen.
# ---------------------------------------------------------------------
# Q3. THE CELL PARTITION AND ITS OPERATING CHARACTERISTICS
# ---------------------------------------------------------------------
# THE r1 DRAFT'S BINARY PASS/FAIL WAS A BLOCKER (review 1 finding 8):
#   a near-miss (mean +0.045, 4/4 lanes positive) would have licensed,
#   as the ONLY permitted narration, a sentence asserting search "does
#   not hold against its own greedy self" — which that data contradicts.
#   And the consequence was irreversible ("NO RE-TUNE, NO RETRY").
# ALSO NEW (review 1 finding 9): the r1 gate had NO UNCERTAINTY
#   TREATMENT at all. It is restored here, using the SAME se law the
#   primary read uses on itself.
#
# STATISTICS, NAMED ONCE, BINDING EVERYWHERE:
#   AGGREGATOR: the EQUAL-WEIGHT MEAN of the four per-lane margins m_i.
#     Median and worst-lane are RECORDED and NEVER govern any cell.
#   CLUSTERING UNIT: checkpoint-lane (n=4), PAIRED at cluster level.
#   se_gov = the LARGER OF THREE, computed by
#     scripts/ch3_r2_grade.se_terms_r2 UNMODIFIED on (T_S rates, T_M
#     rates, n=1000): pooled-binomial two-sample, paired-clustered
#     sd(m_i)/sqrt(4), unpaired two-sample clustered. The third term can
#     only raise se, which pushes borderline data toward UNRESOLVED
#     rather than toward the irreversible cell — the safe direction.
#   L = mean(m_i) - 2*se_gov     U = mean(m_i) + 2*se_gov
#   kpos = number of lanes with m_i > 0
#
# THREE CELLS — TOTAL, DISJOINT, EVALUATED IN THIS ORDER:
#
#   T-PASS        U >= 0.05  AND  L > 0  AND  kpos >= 3
#     READING: the data are compatible with the pre-registered +0.05
#     headroom AND exclude a zero margin AND the lanes agree.
#     CONSEQUENCE: ch3_r5b_exit_draft.yaml becomes eligible to be
#     ratified and built. NOTHING ELSE. No headline claim, no README
#     row beyond the recorded number.
#
#   T-FAIL        U < 0.05
#     READING: the pre-registered headroom is EXCLUDED at the same
#     2*se bound the primary uses. THE ACTOR EXPERT-ITERATION FAMILY
#     CLOSES FOR THIS CHAPTER. r5b does not run. NO RE-TUNE, NO RETRY
#     AT LARGER n. Two licensed sentences, selected by a pre-stated
#     numeric sub-rule so no narration freedom exists:
#       T-FAIL/NULL  (mean(m_i) <= 0) — verbatim: "search@M's credited
#         advantage is measured only against SimpleHeuristics; against
#         the BC-FP clone, against Foul Play and against its own greedy
#         self it does not hold. There is no expert to iterate on."
#       T-FAIL/SHORT (mean(m_i) > 0) — verbatim: "search@M does beat its
#         own greedy self in mirror play, by mean(m_i) = <value>
#         (per-lane <m_62>/<m_63>/<m_64>/<m_65>, 2*se_gov = <value>),
#         but the margin is bounded above the pre-registered +0.05
#         headroom a lossy one-iteration student would need. The actor
#         expert-iteration family closes for INSUFFICIENT TEACHER
#         HEADROOM, not for absence of an edge." **THE "DOES NOT HOLD
#         AGAINST ITS OWN GREEDY SELF" CLAUSE IS SUPPRESSED IN THIS
#         CELL** and may not appear in README, STATUS or SESSION_LOGS.
#
#   T-UNRESOLVED  everything else (U >= 0.05 but L <= 0 or kpos <= 2)
#     READING: the point estimate is compatible with the required
#     headroom but zero is not excluded, or the four lanes disagree.
#     THE FAMILY DOES NOT CLOSE AND r5b DOES NOT LAUNCH. Licensed
#     sentence, verbatim: "the T-GATE did not resolve: mean(m_i) =
#     <value>, 2*se_gov = <value>, lanes <m_62>/<m_63>/<m_64>/<m_65>.
#     Neither the +0.05 headroom nor a zero margin is excluded. No
#     conclusion about expert iteration is licensed from this run."
#     NAMED, PRICED OPTION — the maintainer's call, not the agent's:
#     RE-RUN BOTH ARMS AT n=1500/lane (+~1.0 h of battles at 4-wide;
#     see Q4), which raises P(resolve) at a true +0.05 from 0.98 to
#     0.999 with lane sd 0 and from 0.87 to 0.92 with lane sd 0.02.
#     If the maintainer declines, the cell stands as UNRESOLVED and is
#     recorded as such. **The re-run is pre-registered HERE, before
#     data, as the ONLY permitted retry, and it re-runs BOTH arms —
#     never T_S alone.**
#
# OPERATING CHARACTERISTICS, COMPUTED BEFORE DATA. Generated by
#   results/design_critic/r5_power_sim.py --tgate (20,000 reps/cell,
#   rng seed 20260824); the exact simulation rule is in that file's
#   docstring and is restated here in one line: per rep, mu_i = mu +
#   N(0, lane_sd); true T_M rate 0.50 (the variance-maximising, i.e.
#   conservative, choice); true T_S rate 0.50 + mu_i; both arms observed
#   as Binomial(n, .)/n; se_gov from se_terms_r2; cells as above. AT THE
#   REGISTERED n = 1000:
#
#     true margin |  P(T-PASS)  P(T-UNRESOLVED)  P(T-FAIL)
#     lane sd 0.00
#       +0.00     |    0.007        0.023          0.970
#       +0.03     |    0.559        0.124          0.317
#       +0.05     |    0.965        0.020          0.015
#       +0.07     |    1.000        0.000          0.000
#     lane sd 0.02
#       +0.00     |    0.020        0.131          0.849
#       +0.03     |    0.431        0.317          0.252
#       +0.05     |    0.837        0.134          0.029
#       +0.07     |    0.982        0.017          0.001
#
#   THE TWO PRE-REGISTERED REQUIREMENTS ARE MET: a true +0.05 passes
#   0.965 / 0.837 (required >= 0.75) and a true 0.00 passes 0.007 /
#   0.020 (required <= 0.05). AND THE CELL WITH THE IRREVERSIBLE
#   CONSEQUENCE IS THE PROTECTED ONE: at a true +0.05 the family closes
#   with probability 0.015-0.029, against 0.74 under the r1 draft's
#   binary rule at a true +0.04 (review 1's simulation).
#
# WHY n = 1000 AND NOT 500. At n=500, 2*se_gov ~ 0.032 > 0.025, so the
#   "compatible with +0.05" and "excludes 0" bounds leave a systematic
#   gap and the gate is INDECISIVE by construction: it lands
#   T-UNRESOLVED on 20% of true nulls and 47% of true +0.03s (simulated
#   above). At n=1000, 2*se_gov ~ 0.022 < 0.025, the bounds close, and
#   T-UNRESOLVED fires only on genuine lane heterogeneity or an inflated
#   clustered se — which is exactly when it should. n=1500 buys ~0.02
#   more power at +0.05 for +1.0 h and is held in reserve as the
#   T-UNRESOLVED re-run, not spent up front.
# WHAT WE DO NOT CLAIM: the gate is a coin flip AT ITS OWN THRESHOLD by
#   construction (that is what a threshold is). What the three-cell
#   partition buys is that a near-miss no longer licenses a false
#   sentence, and that a REAL edge is almost never destroyed.
