# r5b would apply them to a SELF-PLAY split. T_S measures all three in
# the self-play regime, for free, before any build is spent.**
#   * search/flip_rate per lane in SELF-PLAY -> the base actor/search
#     disagreement a0_selfplay = 1 - flip_rate. r5b's D-2/D-3 are stated
#     RELATIVE to this number, not to 0.402.
#   * search/searched_decisions per battle -> r5b's dataset yield and
#     its ~2.8 h collection estimate, re-derived rather than transferred.
#   * search/placeholder_skip_rate -> the fraction of rows r5b EXCLUDES
#     from its fit (review 2 MAJOR-8).
#   * search/leaves_mean, search/ms_mean -> F-C, F-M and r5b's budget.
#   * m_i, the per-lane teacher margin itself, is the first measurement
#     of our search against our own weights in this repo.
# INDEPENDENTLY OF EVERY CELL (design B's U2, "the highest value-per-
#   minute item in the whole memo"): STATUS.md and SESSION_LOGS.md
#   record M2 — D26's critic ctx srank99 is 49/51/35/52 of 384 on the
#   calibrated probe, so D22's "7-11" is STALE for the headline and L2
#   (regen-L2) and L4 (capacity) are dead on that number. Already landed
#   at SESSION_LOGS.md:5896-5918; the obligation is registered here so
#   it is not dropped.
# ---------------------------------------------------------------------
# Q8. THE PURITY RULINGS — OPEN, NOT RECOMMENDED, NOT CONSENSUS
# ---------------------------------------------------------------------
# RULE-1 (design A's UD-0). **THIS FILE DOES NOT NEED THE RULING AND IS
#   NOT BLOCKED BY IT**: the T-GATE moves nothing into any weights — it
#   plays two existing checkpoints against each other and records win
#   rates. RULE-1 is reproduced here for the record because this file's
#   T-PASS cell hands to r5b, WHICH IS BLOCKED ON IT. The blocking
#   bracket lives in ch3_r5b_exit_draft.yaml, not here, which is why
#   this file remains gradeable.
#   THE QUESTION: distillation moves poke-engine-derived information
#   (search ACTIONS in r5b; search VALUES in A's design) INTO THE
#   WEIGHTS. R2 licensed inference-time engine use only.
#   **WHO SAID WHAT, CORRECTED (review 1 BLOCKER 34): A raised this and
#   recommended CLEAN-with-a-clause. B NEVER RAISED ENGINE PURITY AT ALL
#   (verified: zero hits for poke-engine / poke_engine / UD-0 in
#   design_input_B.md; A predicted exactly this at A §9.4). THE r1
#   DRAFT'S "BOTH DESIGN AGENTS RECOMMEND RULING CLEAN" IS FALSE AND IS
#   WITHDRAWN. One agent recommended; the other was silent.**
#   A'S THREE OPTIONS, VERBATIM from design_input_A.md:1148, ALL THREE
#   PUT TO THE MAINTAINER (the r1 draft deleted the third — the only one
#   that bites r5b):
#     (1) "CLEAN with a mandatory provenance clause"
#     (2) "NOT CLEAN (kill the lever)"
#     (3) "CLEAN only for the search-deployed agent, never for a greedy
#          claim"
#   CONSEQUENCE OF EACH, SPELLED OUT:
#     (1) r5b is buildable and its greedy read is licensed, with A's
#         qualifier mandatory in every licensed sentence: "the actor was
#         fitted offline to its own search's decisions, backed up
#         through poke-engine from the checkpoint's own self-play."
#     (2) r5b dies. A's critic-value design dies with it. This file
#         still runs and still yields Q7's measurements.
#     (3) **r5b's GREEDY read is dead as designed** — the whole point of
#         r5b is a greedy, zero-inference-cost artefact — and the only
#         surviving shape is a SEARCH-DEPLOYED read, which is design A's
#         successor (see named_successor). SAY IT PLAINLY: option 3 does
#         not soften r5b, it replaces it.
#   A'S OWN COUNTER-ARGUMENT, restored verbatim (the r1 draft dropped
#   it): "*Not clean*: `poke-engine` is external software encoding game
#   knowledge our agent never had to learn, and after distillation that
#   knowledge is indistinguishable, in the weights, from something
#   learned."
#   A also made this "**BLOCKS THE BUILD**, not just the launch"; the r1
#   draft softened it to a Stage-2 launch blocker. Restored in r5b.
# RULE-1b (design B's U8 — A DIFFERENT QUESTION, un-merged; review 1
#   finding 35). B: "I assert that recording search play against
#   `SimpleHeuristicsPlayer` and then training on those states would
#   break the R0-1b purity seam *and* be train-on-test against the
#   headline metric. That reading is mine, not a ruling. **If the
#   maintainer rules the other way, the design gets materially cheaper
#   and materially more likely to credit — and materially less honest.**
#   I have designed the expensive, honest version. **DECIDE EXPLICITLY,
#   on the record, either way.**" The r1 draft folded U8 into UD-0 and
#   thereby converted B's explicit request for a ruling into a settled
#   premise. It is put back as its own question, and it is likewise not
#   needed for THIS file (the T-GATE trains on nothing).
# ---------------------------------------------------------------------
# Q9. CONFOUNDS AND LIMITS, DISCLOSED
# ---------------------------------------------------------------------
# CA-1 SEAT-1-ONLY. The search seat exists only as seat-1 machinery
#   (_SearchEvalAdapter), so both arms are SAME-ORIENTATION and the
#   ~0.198 asymmetry cancels inside every m_i. The corollary is that
#   this file measures the teacher's margin AS SEAT 1 ONLY; a
#   seat-2 margin is unmeasured and unclaimed.
# CA-2 MIRROR-PLAY REGIME != EVAL REGIME. m_i is measured in self-play;
#   r5b's read is vs SH. This gate answers "is there a teacher in the
#   regime the DATA would come from", which is the right question for a
#   distillation, and NOT "does search beat greedy vs SH" (R2 already
#   answered that: +0.06925).
# CA-3 ONE DOSE, ONE DEPTH. Dose M, depth 1, evaluator ABSENT (E0).
#   A T-FAIL refutes the teacher AT THIS DOSE AND DEPTH over these four
#   checkpoints, not search in general. That clause is licensed in
#   T-FAIL/SHORT and T-UNRESOLVED, and SUPPRESSED in T-FAIL/NULL only
#   to the extent the closure sentence already scopes itself.
# CA-4 n=4 CLUSTERS, df=3. t(3,.975) = 3.18, so "2*se" is ~86% coverage
#   and P(the sd is underestimated by 2x) ~ 0.14. Stated before data.
#   The three-cell partition, not the se, is the substantive protection.
# CA-5 THE T_M RATE IS ITSELF UNMEASURED. Deterministic-seat-1 vs
#   sampling-seat-2 in a true mirror has no recorded value in this repo;
#   the power table assumes 0.50 because that maximises the binomial
#   variance. If the realized T_M rate is far from 0.50 the gate is
#   slightly MORE powerful than tabled, never less.
# =====================================================================
