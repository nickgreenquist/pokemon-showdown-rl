  BSM: {kind: search_seat, seat: w112, ensemble_members: [w104, w112, w120], dose: M, battles: 2, search_time_ms: 20, seat_username: tbsmkseat, fp_username: tbsmkbot, tree: {iters: 300, n_det: 2, batch: 16, decide: gumbel, beta: 4.0, root_min_visits: 8}}

  # PHASE S -- the MECHANISM screen. Win rates here are NOT reads.
  BS1: {kind: search_seat, seat: w112, ensemble_members: [w104, w112, w120], dose: M, battles: 40, search_time_ms: 20, seat_username: tbbs1seat, fp_username: tbbs1bot, tree: {iters: 100, n_det: 2, batch: 16, decide: gumbel, beta: 4.0, root_min_visits: 8}}
  BS3: {kind: search_seat, seat: w112, ensemble_members: [w104, w112, w120], dose: M, battles: 40, search_time_ms: 20, seat_username: tbbs3seat, fp_username: tbbs3bot, tree: {iters: 300, n_det: 2, batch: 16, decide: gumbel, beta: 4.0, root_min_visits: 8}}
  BS9: {kind: search_seat, seat: w112, ensemble_members: [w104, w112, w120], dose: M, battles: 40, search_time_ms: 20, seat_username: tbbs9seat, fp_username: tbbs9bot, tree: {iters: 900, n_det: 2, batch: 16, decide: gumbel, beta: 4.0, root_min_visits: 8}}
  # the VISITS rule at the big budget: §26's TV acted on only 3.7% of decisions
  # because visit share IS nearly the prior at iters 100. If the budget is what
  # was missing, this is where it shows.
  BSV: {kind: search_seat, seat: w112, ensemble_members: [w104, w112, w120], dose: M, battles: 40, search_time_ms: 20, seat_username: tbbsvseat, fp_username: tbbsvbot, tree: {iters: 900, n_det: 2, batch: 16, decide: visits, root_min_visits: 8}}

phases:
  S: [BS1, BS3, BS9, BSV]

decision_rule:
  # WRITTEN BEFORE THE SCREEN RUNS, and it reads the MECHANISM, never a win rate.
  primary: "tree/kl_pi_prior at iters 900 vs iters 100, and tree/argmax_moved at both"
  fires: >-
    Run phase R (n=1500, the winning budget vs an in-session greedy anchor) only
    if KL at 900 is at least 1.5x KL at 100 AND argmax_moved rises by at least 5
    points. Both are per-decision quantities over ~1,300 decisions per arm, so
    they are far better determined than any win rate here.
  does_not_fire: >-
    If KL is flat in the budget, MORE ITERATIONS DO NOT BUY MORE THINKING on this
    object, and the tree's +0.021 is whatever it is at iters 100 -- resolving it
    is then a pure n question (n~4,375/arm) and a separate decision. It also
    kills the cheap version of IDEAS 4.9: an expert that IS the student has
    nothing to teach, and the right follow-up becomes the PRIOR (a flatter
    policy, a temperature) rather than the budget.
  cost_is_recorded_either_way: >-
    search/ms_mean at each rung is the price of a decision at that budget, and
    the ladder is the first measurement of how tree cost scales with iters in
    this harness. Quote it with the batch width (16) -- batching is what makes
    depth affordable and it does not change what is searched.

comparators:
  tg_iters100: {rate: 0.6040, n: 1000, acts: 0.1144, note: "§26 TG, gumbel, iters 100"}
  tv_iters100: {rate: 0.5970, n: 1000, acts: 0.0365, note: "§26 TV, visits, iters 100"}
  greedy_inblock: {rate: 0.5830, n: 1000, note: "§26 TGR -- CROSS-SESSION from here"}
  greedy_pooled: {rate: 0.5765, n: 4500, note: "four draws; the bar"}

R0_gates:
  - name: G_EXPERT_REPORTED
    check: "every arm reports tree/kl_pi_prior, tree/pi_top1 and tree/argmax_moved; absent means the counters did not survive the seat path and the screen says NOTHING"
  - name: G_BUDGET_REALIZED
    check: "search/ms_mean rises roughly with iters (100 -> 300 -> 900); flat ms means the iters knob did not reach the tree and every rung is the same arm"
  - name: G_SESSION
    check: "no comparison to §26's numbers without an in-session anchor -- the offset on this instrument is ~0.02 and §26's anchor is a different session"
