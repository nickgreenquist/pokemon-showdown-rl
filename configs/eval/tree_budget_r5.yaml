# DOES A BIGGER TREE ACTUALLY THINK HARDER? (IDEAS 8.6, the follow-up RESULTS §26
# argues for.) Hacking run, 2026-09-18. CREDITS NOTHING.
#
# WHAT §26 LEFT. A real decoupled-UCT tree at `iters: 100` read TG (gumbel)
# 0.6040 against an in-block greedy anchor of 0.5830 -- **+0.0210 at 0.96 se**,
# the first search arm this project has measured that is not BELOW greedy, and
# UNRESOLVED rather than null (se_diff 0.0220 at n=1000).
#
# WHY NOT JUST ADD n. Resolving +0.0210 at 2 se takes n~4,375 per arm -- an
# overnight block -- and it would spend that on the WEAKEST version of the arm.
# `iters: 100` is precisely the regime the 90.9% visit-concentration measurement
# ^^ WITHDRAWN 2026-09-19 (RESULTS §32): the 90.9% was ONE smoke decision. Measured over 1,107 searched decisions at iters 100 (results/tree_budget_r5/bs1.json): pi_top1 0.417 vs the prior's 0.885, KL 5.70 nats -- pi' is far FLATTER than the prior.
# describes: the prior dominates and the tree can barely express an improvement.
# TV changed the played action on 1.1 decisions per battle. If more iterations
# move pi' off the prior, the effect worth resolving is a bigger one.
#
# THE CHEAP SCREEN COMES FIRST, AND IT IS THE POINT OF THIS FILE.
# `rl/search/tree.py` now reports, on EVERY decision and every decide rule:
#     tree/kl_pi_prior   how far the visit distribution has moved from the prior
#     tree/pi_top1       the visit concentration (90.9% was measured once by hand)
# ^^ WITHDRAWN 2026-09-19 (RESULTS §32): the 90.9% was ONE smoke decision. Measured over 1,107 searched decisions at iters 100 (results/tree_budget_r5/bs1.json): pi_top1 0.417 vs the prior's 0.885, KL 5.70 nats -- pi' is far FLATTER than the prior.
#     tree/argmax_moved  UNGATED -- whether the search HAS an opinion, which is a
#                        different question from whether a margin let it act
# Those are per-DECISION quantities with ~1,300 samples in a 40-battle arm, so
# phase S measures the MECHANISM to a precision a win rate could not reach at
# n=4,375. **If KL does not rise with iters, the budget is not the lever and the
# expensive rungs never run.** That is IDEAS 4.9's falsifier doing double duty:
# a tree whose visit distribution is its own prior is nearly the greedy policy,
# and it also has nothing to teach an expert-iteration loop.
#
# NO WIN RATE FROM PHASE S IS A READ. n=40 carries se 0.079.
#
# PHASE R IS CONDITIONAL AND DELIBERATELY UNWRITTEN. Which budget it runs, and
# whether it runs at all, is decided by phase S against the rule below -- not by
# a win rate, and not by a preference.

