usernames:
  scheme: "ch5c1<armid><role>, role in {seat, fp}, arm ids lowercase; rerun pairs suffix the ARM ID (t104b), never the role. FULL-STRING distinct and NO name a prefix of any other, asserted (with every name issued in ch5_r1_offsh.yaml and ch5_r2_offsh.yaml) by tests/test_ch5_100m_offfp_prereg.py."
  never_reuse: [c4, r4anchor, ch3, ch4, ch5r1, ch5r2]
  pairs:
    T104: {seat: ch5c1t104seat, fp: ch5c1t104fp}
    T112: {seat: ch5c1t112seat, fp: ch5c1t112fp}
    T120: {seat: ch5c1t120seat, fp: ch5c1t120fp}
  rerun_pairs:
    T104: {seat: ch5c1t104bseat, fp: ch5c1t104bfp}
    T112: {seat: ch5c1t112bseat, fp: ch5c1t112bfp}
    T120: {seat: ch5c1t120bseat, fp: ch5c1t120bfp}

