# =====================================================================
# CH5 100M PRIMARY — RUNNER-FACING SPEC (ops file, NOT a new pre-reg).
# AUTHORITY: configs/showdown_sp_100m.yaml (RATIFIED 2026-09-01) — the
# PRIMARY READ is frozen there: pooled off-FP@20 greedy, FINAL vs FINAL,
# each T lane's completion checkpoint (>=1e8 crossing rung), n=3000/lane,
# GREEDY seat (R2-r9 protocol), serial k=1, no co-scheduling; delta =
# pooled_T - 0.4745556; equal-weight mean of per-seed finals. This file
# adds ONLY what the wave/runner/seat need to execute that read:
# checkpoint paths+shas (the seat sha-asserts before loading), fresh
# username pairs, and the results_dir the grader reads. No cell, bar, n,
# aggregator, sidedness, comparator or barred sentence is (re)defined
# here; on any conflict the ratified header wins.
# Every FP@20 quote carries the budget name and the two standing
# disclosures (weakly-powered equivalence; flattering point estimate).
# Wave: scripts/ch5_100m_offfp_wave.sh (ch5_r2_wave.sh copied, deltas in
# its header). Grade: scripts/ch5_100m_grade.py.
# =====================================================================

results_dir: results/ch5_100m

checkpoints:
  s104: {path: runs/showdown_sp_100m_s104/ckpt_100000027.pt, sha256: 16a6f02064e4c71ddecec08122a60f2ba363cea237761c9cda01a1c2ce5914ff, step: 100000027}
  s112: {path: runs/showdown_sp_100m_s112/ckpt_100000008.pt, sha256: 2ec16fbf85a9046d360328e50cdee5c732d8529599aafa2215a2a56128abcbb3, step: 100000008}
