# WHY THIS EXISTS -- the one number Saturday's launch shape depends on, and
# it can be measured tonight for free.
#
# STATUS (2026-09-11) says "members SATURATE at 3; the monster run should buy
# STEPS", from three 2-member pairs vs ONE 3-member triple on one seed block:
# 0.78233 -> 0.81678 -> 0.82667. The review session found that read does not
# carry its weight: the same ENS3 object spreads 0.0147 across its three
# batches (0.82667 / 0.81467 / 0.82933), larger than the 2->3 gain (+0.0099);
# the 1-member point used s112 alone (0.78233) where the b0 singles mean is
# 0.78867, so the gains are +0.028 then +0.010; and the member added last was
# the weakest lane. A 4th-6th member at +0.01 each is not excluded. Against
# "buy steps": RESULTS s18 records the last doubling (50M -> 100M finals) at
# +0.024 off-FP (cell P3, NOT credited) and +0.009 vs SH, while three members
# bought +0.035 vs SH for free.
#
# The 4th, 5th and 6th members EXIST ALREADY: the R2 batch-50M finals
# (s66/s75/s83, ckpt_050000000.pt), 828-d objects the ch5_100m grade already
# compared to the 100M finals (vs SH 0.781/0.795/0.783 vs 0.791/0.800/0.797).
# Mixing horizons makes every extra member a slightly WEAKER one, so a gain
# here is a LOWER bound on what three more 200M members would buy, and a null
# here is not proof of saturation -- it is stated as such below.
#
# ARMS (vs SH, LOCKED protocol: deterministic, ties non-wins, 3000/chunk-set,
# seed window b = 100 + b*3000 exactly as search_s3_100m.yaml's ENS3 uses):
#   A50    greedy, FRESH, the three 50M finals, b0            (the 1-member point at 50M)
#   E350   ENS3 of the 50M finals, batches b0/b1/b2, n=9000   (the 3-member point at 50M)
#   E4     100M trio + s75 (strongest 50M single), b0         (4 members)
#   E5     100M trio + s75 + s66, b0                          (5 members)
#   E6MIX  100M trio + all three 50M finals, b0/b1/b2, n=9000 (6 members)
# Comparators, SAME session block, already on disk in results/search_s3_100m:
#   A0 (100M singles, b0) 0.78933 / 0.78233 / 0.79433, mean 0.78867
#   ENS3 b0/b1/b2 0.82667 / 0.81467 / 0.82933, pooled 0.82356
#
# THE READ, stated before any arm runs. DESCRIPTIVE, credits nothing, and the
# seeds do NOT pair battles (per-battle agreement between arms on shared seeds
# sits at the independence level, 0.66-0.73; teams and rolls are server-rolled)
# so every comparison is UNPAIRED with the two-proportion binomial se.
#   W1 members-at-100M curve: ENS3 (3) -> E4 -> E5 -> E6MIX (6), all on b0,
#      plus E6MIX pooled n=9000 vs ENS3 pooled n=9000 (se_diff ~0.0057).
#      E6MIX - ENS3 >= +0.025 and >= 2 se  -> members still pay at 3; the
#          monster buys WIDTH first (6 lanes), horizon second.
#      |E6MIX - ENS3| < 2 se               -> not resolvable with weaker
#          members; the 6-lane shape is still preferred because it costs
#          nothing Saturday can not afford (43 h at w6) and yields two
#          committees. This branch does NOT establish saturation.
#      E6MIX - ENS3 <= -0.025               -> weaker members HURT the pooled
#          prior; report, and prefer equal-strength members (all-200M).
#   W2 ensemble gain at 50M vs at 100M: (E350 - A50 mean) vs (ENS3 - A0 mean
#      = +0.0349). Equal gains -> members and steps are additive; a smaller
#      gain at 100M than at 50M -> they are substitutes and the horizon is
#      the weaker lever.
#
# DISCLOSURES: vs SH is the SATURATED axis (bare policy 0.78-0.79); every
# delta here is compressed by the ceiling and the off-FP twin
# (configs/eval/ens_width_offfp.yaml) is the axis with room. The clustered se
# is UNAVAILABLE for every ensemble arm by construction (one committee per
# arm), so the binomial governs -- anti-conservative, said up front.

