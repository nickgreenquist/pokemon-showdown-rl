env_id: Showdown-v0
seed: 35
total_steps: 50000000
eval_every: 250000
eval_episodes: 100
num_envs: 8
torch_threads: 1
checkpoint_every: 500000
run_name: showdown_sp_struct50m_s35
logger: wandb
eval_win_rate: true
selfplay:                # identical to showdown_sp_struct12m.yaml (D16a)
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 150
  latest_prob: 0.8
agent:
  algo: ppo
  trunk: entity_deepsets   # the credited Rung 2 treatment, unchanged
  trunk_kwargs:
    species_vocab: 152
    move_vocab: 166
    embed_dim: 64
    entity_dim: 128
    pool: max
    ctx_sizes: [384, 384]
    scorer_sizes: [256]
    value_sizes: [384, 384]
  hidden_sizes: [512, 512]   # unused when trunk != mlp; kept so a
