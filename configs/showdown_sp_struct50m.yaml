  lr: 2.5e-4
  lr_anneal_steps: 0       # declined lever — see NO NEW LEVERS
  gamma: 1.0               # Rung 1 nulled; signal NOT carried
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
