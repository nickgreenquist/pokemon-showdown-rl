# Phase 4 probe arm: PFSP — connect4_pool.yaml with the historical draw
# weighted by AlphaStar's f_hard(x) = (1-x)^p at p = 2 (their exponent),
# x = the learner's tracked win rate vs each member (0.5 prior, weights
# snapshotted at rollout boundaries). Reweights WITHIN the self-lineage:
# games concentrate on the snapshots the learner still struggles against
# instead of ones beaten 100% of the time. checkpoint_every 100000 per the
# chunk-4 method note (20-point vs-random curves). Everything else is the
# locked campaign config.
env_id: Connect4-v0
seed: 0
total_steps: 2000000
eval_every: 50000
eval_episodes: 400   # at 100 the se on eval/return_mean is 0.093 — rungs closer than ~120 Elo are a coin flip
num_envs: 8
torch_threads: 1     # measured 3.9x faster than torch's default on this env
checkpoint_every: 100000  # probe arms: 20-point curves (chunk-4 method note)
run_name: connect4_pool_pfsp_s0
logger: wandb
eval_win_rate: true
selfplay:
  opponent: self
  eval_opponent: heuristic
  pool_size: 20
  push_every_updates: 20
  latest_prob: 0.8
  pfsp_power: 2.0     # THE lever: f_hard(x) = (1-x)^2 over the historical draw
agent:
  algo: ppo
  hidden_sizes: [128]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128  # 8 envs x 128 = 1024 per update -> ~1953 updates at 2M
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
