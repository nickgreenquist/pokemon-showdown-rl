# REINFORCE on CartPole: the Phase 2 on-ramp — the policy-gradient core
# (score-function estimator, reward-to-go, normalized returns) in isolation
# before PPO adds GAE + clipping + vectorization. Per-episode updates, no
# critic, no replay. Pipeline proof, not a benchmarked milestone.
env_id: CartPole-v1
seed: 0
total_steps: 150000
eval_every: 5000
eval_episodes: 20
run_name: cartpole_reinforce
device: cpu
logger: wandb
agent:
  algo: reinforce
  hidden_sizes: [64, 64]
  lr: 1.0e-3
  gamma: 0.99
