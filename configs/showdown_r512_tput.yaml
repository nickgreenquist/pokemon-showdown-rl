# Throughput probe — full-loop lane scaling (2026-08-04 throughput session).
# NOT a science run: no pre-registered read, no verdict, nothing credited.
# The only output is time/steps_per_sec per lane.
#
# Needs the local Showdown server running:
#   cd showdown && node pokemon-showdown start --no-security
#
# Why it exists: measurement (c) prices COLLECTION only, at [64,64] with no
# learning updates, in decisions/s. The session's goal is stated in TRAINING
# steps/s (restore >=685 per run at 3-wide, vs the 587 observed), which only
# a real rl.train loop at [512,512] can measure. This is showdown_r512.yaml
# with total_steps cut to 150k and nothing else touched, so the resulting
# steps/s is directly comparable to the 587/685 figures on record.
#
# Launched W-wide concurrently (--seed / --run-name per lane) against the
# SHARED server, now running simulator: 4 in showdown/config/config.js —
# the one-line lever that replaced the planned server-per-lane change
# (measured 2026-08-04: shared 9,233 dec/s at W=4 vs 7,341 for one server
# per worker at simulator: 1; plateau at W=6-8, turns over by W=12).
#
# Run dirs runs/showdown_tput_w*_s* are disposable — delete after the read.
env_id: Showdown-v0
seed: 0
total_steps: 150000
eval_every: 100000
eval_episodes: 100
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_tput_w3_s0
logger: wandb
eval_win_rate: true
selfplay:
  opponent: heuristics
  eval_opponent: heuristics
agent:
  algo: ppo
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 512
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
