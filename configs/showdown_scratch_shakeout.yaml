# Run-3 shakeout: the from-scratch recipe at 500k, 3 seeds CONCURRENT
# (Stage-0 pattern) — the last gate before the 12M overnight, and the
# FIRST measurement of the random-init regime on Showdown (throughput,
# episode profile and tie rate were all unmeasured before this; the
# no-overnight-on-unmeasured-throughput rule applies).
#
# Pass gates (pre-registered, 2026-08-01 run-3 design session) — ALL must
# hold or the overnight does not launch; bands are judgment bands, the
# regime is new:
#   - steps/s >= 500 per run at 3-wide (warm-SP precedent 552-554; the
#     12M wall estimate is RECOMPUTED from the measured value — mtime
#     read, meta.yaml -> checkpoint.pt);
#   - loss/entropy declining from ln 10 ~= 2.30, <= 1.8 at 500k, and
#     >= 0.3 (no-learning and instant-collapse both fail);
#   - training tie fraction <= 8% and mean rollout/episode_length <= 60
#     (random-play regime: looser than run-1's gates on purpose — these
#     catch degeneracy, not style);
#   - selfplay/pool_size reaches 4 (step-0 anchor + 3 pushes at cadence
#     150 by update ~488);
#   - selfplay/winrate_anchor >= 0.55 by 500k on >= 2 of 3 seeds (the
#     learner vs its own random init — any learning at all shows here
#     first).
# MUST run in the maintainer's terminal.
env_id: Showdown-v0
seed: 0
total_steps: 500000
eval_every: 100000
eval_episodes: 100
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_scratch_shakeout_s0
logger: wandb
eval_win_rate: true
selfplay:
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 150
  latest_prob: 0.8
agent:
  algo: ppo
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  lr_anneal_steps: 0
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
