# WHAT IS COMMON ACROSS THE ARMS, AND WHAT IS NOT [V2-12]. An earlier draft
# said "the engine draws a fresh battle seed per battle", which reads as if
# the battle stream diverged between arms. IT DOES NOT.
# engine/pkmn_gen1/src/env.rs:968-980 draws
#   battle_seed = splitmix64(lane_seed * PHI ^ battle_counter)
#   team pair   = splitmix64(battle_seed ^ 1) % bank.pairs()
# — a function of (lane_seed, battle_counter) and NOTHING ELSE, so at a
# given battle index both arms play the SAME battle seed off the SAME team
# pair from the SAME bank, and both arms run ~1,015 battles per update.
# THE BATTLE AND TEAM STREAM IS COMMON. What diverges is (a) the torch
# stream, from the first poll, because an 8-row forward and a 256-row
# forward consume different call counts and shapes, and (b) the self-play
# pool's member-draw offset, since draws happen per battle START and the
# start cadence differs.
# NO CRN CREDIT IS TAKEN AND THE PRIMARY READ IS UNPAIRED. This is recorded
# so that nobody later reads the seed reuse as a paired estimator and
# quietly narrows the interval: the aggregator is written as the
# equal-weight mean of the three PER-SEED SIGNED DELTAS, which is
# ARITHMETICALLY IDENTICAL to the difference of the two arms' equal-weight
# means, and the unpaired se_diff is the one quoted. A-1's refutation of
# pairing on these seeds stands and is not re-litigated (+0.856 on the
# endpoint, -0.996 on the AUC).
# ALSO COMMON, AND ALSO NOT CREDITED: both arms evaluate at seed_start 100,
# so the EVAL side has common random numbers across arms. That makes the
# unpaired se_diff CONSERVATIVE rather than wrong, and no credit is taken
# for it either.
