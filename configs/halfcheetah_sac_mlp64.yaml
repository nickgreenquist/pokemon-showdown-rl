
# SAC on HalfCheetah-v5 with PPO'S ARCHITECTURE — the Phase 3 ablation arm.
#
# Identical to configs/halfcheetah_sac.yaml except the network: 64x64 Tanh,
# which is what our PPO runs, instead of SAC's reference 256x256 ReLU. The
# question it answers is "would matching PPO's architecture have changed the
# conclusion", so the arm is PPO's architecture WHOLE — deliberately not
# decomposed into a width x activation 2x2, which would answer a different and
# less useful question. Three seeds, like every other benchmark claim here.
#
# LIMITATION, to be stated wherever the number is reported: one environment.
# The finding is "on HalfCheetah, architecture accounts for X of the gap", not
# anything general.
#
# Pre-registered so a small gap is not read as a misconfigured ablation: the
# closest published predictor (Henderson et al. 2017, HalfCheetah, DDPG) has
# 64x64 tanh at 5325 +/- 281 BEATING 64x64 ReLU at 4198 +/- 606 and within ~5%
# of 400x300 ReLU; SimBa (2024) finds actor-width scaling "tends to reduce
# performance" without regularization. A small gap is the published-consistent
# outcome.
#
# ~22 min solo at the measured 759 steps/s, vs ~39 for the 256x256 arm.
env_id: HalfCheetah-v5
seed: 0
total_steps: 1000000
eval_every: 50000
eval_episodes: 10
run_name: halfcheetah_sac_mlp64
device: cpu
normalize_obs: false
normalize_reward: false
logger: wandb
agent:
  algo: sac
  hidden_sizes: [64, 64]  # PPO's architecture, the whole point of this arm
  activation: tanh
  q_lr: 1.0e-3              # also the temperature optimizer's lr
  policy_lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  buffer_capacity: 1000000
  learning_starts: 5000     # uniform random actions until here
  policy_frequency: 2
  target_network_frequency: 1
  autotune: true            # target entropy is -act_dim, derived not configured
  alpha: 0.2                # unused while autotune is true
