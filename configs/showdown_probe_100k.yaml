# Stage-0 free-lever probe (pre-registered in the 2026-07-30 async-review
# entry): does the shared server + machine sustain N concurrent training
# runs without material steps/s degradation? Decides whether the async
# vec-env branch stays shelved, and unlocks 3-seed lever reads.
#
# The 512 campaign recipe at 100k steps, timing-only: evals suppressed
# (eval_every > total_steps), no mid-run checkpoints; steps/s is read from
# meta.yaml -> checkpoint.pt mtimes. logger tensorboard, NOT wandb: 2026-07-24
# recorded concurrent wandb-offline inits hitting service-startup timeouts
# and leaving stub run dirs.
# MUST run in the maintainer's terminal (CLAUDE.md >5-min rule exists
# because Claude-tooling launches measured 10x slower on a prior project —
# fatal to a throughput measurement even if a run fits in 2 min).
env_id: Showdown-v0
seed: 0
total_steps: 100000
eval_every: 200000
eval_episodes: 10
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: probe_solo
logger: tensorboard
eval_win_rate: true
selfplay:
  opponent: heuristics
  eval_opponent: heuristics
agent:
  algo: ppo
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
