# PPO on Pendulum-v1 — the continuous track's sanity gate, this track's
# equivalent of what CartPole was for chunk 3. Cheap enough to run before any
# MuJoCo compute is spent, and it exercises every new code path: the Gaussian
# policy, both normalizers, ClipAction, and the checkpointed statistics.
#
# GATE, stated up front so a weak result is not mistaken for a bug: eval return
# comfortably clear of the ~-1200 random baseline and still improving. NOT
# "solved". The only published PPO-Pendulum number (-172, SB3 RL-Zoo) comes
# from a config tuned specifically for this env — gamma 0.9, lr 1e-3, gSDE —
# whereas this file deliberately runs the shared MuJoCo recipe at gamma 0.99.
# Pendulum under gamma 0.99 is known to be tuning-sensitive for PPO; chasing
# -172 here would repeat the chunk-4 afternoon spent proving a mis-tuned
# learning rate was not a code bug.
#
# Numbers are the halfcheetah_ppo.yaml recipe unchanged apart from the budget,
# so the gate tests the recipe we are about to benchmark rather than a
# different one.
#
# RESULT 2026-07-26 (seed 0): gate passed with room to spare — eval climbs
# -1074 -> -109 over the 150k budget, and the de-biased 100-episode re-eval of
# the final checkpoint reads -136.2 +/- 91.7. That lands better than the tuned
# RL-Zoo reference above despite gamma 0.99, so the conservative gate language
# was not needed here. All health bands green: policy_std 0.99 -> 0.62 (no
# early collapse), approx_kl <= 3.5e-3, value loss settling at ~2e-3 in scaled
# reward units, and training return logged in raw units throughout.
env_id: Pendulum-v1
seed: 0
total_steps: 150000
eval_every: 10000
eval_episodes: 10
run_name: pendulum_ppo
device: cpu
num_envs: 1  # CleanRL's continuous recipe; see halfcheetah_ppo.yaml
normalize_obs: true
normalize_reward: true
logger: wandb
agent:
  algo: ppo
  hidden_sizes: [64, 64]
  lr: 3.0e-4
  lr_anneal_steps: 150000  # linear to ~0 over the full budget
  gamma: 0.99
  gae_lambda: 0.95
  rollout_steps: 2048
  epochs: 10
  minibatches: 32
  clip_eps: 0.2
  entropy_coef: 0.0  # exploration rides on the learned log_std, not a bonus
  value_coef: 0.5
  max_grad_norm: 0.5
