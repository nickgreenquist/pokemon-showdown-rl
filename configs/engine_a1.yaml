# ---------------------------------------------------------------------
# THE FIVE PRE-REG RULES THE D25/D25-P CYCLE PAID FOR
#  1. ACROSS-LANE AGGREGATOR, NAMED: the EQUAL-WEIGHT MEAN of the three
#     per-seed win rates (the R2/G9 aggregator), on BOTH sides, for BOTH
#     primary reads. Never a battle-weighted pool, never a subtraction.
#  2. NO UNNAMED CELLS: the partitions in ACTION ON EACH BRANCH are
#     exhaustive and every boundary is assigned explicitly.
#  3. DOSE MATCHED, AND HOW WE'D KNOW: see DOSE above.
#  4. CREDIT LINE RESTATED VERBATIM: see (A); and why it does not apply.
#  5. WHICH SIDE EACH BAND READS: every band below is TWO-SIDED on the
#     SIGNED delta (engine minus banked-async), and the sign is reported
#     on every branch including PASS. A one-sided read is barred: an
#     engine arm that is BETTER than the Node arm is as much a parity
#     failure as one that is worse.
#
# ---------------------------------------------------------------------
# R0 SANITY GATES (first 200k steps of each lane; kill the fleet on breach)
#   - loss/entropy in [1.3, 2.0]  (G9's re-based band; the control's own
#     first-250k runs 1.81 -> 1.57).
#   - loss/clip_frac != 0.0 on every update (recorded-old_logp liveness).
#   - aux/illegal_label_frac == 0 AND aux/frame_collision_frac == 0 (the
#     D25 hard gates, fed by the engine's (kind, id, flags) label seam).
#   - aux/label_present_frac within [0.74, 0.88] over the first 250k
#     (G9's re-based R0-7 band; the un-rebased [0.78, 0.88] would have
#     false-killed s83 at 0.757).
#   - eval/win_rate present and in (0, 1).
#   - collect/policy_version_lag_p99 <= 1; breach = 3 CONSECUTIVE rollouts.
#   - NEW, AND OWED TO AN ASYMMETRY IN THE INSTRUMENT: eval/no_outcome
#     == 0 on EVERY A-1 eval. 07f587d relaxed rl/common/evaluation.py from
#     raising on any missing outcome to raising only when
#     missing*2 > len(outcomes), scoring a minority as non-wins. The
#     banked JSONs were produced under the OLD all-or-nothing guard, so
#     their missing == 0 is proven by the fact they completed; the engine
#     arm runs under the new code, where a silent 1% no-outcome rate is a
#     -0.01 bias, 40% of the band. This gate restores the symmetry.
#   - THE TEAM-BANK GATE: the bank file A-1 uses must hold >= 1,000,000
#     pairs and its sha256 is stamped in every lane's meta.yaml. WHY: the
#     engine draws with replacement from a fixed bank, the Node arm rolls
#     fresh teams server-side and effectively never repeats, and eval is
#     on the server with fresh teams — so a small bank reads the engine
#     agent OUT OF DISTRIBUTION, with expected sign NEGATIVE. At 12M and
#     Lbar 30.2 a lane runs ~397,351 battles: a 50,000-pair bank recurs
#     7.95x per lane and 23.84x fleet-wide (12.6% of battles use an
#     unseen pair), while 1,000,000 pairs recur 0.40x per lane and leave
#     82.5% of battles on an unseen pair. The plan pre-decides that a
#     NEGATIVE delta outside the band means the I1/I2 projection leaks —
#     which would send diagnosis to the wrong place — so bank recurrence
#     is named FIRST in the negative-delta diagnosis order below.
#
# ---------------------------------------------------------------------
# PRIMARY READS (co-primary; BOTH must hold for a PASS)
#
# P-END — THE ENDPOINT, and the JOURNEY's own gate.
#   Each engine lane's 12M crossing rung under the LOCKED EVAL PROTOCOL:
#   n = 3000/seed, seed_start 100, deterministic policy, vs
#   SimpleHeuristicsPlayer, ties as non-wins, scripts/eval_checkpoint.py.
#   Aggregator: equal-weight mean of the three per-seed win rates.
#   READ: signed D_END = pooled_E - 0.67211.
#   PASS: |D_END| < 0.025.
#   ESTIMATOR, NAMED (CLAUDE.md: "name the across-lane aggregator ... say
#   which side each band reads"): the band is a FIXED MAGNITUDE — the
#   maintainer's, quoted verbatim above — so the pass rule does not depend
#   on an se at all. se_diff enters only the DISCLOSED POWER, and the se
#   quoted there is the UNPAIRED TWO-FLEET se_diff, the LARGER of the
#   pooled-binomial se_diff and the seed-clustered se_diff computed from
#   the per-seed finals at read time. This is a DEVIATION, disclosed:
#   JOURNEY 7.5 and PKMN_ENGINE_RUST_PLAN.md:1109 both read the band
#   against the banked 0.67211 as if it were KNOWN (se 0.0078, band 3.2
#   se), which understates uncertainty by ignoring the baseline's own
#   3-seed spread. The PASS RULE is unchanged by this; only the honesty of
#   the power statement is. RW-3.
#
# P-AUC — THE CURVE, and the reason a single endpoint is not enough.
#   AUC_lane = the mean of eval/win_rate over the 48 in-loop rungs at
#   250k...12.0M in that lane's history.csv (eval_every 250000,
#   eval_episodes 100, eval_opponent heuristics). Arm statistic: the
#   equal-weight mean of the three lane AUCs. Read UNPAIRED.
#   BANKED BASIS, from the same six runs, computed and re-checked this
#   session: async 0.6592/0.6340/0.6448 -> 0.64597 (sd 0.01265);
#   sync 0.6212/0.6427/0.6319 -> 0.63194 (sd 0.01073); pooled AUC sd
#   0.01173 on 4 df -> unpaired 2*se_diff = 0.01915.
#   READ: signed D_AUC = AUC_E - 0.64597.  PASS: |D_AUC| < 0.025.
#   WHY IT IS A REAL GATE AND NOT DECORATION: averaging 48 rungs collapses
#   the per-rung binomial se from 0.0283 to ~0.0041, leaving almost pure
#   seed variance, so the AUC is TIGHTER than the 3000-battle endpoint
#   (2*se_diff 0.01915 vs 0.02447) at ZERO extra cost — the rungs are
#   already banked on both sides. Both arms' in-loop evals go through
#   make_eval_env to poke-env against the Showdown server, so the overlay
#   is on ONE instrument.
#   TWO DISCLOSURES IT OWES: the AUC's seed pairing ANTI-correlates
#   (rho -0.996; see (A)), so it is read unpaired and no pairing credit is
#   taken; and it shares P-END's engine-trained/server-evaluated transfer
#   confound, so it buys power against noise but NOT independent evidence
#   about learning.
#   NOT A GATE, descriptive only: the max |per-rung pooled delta| and the
#   rung at which it occurs. At n=100 the two BANKED arms already spread
#   -0.0967 to +0.1167 per rung, so eyeballing 48 rungs finds a
#   "divergence" every time. It is reported and never graded.
#
# SECONDARY (descriptive, no gates, cannot change the verdict):
#   - per-seed D_END and D_AUC with signs (net init is matched lane-for-
#     lane; interpretable for diagnosis, NOT a paired estimator).
#   - rollout/episode_length trajectory vs the banked lanes at matched
