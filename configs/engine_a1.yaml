#   wins_from_returns exists only as the cross-check; the two must agree.
#   TWO PROTOCOL DEVIATIONS, DISCLOSED [R1-S11]: this reads an INTERMEDIATE
#   RUNG, not the locked protocol's "final checkpoint" (it is the rung G9
#   read, and the only one the banked arm has); and it pools 3x3000, not the
#   5x3000 every arm from D23 on has used (5 seeds do not exist on the
#   baseline side — see the exhaustiveness sweep).
#   ESTIMATOR, NAMED (CLAUDE.md: "name the across-lane aggregator ... say
#   which side each band reads"): the band is a FIXED MAGNITUDE — the
#   maintainer's, quoted verbatim above — so the pass rule does not depend
#   on an se at all. se_diff enters only the DISCLOSED POWER, and the se
#   quoted there is the UNPAIRED TWO-FLEET se_diff, the LARGER of the
#   pooled-binomial se_diff and the seed-clustered se_diff computed from
#   the per-seed finals at read time. This is a DEVIATION, disclosed:
#   JOURNEY 7.5 and PKMN_ENGINE_RUST_PLAN.md:1238 both read the band
#   against the banked 0.67211 as if it were KNOWN (se 0.0078, band 3.2
#   se), which understates uncertainty by ignoring the baseline's own
#   3-seed spread. The PASS RULE is unchanged by this; only the honesty of
#   the power statement is. RW-3.
#
# P-AUC — THE CURVE, and the reason a single endpoint is not enough.
#   SCOPE CHANGE, UNRATIFIED [R1-M8]. JOURNEY 7.5 names ONLY the endpoint.
#   Making the AUC co-primary can FAIL a run the JOURNEY's own wording would
#   PASS — a TIGHTENING, not a loosening, and therefore the maintainer's.
#   UNTIL RW-8 IS ANSWERED, P-AUC IS SECONDARY-DESCRIPTIVE: the verdict is
#   P-END alone and the A1-SPLIT branch does not exist. What follows
#   describes what P-AUC WOULD be if RW-8 promotes it.
#   AUC_lane = the mean of eval/win_rate over the 48 in-loop rungs at
#   250k...12.0M (eval_every 250000, eval_episodes 100, eval_opponent
#   heuristics), read from that lane's history.csv if the lane NEVER
#   RESUMED and from history_merged.csv (scripts/merge_history.py) if it
#   did [R1-M4]. A resume SPLITS the wandb history into two offline runs
#   with overlapping steps and extract_history.py then HARD-FAILS, so
#   history.csv does not exist for a resumed lane (docs/landmines.md:268-283).
#   The merge is VERIFIED before the read: segments == resumes + 1 from
#   meta.yaml, _step monotone, and the eval-row COUNT equal to the banked
#   lanes' 48. A lane whose merged history yields a count != 48 is REPORTED
#   and re-extracted; it is never graded on a different denominator.
#   FIRST VERDICT-GRADE USE OF A HISTORY READ IN THIS REPO.
#   docs/landmines.md:282 records that "the verdict path never reads
#   history ... so a mishandled merge corrupts curves and readouts, not the
#   credit decision." P-AUC removes that margin — part of what RW-8 is being
#   asked to accept, and a reason it may be declined. The banked side is
#   unaffected: all three async lanes have one offline run and no resumes. Arm statistic: the
#   equal-weight mean of the three lane AUCs. Read UNPAIRED.
#   BANKED BASIS, from the same six runs, computed and re-checked this
#   session: async 0.6592/0.6340/0.6448 -> 0.64597 (sd 0.01265);
#   sync 0.6212/0.6427/0.6319 -> 0.63194 (sd 0.01073); pooled AUC sd
#   0.01173 on 4 df -> unpaired 2*se_diff = 0.01915.
#   READ: signed D_AUC = AUC_E - 0.64597.  PASS: |D_AUC| < 0.025.
#   WHY IT IS A REAL GATE AND NOT DECORATION: averaging 48 rungs collapses
#   the per-rung binomial se from 0.0283 to ~0.0041, leaving almost pure
#   seed variance, so the AUC is TIGHTER than the 3000-battle endpoint
#   (2*se_diff 0.01915 vs 0.02447) at ZERO extra cost — the rungs are
#   already banked on both sides. Both arms' in-loop evals go through
#   make_eval_env to poke-env against the Showdown server, so the overlay
#   is on ONE instrument.
#   TWO DISCLOSURES IT OWES: the AUC's seed pairing ANTI-correlates
#   (rho -0.996; see (A)), so it is read unpaired and no pairing credit is
#   taken; and it shares P-END's engine-trained/server-evaluated transfer
#   confound, so it buys power against noise but NOT independent evidence
#   about learning.
#   NOT A GATE, descriptive only: the max |per-rung pooled delta| and the
#   rung at which it occurs. At n=100 the two BANKED arms already spread
#   -0.0967 to +0.1167 per rung, so eyeballing 48 rungs finds a
#   "divergence" every time. It is reported and never graded.
#
# SECONDARY (descriptive, no gates, cannot change the verdict):
#   - per-seed D_END and D_AUC with signs (net init is matched lane-for-
#     lane; interpretable for diagnosis, NOT a paired estimator).
#   - rollout/episode_length trajectory vs the banked lanes at matched
#     steps; loss/entropy, loss/approx_kl, loss/explained_variance overlays.
#   - collect/policy_version_lag_p99 and the realized in-flight carry.
#   - THE PLAN NAMES off-FP@20 AS A SECONDARY (PKMN_ENGINE_RUST_PLAN.md:1238)
#     AND IT IS DROPPED, WITH A REASON [R1-S12]: A-1 credits nothing, lands
#     no README row and is not a headline-grade result, so CLAUDE.md's anchor
#     battery does not fire. An FP@20 leg would cost ~7.75 h of server time
#     to describe an instrument. If A-1 PASSES and a later gen-1 headline is
#     produced on the engine path, THAT result carries the full battery.
#   - D-SYNC: the same two reads against the banked SYNC fleet
#     (0.64889 endpoint, 0.63194 AUC). Reported because an engine arm
#     landing on the sync fleet rather than the async one is diagnostic
#     information the async-only read cannot show — see disclosure (2).
#
# ---------------------------------------------------------------------
# ACTION ON EACH BRANCH (exhaustive; boundaries assigned explicitly)
#   A1-PASS   |D_END| < 0.025 AND |D_AUC| < 0.025
#             -> the engine collector is ACCEPTED as the gen-1 training
#             default AT K = 8 (see K below). Both signed deltas are
#             recorded and travel forever (N-ENG). Merge is then a
#             maintainer decision, not an automatic consequence.
#   A1-SPLIT  exactly one of the two reads inside its band
#             -> NOT a pass. Enter diagnosis round 1. A split is
#             INFORMATIVE: endpoint-in/AUC-out points at a trajectory
#             difference that the endpoint happened to cross;
#             AUC-in/endpoint-out points at the rung, the anneal, or eval
#             noise. Report both signs.
#   A1-FAIL   both reads outside their bands
#             -> diagnosis round 1.
#   Boundaries: |D| exactly 0.025 reads as OUTSIDE (fails that leg).
#   THREE CELLS THE PARTITION WOULD OTHERWISE LEAVE UNNAMED [R1-S9]:
#     A1-VOID-K  fewer than 3 engine lanes reach the 12M rung -> the read is
#       DESCRIPTIVE ONLY and A-1 does not decide the switch. k<=2 cannot
#       carry a 3-seed aggregator, and re-running one lane to fill the gap
#       makes the arm a mixed-provenance fleet. Report and relaunch.
#     A1-R0      an R0 breach kills the fleet. A relaunch after an R0 fix
#       does NOT consume one of JOURNEY's two diagnosis rounds: the rounds
#       are for a COMPLETED read outside the band, never for a fleet that
#       produced no read.
#     A1-RUNG    a lane whose crossing rung is more than one update (30,720
#       steps) off 12,000,000 is still GRADED, at its realized step, with
#       that step disclosed beside the number. Beyond 250,000 steps (one
#       eval interval) it is A1-VOID-K instead — that is a different dose,
#       not an overshoot.
#
#   DIAGNOSIS ORDER, PRE-COMMITTED (JOURNEY allows TWO rounds), and
#   ordered by the sign of D_END because the sign is informative:
#     if D_END < 0 (engine worse) — ORDERED BY COST TO TEST, because a
#     diagnosis round is scarce and only two exist:
#       1. I1/I2 projection leakage — re-run P-1/P-2 on tapes drawn from
#          the A-1 lanes' OWN decisions, not the banked corpus. Cheap, no
#          training, and it tests the hypothesis the plan itself
#          pre-decides for a negative delta.
#       2. the D25 label join (aux/label_present_frac vs the banked lanes')
#          and staleness / K. Also cheap.
#       3. TEAM-BANK SUPPORT — re-run one lane against a >= 5,000,000 pair
#          bank. LAST because it costs a whole 12M training lane, which is
#          exactly why the >= 1,000,000 bank is bought UP FRONT rather than
#          diagnosed into later. If RW-6 rules for the 50,000 bank this
#          moves to FIRST and a diagnosis round is spent on it.
#     if D_END > 0 (engine better — as much a failure as worse):
#       1. INFORMATION LEAK — the observation must be a function of what
#          poke-env could observe (invariant I1). Re-audit the encoder
#          against the information boundary, and the D18 privileged block
#          for an accidental live path.
#       2. team-bank memorisation (a small bank can flatter, not only
#          punish).
#       3. staleness / K.
#   AFTER TWO ROUNDS, VERBATIM FROM JOURNEY 7.5: "we KEEP the server path;
#   the sunk cost is then the parity harness, which survives as a test
#   suite." The gen-1 collector STAYS on Node, the port is NOT merged as
#   the training default, and steps 8-11 sit on the server path. This is
#   PRE-DECIDED and is not reopened by a near-miss.
#
# ---------------------------------------------------------------------
# K — DECLARED, NOT ASSUMED
# A-1 runs at k = 8, MATCHING the banked arm's collector.concurrency 8, so
# that the COLLECTOR IS THE ONLY DELTA. The engine's own default is 256
# (rl/train.py, configs/engine_smoke.yaml:62). At Lbar 30.2, K = 256
# carries ~3,866 collected-but-unfinished steps into the next batch —
# 12.6% of a 30,720-step update, against 0.39% at K = 8, a ~32x increase
# in off-policy carry — and the banked arm's own R0 gate was
# lag_p99 <= 1. Running A-1 at 256 would bundle a staleness treatment into
# "the collector" and make any delta unattributable.
# CONSEQUENCE, STATED PLAINLY: A-1 accepts the collector AT K = 8. It does
# NOT accept K = 256, and the production K is T-1(b)'s question. Any
# K > 8 needs its own read before it becomes the training default — a
# staleness read, not necessarily a win-rate fleet. RW-1.
# A K-MATCHED LANE IS PRE-NAMED as diagnosis round 1 if the maintainer
# rules A-1 to 256 instead (RW-1 branch b).
#
# ---------------------------------------------------------------------
# FLAG-GATED MECHANISMS THAT MUST BE OFF (a contaminated arm answers a
# different question, and the port carries three switches that would do it)
#   - BOTH-SEAT HARVEST (IDEAS 4.1): OFF. It changes the data
#     distribution per update and would be a second treatment. The
#     harvest/* metric names stay unemitted for A-1.
#   - D18 PRIVILEGED BLOCK (IDEAS 4.7): OFF, BY ABSENCE [R1-M1]. There is no
#     `collector.privileged` key — ENGINE_KEYS (rl/train.py:687) is strict and
#     a config carrying one is REFUSED outright ("unknown collector key(s)").
#     The real guard is `agent.privileged_dim`, left unset: rl/train.py:803-816
#     refuses collector.mode engine when it IS set, because the emitter exists
#     (BatchEnv(privileged=True)) but the seam into PPO does not, so a wide
#     critic would train on zeros.
#   - ENGINE SCRIPTED OPPONENTS: unused. selfplay.opponent is self, and
#     the eval opponent is the SERVER's SimpleHeuristicsPlayer — the
#     verdict denominator is never an in-engine reimplementation.
#   - D25 opponent-action labels stay ON (env_kwargs.opp_action true,
#     agent.aux_oppact_coef 0.1) because the banked arm has them; turning
#     them off would be the treatment.
# EVERY KEY BELOW THE collector BLOCK IS BYTE-IDENTICAL to
# configs/showdown_sp_batch50m_async.yaml (diff it). The keys that
# legitimately differ are exactly: collector.* , run_name, and
# env_kwargs.seat_tag (eval-seat naming, IDEAS 2.2 — needed because A-1
# reuses the banked arm's seeds; it touches no learning path).
#
# ---------------------------------------------------------------------
# N-ENG — THE NON-LEVER DECLARATION (the N-COLL precedent,
# configs/showdown_sp_100m.yaml:95-106)
# The engine collector is declared a NON-LEVER backed by A-1's null. Its
# SIGNED delta rides every gen-1 credit sentence produced on the engine
# path, forever, exactly as G9's +0.02322 does for async. A bare "A-1
# passed" is NOT an attribution. No gen-1 number ever pools across
# collectors, and any comparison that spans the switch names both deltas.
#
# BARRED LANGUAGE on every branch (no TOST is run): "equivalent",
# "identical", "no difference", "the same as the Node path", "validated".
# PERMITTED: "inside the band at |D| = x", "within +-k se_diff",
# "not distinguishable at this n and k", "screened, not equivalence-tested".
#
# WHAT A-1 CANNOT SAY, EVEN ON A PASS: nothing about behaviour at 100M+,
# which is the horizon the port exists to buy. A 12M null does not close
# an axis (the D18 vacating principle, IDEAS 2026-09-06). A-1 is
# nonetheless acceptable as the switch gate because the signed delta
# travels forever, no number pools across collectors, and the failure
# branch keeps the server path — not because 12M licenses the instrument.
#
# ENV, REQUIRED ON EVERY LANE AND EVERY EVAL [R1-M9]:
#   POKEMON_RL_ENCODER_V2=1 POKEMON_RL_ENCODER_IDS=1
# Process env vars read at import (rl/envs/showdown.py:118, :131); they are
# what makes OBS_DIM 828 — the banked arm's own stamp, which this header
# quotes. Without them the lane builds a different width and no checkpoint
# compares (CLAUDE.md's OBS_DIM landmine). scripts/engine_gates.sh exports
# both and refuses to launch if either is unset.
#
# OPS: launched ONLY by scripts/engine_gates.sh (D-1 -> T-1 -> A-1, order
# frozen, every unit skipped when its output exists, ELAPSED per unit,
# step 0 refuses while anything else owns the box or the server). Lanes
# are detached and resume-safe (--resume runs/<dir>). Distinct seeds
# across concurrent lanes (CLAUDE.md rule 2). Commit docs before
# launching; launch from a clean tree.
# THREE LANDMINES THIS FLEET IS EXPOSED TO [R1-S6]:
#   (a) A LANE CAN STALL ALIVE AT ZERO CPU — every pgrep passes forever.
#       Liveness is a CPU-TIME DELTA (`ps -o time=` twice, 15 s apart), never
#       a step count and never a process check. Recover with --resume.
#   (b) PROGRESS IS A RATE, and T-1 has not run, so no comparable s/battle
#       exists for the engine path yet. Until T-1 (c) lands, the liveness
#       read is the CPU delta plus a monotone `_step`; no ETA is quoted.
#   (c) RESOURCE GATES ARE CALIBRATED AT A FLEET WIDTH. A-1 is 3-wide and
#       carries a NEW resource profile (a 1M-pair bank is ~96 MB resident,
#       plus k battles); the launcher checks free RAM, free disk and a clean
#       tree before lane 1, and records the width beside any figure.
# SEAT NAMES ARE NOW DETERMINISTIC ACROSS A RESUME [R1-S7]. With
# env_kwargs.seat_tag set, a resumed lane reconnects under exactly the names
# it died with, and a mid-battle kill poisons a username pair for hours
# (docs/landmines.md:110-119). start_timer_on_battle_start defaults True
# (rl/envs/showdown.py:1348), which is what bounds it — the abandoned room
# ends and the seat frees. Do not remove the timer. The tag is NOT needed to
# avoid the banked lanes, which are finished; it is needed for RW-4 branch
# (b) and for any diagnosis lane run at the same seed.
# =====================================================================
env_id: Showdown-v0
seed: 66                   # lanes 2/3 via --seed 75 / 83
total_steps: 50000000      # the CONTROL'S OWN horizon; killed at the 12M rung
eval_every: 250000
eval_episodes: 100
num_envs: 8                # x rollout_steps = the 30,720-step update budget
torch_threads: 1
checkpoint_every: 500000
run_name: engine_a1_s66    # lanes 2/3 via --run-name
logger: wandb
eval_win_rate: true
collector:
  mode: engine             # THE TREATMENT
  k: 8                     # MATCHES the banked arm's concurrency 8 (see K)
  team_bank: data/engine/teams_a1_1000000.bin   # >= 1,000,000 pairs; sha stamped
  learner_seat: p1
env_kwargs:
  opp_action: true
  seat_tag: a1             # eval-seat naming only; A-1 reuses seeds 66/75/83
selfplay:
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 5
  latest_prob: 0.8
agent:
  algo: ppo
  trunk: entity_deepsets
  aux_oppact_coef: 0.1
  aux_label_space: l6
  aux_scorer_sizes: [96]
  aux_head_gain: 0.01
  aux_max_grad_norm: 0.5
  trunk_kwargs:
    species_vocab: 152
    move_vocab: 166
    embed_dim: 64
    entity_dim: 128
    pool: max
    ctx_sizes: [384, 384]
    scorer_sizes: [256]
    value_sizes: [384, 384]
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  lr_anneal_steps: 50000000   # == total_steps; the CONTROL'S schedule (anneal trap)
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 3840
  epochs: 4
  minibatches: 120
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
