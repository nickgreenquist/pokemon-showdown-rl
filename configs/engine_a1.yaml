# ---------------------------------------------------------------------
# (A) POWER — WHAT THIS GATE IS, AND WHAT IT IS NOT
#
# A-1 IS A GROSS-BREAKAGE SCREEN. It is NOT an equivalence test, and the
# words "equivalent", "identical" and "no difference" are BARRED on every
# branch (see BARRED LANGUAGE). No TOST is run.
#
# THE SIGMA THIS TURNS ON. docs/IDEAS_POST_100M.md §1 carries
# sigma_seed ~= 0.0617 at k=3. That number is measured AT THE 50M DOSE
# (RESULTS.md:1177, the 50M fleet off Foul Play @20, n=1000/lane, sd of
# 0.3960/0.3430/0.2730; its vs-SH twin at the same dose is 0.06295,
# SESSION_LOGS.md:8322). A-1's dose is 12M. Using a 50M-dose sigma to
# size a 12M gate is a dose mismatch, and it is the reason the band was
# briefly believed to be unusably loose.
#
# MEASURED sigma_seed AT 12M, pooling every 12M fleet in runs/ that
# carries a locked-protocol vs-SH final (11 fleets):
#   all 12M fleets            df 31   s = 0.03335   chi2 95% CI [0.0267, 0.0443]
#   flat-LR subset (8)        df 24   s = 0.03720
#   ANNEALED-LR subset (3)    df  7   s = 0.01349   chi2 95% CI [0.0089, 0.0275]
#   G9's two arms alone       df  4   s = 0.01499
# The LR schedule is the covariate, not the mean: corr(sd, mean) = -0.147,
# Bartlett across the 11 variances chi2 = 19.66 df 10 p = 0.033, and
# flat-vs-annealed is chi2 = 7.07 df 1 p = 0.0078, a 7.6x variance ratio.
# Binomial noise is 7.1% of the all-fleet spread at n=3000, so the spread
# is real seed variation, not eval noise.
#
# A-1's REFERENCE CLASS IS THE ANNEALED FAMILY. Both arms run the 50M
# anneal schedule and are killed at 12M (see DOSE), and two of the three
# annealed fleets ARE this recipe. PLANNING CONSTANT: sigma_seed = 0.01349
# on 7 df. The upper end of its own CI, 0.0275, is carried in every
# disclosure because that is where the band stops working.
#
# THE BAND IN se UNITS, k=3/arm, unpaired two-fleet (se_diff = sigma*sqrt(2/3)):
#   sigma    se_diff   |D|<0.025 is   P(fail | true D=0)   P(pass | true D=0.05)
#   0.01349  0.01101   2.27 se        0.023                0.012
#   0.01499  0.01224   2.04 se        0.041                0.021
#   0.02750  0.02245   1.11 se        0.266                0.132
#   0.03335  0.02723   0.92 se        0.359                0.176
#   0.06170  0.05038   0.50 se        0.620                0.242
# So at the reference-class sigma the band is 2.27 se_diff — the same
# FORM as the repo's own 2*se_diff rule — with a 2.3% false-alarm rate
# and 98.8% power against a 0.05 defect. THE BAND IS NOT WIDENED AND
# MUST NOT BE: at |D| < 0.05 a real 0.05 defect passes 50% of the time,
# which is the wrong trade for a screen whose entire job is catching
# silent breakage.
#
# WHAT AN EQUIVALENCE TEST WOULD COST (TOST, alpha .05 one-sided, power
# .80, delta 0.025), stated so the choice is priced rather than guessed:
#   sigma 0.01349 -> k >= 4/arm      sigma 0.02750 -> k >= 15/arm
#   sigma 0.03335 -> k >= 22/arm     sigma 0.06170 -> k >= 76/arm
# NOT RUN under this pre-reg. Buying it is RW-2.
#
# STANDING DISCLOSURE, rides every quote of this gate, all three parts:
#   (1) An equivalence test at this n is WEAKLY POWERED; A-1 is a screen.
#       At the upper end of its own 95% CI (sigma 0.0275) it fails a
#       truly-equivalent arm 26.6% of the time, and 35.9% if the annealed
#       family is not in fact A-1's reference class.
#   (2) The band CANNOT distinguish "matches async" from "matches sync".
#       An engine arm reproducing the SYNC fleet exactly lands at
#       |D| = 0.02322 — a PASS consuming 93% of the band — and G9
#       credited that same 0.02322 as the async collector's own effect.
#   (3) The baseline's own acceptance delta was +0.02322 = 2.11 se at the
#       reference-class sigma: an effect that missed the credit line only
#       on magnitude, never on precision. A-1 anchors on it anyway,
#       because the JOURNEY names that fleet as the reference.
#
# CREDIT LINE, VERBATIM (appears in this header exactly once, here):
# "a lever is credited iff pooled delta >= +0.025 AND >= 2*se_diff,
# where se_diff is the LARGER of the pooled-binomial se_diff and the
# seed-clustered se_diff, the latter computed from the per-seed finals
# at read time."
# IT DOES NOT APPLY TO A-1 AND CANNOT. That line answers "is there an
# effect"; A-1 asks whether a difference is ABSENT, which no credit rule
# can answer. It is restated so that its absence cannot be read as a
# waiver, and so that nobody later quotes A-1's PASS as a credit. A-1
# credits nothing, and the engine collector is a NON-LEVER whose signed
# delta travels forever (see N-ENG).
#
# NO PAIRING CREDIT IS TAKEN, AND THE SEED REUSE IS NOT A PAIRING CLAIM.
# Seeds 66/75/83 are reused so that network initialisation matches the
# banked arm lane-for-lane, which makes the per-seed SECONDARY read
# interpretable during diagnosis. It buys NO variance reduction and none
# is claimed. Across a Node arm and an engine arm only the net init is
# genuinely paired: --seed never reached the server on the Node path
# (rl/envs/showdown.py:26-28, :964-965 — the server rolls the teams), and
# the torch stream diverges from the first poll because call counts and
# tensor shapes differ between concurrency 8 and the engine's K. The
# banked runs refute the pairing directly: the SAME six runs imply a
# seed-pair correlation of +0.856 on the 12M endpoint and -0.996 on the
# 48-rung AUC, and on the AUC the paired se (0.01348) is WORSE than the
# unpaired one (0.00957). A structure that reads +0.86 and -1.00 on the
# same data is not a structure. BOTH primary reads are UNPAIRED.
#
