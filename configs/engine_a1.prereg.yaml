    findings: {must: 11, should: 11, nice: 5}
    verdict_before_fixes: >-
      "No" — would not let the gate decide an irreversible switch as drafted.
    applied: >-
      all MUSTs and the SHOULDs that change a number or a mechanism, tagged
      [R2-*] in place. Four were code defects, not prose: the R0 label gate
      named a metric on which two of the three BANKED lanes read outside the
      band (would have killed a perfect engine arm at its second update); the
      team-bank generator buffered all of node's stdout, ~1.4 GB at 1M pairs
      and ~7 GB at 5M, enough to OOM the box RW-6 was about to ask for; the
      >=1M floor was enforced nowhere in code; and the runner killed each lane
      on the checkpoint, which rl/train.py writes BEFORE that step's eval, so
      the 48th in-loop rung P-AUC needs would have been lost.
    design_change_it_forced: >-
      ~71% of the regime-matched sigma is EVAL-REPLICATE noise, not training
      seed variation, so A-1's precision is bought with battles rather than
      seeds. Both arms now read at n=12,000/seed — the banked arm re-evaluated
      from its own sha-pinned checkpoints — which takes the band from 2.04 to
      2.98 se_diff and the false-alarm rate from 4.1% to 0.3%, for eval time
      and no training.
    reversal_it_forced: >-
      RW-8's recommendation flipped from co-primary to secondary-descriptive:
      the AUC is WIDER than the endpoint on the async arm, which is the arm
      A-1 actually compares against.
