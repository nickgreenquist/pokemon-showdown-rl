# FACT 2 — ARM B's TARGET WAS WRONG, AND IS NOW FIXED (commit b147f48,
#   2026-09-10, found in the pre-launch review BEFORE any lane started).
#   The head regressed `flat_targets`, the GAE(lambda) target. At gamma 1
#   with a terminal-only reward that decomposes EXACTLY as
#       target_t = lam^(N-1-t) * z + (1-lam) * sum_k lam^(k-1) V(s_{t+k})
#   so at the production lambda of 0.95 over a ~34-decision episode only
#   ~0.47 of the head's target mass (step-weighted) was the GAME'S OUTCOME
#   and ~0.53 was the ORDINARY NON-PRIVILEGED CRITIC'S OWN OUTPUT — ~0.82 of
#   it at the FIRST DECISION of a battle, which is exactly where the
#   privileged block carries the most information. THE HEAD EXISTED TO BEAT
#   THAT CRITIC AND WAS BEING TRAINED TO AGREE WITH IT. It now regresses the
#   MONTE-CARLO RETURN on both drivers.
#   THE VERDICT METRIC IS THEREFORE `priv_eval/ev_mc_advantage` — the head's
#   EV minus the critic's EV, BOTH against the outcome, computed on the same
#   batch in the same pass (rl/agents/ppo.py:1638-1653).
#   `priv_eval/explained_variance` IS A DIAGNOSTIC AND NEVER A VERDICT
#   INPUT: it scores the head against a target that is ~53% the critic's own
#   output, which FLATTERS THE HEAD BY CONSTRUCTION. Quoting it as the arm's
#   read would be scoring a contestant against a scorecard half-written by
#   its opponent. The companion keys `priv_eval/explained_variance_mc` and
#   `priv_eval/critic_ev_mc` are the two halves of the verdict metric and
#   are reported beside it.
