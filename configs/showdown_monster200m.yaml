# ---- ARM B (the head): P-BEV's THREE CELLS, EXHAUSTIVE -----------------
#   B-EV-POS    `priv_eval/ev_mc_advantage` lane-mean > 0 on EVERY lane.
#               The privileged view fits the outcome better than the
#               ordinary critic does, at 100M, on real rows. That is the
#               precondition for the deferred search read and it is banked
#               as such. IT IS NOT A WIN-RATE CLAIM and may never be quoted
#               as one.
#   B-EV-NEG    lane-mean < 0 on EVERY lane. The privileged view fits the
#               outcome WORSE. A finding about the block, and the strongest
#               available argument for NOT building the search seam.
#   B-EV-MIXED  otherwise (a lane at exactly 0.0 reads here). Reported with
#               all per-lane values and both EV halves.
#   P-BS IS NOT A CELL OF THIS RUN. There is no search seam; the read is
#   DEFERRED to its own pre-registration and the checkpoints carry the head
#   so it is recoverable at eval cost only.
#   P-ID IS NOT A CELL EITHER. It is an assertion: a single differing
#   element between a head-on lane's actor/critic and a same-seed control's
#   is an R0-CLASS EVENT that stops the fleet, not a result.
