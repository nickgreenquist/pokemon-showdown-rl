#   D-A  ANNEAL LIVENESS at the crossing rungs nearest >= 4M / 25M / 50M /
#        100M, every lane, all param groups: optimizer lr ==
#        2.5e-4 * max(0, 1 - basis/1e8), basis = the step of the last update
#        preceding the update being annealed. Breach -> STOP that lane.
#        ARM C AND ARM B ADD A GROUP EACH and the gate covers them: arm B's
#        priv_eval group runs at the CRITIC's lr and anneals with it.
#   D-B  THROUGHPUT: realized dStep/dWall over >= 30-min conforming windows
#        post-1M, never `time/steps_per_sec`. Expected 1,097 +- 15% at width
#        6 -> [933, 1262]; 1,387 +- 15% at width 3 -> [1179, 1595]. RECORD
#        below 0.90x expected; STOP-AND-INVESTIGATE below 0.70x sustained
#        over two windows. A WINDOW THAT STRADDLES STARTUP INVENTS RECORDS —
#        use the conforming window only.
#   D-C  AUX HEALTH every 5M: illegal == 0, collision == 0 (STOP that lane);
#        labelled_frac bin-mean in [0.65, 0.86] RECORD.
#   D-D  selfplay/winrate_anchor >= 0.75 by 4M each lane (STOP); RECORD
#        below 0.83.
#   D-E  MEMORY: per-lane peak RSS RECORD-ONLY at every D-B reading, NO
#        per-lane threshold at ANY width — that is the D-E landmine, and
#        this fleet changes width mid-run, so a per-lane line would fire on
#        the wave-2 lanes by design. RECORD any lane above 3.0 GB. The only
#        STOP is box-level: free+inactive < 2 GiB AND non-zero swapouts, 3
#        consecutive 5-min polls -> STOP ALL, disclose, resume after.
#        THIS FLEET'S MEMORY IS THE LEAST-MEASURED THING ABOUT IT (see (F))
#        and D-E is the instrument that catches it.
#   D-F  DISK: RECORD < 40 GiB free; STOP ALL < 20 GiB (a full disk corrupts
#        a checkpoint write). Re-based upward from the 100M pre-reg's
#        30/15 GiB because this fleet writes ~41 GB against that one's ~14.
#   D-G  LAG: RECORD lag_p99 >= 2 on any rollout; STOP that lane at p99 >= 2
#        for 3 consecutive rollouts. The update fence is what makes old_logp
#        exact.
#   D-H  THE STALL WATCH, AND IT IS NOT OPTIONAL. A lane can stall ALIVE at
#        ZERO CPU and every pgrep passes forever (twice in R2, ~10 h apart).
#        Liveness is a CPU-TIME DELTA — `ps -o time=` twice, 15 s apart —
#        never a step count and never a process check. Poll every 15 min per
#        lane. Recover with `--resume runs/<dir>`. A pgrep guard anchors on
#        `bin/python`.
#   D-I  THE BOX IS SHARED BY NINE LANES AND ONE SHOWDOWN SERVER. RECORD the
#        server's CPU-time delta at every D-B reading; a server that has
#        stopped advancing while lanes are evaluating is the orphaned-room
#        shape. Every connecting seat sends /timer on
#        (start_timer_on_battle_start, default True) and it is what bounds
#        an abandoned room — DO NOT REMOVE IT.
