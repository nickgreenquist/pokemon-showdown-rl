# ---------------------------------------------------------------------
# (G) THE FIVE PRE-REG RULES THE D25/D25-P CYCLE PAID FOR
#
#  1. ACROSS-LANE AGGREGATOR, NAMED: the EQUAL-WEIGHT MEAN of the three
#     per-seed win rates, on EVERY arm, for EVERY read, greedy and searched
#     alike. Never a battle-weighted pool; never a subtraction of pools.
#     A between-arm delta is the equal-weight mean of the three per-seed
#     win rates of one arm minus the equal-weight mean of the other's — and
#     because the seeds are shared it is numerically equal to the mean of
#     the three per-seed deltas. Both framings are the same number here;
#     the FIRST is the definition, so that a lane loss (which breaks the
#     pairing) does not silently change the estimator.
#  2. NO UNNAMED CELLS: section (K) partitions every read exhaustively and
#     assigns every boundary explicitly, including the void cells.
#  3. DOSE MATCHED, AND HOW WE'D KNOW: see (H).
#  4. CREDIT LINE RESTATED VERBATIM: immediately below, exactly once.
#  5. WHICH SIDE EACH BAND READS: stated per read in (I). Every between-arm
#     band is TWO-SIDED on the signed delta and the sign is reported on
#     every branch including the null ones; the CREDIT cell is the positive
#     side only, and a symmetric negative cell is named so that "not
#     credited" and "harmful" are never the same sentence.
#
# CREDIT LINE, VERBATIM (appears in this header exactly once, here):
# "a lever is credited iff pooled delta >= +0.025 AND >= 2*se_diff,
# where se_diff is the LARGER of the pooled-binomial se_diff and the
# seed-clustered se_diff, the latter computed from the per-seed finals
# at read time."
# Clustered formula: sqrt(s_arm^2/k_arm + s_cmp^2/k_cmp). BAR =
# max(0.025, 2*se_gov). It GOVERNS the two credit-seeking contrasts named
# in (I) — P-C and P-BS — and it governs nothing else in this file.
#
# THE MULTIPLICITY DISCLOSURE THIS RUN OWES, because it is the first gen-1
# fleet in this repo to read TWO credit-seeking contrasts against ONE
# control. No alpha adjustment is applied: the credit line is a fixed
# effect-size floor plus a 2*se_diff rule, not a p-value, and inventing a
# correction for it here would be a new rule written by a drafter. What is
# owed instead is the DISCLOSURE, and it rides every credit sentence this
# run produces: TWO credit-seeking contrasts were read against a shared
# control, so the family-wise probability of a false credit is higher than
# the single-contrast figure the credit line implies.
#
# ---------------------------------------------------------------------
# (G2) THE POWER PROBLEM, STATED BEFORE THE RUN RATHER THAN AT THE READOUT
#      — AND THE ONE RULING IT RAISES [RWM-8]
#
# THE PRIMARY AXIS OF THIS PRE-REG IS vs-SH, per CLAUDE.md's anchor battery
# ("vs-SH ... the ONLY verdict input") and per the brief this file was
# drafted to. IT IS ALSO THE WEAKEST AXIS AVAILABLE AT THIS DOSE, and the
# repo has already measured why.
#
# THE ARITHMETIC, FROM configs/showdown_sp_100m.yaml:141-168 — the 100M
# pre-reg's own, not this drafter's: at p ~= 0.79 against p ~= 0.47, vs-SH
# needs ~1.56x MORE TRUE IMPROVEMENT to clear the same ABSOLUTE +0.025
# floor, because the same logit gain buys less probability near the tail.
# At a matched logit gain of 0.10 and a fixed sigma_seed of 0.008,
# P(credit) is 0.488 off-FP@20 against 0.067 vs-SH. That pre-reg concluded,
# verbatim: pre-registering vs-SH as a verdict axis "would pre-register a
# near-guaranteed failure sentence", and its ratification item E1 promoted
# off-FP@20 to the verdict axis FOR THAT ROUND ONLY, explicitly noting it
# "does not carry itself forward".
#
# WHAT THE BAR ACTUALLY IS HERE, COMPUTED IN ADVANCE so no letter-vs-rule
# gap can open at the readout. At p ~= 0.79, n = 3000/seed, k = 3:
#   pooled-binomial se per arm  = sqrt(0.79*0.21/9000)      = 0.00429
#   pooled-binomial se_diff     = sqrt(2) * 0.00429         = 0.00607
#   seed-clustered se_diff, at the banked 100M fleet's OWN measured vs-SH
#     seed sd of 0.00455 (results/ch5_100m/grade.json, s_T):
#                               = 0.00455 * sqrt(2/3)       = 0.00372
#   -> THE BINOMIAL GOVERNS, 2*se_gov = 0.01214 < 0.025, so BAR = 0.025.
# AND THE SEED SD IS A 2-df ESTIMATE. The 100M pre-reg's own multiplier
# table puts the 95% interval on sigma_seed at [0.521, 6.285] x s — a
# factor of 12. At the upper end (sigma 0.0286) the clustered se_diff is
# 0.0234, 2*se_gov = 0.0467, and CREDIT WOULD REQUIRE +0.047. So the bar
# this run faces is 0.025 if the seed spread is as tight as the 100M
# fleet's and up to ~0.047 if that fleet was lucky. BOTH NUMBERS ARE QUOTED
# WHEREVER s_T IS.
#
# THE TWO NUMBERS THIS HEADER IS REQUIRED TO PRINT, AND DOES, so that no
# readout can present a null as a surprise:
#   * AT k = 3 AND n = 3000, P(credit | a TRUE +0.025) = 0.45. THE BAR IS A
#     COIN FLIP AT ITS OWN EFFECT SIZE. (This is the 2-df-marginalized
#     figure in the same family as the 100M pre-reg's own 0.466 on its axis;
#     raising k is the only thing that moves it, which is what makes the
#     freed-lane branch in (A1) a statistical decision and not a tidiness
#     one.)
#   * ON THE vs-SH AXIS AT p = 0.789, P(credit) ~= 0.07 — credit requires
#     pooled >= 0.81367 (0.78867 + 0.025). THE SATURATION ARGUMENT WAS
#     ALREADY PRE-REGISTERED, at configs/showdown_sp_100m.yaml:141-145 and
#     :205-213, and this file is re-printing it rather than discovering it.
# BOTH FIGURES RIDE EVERY NULL THIS RUN PRODUCES. A null at a bar with
# P(credit)=0.45 against its own effect size is a statement about the
# instrument at least as much as about the lever, and the readout must say
# so in the same paragraph as the number.
# The honest prior, from docs/IDEAS_POST_100M.md:676-683 verbatim: "Unless
# the next doubling's effect is LARGER than the last, k=3 unpaired lands in
# P3 again — the pre-reg must pair seeds (2.2) or pre-commit a descriptive
# read". THIS FILE DOES BOTH: seeds are shared (section (E)) and the
# descriptive reads in (O) are pre-committed.
#
# THE RULING THIS RAISES, AND IT IS NOT THE DRAFTER'S [RWM-8]: whether to
# promote off-FP@20 to the verdict axis for THIS round, as E1 did for the
# 100M round, with vs-SH as the named secondary under a composition table.
# ARGUMENTS FOR: the measured power gap is ~7x; the object this run
# produces is a LADDER candidate and FP is "the incumbent and the
# reproducible one" (JOURNEY standing notes); the goal changed on
# 2026-09-11 to "as high as possible", and FP@20 discriminates near the top
