# ---------------------------------------------------------------------
# (H) DOSE — MATCHED BY CONSTRUCTION, AND HOW WE WOULD KNOW
#
# 100,000,000 env steps per lane, read at the FINAL checkpoint (the locked
# protocol's own word), which on this loop is the crossing rung — the first
# checkpoint at step >= 100,000,000. The banked Node fleet's realized
# crossings were 100,000,027 / 100,000,008 / 100,000,080, i.e. well inside
# one update.
# HOW WE WOULD KNOW: the realized final step in each lane's meta.yaml and
# checkpoint filename. A lane whose crossing step is more than ONE UPDATE
# (30,720 steps) off 100,000,000 is REPORTED and graded at its realized
# step, never at the nominal. Beyond 250,000 steps (one eval interval) it is
# the M-VOID-DOSE cell in (K) — that is a different dose, not an overshoot.
# ACROSS ARMS dose is matched by construction (same total_steps, same
# anneal, same rollout budget, same epochs, same minibatches). Optimizer
# passes per datum are matched in configuration: epochs 4 and minibatches
# 120 in all three arms; the realized grad-steps-per-env-step is RECORDED at
# grade time, never asserted.
# AGAINST THE BANKED NODE FLEET (the descriptive overlay only) dose is ALSO
# matched at 100M with the same anneal — the collector is the unmatched
# thing, and that is the point of the overlay.
#
# THE TEAM BANK, AND A NUMBER THAT CHANGES AT THIS DOSE. The lanes draw team
# pairs with replacement from a fixed 5,000,000-pair bank (RW-6's ruling for
# A-1, carried forward). At L-bar 30.70 a 12M A-1 lane ran ~390,317 battles
# and 96.2% of them were the FIRST use of their pair. A 100M lane runs
# ~3,257,000 battles, and the same arithmetic gives 0.651 draws per pair,
# 2.393M distinct pairs, and 73.5% of battles on a first-use pair. Across
# nine lanes sharing one bank the fleet-wide first-use fraction is 17.0%.
# Both are quoted because the per-lane one flatters.
# WHY THIS IS DISCLOSED AND NOT FIXED: recurrence is COMMON TO ALL THREE
# ARMS, so it cannot bias any between-arm contrast — which is what the
# credit line reads. It CAN bias the absolute level (the headline vs-SH
# number, and the ladder object's strength) and the descriptive Node
# overlay, where the Node arm effectively never repeats a pair. Restoring
# A-1's 96% would need ~20,000,000 pairs, which is +2.13 GB resident PER
# LANE against the memory budget in (F) — infeasible until the bank is
# mmap'd. RWM-4 asks for the ruling; the recommendation is to keep 5M and
# disclose.
# `collector.min_bank_pairs: 1000000` is enforced in code at launch
# (rl/train.py:789-806); a floor in prose is not a floor.
#
# ---------------------------------------------------------------------
# (I) PRIMARY READS
#
# THE INSTRUMENT for every greedy read: the LOCKED EVAL PROTOCOL — final
# checkpoint, 3000 battles/seed, 3 seeds pooled, ties as non-wins,
# deterministic policy, vs `SimpleHeuristicsPlayer` on the Showdown server,
# seed_start 100, via scripts/eval_checkpoint.py.
# THE CROSS-CHECKS ARE REQUIRED OF EVERY ARM: `wins_from_returns ==
# eval/win_rate` on every eval JSON (eval/win_rate is env-supplied outcome
# and wins_from_returns exists only as the cross-check; the two must agree),
# `mask_desyncs == 0`, and the key `eval/no_outcome` ABSENT — not "== 0".
# rl/common/evaluation.py:180-182 emits that key only when missing > 0, so a
# literal "== 0" gate either KeyErrors or, with a .get default, passes
# silently forever.
# PROTOCOL DEVIATION, DISCLOSED: 3 seeds, not the 5 every arm from D23 on has
# pooled. Three is what 45 fleet-hours buys at three arms; five would be
# 75 fleet-hours. This is the NON-conservative direction and it is stated
# here rather than buried — the credit line's seed-clustered leg is computed
# on k=3, and CLAUDE.md's own landmine says ONE RUNG AT n=3000 IS WORTH
# +-0.02.
#
# EVERY COMPARATOR IN THIS PRE-REG IS READ IN THE SAME SESSION AS ITS ARM.
# THIS IS A HARD RULE AND IT IS NOT A STYLE PREFERENCE. The project has a
# MEASURED ERA BIAS on this instrument: the SAME three 100M checkpoints,
# the same seed_start, deterministic, read one week apart, give pooled
# 0.79589 (banked 2026-09-03, results/ch5_100m/final_s*.json) against
# 0.78867 (fresh 2026-09-10, results/search_s3_100m/a0_s*.final.json) — a
# drift of -0.00723. The earlier precedent is sharper still:
# configs/eval/ch3_r4_ensemble_critic.yaml:592 records "R2 A0 0.72358 vs R3
# A0 0.70875 — same checkpoints, same seed_start, deterministic, 4x3000,
# one day apart: -0.0148 at ~2.6x its binomial se; teams are server-rolled.
# A frozen comparator carries a bias worth 59% of the floor that NO SE TERM
# CAPTURES." 0.0148 is 59% of the credit floor.
# CONSEQUENCES, BINDING:
#   * The three arms are read in ONE post-fleet session, interleaved, never
#     arm-by-arm on different days. The read ORDER is pre-stated in (S).
#   * D-COLL100 (the banked Node 100M overlay, section (O)) re-reads the
#     BANKED checkpoints FRESH in the same session. It costs ~6 minutes
#     (~120 s per lane) and without it the overlay measures the calendar.
#     The banked 0.79589 is reported beside it as PROVENANCE only.
#   * No number in this pre-reg is ever compared to a figure quoted from
#     RESULTS.md or STATUS.md without a same-session re-read of the
#     checkpoint that produced it, where that checkpoint is on disk.
#
# ---- P-A — THE OBJECT (no contrast; this is what step 11 gets) -------
#   Each arm's pooled vs-SH final under the locked protocol, with its three
#   per-seed numbers, its seed sd, its pooled-binomial se and its
#   seed-clustered se. THREE NUMBERS, reported side by side, with A-1's
#   signed collector delta attached to every one of them.
#   STATUS: REPORTED, NOT GATED. There is no band on an absolute level and
#   inventing one would be inventing JOURNEY 10's missing exit condition.
#   WHAT IT FEEDS: step 11's choice of ladder object, which is step 11's.
#
# ---- P-C — ARM C vs ARM A, GREEDY. CREDIT-SEEKING. -------------------
#   READ: signed delta_C = pooled_C - pooled_A, both under P-A's instrument.
#   AGGREGATOR: equal-weight mean of per-seed win rates, per (G).
#   SIDES: TWO-SIDED on the signed delta. The CREDIT cell is the positive
#   side and requires the credit line in full. A symmetric NEGATIVE cell
#   (delta <= -0.025 AND |delta| >= 2*se_diff) is named so that a harmful
#   lever is reported as harmful rather than as "not credited".
#   se_diff: se_gov, exactly as the credit line in (G) defines it (it is
#   restated there and, per this repo's own rule, exactly once).
#   UNPAIRED, even though the seeds are shared — C is not
#   init-paired with A (see (E)) and no pairing credit is taken anywhere.
#   WHAT THIS IS: IDEAS 4.7, the asymmetric-baseline lever, at 8.3x the dose
#   its kill was vacated at.
#
# ---- P-ID — THE IDENTITY CHECK. NOT A CONTRAST, AND NOT A READ. ------
#   REPLACES the "P-BA" cell of an earlier draft, which registered arm B
#   against arm A as a greedy contrast. FACT 1 measured that comparison at
#   EXACTLY ZERO — 21 rungs, 223 tensors, 3,428,015 elements, zero
#   differing. A contrast whose value is known in advance to be the integer
#   zero is not a contrast, and registering one would manufacture a null
#   result out of an equality.
#   WHAT IS REGISTERED INSTEAD: an ASSERTION, checked and reported, never
#   graded.
#     Under D1-RIDE: the combined lane's actor and critic tensors at the
#     100M rung are bitwise equal to a same-seed control's. THE CONTROL IS
#     THE BANKED SMOKE PAIR (engine_pe_s66 vs engine_a1b_s66, digest
#     104a9339eb6a2260 at ckpt_010500013), not a new lane — FACT 1 is
#     already measured and re-buying it at 100M would cost 25 h to confirm
#     an equality that has a mechanism.
#     Under D1-SEPARATE: monster100m_b_s{s}'s actor and critic tensors are
#     bitwise equal to monster100m_a_s{s}'s at EVERY shared rung, all three
#     seeds. A SINGLE DIFFERING ELEMENT IS AN R0-CLASS EVENT — it means the
#     head is not inert, which falsifies the premise the whole arm rests on
#     — and it stops the fleet for diagnosis.
#   NO WIN-RATE COMPARISON BETWEEN A AND B IS REPORTED ON THE GREEDY AXIS,
#   in either direction, on any branch. If the checkpoints are identical
#   then so are their evals, and quoting two draws of one checkpoint as an
#   A/B would be quoting eval noise as a lever.
#   [WHAT AN EARLIER DRAFT CLAIMED HERE AND WAS WRONG ABOUT, recorded so it
#   is not re-derived: it argued that collector/learner interleaving would
#   make the two lanes drift, and proposed |B - A| as the engine collector's
#   run-to-run reproducibility floor. The measurement says the collector is
#   DETERMINISTIC at a fixed lane seed and policy — the battle stream is
#   splitmix64(lane_seed * PHI ^ battle_counter) and the pool-member stream
#   is a private np.random.default_rng(seed), neither of which reads a
#   clock. There is no interleaving floor, and the reasoning that predicted
#   one was wrong.]
#
# ---- P-BEV — ARM B's REGISTERED PRIMARY. AVAILABLE TODAY. ------------
#   CREDIT-SEEKING ON A MECHANISM, NOT ON A WIN RATE, and that is deliberate
#   — see P-BS for why the win-rate read cannot run yet.
#   THE STATISTIC: `priv_eval/ev_mc_advantage` = the head's explained
#   variance MINUS the critic's explained variance, BOTH against the
#   MONTE-CARLO RETURN, computed on the SAME batch in the SAME pass
#   (rl/agents/ppo.py:1638-1653; the critic's values are recovered exactly
#   as flat_targets - flat_advantages, so this costs one forward and no
#   extra bookkeeping). It answers the one question the head exists to
#   answer: DOES THE PRIVILEGED VIEW FIT THE SAME RETURNS BETTER THAN
#   `self.critic` DOES?
#   IT IS PAIRED WITHIN A LANE. Head and critic are scored on the same rows,
#   in the same update, against the same target. That is the tightest
#   pairing available anywhere in this project, it consumes NO contrast arm,
#   and its power scales with the number of lanes carrying the head rather
#   than with the number of ARMS — which is why ALLOC-AB9 does not weaken it.
#   THE READ: the per-lane mean of `priv_eval/ev_mc_advantage` over the LAST
#   5M steps, then the equal-weight mean over lanes. Reported with its
#   per-lane values, with `priv_eval/explained_variance_mc` and
#   `priv_eval/critic_ev_mc` beside it so the difference can be decomposed.
#   SIDES: TWO-SIDED. A NEGATIVE ev_mc_advantage means the privileged view
#   fits the outcome WORSE than the ordinary critic does, which would be a
#   finding about the block and not merely an absence.
#   NO BAND IS PRE-REGISTERED ON ITS MAGNITUDE, and the reason is stated
#   rather than elided: this metric has never been measured on a real lane
#   at any dose, there is no basis from which to name a floor, and a number
#   invented by a drafter is worse than an honest "reported with its sign
#   and its spread". WHAT IS PRE-STATED IS THE SIGN TEST: the arm's
#   mechanism cell is POSITIVE iff the lane-mean advantage is > 0 on EVERY
#   lane, NEGATIVE iff < 0 on every lane, and MIXED otherwise. Three cells,
#   exhaustive, no boundary unassigned (exactly 0.0 on any lane reads as
#   MIXED).
#   `priv_eval/explained_variance` IS A DIAGNOSTIC AND IS BARRED AS A
#   VERDICT INPUT ON EVERY BRANCH. It scores the head against the GAE
#   target, which at lambda 0.95 over ~34 decisions is ~53% the ORDINARY
#   CRITIC'S OWN OUTPUT — ~82% of it at the first decision, where the
#   privileged block matters most. Quoting it as the arm's read would score
#   a contestant against a scorecard half-written by its opponent. It is
#   logged, reported, and not actionable.
#
# ---- P-BS — ARM B, SEARCHED. DEFERRED. NOT REGISTERED FOR THIS RUN. --
#   THERE IS NO SEARCH SEAM. `grep -rn priv_eval rl/search/` returns ZERO
#   LINES today, and rl/agents/ppo.py says so in its own comment: the head
#   "exists to be the SEARCH LEAF EVALUATOR later". The `evaluator` dial
