# ---- FLEET-LEVEL CELLS (these dispose of lanes, not of levers) ---------
#   M-VOID-K      an arm finishing fewer than 3 lanes at the 100M rung is
#                 DESCRIPTIVE ONLY and decides nothing. k<=2 cannot carry a
#                 seed-clustered aggregator, and re-running one lane makes
#                 the arm a mixed-provenance fleet. Report and relaunch the
#                 arm.
#   M-VOID-DOSE   a lane whose crossing step is more than 250,000 off
#                 100,000,000 is not graded at that arm's dose; it is
#                 M-VOID-K for that arm. Between 30,720 and 250,000 it is
#                 GRADED at its realized step with that step disclosed.
#   M-R0          an R0 breach kills the affected lane or the fleet per the
#                 gate. A relaunch after an R0 fix is a fresh fleet and
#                 consumes nothing; R0 exists to catch a build fault in
#                 minutes rather than in twenty-five hours.
#   M-WAVE        a lane lost in wave 1 is re-run IN WAVE 2 at wave 2's
#                 width, with the width difference disclosed on that lane's
#                 row. NEVER re-run alone at width 1 — a solo lane runs 1.9x
#                 faster under a different memory and thermal regime than
#                 any other lane in the fleet.
#   M-UNRATIFIED  a decision in (A1) or (A2) is unanswered at launch time.
#                 THE FLEET DOES NOT LAUNCH. The arm list and the lane
#                 allocation are not defaults this file may pick.
