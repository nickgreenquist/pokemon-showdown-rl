#                            outside {opp_action, seat_tag}.
#   `collector.privileged`   DOES NOT EXIST. ENGINE_KEYS is strict.
#   DECLARED CONFIG DIFFERENCES BETWEEN THE THREE ARMS, EXHAUSTIVE:
#     run_name, env_kwargs.seat_tag, agent.priv_eval_dim (B),
#     agent.priv_eval_coef (B), agent.privileged_dim (C).
#     EVERY OTHER KEY IS BYTE-IDENTICAL ACROSS THE THREE FILES — diff them;
#     the launcher diffs them before lane 1 and refuses on any undeclared
#     difference.
#   DECLARED DIFFERENCES AGAINST configs/showdown_sp_100m.yaml (arm A only):
#     collector.* (async/concurrency -> engine/k/team_bank/min_bank_pairs/
#     learner_seat), run_name, env_kwargs.seat_tag. Every other key is
#     byte-identical.
#
# ---------------------------------------------------------------------
# (R) LAUNCH-BLOCKING PRECONDITIONS
#
#   PRE-1  THE OPPACT HEAD in all three configs (section (B)). Asserted by
#          the launcher, and by rl/train.py at launch.
#   PRE-2  ARM C HAS NEVER RUN ON THIS ROUTE (section (A)). A live design-A
#          smoke — one lane, ~10 updates, read against R0-C1/C2/C3 and
#          R0-B1/B2/B3, then killed — must PASS before the fleet. It is
#          minutes of agent-side work and it is the difference between
#          finding a dead seam at update 10 and finding it at hour 25.
#          Its config is `configs/showdown_monster100m_c.yaml` itself with
#          `--run-name monster_c_smoke_s104`; nothing else changes.
#   PRE-3  THE ARM-B SMOKE HAS READ ITS GATES. runs/engine_pe_s66 is live as
#          this is drafted; its R0-B4/B5/B6 read (and its BITWISE
#          actor/critic comparison against engine_a1b_s66) must be in hand.
#   PRE-4  THE PRIVILEGED ENCODE IS PRICED. `scripts/engine_t1.py --leg b`
#          twice, flag off then on. ~10 minutes. Until then (N)-7 is a bound.
#   PRE-5  WIDTH MEASURED (unit W-0, section (F)) and the branch recorded.
#   PRE-6  ENV VARS on every lane and every eval:
#          POKEMON_RL_ENCODER_V2=1 POKEMON_RL_ENCODER_IDS=1. Read at import
#          (rl/envs/showdown.py:118,:131); they are what makes OBS_DIM 828.
#          The launcher exports both and refuses if either is unset.
#   PRE-7  THE BANK EXISTS and holds >= 1,000,000 pairs, sha256 recorded
#          (data/engine/teams_a1_5000000.bin, 480,000,262 B, built
#          2026-09-09).
#   PRE-8  THE TEST AMENDMENT (section (E), RWM-2) is committed.
#   PRE-9  CLEAN TREE, DOCS COMMITTED (CLAUDE.md rule 3). One untracked .md
#          stamps git_dirty on all nine lanes and the dirty flag cannot be
#          reconstructed afterwards.
#   PRE-10 THE BOX IS FREE. No ch3_eval jobs, no train lanes, no calibration
#          jobs, no other agent's queues. A fresh Showdown server, started
#          by the launcher. free+inactive >= 14 GiB and >= 60 GiB disk at
#          lane 1.
#   PRE-11 RATIFICATION. Every RWM-n answered in the sidecar and
#          `verdict_authorized` set. The launcher refuses without an
#          explicit `launch_authorization`.
#   PRE-12 THE TWO PENDING DECISIONS IN (A1) AND (A2) ARE ANSWERED, and the
#          lane list and seed list that follow from them are written into
#          the sidecar before lane 1. An unanswered decision is M-UNRATIFIED
#          in (K) and THE FLEET DOES NOT LAUNCH — the arm list and the lane
#          allocation are not defaults this file may pick.
#
# ---------------------------------------------------------------------
# (S) OPS
#
#   THE ENV IS `pkmn-engine-port`, NOT `pokemon-showdown-rl`. The engine
#   extension is built there and only there
#   (/opt/anaconda3/envs/pkmn-engine-port/bin/python, as
#   scripts/engine_gates.sh:37 and the live lanes use). This is CLAUDE.md
#   rule 1's named engine-port exception. Do not install into it and do not
#   run these lanes from the analysis env.
#
#   LANES ARE DETACHED AND RESUME-SAFE. `--resume runs/<dir>` restores step,
#   updates_done, the anneal basis, the RNG streams and the engine's battle
#   counter. TWO THINGS A RESUME COSTS, both pre-stated so neither is a
#   surprise at grade time:
#     (i) A RESUME SPLITS THE WANDB HISTORY into two offline runs with
#         OVERLAPPING steps, and `extract_history.py <run_dir>` then HARD
#         FAILS. Use `scripts/merge_history.py`, verify segments == resumes
#         + 1 from meta.yaml and _step monotone, and read the merged file.
#         Every curve in (O) is affected; no PRIMARY read is, because the
#         primary reads are checkpoint evals.
#     (ii) `checkpoint.pt` LAGS the last logged step by much more than one
#         update (R2 lost 190,776 and 170,680 steps). Read the real
#         `from_step` from meta.yaml, and expect `updates_done` one short
#         per resume.
#   SEAT NAMES ARE DETERMINISTIC ACROSS A RESUME with seat_tag set, so a
#   resumed lane reconnects under exactly the names it died with. A
#   mid-battle kill poisons a username pair for hours; /timer on is what
#   bounds it.
#
#   THE POST-FLEET EVAL SCHEDULE, ORDER FROZEN (all agent-side, detached,
#   resume-safe, rate-readable; NOTHING runs while any lane trains). The
#   ORDER is what discharges the era-bias rule in (I): every arm's cell on a
#   given axis is read in ONE contiguous session, arm-interleaved.
#     1  vs-SH finals, 9 lanes x 3000, locked protocol.       ~18 min
#     2  D-COLL100: the three BANKED Node 100M checkpoints,
#        re-read FRESH at the same n in the same session.      ~6 min
#     3  BC-clone h2h, 9 lanes x 500.                          ~4 min
#     4  srank/dormancy (P-D18 leg (c)): d22 two-stage on all
#        nine finals plus the three banked Node finals. FLEET
#        DOWN, SERVER UP.                            BRACKETED, not measured
#     5  FP@20 h2h, 9 lanes x 3000, serial k=1.                ~12 h
#     6  P-BS — NOT A STEP OF THIS SCHEDULE. DEFERRED to its own
#        pre-registration; there is no search seam. Listed so its
#        absence is deliberate.                            NOT RUN
#   TOTAL ~13 h without step 4 (step 6 does not run). Steps 1-3 alone
#   settle P-A, P-C and two of the three anchor legs; P-BEV needs no
#   post-fleet work at all, because it is read off the lanes' own history.
#   NO STEP IS REORDERED to get a number earlier. Step 5 last on the axis
#   list is deliberate: FP@20 is descriptive, and running it before the
#   verdict axis would make the verdict the second thing anybody read.
#
#   THE LAUNCH COMMANDS ARE IN configs/showdown_monster100m.prereg.yaml
#   under `launch_commands`, one per block, and in
#   docs/proposals/MONSTER_PREREG_NOTES.md in the handed-over form. They are
#   NOT in this header, because a header is not a runbook and a copy of a
#   command in two places is a command that drifts.
#
#   READOUT: RESULTS.md gets the addendum, by hand, in ONE commit with the
#   STATUS rewrite and the SESSION_LOGS entry. `readouts/` gets a file only
#   if the object is laddered — the 100M fleet produced no readouts/ file
#   and its account is RESULTS §18. That precedent is followed.
# =====================================================================
env_id: Showdown-v0
seed: 104                  # lanes 2/3 via --seed 112 / 120
total_steps: 200000000     # JOURNEY 10's dose
eval_every: 250000         # 400 in-loop evals/lane, ~0.61 h; descriptive only
eval_episodes: 100
num_envs: 8                # x rollout_steps = the 30,720-step update budget
torch_threads: 1
checkpoint_every: 500000   # ~200 crossing rungs/lane; see DISK in (F)
run_name: monster200m_a_s104      # lanes 2/3 via --run-name
logger: wandb
eval_win_rate: true
collector:
  mode: engine             # A-1-accepted, signed delta -0.00436 travels forever
  k: 8                     # DECLARED, NOT ASSUMED — see (C). Do not raise.
  team_bank: data/engine/teams_a1_5000000.bin   # 5,000,000 pairs; recurrence in (H)
  min_bank_pairs: 1000000  # ENFORCED in code at launch; a floor in prose is not a floor
  learner_seat: p1
env_kwargs:
  opp_action: true         # D25 pair, half 1 of 2. MANDATORY — see (B).
  seat_tag: m10a           # ARM A. Eval-seat naming only; touches no learning path.
selfplay:
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 5
  latest_prob: 0.8
agent:
  algo: ppo
  trunk: entity_deepsets
  aux_oppact_coef: 0.1     # D25 pair, half 2 of 2. MANDATORY — see (B).
  aux_label_space: l6
  aux_scorer_sizes: [96]
  aux_head_gain: 0.01
  aux_max_grad_norm: 0.5
  trunk_kwargs:
    species_vocab: 152
    move_vocab: 166
    embed_dim: 64
    entity_dim: 128
    pool: max
    ctx_sizes: [384, 384]
    scorer_sizes: [256]
    value_sizes: [384, 384]
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  lr_anneal_steps: 200000000  # == total_steps. THE ANNEAL TRAP — see (D).
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 3840
  epochs: 4
  minibatches: 120
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
# NO PRIVILEGED KEY OF ANY KIND. This is the control: the collector's
# `privileged` flag is derived from `PPOAgent.privileged_block_dim`, which is
# zero here, so the Rust side never runs the second encode and the batch
# carries no `privileged` array at all.
