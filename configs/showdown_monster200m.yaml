# (C) K = 8, DECLARED AND JUSTIFIED — DO NOT "OPTIMISE" IT LATER
#
# The engine's own production default is 256 (rl/train.py:777). This fleet
# runs at 8, and the reasoning is restated here in full so that a later
# reader who sees "4x speedup" in SPEEDUP.md does not helpfully raise it.
#
# WHAT k ACTUALLY BUYS, AT MATCHED WIDTH (results/engine_a1/maxout.json,
# `cells[].per_lane_realized_median`; the 4.035x figure is the COLLECTOR's,
# not k's, and mixing them is the error K-1's own header retracts):
#     width 1   2,390.2 -> 3,034.7 steps/s per lane   1.270x
#     width 3   1,620.5 -> 2,105.6                    1.299x
#     width 6   1,282.3 -> 1,665.6                    1.299x
# At the shape THIS fleet actually runs (9 lanes x 100M, 6-wide then
# 3-wide; see COST), 1.299x on the collect term is worth about FIVE FLEET
# HOURS out of ~45 — and the collect term is 34.9% of wall on the engine
# path, so the lane-level gain is smaller than 1.299x.
#
# WHAT IT COSTS. At L-bar 30.70 the length-biased carry is 0.436% of a
# 30,720-step update at k=8 and 13.3-13.8% at k=256 — a 32-37x increase in
# off-policy rows (configs/engine_k256.yaml, methods 1 and 2, which agree).
# AND THE CARRY IS NOT UNIFORM: P(lag >= 1) by within-episode position runs
# 0.2248 over turns 0-4 against 0.0726 over turns 25+ at k=256 (0.0062 and
# 0.0019 at k=8). k=256 TRAINS OPENING PLAY OFF-POLICY AND ENDGAME PLAY
# ON-POLICY by a factor of 3.1x — a structured, non-uniform treatment on
# lead choice and early switching, which is exactly the behaviour a ladder
# object is judged on. The stale rows enter through the recorded `old_logp`
# with NO filter and NO reweighting (rl/agents/ppo.py:1163-1165, :1332-1334),
# and the PPO clip is the only correction in the path — already saturated on
# the comparator at clip_frac 0.2264-0.2363 against clip_eps 0.2.
#
# AND THE SCREEN THAT WOULD HAVE LICENSED 256 CANNOT RESOLVE IT. K-1
# (configs/engine_k256.yaml, drafted and reviewed twice, PARKED not
# withdrawn) has an MDE at 80% power of 0.032-0.038 against its own accept
# band of 0.025: a screen whose resolution floor is wider than its band.
# THE CONSEQUENCE: this fleet runs at k=8, the setting A-1 accepted the
# collector at, and any k > 8 needs its own read BEFORE it becomes a
# training default. Nothing in this pre-reg licenses k=256, and a later
# reader wanting the five hours should read configs/engine_k256.yaml's
# staleness section first.
#
# WIDTH IS FREE AND K IS NOT, AND THAT IS THE WHOLE POINT. A lane is a
# SEED; width does not change learning and needs no screen. The headline
# 2.06x fleet figure factors as 1.299 (k) x 1.582 (width 3 -> 6), and this
# fleet takes the 1.582 and declines the 1.299.
#
# ---------------------------------------------------------------------
# (D) THE ANNEAL TRAP, PINNED
#
# JOURNEY 10, verbatim (quoted once more here because it is the binding
# sentence and this is the section that discharges it): "The anneal trap
# still binds: a fresh full-horizon run with `lr_anneal_steps ==
# total_steps`, never a warm start off a finished checkpoint."
#
# DISCHARGED: total_steps 100,000,000 and agent.lr_anneal_steps
# 100,000,000, in all three arms, byte-identical. This is R0-b, the recipe's
# own full-horizon-anneal convention, and it is CONSTITUTIVE of "a 100M run"
# under this recipe rather than a bundled delta
# (configs/showdown_sp_100m.yaml, N-ANNEAL).
#
# AND IT IS A FRESH RUN. No `--resume`, no warm start, no initialisation
# from the banked 100M finals or from any A-1 lane. Every lane starts from
# `set_seed(cfg.seed)` at step 0. A warm start would (i) break the anneal
# basis — `anneal_basis = step` at rl/train.py:970, so a warm-started lane
# would anneal from the wrong place — and (ii) make the arms incomparable,
# since only one of the three could inherit a control's weights.
# A RESUME AFTER A CRASH IS NOT A WARM START and is permitted (it restores
# step, updates_done, the anneal basis and the battle counter); see OPS for
# the two things a resume costs.
#
# ---------------------------------------------------------------------
# (E) SEEDS — SHARED ACROSS ARMS, UNDER DISTINCT `env_kwargs.seat_tag`s.
#     DERIVED FROM THE CODE, NOT FROM RULE 2's HEADLINE.
#
# THE SEED LIST IS ALLOCATION-DEPENDENT AND (A1) OWNS IT: 104/112/120 under
# ALLOC-3x3; 104/112/120/128/136 (C on the first four) under ALLOC-AB5C4;
# 104/112/120/128/136/144/152/160/168 under ALLOC-AB9. EVERYTHING IN THIS
# SECTION HOLDS FOR ALL THREE — the mechanism, the tag derivation, the
# window argument and the test amendment do not depend on how many seeds
# there are, only on which. Where this section writes "104/112/120" it means
# the first three of whichever list the ruling picks.
#
# CLAUDE.md rule 2 says concurrent lanes need distinct `--seed`s INCLUDING
# ACROSS ARMS. The reason it gives is mechanical: poke-env derives seat
# usernames from the globally-seeded `random`, so two lanes at one seed ask
# Showdown for the same names and die with a misleading TimeoutError. THE
# RULE IS RIGHT AND THE MECHANISM IS THE THING TO CHECK, because on this
# collector the mechanism has moved twice.
#
# WHAT THE ENGINE PATH ACTUALLY OPENS. `rl/train.py:508-525`: with
# `collect_mode in ("async", "engine")` NO TRAINING ENV IS CONSTRUCTED AT
# ALL — the agent is built against `fake_spaces()` and the engine collector
# is in-process with no sockets, no threads and no child processes
# (rl/envs/engine_collector.py:315-316). The ONLY poke-env object a monster
# lane creates is the in-loop EVAL env, `make_eval_env(cfg)` at
# rl/train.py:533, which opens TWO seats (ours and SimpleHeuristicsPlayer).
# So a lane is 2 usernames, not 18.
#
# WHAT `seat_tag` DOES. rl/envs/make.py:41-49 pops `seat_tag` before the env
# is built and, when it is set, injects explicit `AccountConfiguration`s
# from `rl.envs.showdown.seat_names(seed, tag, seat_role)`
# (rl/envs/showdown.py:968-986):
#     base = f"as2s{seed}{role}{sha256(tag)[:4]}"   ->  base+"a", base+"b"
# `make_eval_env` passes `seat_role="e"` (rl/envs/make.py:155-157), exactly
# so a tagged run's eval seats cannot collide with training sub-env 0's.
# WITH A TAG SET, poke-env's global-`random` derivation IS NEVER REACHED,
# and rule 2's failure mechanism is not present. Without a tag it is, and
# three arms at one seed would collide on the first eval.
# VERIFIED LIVE, NOT DERIVED: the design-B smoke at seed 66 under
# `seat_tag: pe` is on the server right now as `as2s66ecdf6a` /
# `as2s66ecdf6b` (runs/engine_pe_s66.nohup.log), which is exactly
# seat_names(66, "pe", "e").
#
# THE EIGHTEEN NAMES THIS FLEET WILL HOLD, COMPUTED AND PINNED so a
# collision is a launcher assertion and not a surprise (13 chars each,
# against Showdown's 18-character cap, SEAT_NAME_MAX):
#     m10a  as2s104ec990{a,b}  as2s112ec990{a,b}  as2s120ec990{a,b}
#     m10b  as2s104e930b{a,b}  as2s112e930b{a,b}  as2s120e930b{a,b}
#     m10c  as2s104eed0d{a,b}  as2s112eed0d{a,b}  as2s120eed0d{a,b}
# All 18 distinct; all distinct from A-1's `a1` tag and the smoke's `pe`.
#
# THE 8-WIDE "SEED WINDOW" DOES NOT APPLY TO AN ENGINE LANE, and saying so
# matters because both seed guards in tests/ are written in terms of it.
# `make_vec_env` seeds sub-env i at `seed + i` (rl/envs/make.py:88), which
# is what makes [seed, seed+7] a reserved window on the VECTOR path. The
# engine path builds no vector env, so only `cfg.seed` itself is consumed —
# by the eval env's spaces, by the pool's private
# `np.random.default_rng(seed)` (engine_collector.py:193) and by the Rust
# battle stream `splitmix64(lane_seed * PHI ^ battle_counter)`. 104/112/120
# are 8 apart anyway, so nothing turns on this; it is recorded so the
# window is not later treated as a live constraint on the engine path.
#
# WHY SHARE RATHER THAN SPEND NINE SEEDS [RWM-1]. Three reasons, in order:
#   1. THIS IS WHAT `seat_tag` WAS BUILT FOR. IDEAS 2.2: "Every training A/B
#      to date has been unpaired for a MECHANICAL reason, not a statistical
#      one ... Fold a per-run tag into the names and arms can SHARE a seed —
#      shared init where shapes match, and a shared early episode stream."
#      A-1 used the tag only to avoid its own banked lanes; this is the
#      first design that takes the pairing.
#   2. THE PAIRING IS WEAKLY DOMINANT AND COSTS NOTHING. rho ~ 0 means no
#      worse than unpaired. The PRIMARY estimator is UNPAIRED regardless
#      (the credit line takes the larger of the pooled-binomial and the
#      seed-clustered se_diff, and neither is a paired quantity), so the
#      pairing can only ADD a secondary. IDEAS 2.2's own obligation —
#      "MEASURE AND REPORT rho ON FIRST USE" — is discharged as a named
#      secondary in section (G).
#   3. THE ENVIRONMENT STREAM IS GENUINELY SHARED, WHICH IS THE PART THAT
#      IS NEW. At a fixed lane seed the battle-seed sequence and the
#      pool-member sequence are functions of the seed alone, so all three
#      arms at seed 104 see the SAME team pairs in the SAME order and the
#      SAME opponent-member draws, until their policies diverge. That is
#      common random numbers on the training distribution, which no gen-1
#      A/B in this repo has ever had.
#
# AND THE PAIRING IS ASYMMETRIC ACROSS THE THREE ARMS. THIS IS THE SINGLE
# MOST IMPORTANT SENTENCE IN THIS SECTION:
#   * A and B ARE init-paired. `priv_eval_coef > 0` constructs the head LAST
#     and REWINDS the global torch RNG stream around it
#     (rl/agents/ppo.py:680-700), so at a fixed seed an arm-B lane's actor,
#     critic, aux head, minibatch permutations and every downstream draw are
#     BIT-IDENTICAL to arm A's. Pinned offline over twenty updates by
#     tests/test_priv_eval_head.py.
#   * C IS NOT. `privileged_dim` re-inits the whole net after the widened
#     critic has moved the RNG stream, so the ACTOR's initial weights move
#     at a fixed seed, with an IDENTICAL parameter count
#     (rl/agents/ppo.py:494-505). The figure usually quoted is actor param
#     sum 334.851 -> 410.510 (tests/test_entity_trunk_gen4.py:194-199), AT
#     THAT TEST'S SEED. MEASURED ON THESE THREE FILES AT SEED 104 the pair
#     is 442.300 (arms A and B, identical to the last float) -> 375.635
#     (arm C). The residue is real at every seed; the numbers are
#     seed-specific and the sign is not fixed. Reordering construction to
#     fix it would move the stream for privileged_dim=0 too and break the
#     gen-1 golden for every existing recipe. DISCLOSE, DO NOT REORDER.
#   So C shares the ENVIRONMENT stream with A but not the INITIALISATION,
#   and B shares both. Any paired secondary reports the two contrasts
#   separately and never pools them, and no pairing credit is taken on
#   either.
#
# THE TEST AMENDMENT THE RATIFICATION COMMIT MUST MAKE [RWM-2], NAMED HERE
# BECAUSE A POST-HOC FIX IS THE THING THE PRE-REG RULES EXIST TO PREVENT.
# Two guards exist and only ONE of them is the guard the brief for this file
# named; both are checked:
#   * tests/test_100m_prereg.py::test_seed_windows_disjoint_and_unused GOES
#     RED THE MOMENT LANE 1 WRITES ITS CONFIG. It enumerates the windows
#     [104..111], [112..119], [120..127] and asserts that no run dir OTHER
#     than showdown_sp_100m_s{104,112,120} stamps a seed inside them. The
#     amendment adds the nine monster dirs as the SECOND legal owner, with
#     the same comment form the 2026-09-01 and 2026-09-09 amendments used,
#     and it lands in the RATIFICATION commit — before launch, never after.
#   * tests/test_ch5_r2_prereg.py::test_seeds_are_window_disjoint_and_unused
#     is UNAFFECTED. It guards 66/75/83 only, and this fleet does not touch
#     them. (That test is the one the drafting brief named; it is the wrong
#     one for these seeds, and the right one is the 100M guard above.)
#
# WHY 104/112/120 AND NOT A FRESH TRIPLE [RWM-1b]. Because arm A is the R4
# recipe at the R4 dose with the R4 anneal, so at these seeds it is
# INIT-PAIRED LANE-FOR-LANE with runs/showdown_sp_100m_s{104,112,120} — the
# banked Node 100M fleet, the same recipe on the other collector. That buys,
# for zero compute, the one descriptive read A-1 explicitly could not
# produce: its own disclosure says "A-1 says nothing about behaviour at
# 100M+, which is the horizon the port exists to buy". It is a DESCRIPTIVE
# overlay and never a verdict input (see D-COLL100 in section (G)) — the
# two fleets differ in collector, in team source, and in eight days of tree
# — but it exists only if these seeds are used, and it cannot be recovered
# later.
#
# ---------------------------------------------------------------------
# (F) COST, WIDTH AND WAVES — FROM MEASURED ARTIFACTS ONLY
#
# EVERY NUMBER BELOW NAMES ITS FILE. Nothing here is a projection from a
# projection, and where a figure is an extrapolation it is labelled as one.
#
# THE TWO MEASURED RATE FAMILIES, and they measure different things:
#   (i) results/engine_a1/maxout.json — IDLE box, evals OFF, k=8, 200,000
#       steps per lane per cell, `cells[].per_lane_realized_median`:
#         width 1  2,390.2 steps/s per lane   fleet 2,390.2   peak RSS 2.263 GB
#         width 3  1,620.5                    fleet 4,861.4   peak RSS 7.369 GB
#         width 6  1,282.3                    fleet 7,693.6   peak RSS 10.952 GB
#       `peak_rss_gb` IS THE SUM OVER THE CELL'S LANES, not per lane
#       (scripts/engine_maxout.py:58-72 accumulates over all lane pids per
#       tick). Per-lane at width 6 is therefore 1.825 GB.
#       THE GRID IS {1, 3, 6} AND NOTHING ABOVE 6 HAS EVER BEEN MEASURED.
#   (ii) THE A-1b LANES' OWN WHOLE-LANE RATE — the honest planning number,
#       because its denominator includes evals, checkpoint writes, pauses
#       and everything else a real lane pays. From each lane's history.csv,
#       (max _step - min _step) / (max _timestamp - min _timestamp), on the
#       FIXED build (bd3d06a), 3-wide, evals on:
#         engine_a1b_s66  1,390.03 steps/s   engine_a1b_s75  1,386.79
#         engine_a1b_s83  1,349.49           -> median 1,386.79
#       The per-lane median of `time/realized_steps_per_sec` on the same
#       lanes is 1,380.95-1,423.54, which brackets it. DO NOT USE
#       `time/steps_per_sec`: it medians 5,202-5,638 on these lanes, ~3.5x
#       the truth, and it is a poll-cadence estimator.
#
# THE PLANNING RATE, AND ITS ONE EXTRAPOLATION:
#   width 3, whole-lane, evals on, fixed build  = 1,386.79 steps/s per lane
#                                                 [MEASURED]
#   width 6/width 3 per-lane ratio from maxout  = 1,282.3 / 1,620.5 = 0.7913
#                                                 [MEASURED, evals OFF]
#   width 6, whole-lane, evals on               = 1,097.4 steps/s per lane
#                                                 [PROJECTED — see caveat]
# CAVEAT, AND IT IS THE RIGHT DIRECTION TO WORRY ABOUT: the width ratio is
# measured with evals OFF, so it does not carry the contention of six lanes'
# eval seats on ONE Showdown server. The projection is therefore an UPPER
# bound on rate and a LOWER bound on hours. The eval term is small — the
# A-1 lanes spent 271-292 s on 49-53 evals, ~5.5 s per 100-battle eval, and
# 400 evals is ~0.61 h per lane — and 6 lanes is 12 eval seats against the
# Node 100M fleet's 27 concurrent seats, so contention is expected to be
# minor. EXPECTED IS NOT MEASURED; D-B below records the realized rate and
# the pre-stated action on a shortfall.
#
# HOURS, AT THE RECOMMENDED WIDTH:
#   one lane, 100M at 1,097.4 steps/s (width 6)  = 91,124 s = 25.3 h
#   one lane, 100M at 1,386.79 steps/s (width 3) = 72,109 s = 20.0 h
#   WAVE 1 — 6 lanes, 6-wide:                      25.3 h
#   WAVE 2 — 3 lanes, 3-wide:                      20.0 h
#   FLEET TOTAL:                                   ~45.3 h  (~1.9 days)
# SANITY, against the only 100M fleet that exists: the banked Node fleet ran
# 3 lanes 3-wide in 49.36 / 49.77 / 49.83 h. This fleet does NINE lanes in
# ~45 h. That is the port, and it is the thing JOURNEY 7.5 was bought for.
#
# THE WAVES ARE ARM-BALANCED, AND THAT IS A DESIGN CONSTRAINT, NOT AN
# ORDERING CONVENIENCE. A wave is a shared box condition — width, thermal
# state, whatever else is running — so a wave that holds unequal numbers of
# each arm CONFOUNDS ARM WITH BOX. The waves are therefore cut BY SEED:
#   WAVE 1 = seeds 104 and 112, all three arms      (6 lanes, width 6)
#   WAVE 2 = seed 120, all three arms               (3 lanes, width 3)
# Every wave holds exactly one lane of each arm per seed, so any wave effect
# enters all three arms equally and cancels in every between-arm contrast.
# A wave cut BY ARM (all of A, then all of B, ...) is BARRED.
#
# NINE-WIDE IS REFUSED, ON MEMORY, AND THE REFUSAL IS MEASURED [RWM-3]:
#   * The box is 24.00 GB (sysctl hw.memsize 25,769,803,776) and 14 cores
#     (M4 Pro, 10 performance + 4 efficiency).
#   * Per-lane RSS at width 6 is 1.825 GB (maxout fleet sum 10.952 / 6), so
#     nine lanes is 16.4 GB of the measured, NON-GROWING figure.
#   * The comparable idle-box headroom is free+inactive 11-13 GB
#     (logs/engine_gates.log, 2026-09-09, the A-1 launch preflight).
#     16.4 > 13 before any growth at all.
#   * AND GROWTH IS UNMEASURED ON THIS PATH. The A-1 lanes ran 2.4-2.6 h. On
#     the Node path a lane grew from 2.31 GB solo to 3.21 GB peak over 49 h
#     (logs/ch5_100m_rss.log, 598 samples) — a factor of 1.39. If the engine
#     path grows anything like that, six lanes reach ~15.2 GB and NINE reach
#     ~22.8 GB, which is the whole box.
#   * The named, MEASURED unlock is mmap'ing the team bank: three processes
#     consume 1.37 GB when the bank is `read()` and 0.00 GB when it is
#     mmap'd (docs/engine_port/NOTES.md). At width 6 that returns 5 x 0.532
#     = 2.7 GB. It is "not implemented tonight, deliberately" (NOTES.md) and
#     it lives in engine/pkmn_gen1/, which this pre-reg does not touch.
#     STATUS.md lists it under "Free wins staged". If it lands before
