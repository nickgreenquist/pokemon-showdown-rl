# D18 — PRIVILEGED (ASYMMETRIC) CRITIC at 12M (DESIGN §12, RATIFIED
# 2026-08-11; sequenced first by D22's closed decision rule).
#
# THE ONE LEVER. During self-play training the CRITIC's input is widened
# with the opponent seat's TRUE own-side state; the actor, the obs
# space, the trunk, and the recipe are the 50M winner's, unchanged.
# Plumbing landed 2026-08-11 (commits cedd6fb, 6d21064; suite 279
# green; live-smoked):
#   env_kwargs.privileged: true  -> info["privileged"] = the opponent
#     seat's own-side block, sliced from ITS OWN embed_battle encoding
#     (6 mon blocks + active extras + 4 move blocks + 10 ids = 408 dims;
#     rl/envs/showdown.py::privileged_block — same fill code as our own
#     side, zero new encoder features).
#   agent.privileged_dim: 408    -> critic input = actor-obs ‖ privileged
#     block; priv tokens go through the SAME mon/move subnets and
#     embeddings; ctx pooling widens 5 -> 8 entity slots. The two flags
#     are checked against each other at first update (loud seam).
# BINDING (Baisero & Amato, arXiv:2105.11674, Thm 5.1): the critic
# conditions on the actor's obs PLUS the privileged block — NEVER
# privileged-only. Honest residue, carried verbatim from §12: the
# theorem's h is the full action-observation history; our obs is an
# approximate belief state standing in for h — near-Markov by
# construction, noted, not proven.
#
# WHY NOW (D22, closed 2026-08-11): EV plateaus at 0.56–0.59 on all
# three 50M lanes from 5M to 50M; the critic's feature srank99 collapsed
# to 7–11 of 384; the exploitability and (binding) plasticity clauses
# both failed to fire. The plateau diagnosis is a representation/critic
# ceiling — exactly the ~40% unexplained terminal-return variance this
# lever attacks (hidden team: 5/6 opponent mons unseen at turn 1).
#
# PURITY (§5): clean — the opponent seat's state in mirror/pool
# self-play is our own process's environment state; no teacher, no
# scripted opponent, no human data. One disclosure line in any writeup.
# NOVELTY (2026-08-10 adversarial search, binding phrasing): "no
# documented instance found" of a privileged/asymmetric critic in any
# Pokemon RL system.
#
# ---------------------------------------------------------------------
# COMPARATOR AND PRIMARY
# ---------------------------------------------------------------------
# COMPARATOR: Rung 2's pooled final at the SAME 12M budget and recipe —
# 0.5509 ± 0.0052 (s26 0.5633 / s27 0.5683 / s28 0.5210, 3x3000, locked
# protocol). One lever apart from this run by construction.
#
# PRIMARY: pooled finals vs SimpleHeuristicsPlayer, LOCKED protocol —
# FINAL checkpoint, deterministic, ties as non-wins, 3000 battles/seed
# x 3 seeds = 9000 pooled. Eval process carries BOTH env vars; the
# privileged block never touches the eval path by construction (the
# critic is not exercised at eval; asserted by the actor-only act()).
#
#   CREDIT LINE (DESIGN §8, restated IN FULL per the 2026-08-11
#   adjudication process fix): a lever is credited iff pooled delta
#   >= +0.025 AND >= 2*se_diff, where se_diff is the LARGER of the
#   pooled-binomial se_diff and the seed-clustered se_diff. Both arms
#   at 3x3000: binomial se_diff = sqrt(2)*0.0052 ~ 0.0074, so the
#   binomial floor is max(+0.025, 2*0.0074 = 0.0147) -> +0.025 ->
#   POOLED FINAL >= 0.5759; the seed-clustered se_diff is computed from
#   the six per-seed finals at read time and GOVERNS if larger (the 50M
#   lesson: spread 0.151 made the seed-clustered z +0.63 — a seed-
#   fragile credit gets the weakness NAMED in every narrative use).
#
# CO-PRIMARY, RECORDED NOT CREDIT-BEARING (next-pre-reg wishlist,
# 2026-08-11, adopted here): the VAL-PEAK checkpoint per lane (argmax of
# the n=1000 in-training evals below), re-graded under the locked
# protocol at 3x3000. Feeds the LIVE ckpt-selection policy question
# (50M best-ckpt gap was +0.035 pooled with a selection caveat at
# n=100); the n=1000 cadence shrinks that caveat ~3x. CREDIT IS JUDGED
# ON THE PRIMARY ALONE — pre-stated so the co-primary can never be
# argued into the claim after the fact.
#
# SECONDARY (mechanism, pre-stated): loss/explained_variance trajectory
# vs the Rung 2 12M control curves (plateau 0.56–0.59) AND vs the 50M
# curves. The lever's own theory of change predicts EV rises. Also
