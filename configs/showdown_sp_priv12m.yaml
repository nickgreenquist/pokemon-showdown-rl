#
# FALSIFIER, PRE-STATED (§12 verbatim): EV jumps but win rate flat or
# negative => the critic fits information the policy cannot exploit and
# the advantage signal degraded — KILL THE RUNG, do not tune around it.
#
# CONFOUND, DISCLOSED: the widened ctx adds ~147k CRITIC params (actor
