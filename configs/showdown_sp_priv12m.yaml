env_id: Showdown-v0
seed: 39
total_steps: 12000000
eval_every: 500000
eval_episodes: 1000
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_sp_priv12m_s39
logger: wandb
eval_win_rate: true
env_kwargs:
  privileged: true         # THE LEVER, env side: seat-B own-side block in info
selfplay:                  # identical to showdown_sp_struct12m.yaml (D16a)
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 150
  latest_prob: 0.8
agent:
  algo: ppo
  trunk: entity_deepsets   # the credited Rung 2/50M treatment, unchanged
  privileged_dim: 408      # THE LEVER, agent side: critic = obs ‖ priv
  trunk_kwargs:
    species_vocab: 152
    move_vocab: 166
    embed_dim: 64
    entity_dim: 128
    pool: max
    ctx_sizes: [384, 384]
    scorer_sizes: [256]
    value_sizes: [384, 384]
  hidden_sizes: [512, 512] # unused when trunk != mlp; kept so a
                           # trunk: mlp rerun of this file is exact
  lr: 2.5e-4
  lr_anneal_steps: 0
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
