# COMPARATOR AND PRIMARY
# ---------------------------------------------------------------------
# COMPARATOR: Rung 2's pooled final at the SAME 12M budget and recipe —
# 0.5509 ± 0.0052 (s26 0.5633 / s27 0.5683 / s28 0.5210, 3x3000, locked
# protocol). One lever apart from this run by construction.
#
# PRIMARY: pooled finals vs SimpleHeuristicsPlayer, LOCKED protocol —
# FINAL checkpoint, deterministic, ties as non-wins, 3000 battles/seed
# x 5 seeds = 15000 pooled (5-lane ratification). 5-LANE ARITHMETIC,
# corrected at ratification (the option line's 0.77x/"~0.583" applied
# sqrt(3/5) to BOTH arms; only the D18 arm gains lanes — the
# comparator stays 3-seed): binomial se_diff = sqrt(0.0052^2 +
# 0.0041^2) = 0.0066, letter still +0.025 -> 0.5759; clustered FLOOR
# unchanged at 0.5809 (comparator-limited); at Rung-2-like D18 spread
# the clustered bar is ~0.589 (2*sqrt(0.0150^2 + (0.026/sqrt5)^2)),
# vs ~0.593 at 3 lanes. The real 5-lane gains: the D18 spread is
# ESTIMATED on 5 seeds instead of 3, the binomial tightens, and the
# recording-rule band narrows. Eval carries BOTH env vars. Eval
# NUMBERS cannot read the privileged block: act() is structurally
# actor-only (hook-verified, 0 critic forwards at eval; the eval env
# does compute-and-discard the block — see CONFOUND 3). Eval-with-flag
# path live-smoked 2026-08-11 (3 evals fired, no incident).
#
#   CREDIT LINE (DESIGN §8, restated IN FULL per the 2026-08-11
#   adjudication process fix): a lever is credited iff pooled delta
#   >= +0.025 AND >= 2*se_diff, where se_diff is the LARGER of the
#   pooled-binomial se_diff and the seed-clustered se_diff. Both arms
#   at 3x3000: binomial se_diff = sqrt(2)*0.0052 ~ 0.0074, so the
#   binomial floor is max(+0.025, 2*0.0074 = 0.0147) -> +0.025 ->
#   POOLED FINAL >= 0.5759; the seed-clustered se_diff is computed from
#   the six per-seed finals at read time and GOVERNS if larger (the 50M
#   lesson: spread 0.151 made the seed-clustered z +0.63 — a seed-
#   fragile credit gets the weakness NAMED in every narrative use).
#   OPERATIVE BAR, COMPUTED IN ADVANCE (2026-08-11 pre-launch review,
#   so no letter-vs-rule gap can open at the readout): the comparator's
#   own per-seed spread (s = 0.0260 over .5633/.5683/.5210) already
#   contributes 0.0260/sqrt(3) = 0.0150 to the clustered se_diff, so
#   even a ZERO-spread D18 arm faces 2*se_diff >= 0.0300 -> pooled
#   final >= 0.5809; with Rung-2-like spread in this arm the bar is
#   ~0.593. THE LARGER-OF RULE GOVERNS CREDIT; 0.5759 is the binomial
#   letter only. POWERING, disclosed: at 3 seeds the governing rule
#   demands delta ~ +0.042 at Rung-2-like spread — Rung 3's credited
#   delta was +0.029, so a real-but-unclaimable result in the
#   +0.025..+0.042 band is a plausible outcome. PRE-STATED RECORDING
#   RULE for that band (the 50M adjudication's shape, adopted in
#   advance): the result is recorded as "letter-met, seed-fragile,
#   NOT credited", full per-seed detail in the log, no narrative use
#   without the weakness named. RATIFICATION OPTION, maintainer's
#   call: 5 lanes (seeds 39-43) for +0.8 lane-days — ADOPTED at
#   ratification; corrected 5-lane arithmetic at the PRIMARY block
#   (the original option line's "0.77x -> ~0.583" over-credited
#   sqrt(3/5) to both arms; true bar ~0.589 at Rung-2-like spread,
#   floor 0.5809 unchanged — the comparator's 3 seeds limit it).
