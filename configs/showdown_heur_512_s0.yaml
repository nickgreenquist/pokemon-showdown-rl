# Phase 5 milestone 2, third attempt: the capacity lever, one variable.
#
# Needs the local Showdown server running:
#   cd showdown && node pokemon-showdown start --no-security
#
# showdown_heur_6m.yaml verbatim except hidden_sizes [64,64] -> [512,512]:
# the 6M budget run plateaued at ~0.30 from ~2.5M on (budget lever read:
# more steps alone do not reach the bar), and the trunk is the one component
# whose suspect status changed this phase without re-examination — the
# encoder grew 10 -> 611 dims while the net stayed CartPole-scale (~45k
# params). Published precedent on this exact problem class (researched
# 2026-07-30, see session log): Huang & Lee's gen7randombattle PPO used
# 1.33M params (929/1000 vs most-damage); Metamon's smallest models that led
# heuristic rankings were 500k-4M. [512,512] on 611 inputs puts actor +
# critic at ~1.16M — Huang-&-Lee scale — one decisive jump instead of a
# timid doubling, so the read is unambiguous in both directions.
# 12M steps (overnight run): rungs stay at every 100k, so the first 6M IS
# the clean paired comparison against showdown_heur_6m_s0 and the 6M -> 12M
# tail is free extension data — the budget-lever lesson (2M cut the [64,64]
# curve mid-climb) applied in advance instead of learned twice.
# torch_threads stays 1: the Phase 3 SAC probe measured 4 threads SLOWER
# even at 256x256. Expect ~600 steps/s (~5.5 h wall).
# Pre-registered read: plateau shifts up => capacity was binding; plateau
# stays ~0.30 => capacity exonerated at this scale, distribution levers
# (mixing, then entropy floor) are next.
env_id: Showdown-v0
seed: 0
total_steps: 12000000
eval_every: 100000
eval_episodes: 100
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_heur_512_s0
logger: wandb
eval_win_rate: true
selfplay:
  opponent: heuristics
  eval_opponent: heuristics
agent:
  algo: ppo
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128  # 8 envs x 128 = 1024 per update, the Phase 4 cadence
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
