# 2. BUILD CONTRACT — BINDING. EVERY LINE WAS AUDITED AGAINST SOURCE.
# ---------------------------------------------------------------------
# B1 WHERE THE LABEL COMES FROM. `rl/envs/showdown.py::PoolPlayer.
#   choose_move` (~805-817) already computes `action = self._current.move
#   (obs, mask, rng)` — **an int in the repo's own 10-way indexing,
#   BEFORE `action_to_order` builds the BattleOrder** — and throws it
#   away. `poke_env`'s `SingleAgentWrapper.step` (:35-51) calls
#   `choose_move(self.env.battle2)` INSIDE our step, from `battle2` in
#   its **pre-resolution** state. The label is therefore genuinely
#   simultaneous-move and costs zero inference. D18's 408-float
#   privileged block is NOT used and D18's measured ~65 us/step seat-B
#   re-encode is NOT incurred.
# B2 WHAT CROSSES THE SEAM IS AN IDENTITY, NOT THE INDEX. The raw index
#   is in the OPPONENT'S OWN frame (`0..5` = its team order, `6..9` = its
#   move order), and both orders are per-battle random permutations we
#   never observe. So `PoolPlayer` records `order.order` from the same
#   decision and the env emits
#     info["opp_choice"] = np.array([kind, id], np.int32)
#   kind in {0 switch, 1 move}; id from the encoder's OWN `_species_id` /
#   `_move_id` so no second id convention can drift; sentinel (-1,-1)
#   when there was no decision. **Emit the key ALWAYS** so the vector
#   array's shape is stable across sub-envs. (Designer A's
#   `(kind, ident)` PYTHON TUPLE hits gymnasium `VectorEnv._add_info`'s
#   object-array branch, and her `ident = 0` for switches would hard-wire
#   the 6-class space into the plumbing. B's seam is adopted verbatim.)
#   Read the label after the **FIRST** inner `self._env.step`; the
#   wait-pump's later opponent choices are forced replacements, not the
#   simultaneous decision, and are DISCARDED. `battle2.wait` turns issue
#   a `DefaultBattleOrder` without calling `choose_move` and yield the
#   sentinel; those rows are dropped, not zero-filled.
# B3 TIMING — THE BUG THIS DESIGN MOST FEARS, AND IT IS THE OPPOSITE OF
#   `privileged`. `rl/train.py:481-495`: `infos` from `envs.step`
#   describe the SUCCESSOR state, and `privs` is carried forward into row
#   t. **The opponent's action is produced DURING that same call and
#   belongs to row t.** It is a TRANSITION-TIME info like
#   `info["outcome"]`, not a state info like `action_mask`. Consequences,
#   both simplifications: **no carry variable, no `next_*` twin, and NO
#   RESET MERGE** (reset has no preceding turn and emits no label —
#   D18's fiddliest line does not recur). An off-by-one here silently
#   trains the head on the NEXT state's label and still learns
#   something; R0-5(a) is the deterministic test.
# B4 THE FRAME COMES FROM THE BUFFERED OBS ROW'S OWN ID-SUFFIX — this is
#   what makes the anti-leak property STRUCTURAL rather than argued.
#   `_fill_ids` writes `obs[-20:][6:12]` = opponent species in OUR reveal
#   order and `obs[-20:][16:20]` = the opponent active's four
#   `_opponent_move_slots` ids. Canonicalisation reads THAT row. A
#   switch-in that `battle1.opponent_team` only learns about AFTER
#   `self._env.step(...)` therefore cannot become a nameable class:
#   **the label can only name entities the actor could see.** If
#   canonicalisation were done env-side post-step it would leak. Assert
#   it (T4 replay assertion), do not comment it.
# B5 NO ENCODER CHANGE. No change to `embed_battle`, `_fill_ids`,
#   `OBS_DIM` (828), or the observation/action spaces. The actor's inputs
#   at decision time are byte-identical to the control's.
# B6 THE HEAD IS A POINTER SCORER, AND IT IS OWNED BY `PPOAgent`, NOT BY
#   THE ACTOR.
#     aux_logits[:, i] = aux_scorer([ctx || opp_entity_i]) + aux_slot_bias[i]
#   over the 12 slots: the 6 opponent mon vectors `mons[:, 6:]`, the 4
#   opponent move vectors, and two constant tokens for classes 10/11.
#   **A plain `Linear(ctx -> K)` is ILL-POSED and this is measured, not
#   argued:** `ctx` is `ctx_net` over MAX-POOLED team features
#   (`entity_deepsets.py:298-315`), so opponent slot identity is
#   destroyed before `ctx` exists, and every logit in this net is
#   `scorer([ctx || entity_i])` (:322-326). The decisive evidence is
#   Designer A's positive control: the identical linear ctx probe cannot
#   decode **the actor's own greedy action** (gain **-0.061**, worse than
#   the marginal). Any ctx-only head or ctx-only estimator would have
#   produced a confident null on an architecture that cannot express the
#   target. This retires D19-A's co-primary B permanently.
#   Agent ownership buys three things: the acting network stays
#   byte-identical at 626,059 params; construction order fixes the global
#   RNG stream so **actor and critic initial weights at a given seed are
#   BIT-IDENTICAL to the aux-off control** (D18 could not have this);
#   and `actor.state_dict()` is unchanged, so `eval_checkpoint.py`,
#   `score_ladder.py` and `d22_dormant_rank.py` run against D25
#   checkpoints UNMODIFIED. The head rides in `state["aux_head"]`,
#   ignored on absence (the `theta0_hash` / `bc_anchor` rider precedent).
# B7 **HEAD WIDTH 96** (Reviewer 2's resolution, which dissolves the
#   designers' 64-vs-128 disagreement by satisfying both readings).
#   Live arithmetic at the ratified `trunk_kwargs`, reproduced
#   independently by both reviewers:
#     OBS_DIM 828 · actor 626,059 · critic 494,849
#     ACTOR_PARAM_CEILING 681,994 · slack 55,935
#     aux w= 32   16,455 -> 642,514  OK
#     aux w= 64   32,903 -> 658,962  OK   (Designer A's pick)
#     **aux w= 96 (12-class) 49,357 -> 675,416  OK, headroom 6,578**
#     aux w=128   65,799 -> 691,858  over 681,994 by 9,864 (B's pick)
#     aux w=256  131,591 -> 757,650  over by 75,656
#   (12-class costs +6 params over 6-class — the slot-bias count. If
#   classes 10/11 use LEARNED 128-d tokens rather than pure bias, add
#   256: 675,672, headroom 6,322. Either variant passes; declare which
#   at build.)
#   **REVIEWER 1'S FINDING, CARRIED BECAUSE IT CHANGES WHAT THE CEILING
#   MEANS: `ACTOR_PARAM_CEILING = 681,994` still encodes the flat-MLP
#   actor AT THE OLD OBS_DIM 808** (`tests/test_entity_deepsets.py:142`:
#   `808*512+512+512*512+512+512*10+10`). **The encoder has been 828
#   since D13a**, and the same capacity-matched reference at 828 is
#   `828*512+512+512*512+512+512*10+10 = 692,234`. So the constant is
#   ~10k stale. Width 96 passes on BOTH the stale constant and the
#   current-encoder reference; width 128 passes only the latter; width
#   256 fails both. **We take 96 and do not touch the constant** —
#   editing a ceiling constant inside a lever's own pre-registration is
#   exactly the move this repo does not make. Fixing 681,994 -> 692,234
#   is recorded as a separate, unrelated cleanup.
#   ALSO REVIEWER 1, and it must be said plainly: **the ceiling is not
#   enforced where Designer A said it is.** The assert lives in
#   `EntityDeepSetsNet.__init__` over `self.parameters()`, so an
#   agent-owned head is INVISIBLE to it and no aux width hard-fails at
#   launch. **The ceiling is a POLICY here, not a code gate.** R0-2
#   therefore asserts both numbers explicitly (626,059 and 675,416),
#   stamps both in meta.yaml, and ships a unit test that widths 128/256
#   fail the strict actor+aux accounting.
# B8 **AUX PARAMS GO IN THEIR OWN THIRD OPTIMIZER GROUP, APPENDED
#   LAST.** Designer B specified group-0 append; Reviewer 2 measured that
#   this is exactly backwards. `PPOAgent.load_state_dict` (`ppo.py:
#   892-925`) substitutes its own `param_groups` into the loaded state,
#   so torch never compares group counts — what the graft depends on is
#   the POSITIONAL ORDER of params flattened across groups:
#     appended to group 0 -> [actor, AUX, critic]: loaded state keys 2,3
#       land on the AUX head; **the critic gets no Adam moments** and the
#       aux head receives the critic's `exp_avg`.
#     third group appended -> [actor, critic, AUX]: keys 0-3 land on
#       actor+critic with matching shapes; aux simply gets none.
#   In-rung impact is nil (D25 lanes are fresh) but it is a silent
#   corruption landmine on any future `init_from`/resume, the fix is
#   free, it makes the init-isolation test trivially true, and it leaves
#   group 0/1 lr-anneal indexing untouched. R0-2c is the ordering test.
# B9 **THE AUX GRADIENT IS CLIPPED SEPARATELY.** Measured on control s26:
#   `loss/grad_clip_frac` mean **0.90** / median 0.94 — the global clip
#   binds on ~9 of 10 minibatches, so **any coupled aux term is a covert
#   10-30% policy-LR cut**, i.e. an unregistered second lever (and D21
#   already queues LR annealing as its own). Per minibatch:
#     1. `loss_ppo` (bit-identical to control) -> backward ->
#        `clip_grad_norm_(params, 0.5)`
#     2. `g_aux = autograd.grad(coef * aux_loss, trunk + head)`; clip to
#        its OWN `aux_max_grad_norm` (0.5); add into `.grad`
#     3. `optimizer.step()`
#   So `loss/grad_norm` and `loss/grad_clip_frac` stay numerically
#   identical to every control curve on a fixed batch (T7).
#   **IRREDUCIBLE RESIDUE, DISCLOSED: the aux gradient still enters
#   Adam's second moment for shared trunk parameters**, so the policy's
#   per-parameter effective step is not perfectly preserved. That cannot
#   be fixed for a shared trunk.
# B10 DROP ALIASED ROWS from the loss and from every read (4.0%-10.3%
#   measured; kept 96.0/94.7/94.1/89.7/93.1%). Under B2's identity seam
#   aliasing does not CORRUPT the label (a recharge is poke-env num -3,
#   `_move_id` -> 0, which lands in class 11 by construction) — the drop
#   is a **read-alignment requirement**, because A's constants and the
#   +0.008/+0.015 oracle identity were measured on the filtered set.
#   A nonzero "aliased row entered the loss" counter is a HARD FAIL.
# B11 The mask is derived from the ACTOR'S OWN OBSERVATION ONLY, routed
#   through `rl/common/masking` with the finite -1e8 sentinel (here the
#   masked object genuinely is a legality vector with the harness's own
#   semantics, so reusing the contract is right). Using seat 2's true
#   `get_action_mask` is available and is DELIBERATELY REJECTED: it would
#   hand the trunk the opponent's legality for free and make "what can
#   they even do" unlearnable rather than learned.
# B12 CANONICALISE **ONCE PER ROLLOUT**, not inside the epoch x minibatch
#   loop — done wrong it costs 16x and shows up as an unexplained
#   update-time regression.
# B13 `PPOAgent.update` unpacks `(..., masks, _next_masks, *rest)` then
#   `privs, next_privs = rest if rest else (None, None)` (`ppo.py:
#   634-636`). An 11th tuple element raises there, and that tuple is
#   shared by every agent fed by `train_vector`. Trivial, but the "no
#   algorithm changes outside the aux path" claim needs the caveat.
# B14 SIZE OF THE BUILD, stated up front so it is not discovered:
#   env + train + buffer really is ~20 lines (5 in `PoolPlayer`, ~12 in
#   `ShowdownEnv.step`, 2 in `train.py`, ~4 in `rollout.py`). The
#   `ppo.py` side — coefficient plumbing, the `forward(x,
#   return_features=True)` seam, canonicaliser, obs-derived legality,
#   masked aux CE, decoupled clip path, five purity seams, metric
#   namespace — is realistically **150-200 lines plus 12-16 offline
#   tests. Budget 2-3 maintainer evenings for the build, not one
#   sitting**, and ~5 evenings all-in with the blocking gates.
