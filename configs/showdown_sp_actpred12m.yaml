# 1. THE ONE LEVER
# ---------------------------------------------------------------------
#   L = L_ppo + aux_oppact_coef * L_aux
#   L_aux = mean over NON-ALIASED, labelled opponent decisions of
#           -log p(y | s), y in **L6**,
#           p = softmax MASKED to the obs-derivable legal classes.
#
# The head predicts, from the agent's own policy context, WHICH ACTION
# THE OPPONENT IS CHOOSING ON THE SAME TURN. Ground truth is free in
# self-play because the opponent is a frozen snapshot of the agent
# itself. The head is TRAIN-TIME ONLY and is not part of the evaluated
# agent. OBS_DIM stays 828; the encoder landmine is untouched.
#
# **THE L6 CANONICAL LABEL SPACE (Designer A's, VERBATIM — this is R0-L's
# own pre-stated fallback, executed because R0-L failed; §9, §14B-1):**
#   L6 = { opponent-move-slot 0, 1, 2, 3 | OTHER_MOVE | SWITCH }
#   where the slots are OUR encoder's four `_opponent_move_slots`
#   (revealed moves first, then set-prior candidates), read from the
#   BUFFERED OBS ROW'S OWN ID-SUFFIX (B4).
#   LEGALITY, all obs-derivable:
#     slot j   legal iff slot j carries a nonzero move id
#     SWITCH   legal iff the opponent has a live bench (the faint count
#              is public)
#     OTHER_MOVE  **ALWAYS legal** — which is what keeps
#              `masked_logits`' ">= 1 legal" assert from ever tripping
#              (`rl/common/masking.py:35`).
# Measured on the tapes in the 12-class space: **0.0000 of realised
# labels marked illegal on all five lanes**, and 0 on the frozen s36
# reference tape. L6 is an EXACT DETERMINISTIC COARSENING of that space
# ({0-5,10} -> SWITCH, {6-9} -> slots 0-3, {11} -> OTHER_MOVE) and a
# realised switch implies a live bench, so **the 0.0000 result transfers
# to L6 by construction.**
# Realised L6 frequencies (s26): 43.6 / 27.3 / 13.6 / 5.2 / 3.0 / 7.2 %.
#
# **THE 12-CLASS SPACE IS NOT TRAINED AND IS NOT DEAD: it is recorded as
# a FREE SECONDARY on the mechanism letter** (§5), because the probe is
# fitted on the lane's ctx, not on the head's output — an L6-trained arm
# is still gradeable on a 12-class probe at zero cost. Both control
# distributions are frozen in §5.
#
# PURITY (DESIGN §5): CLEAN, conditionally, and the condition is a seam.
# The label is the action of the agent's own current or past weights —
# §5 clause (b) verbatim. No teacher, no human data, no scripted
# opponent, no observation change. **But an action-prediction head IS a
# self-distillation channel and is inside the claim only because the
# teacher is us.** R0-1b enforces `opponent: self` with `fixed_mix` /
# `pfsp_power` at zero. **CORRECTED FROM r1 (audit D17): r1 justified
# that seam by claiming `SnapshotPool._fixed` holds
# `SimpleHeuristicsPlayer`. IT DOES NOT** — `pool.py:141` holds
# `(RandomOpponent(), HeuristicOpponent())` and `HeuristicOpponent`
# (`opponents.py:94-112`) is the **Connect-4** win-in-one/block-in-one
# bot; independently `train.py:252-260` already hard-raises
# `"fixed_mix > 0 is Connect4-only"` for any `Showdown*` env, and
# `pfsp_power` reweights only among `AgentOpponent` members and can never
# reach `_fixed`. The hazard is DOUBLY FORECLOSED. The seam is KEPT as a
# cheap belt-and-braces assert; the false rationale is deleted and
# "Reviewer 1 calls it a real find" is withdrawn. In a purity-claim repo
# a purity paragraph must not rest on a false statement about the code.
# NOVELTY: not claimed — agent-modelling-as-auxiliary-task is published
# (arXiv:1907.09597; DouZero+ hidden-hand prediction).
# DISCLOSURE LINE for any writeup, verbatim:
#   "During training the agent also predicts, from its own policy
#   context, which action its opponent is choosing on the same turn —
#   ground truth that self-play makes free, because the opponent is a
#   frozen snapshot of the agent itself. No teacher, no human data and no
#   scripted opponent is involved, and the prediction head is train-time
#   only and is not part of the evaluated agent. The predictable content
#   of that label was bounded in advance from the agent's own play (0.544
#   nats realised at five lanes, of a 1.04-1.31-nat oracle window, ~1.0
#   after the historical-pool correction) and the result is reported
#   against that bound."
