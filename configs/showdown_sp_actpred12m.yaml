# 2. BUILD CONTRACT — BINDING. EVERY LINE WAS AUDITED AGAINST SOURCE.
# ---------------------------------------------------------------------
# B1 WHERE THE LABEL COMES FROM. `rl/envs/showdown.py::PoolPlayer.
#   choose_move` (:802-817) already computes `action = self._current.move
#   (obs, mask, self._rng)` at :814 — **an int in the repo's own 10-way
#   indexing, BEFORE `action_to_order` (:817) builds the BattleOrder** —
#   and throws it away. poke-env's `SingleAgentWrapper.step` (:37-45,
#   :76) calls `choose_move(self.env.battle2)` INSIDE our step, from
#   `battle2` in its **pre-resolution** state. The label is therefore
#   genuinely simultaneous-move and costs zero inference. D18's 408-float
#   privileged block is NOT used and D18's measured ~65 us/step seat-B
#   re-encode is NOT incurred.
# B2 WHAT CROSSES THE SEAM IS AN IDENTITY, NOT THE INDEX. The raw index
#   is in the OPPONENT'S OWN frame (`0..5` = its team order, `6..9` = its
#   move order), and both orders are per-battle random permutations we
#   never observe. So `PoolPlayer` records `order.order` from the same
#   decision and the env emits
#     info["opp_choice"] = np.array([kind, id, flags], np.int32)
#   kind in {0 switch, 1 move}; id from the encoder's OWN `_species_id` /
#   `_move_id` so no second id convention can drift.
#   **THIRD FIELD ADDED IN r2 (audit D8, implementer gap 5):** r1's
#   two-field seam conflated "no decision" (a `battle2.wait` turn) with
#   "a real decision on an ALIASED turn", while B10 demands a hard-fail
#   counter for the latter and the SMOKE READS demand a separate
#   label-present fraction. `flags` bit 0 = decision present, bit 1 =
#   aliased. Aliasing is detected env-side by
#   `_move_slots_aliased(battle2)` (`showdown.py:365-369`) — **NOT** by
#   "seat 2's obs[5]", which does not exist: `showdown.py:284` sets
#   `vec[5]` for SEAT 1 only and B1 forbids the seat-B re-encode.
#   **Emit the key ALWAYS** so the vector array's shape is stable across
#   sub-envs; sentinel `(-1,-1,0)`. (Designer A's `(kind, ident)` PYTHON
#   TUPLE hits gymnasium `VectorEnv._add_info`'s object-array branch, and
#   her `ident = 0` for switches would hard-wire the label space into the
#   plumbing. B's array seam is adopted, widened by one field.)
#   Read the label after the **FIRST** inner `self._env.step`; the
#   wait-pump's later opponent choices are forced replacements, not the
#   simultaneous decision, and are DISCARDED. `battle2.wait` turns issue
#   a `DefaultBattleOrder` without calling `choose_move` and yield the
#   sentinel; those rows are dropped, not zero-filled.
#   **`PoolPlayer` MUST CLEAR its recorded choice to the sentinel before
#   each inner `_env.step`**, or a `wait` turn silently re-emits the
#   previous turn's label (audit implementer gap 6).
# B3 TIMING — THE BUG THIS DESIGN MOST FEARS, AND IT IS THE OPPOSITE OF
#   `privileged`. `rl/train.py:481-495`: `infos` from `envs.step`
#   describe the SUCCESSOR state, and `privs` is carried forward into row
#   t. **The opponent's action is produced DURING that same call and
#   belongs to row t.** It is a TRANSITION-TIME info like
#   `info["outcome"]`, not a state info like `action_mask`. Consequences,
#   both simplifications: **no carry variable, no `next_*` twin, and NO
#   RESET MERGE** (reset has no preceding turn and emits no label —
#   D18's fiddliest line does not recur). An off-by-one here silently
#   trains the head on the NEXT state's label and still learns
#   something; R0-5(a) is the deterministic test.
# B4 THE FRAME COMES FROM THE BUFFERED OBS ROW'S OWN ID-SUFFIX — this is
#   what makes the anti-leak property STRUCTURAL rather than argued.
#   `_fill_ids` (`showdown.py:324-345`) writes `obs[-20:][6:12]` =
#   opponent species in OUR reveal order (:338-339) and `obs[-20:][16:20]`
#   = the opponent active's four `_opponent_move_slots` ids (:343-345).
#   Canonicalisation reads THAT row. A switch-in that
#   `battle1.opponent_team` only learns about AFTER `self._env.step(...)`
#   therefore cannot become a nameable class: **the label can only name
#   entities the actor could see.** If canonicalisation were done
#   env-side post-step it would leak. Assert it (replay assertion in
#   R0-5(d)), do not comment it.
# B5 NO ENCODER CHANGE. No change to `embed_battle`, `_fill_ids`,
#   `OBS_DIM` (828), or the observation/action spaces. The actor's inputs
#   at decision time are byte-identical to the control's.
# B6 **THE HEAD IS A POINTER SCORER OVER SIX SLOTS, OWNED BY `PPOAgent`,
#   NOT BY THE ACTOR** (Designer A's L6 head, verbatim):
#     logit_j      = aux_scorer([ctx || opp_move_token_j]) , j = 0..3
#     logit_SWITCH = aux_scorer([ctx || opp_bench_pool_token])
#     logit_OTHER  = aux_scorer([ctx || null_token])
#     + a 6-dim `aux_slot_bias`.
#   **DECLARED AT RATIFICATION (audit D7 / implementer gaps 2 and 4 —
#   r1 left these as an either/or and the YAML declared neither):**
#     `opp_bench_pool_token` = max-pool of the EXISTING `mons[:, 6:]`
#       (B,6,128 — real, built at `entity_deepsets.py:295-297`, already
#       sliced at :309) over the opponent's LIVE, NON-ACTIVE bench slots;
#       the all-zero vector when the bench is empty, in which case SWITCH
#       is masked illegal anyway. **Adds NO parameters.**
#     `null_token` = ONE **LEARNED** 128-d parameter vector. **Adds 128.**
#     `aux_head_gain` scales the scorer's FINAL layer only (the net's own
#       `init_head` convention); `aux_slot_bias` is initialised to ZERO
#       and is NOT scaled (audit implementer gap 10).
#
#   **B6a — THE DEFECT THAT WOULD HAVE STALLED THE BUILD, AND ITS EXACT
#   FIX. THE OPPONENT MOVE TOKENS DO NOT EXIST IN THE NETWORK.**
#   r1 wrote "the 4 opponent move vectors" as if they were sitting there.
#   Read the source: `entity_deepsets.py:298-302` runs
#     own_moves = move_net(cat([tok["moves"][:, :4],
#                               move_emb(tok["move_ids"][:, :4])], -1))
#   — **own moves ONLY** — and the module docstring says so outright
#   (:30-31): "the 4 opponent-move tokens exist for the attention screen
#   and are **not run through the subnet here**." The tokenizer DOES emit
#   them (`:67` `moves` is (B,8,MOVE_DIM) = own 4 || opp 4; `:70`
#   `move_ids` is (B,8) = own 4 then opp 4); nothing consumes slots 4:8.
#   **THE FIX, SPECIFIED EXACTLY — apply the EXISTING subnet and
#   embedding to the existing-but-unused tokens, adding NO new module and
#   NO new parameters:**
#     opp_moves = self.move_net(torch.cat(
#         [tok["moves"][:, 4:],
#          self.move_emb(tok["move_ids"][:, 4:].clamp(
#              0, self.tokenizer.move_vocab - 1))], dim=-1))   # (B,4,128)
#   The pattern already exists verbatim at `_priv_features:280-283` and
#   the widths are compatible. This pass runs ONLY inside the aux path
#   (i.e. only when `aux_oppact_coef > 0` and only during `update`), and
#   `forward(x)` is unchanged, so the acting network is untouched.
#
#   **B6b — THE CONSEQUENCE FOR THE ONE-LEVER CONTRACT, STATED PLAINLY.**
#   Because `move_net` and `move_emb` are SHARED trunk weights, the aux
#   gradient now flows into them through a path the policy never used.
#   **D25 is therefore an ACTOR-SIDE LEVER THAT MODIFIES SHARED
#   PARAMETERS**, not a bolt-on: after step 1 the trained weights of
#   `move_net`, `move_emb`, `mon_net`, `species_emb` and `ctx_net` differ
#   from the control's. That is the mechanism, and it is also C6.
#   **WHAT REMAINS BIT-IDENTICAL, and each is a gate:**
#     (i)   the ACTING forward path — `forward(x)` untouched, obs/action
#           spaces untouched, OBS_DIM 828 (B5, R0-1);
#     (ii)  actor parameter COUNT 626,059 and `actor.state_dict()` KEY
#           SET — the head is agent-owned, so `eval_checkpoint.py`,
#           `score_ladder.py` and `d22_dormant_rank.py` run UNMODIFIED
#           (R0-2b);
#     (iii) actor and critic INITIAL weights at a fixed seed, bit-
#           identical to the aux-off control, because head construction
#           comes last in the global RNG stream (R0-3b) — D18 could not
#           have this;
#     (iv)  `loss/grad_norm` and `loss/grad_clip_frac` on a fixed batch,
#           lever-on vs lever-off, because the aux gradient is clipped
#           separately and added after the PPO clip (B9, R0-9);
#     (v)   the EVAL forward — the opponent-move pass is never executed
#           at eval; R0-7's forward-hook count of 0 over a full eval pass
#           is the check.
#   **NOT bit-identical, and not claimed to be: the trunk's trained
#   weights, and Adam's second moment for every shared parameter (B9,
#   C9).**
#
#   A plain `Linear(ctx -> K)` head is ILL-POSED and this is measured,
#   not argued: `ctx` is `ctx_net` over MAX-POOLED team features
#   (:306-315), so opponent slot identity is destroyed before `ctx`
#   exists, and every logit in this net is `scorer([ctx || entity_i])`
#   (:322-326). The decisive evidence is Designer A's positive control:
#   the identical linear ctx probe cannot decode **the actor's own greedy
#   action** (gain **-0.061**, worse than the marginal). Any ctx-only
#   head or ctx-only estimator would have produced a confident null on an
#   architecture that cannot express the target. This retires D19-A's
#   co-primary B permanently.
# B7 **HEAD WIDTH 96.** Live arithmetic at the ratified `trunk_kwargs`.
#   The scorer is Linear(512, w) + Linear(w, 1) = 514w + 1 params, plus 6
#   slot biases, plus the 128-d learned null token (B6):
#     OBS_DIM 828 · actor 626,059 · critic 494,849
#     ACTOR_PARAM_CEILING 681,994 · slack 55,935
#       w    scorer+bias   +null    actor+aux    verdict
#      32      16,455     16,583      642,642    OK
#      64      32,903     33,031      659,090    OK   (A's pick)
#    **96      49,351     49,479    **675,538**  OK, headroom 6,456**
#     128      65,799     65,927      691,986    OVER by 9,992
#     256     131,591    131,719      757,778    OVER by 75,784
#   **THE OPERATIVE ASSERTED NUMBERS ARE actor 626,059 AND actor+aux
#   675,538** (learned-null variant, declared in B6). If the null token
#   were a CONSTANT the totals would be 675,410 / 691,858 / 757,650; that
#   variant is NOT taken and is recorded only so the r1 constants are
#   traceable. **This dissolves audit D7 by adoption rather than by
#   patching: r1 shipped a 12-class w=96 row (49,357 / 675,416 / 6,578)
#   next to 6-class rows for every other width; with L6 adopted the whole
#   table is one label space again.** Provenance, since r1 got it wrong:
