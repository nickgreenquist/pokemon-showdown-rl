                           # -> 96 -> 1, 12 classes. 49,357 params;
                           # actor+aux 675,416 <= 681,994 (headroom 6,578).
                           # [128] = 691,858 and [256] = 757,650 fail the
                           # strict actor+aux accounting — R0-2 unit test.
  aux_head_gain: 0.01      # the net's own init_head convention: Xavier, zero
                           # biases, final layer x0.01. Not a free number —
                           # ctx has no LayerNorm (RMS 0.54 at init -> ~82 at
                           # 12M) while the entity half IS LayerNorm'd.
  aux_max_grad_norm: 0.5   # aux gradient clipped SEPARATELY, added after the
                           # PPO clip (R0-9). Control grad_clip_frac is 0.90,
                           # so a coupled term would be a covert policy-LR cut.
  trunk_kwargs:            # byte-identical to showdown_sp_struct12m.yaml
    species_vocab: 152
    move_vocab: 166
    embed_dim: 64
    entity_dim: 128
    pool: max
    ctx_sizes: [384, 384]
    scorer_sizes: [256]
    value_sizes: [384, 384]
  hidden_sizes: [512, 512] # unused when trunk != mlp; kept so a
                           # trunk: mlp rerun of this file is exact
  lr: 2.5e-4
  lr_anneal_steps: 0
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
