# 4. CO-PRIMARY A — WIN RATE. CREDIT IS LIVE, AND UNDERPOWERED.
# ---------------------------------------------------------------------
# PROTOCOL (locked, DESIGN §8): FINAL checkpoint, deterministic policy,
# ties as non-wins, vs `SimpleHeuristicsPlayer`, **3000 battles/seed**, 5
# seeds pooled = 15,000. Both encoder env vars at every eval.
# (DESIGN §8's 3000 wins over CLAUDE.md's stale 1000 — STATUS item 2.)
# COMPARATOR (frozen, the 5-seed Rung-2 refresh): s26 0.5633 / s27 0.5683
# / s28 0.5210 / s50 0.5763 / s51 0.4937 -> **pooled 0.54452, sd
# 0.03558.** Re-derived independently by both reviewers to 4 d.p.
#
#   **CREDIT LINE (DESIGN §8, RESTATED IN FULL, VERBATIM, INCLUDING THE
#   LARGER-OF CLAUSE): a lever is credited iff pooled delta >= +0.025
#   AND >= 2*se_diff, where se_diff is the LARGER of the pooled-binomial
#   se_diff and the seed-clustered se_diff, the latter computed from the
#   per-seed finals at read time.**
#
#   ARITHMETIC (verified by both reviewers):
#     binomial se_diff at 15,000 vs 15,000, p~0.55 = 0.005745 -> 2*se =
#       0.011489 < 0.025, so **the binomial can NEVER govern**; the
#       LETTER BAR is 0.54452 + 0.025 = **0.5695**.
#     seed-clustered 2*se_diff = 2*sqrt(s_T^2/5 + 0.03558^2/5):
#        s_T     2*se_clus    OPERATIVE BAR
#        0.000    0.03182      0.5763   <- comparator-limited FLOOR
#        0.020    0.03651      **0.5810**
#        0.026    0.03942      **0.5839**
#        0.036    0.04527      **0.5898**
#        0.049    0.05416      **0.5987**
#        0.060    0.06239      0.6069
#     Every 12M arm ever measured here sits in that band (Rung-2 0.0356,
#     D18 0.0364, D23 0.0491), so the realistic bar is **0.584-0.599**.
#     The bar is COMPARATOR-LIMITED: no treatment lane count moves the
#     0.5763 floor.
#
#   POWER, PRE-STATED (200k-draw sim, comparator FIXED at its measured
#   values so all randomness is the treatment arm). Second row of each
#   cell is P(letter-met recording band):
#        delta    s_T=.020  .026    .036    .049
#        +0.020    0.040   0.062   0.081   0.091  | band .25 .27 .30 .32
#        +0.025    0.113   0.128   0.134   0.129  | band .39 .37 .36 .37
