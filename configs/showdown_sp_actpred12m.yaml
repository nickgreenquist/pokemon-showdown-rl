# 10. CONFOUNDS, DISCLOSED
# ---------------------------------------------------------------------
# C1 CAPACITY / GENERIC-AUX-TASK. The trained (not acting) stack gains
#   49,357 params and their Adam state. **If D25 credits, "belief
#   shaping" vs "an auxiliary loss helps" is NOT separable from this
#   read.** The only clean control is the shuffled-label placebo — §12.
# C2 HORIZON: 12M under-tests. A null closes the family **AT 12M FOR THIS
#   CHAPTER** — a budget decision under D17's cap — not a refutation of
#   the 50M thesis.
# C3 **THE HEAD MODELS OURSELVES.** In mirror/pool self-play the opponent
#   IS our own policy, so the belief is a self-model. That is what makes
#   the ground truth free and the information large. Three distinct
#   failure modes hide in it and they need different evidence:
#   (a) STATE-INDEPENDENT SELF-MARGINAL — the head fits P(class), which
#       is just our own action-type mix (controls: P(switch) 0.233-0.241,
#       P(move) 0.759-0.767, near-flat within each group). Designed
#       against: `aux_slot_bias` absorbs the marginal at the optimum and
#       receives no trunk gradient. Detected by the g statistic, which is
#       the residual ABOVE the mask-renormalised marginal.
#   (b) SELF-COPYING — the head implements "what would I do in that
#       seat", re-deriving the policy rather than inferring anything.
#       Not WRONG (in a symmetric game the mirror IS the correct opponent
#       model) but it means the aux loss added no information the trunk
#       did not already contain, which is a different claim. Detected by
#       S7 and S8.
#   (c) ENDOGENOUS LABELS — the lever changes the policy, which changes
#       the pool, which changes the labels, so raw `aux_ce` is NOT
#       comparable across arms. **Handled by construction: every
#       mechanism read is on the FIXED REFERENCE TAPE (§5).** Also worth
#       stating as a mechanism possibility, not only a nuisance: an agent
#       that predicts its own pool better may simply have become more
#       self-consistent, which is not the same as being stronger.
# C4 EVAL-OPPONENT MISMATCH: the head is discarded at eval and the
#   evaluated opponent (SH) is not the modelled one. Transfer is
#   untested. **The lever's claim is REPRESENTATIONAL — the trunk learns
#   to reason about a simultaneous-move opponent at all — NOT "we ship an
#   opponent model".**
# C5 CTX-FREE DECODABILITY: 88-95% of the realised structure survives
#   removing ctx, and the ablated probe is a linear read of the RAW
#   OBSERVATION. Quantified in advance; §5 is the test; F2 is the branch.
# C6 NEW INPUT PATHWAY: `move_net` / `move_emb` currently never see
#   opponent move tokens; the aux head feeds them. A representation
#   change could come from those subnets seeing 2x the data rather than
#   from belief. The alternative that removes it — a private move subnet
#   for the aux head — would gut the mechanism claim by removing the
#   trunk gradient from the four move classes. **We share and disclose.**
# C7 CADENCE: the comparator's 120 x 100 in-training SH evals draw off
#   the global RNG stream that `SimpleHeuristicsPlayer` shares with
#   training; D25 matches it verbatim, so this rung is cadence-clean
#   against the comparator and NOT against D18/D23.
# C8 MEASUREMENT n: the §0 probes were fit on ~4.7-4.9k rows and the
#   raw-obs probe's learning curve was still RISING (0.27 at n = 1.2k ->
#   0.43 at n = 5.0k). **0.544 is a LOWER bound on what a head trained on
#   12M steps can reach**; the upper bound is the oracle (~1.0
#   pool-corrected). Both bounds are in this header so neither can be
#   quoted alone.
# C9 ADAM SECOND MOMENT: the irreducible residue of B9 — not fixable for
#   a shared trunk.
