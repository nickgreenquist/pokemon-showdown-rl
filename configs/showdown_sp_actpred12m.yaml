# 1. THE ONE LEVER
# ---------------------------------------------------------------------
#   L = L_ppo + aux_oppact_coef * L_aux
#   L_aux = mean over NON-ALIASED, labelled opponent decisions of
#           -log p(y | s), y in the 12-class canonical space,
#           p = softmax MASKED to the obs-derivable legal classes.
#
# The head predicts, from the agent's own policy context, WHICH ACTION
# THE OPPONENT IS CHOOSING ON THE SAME TURN. Ground truth is free in
# self-play because the opponent is a frozen snapshot of the agent
# itself. The head is TRAIN-TIME ONLY and is not part of the evaluated
# agent. OBS_DIM stays 828; the encoder landmine is untouched.
#
# THE 12-CLASS CANONICAL LABEL SPACE (Designer B's; Reviewer 1
# MUST-FIX 5; ratified by the gate, which is defined on it):
#   0-5  opponent switches to OUR opponent-reveal slot i
#        legal iff revealed AND not fainted AND not active
#   6-9  opponent uses the move in OUR opponent-move-slot j
#        legal iff that slot carries a nonzero move id
#   10   opponent switches to a mon we have NEVER SEEN
#        legal iff fewer than 6 revealed
#   11   opponent uses a move not in our four slots (incl. recharge /
#        Struggle / id 0) — ALWAYS legal, which is what keeps
#        `masked_logits`' ">= 1 legal" assert from ever tripping
# Measured on the tapes: **0.0000 of realised labels marked illegal on
# all five lanes** — the mask is implementable and correct.
# **TRAIN ON 12; REPORT L6 BY MARGINALISING THE SAME FITTED 12-WAY
# POSTERIORS** ({0-5,10} -> SWITCH, {6-9} -> slots 0-3, {11} ->
# OTHER_MOVE — an exact deterministic coarsening). That preserves
# Designer A's oracle-validated L6 constants as the manipulation-check
# scale at zero cost, and the residual bias is conservative (a 12-trained
# head marginalised to L6 can only be handicapped by gradient dilution,
# so a pass is trustworthy).
#
# PURITY (DESIGN §5): CLEAN, conditionally, and the condition is a seam.
# The label is the action of the agent's own current or past weights —
# §5 clause (b) verbatim. No teacher, no human data, no scripted
# opponent, no observation change. **But an action-prediction head IS a
# self-distillation channel and is inside the claim only because the
# teacher is us.** `SnapshotPool._fixed` really does hold a
# `HeuristicOpponent`, so a mis-set `fixed_mix`/`pfsp_power` would have
# the head DISTILLING SimpleHeuristicsPlayer, which §5 forbids. Hence
# R0-1b, which raises loudly.
# NOVELTY: not claimed — agent-modelling-as-auxiliary-task is published
# (arXiv:1907.09597; DouZero+ hidden-hand prediction).
# DISCLOSURE LINE for any writeup, verbatim:
#   "During training the agent also predicts, from its own policy
#   context, which action its opponent is choosing on the same turn —
#   ground truth that self-play makes free, because the opponent is a
#   frozen snapshot of the agent itself. No teacher, no human data and no
#   scripted opponent is involved, and the prediction head is train-time
#   only and is not part of the evaluated agent. The predictable content
#   of that label was bounded in advance from the agent's own play (0.544
#   nats realised at five lanes, of a 1.04-1.31-nat oracle window,
#   ~1.0 after the historical-pool correction) and the result is reported
#   against that bound."
#
