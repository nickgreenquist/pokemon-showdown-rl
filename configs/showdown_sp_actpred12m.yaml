env_id: Showdown-v0
seed: 52
total_steps: 12000000
eval_every: 100000          # struct12m cadence VERBATIM — the 5-seed
eval_episodes: 100          # comparator was run at it (C7)
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_sp_actpred12m_s52
logger: wandb
eval_win_rate: true
env_kwargs:
  opp_action: true         # LEVER, env side: capture the pool opponent's
                           # chosen action IDENTITY (kind, id, flags) at every
                           # simultaneous decision. NOT env_kwargs.privileged
                           # — D18's plumbing is unused and BOTH
                           # env_kwargs.privileged and agent.privileged_dim
                           # are ABSENT by R0-1. Must be INERT at every eval
                           # site (make_eval_env passes it; R0-2b).
selfplay:                  # identical to showdown_sp_struct12m.yaml
  opponent: self           # REQUIRED by the purity seam R0-1b
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 150
  latest_prob: 0.8
agent:
  algo: ppo
  trunk: entity_deepsets   # the credited Rung 2 / 50M treatment, unchanged
  aux_oppact_coef: 0.1     # THE LEVER. PROVISIONAL: R0-10b picks the
                           # starting value offline and R0-10's smoke sets
                           # the operative one from {0.05, 0.1, 0.25, 0.5}
                           # BEFORE launch. This is the ONLY line the gates
                           # may change; no in-rung re-tune. 0.0 = exact no-op.
  aux_label_space: l6      # L6 = {opp-move-slot 0..3 | OTHER_MOVE | SWITCH}.
                           # NOT a free choice: R0-L's pre-stated fallback,
                           # executed because R0-L FAILED 0-of-2 at its named
                           # lanes. Stamped in meta.yaml by R0-1 so it cannot
                           # be changed silently at launch.
  aux_scorer_sizes: [96]   # pointer scorer over [ctx 384 || entity 128]
                           # -> 96 -> 1, 6 classes. 49,479 params with the
                           # DECLARED learned 128-d null token; actor+aux
                           # 675,538 <= 681,994 (headroom 6,456).
                           # [128] = 691,986 and [256] = 757,778 fail the
                           # strict actor+aux accounting — R0-2 unit test.
  aux_head_gain: 0.01      # the net's own init_head convention: Xavier, zero
                           # biases, FINAL scorer layer x0.01 (aux_slot_bias
                           # init zero, NOT scaled). Not a free number —
                           # ctx has no LayerNorm (RMS 0.54 at init -> ~82 at
                           # 12M) while the entity half IS LayerNorm'd.
  aux_max_grad_norm: 0.5   # aux gradient clipped SEPARATELY, added after the
                           # PPO clip (R0-9). Control grad_clip_frac is 0.8995,
                           # so a coupled term would be a covert policy-LR cut.
  trunk_kwargs:            # byte-identical to showdown_sp_struct12m.yaml
    species_vocab: 152
    move_vocab: 166
    embed_dim: 64
    entity_dim: 128
    pool: max
    ctx_sizes: [384, 384]
    scorer_sizes: [256]
    value_sizes: [384, 384]
  hidden_sizes: [512, 512] # unused when trunk != mlp; kept so a
                           # trunk: mlp rerun of this file is exact
  lr: 2.5e-4
  lr_anneal_steps: 0
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
