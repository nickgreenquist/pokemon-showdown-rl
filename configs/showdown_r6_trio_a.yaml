# BODY: the W base with ONLY the diffs stated above (tests/test_r6_trio_configs.py pins
# the diff set against configs/showdown_monster200m_w.yaml).
env_id: Showdown-v0
seed: 304                  # lanes via --seed 304 / 312 / 320 (rule 2)
total_steps: 200000000     # JOURNEY 10's dose, repeated (R6)
eval_every: 250000         # descriptive in-loop evals only
eval_episodes: 100
num_envs: 8                # x rollout_steps = the update budget
torch_threads: 1
checkpoint_every: 500000
run_name: r6_trio_a_s304   # lanes 2/3 via --run-name (the launcher derives it)
logger: wandb
eval_win_rate: true
collector:
  mode: engine             # A-1-accepted, signed delta -0.00436 travels forever
  k: 8                     # DECLARED, NOT ASSUMED. Do not raise.
  team_bank: data/engine/teams_a1_5000000.bin
  min_bank_pairs: 1000000
  learner_seat: p1
  outcome_targets: true    # TRIO A, key 1 of 3: IDEAS 4.11's three terminal targets per episode
env_kwargs:
  opp_action: true         # D25 pair, half 1 of 2. MANDATORY.
  seat_tag: r6ta           # TRIO A (distinct from every fleet and screen tag)
selfplay:
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 5
  latest_prob: 0.8
agent:
  algo: ppo
  trunk: entity_deepsets
  l2_init_decay: 0.02      # W base: D23's regenerative L2 toward theta0
  aux_oppact_coef: 0.1     # D25 pair, half 2 of 2. MANDATORY.
  aux_label_space: l6
  aux_scorer_sizes: [96]
  aux_head_gain: 0.01
  aux_max_grad_norm: 0.5
  aux_outcome_coef: 0.1    # TRIO A, key 2 of 3: coef * mse over the three targets, inside the critic's loss
  trunk_kwargs:
    species_vocab: 152
    move_vocab: 166
    embed_dim: 64
    entity_dim: 128
    pool: max
    ctx_sizes: [384, 384]
    scorer_sizes: [256]
    value_sizes: [1024, 1024]   # W base: the 1024 critic (1,807,489 params before the head)
    value_aux_out: 3           # TRIO A, key 3 of 3: the critic's outcome head (+3,075 params); the actor ignores it
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  lr_anneal_steps: 200000000  # == total_steps. THE ANNEAL TRAP.
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 3840
  epochs: 4
  minibatches: 120
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
