# =====================================================================
env_id: Showdown-v0
seed: 70
total_steps: 12000000
eval_every: 100000          # struct12m cadence VERBATIM (C-A5): clean
eval_episodes: 100          # against D25 AND the Rung-2 comparator
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_sp_zeroinfo12m_s70
logger: wandb
eval_win_rate: true
env_kwargs:
  opp_action: true         # UNCHANGED from D25: the seam still captures
                           # the real labels — their ONLY surviving role
                           # is the canonicalise row filter (valid/allow),
                           # so trained rows match D25's exactly. The
                           # trained TARGET never reads them
                           # (rl/networks/zeroinfo.py; Z1-3).
selfplay:                  # identical to showdown_sp_struct12m.yaml
  opponent: self           # REQUIRED by the purity seam
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 150
  latest_prob: 0.8
agent:
  algo: ppo
  trunk: entity_deepsets   # the credited Rung 2 treatment, unchanged
  aux_oppact_coef: 0.1     # D25's operative value, UNCHANGED — the dose
                           # knob stays where the treatment had it; the
                           # dose GATES (header) judge what was delivered
  aux_synthetic: true      # THE LEVER, THE ONLY DIFF vs D25 (R0-a):
                           # train the aux head on the frozen zero-info
