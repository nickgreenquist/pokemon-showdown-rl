# Phase 4 probe arm: entropy floor — connect4_pool.yaml with entropy_coef
# 5x the baseline (0.01 -> 0.05). The chunk-2 pathfinder measured entropy
# collapsing 1.91 -> 0.03-0.12 by 2M under 0.01, taking game-tree coverage
# with it (8-133 distinct games of 200); this arm asks whether paying more
# for entropy keeps coverage alive. Second divergence, shared by all three
# probe arms per the chunk-4 method note: checkpoint_every 100000, so
# score_ladder yields a 20-point vs-random CURVE to align against entropy's
# descent (that separates "entropy_coef too low" from "pool insufficiently
# diverse"). Everything else is the locked campaign config.
env_id: Connect4-v0
seed: 0
total_steps: 2000000
eval_every: 50000
eval_episodes: 400   # at 100 the se on eval/return_mean is 0.093 — rungs closer than ~120 Elo are a coin flip
num_envs: 8
torch_threads: 1     # measured 3.9x faster than torch's default on this env
checkpoint_every: 100000  # probe arms: 20-point curves (chunk-4 method note)
run_name: connect4_pool_entropy_s0
logger: wandb
eval_win_rate: true
selfplay:
  opponent: self
  eval_opponent: heuristic
  pool_size: 20
  push_every_updates: 20
  latest_prob: 0.8
agent:
  algo: ppo
  hidden_sizes: [128]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128  # 8 envs x 128 = 1024 per update -> ~1953 updates at 2M
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.05  # THE lever: 5x the collapsing baseline
  value_coef: 0.5
  max_grad_norm: 0.5
