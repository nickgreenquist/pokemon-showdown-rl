# PPO on Hopper-v5 — continuous-track benchmark run. Every number is identical
# to configs/halfcheetah_ppo.yaml, which carries the full annotation: recipe
# provenance, the per-knob divergences from the discrete track, the anchor
# numbers and the v4->v5 caveats. One hyperparameter set for all three envs;
# per-env tuning is the probe tier, as it was in Phase 1.
#
# Env note: unlike HalfCheetah, Hopper genuinely terminates (it falls over), so
# episode length is itself a learning signal here — a rising rollout/
# episode_length is the early health readout. v4->v5 transfer for the published
# anchor (2383 +/- 272) is near-clean: v5 stopped paying the healthy-reward
# bonus on unhealthy steps, worth roughly -1 per episode.
env_id: Hopper-v5
seed: 0
total_steps: 1000000
eval_every: 50000
eval_episodes: 10
run_name: hopper_ppo
device: cpu
num_envs: 1
normalize_obs: true
normalize_reward: true
logger: wandb
agent:
  algo: ppo
  hidden_sizes: [64, 64]
  lr: 3.0e-4
  lr_anneal_steps: 1000000
  gamma: 0.99
  gae_lambda: 0.95
  rollout_steps: 2048
  epochs: 10
  minibatches: 32
  clip_eps: 0.2
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5
