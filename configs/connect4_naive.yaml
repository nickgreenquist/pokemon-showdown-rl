# Phase 4 naive arm: pool_size 1 — self-play against a single lagged copy of
# the learner (a snapshot at most 20 updates old), which is what the
# self-play literature means by naive self-play. This is the arm the chunk-4
# forgetting demonstration expects to cycle.
#
# One-key diff discipline: identical to connect4_pool.yaml except pool_size
# (and run_name) — see that file for the annotated rationale of every other
# number.
env_id: Connect4-v0
seed: 0
total_steps: 2000000
eval_every: 50000
eval_episodes: 400   # at 100 the se on eval/return_mean is 0.093 — rungs closer than ~120 Elo are a coin flip
num_envs: 8
torch_threads: 1     # measured 3.9x faster than torch's default on this env
checkpoint_every: 200000  # the ladder the chunk-3 tournament plays
run_name: connect4_naive_s0
logger: wandb
eval_win_rate: true
selfplay:
  opponent: self
  eval_opponent: heuristic
  pool_size: 1        # THE one-key diff: at 1, push replaces the sole member
  push_every_updates: 20
  latest_prob: 0.8    # inert at pool_size 1; kept for the one-key diff
agent:
  algo: ppo
  hidden_sizes: [128]
  lr: 2.5e-4
  gamma: 1.0
  gae_lambda: 0.95    # 1.0 is the pre-registered probe arm at the pathfinder
  rollout_steps: 128  # 8 envs x 128 = 1024 per update -> ~1953 updates at 2M
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
