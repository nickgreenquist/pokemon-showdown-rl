disclosures_that_travel:
  - "A-1's signed collector delta -0.00436 on the fixed build bd3d06a rides every gen-1 credit sentence produced on this path, forever, as N-COLL's +0.02322 does for async. A bare 'A-1 passed' is NOT an attribution. No gen-1 number ever pools across collectors."
  - "k = 8, named in every throughput or cost sentence. The engine's production default is 256 and this fleet is not at it."
  - "the engine build sha, the static-tables fingerprint and the team-bank sha256, from meta['engine'], identical across all nine lanes"
  - "arms A and B are init-paired at a shared seed; arm C is NOT, because privileged_dim re-rolls the actor (442.300 -> 375.635 at seed 104, identical param count)"
  - "THREE seeds, not five — a disclosed deviation in the NON-conservative direction from the D23-onward 5x3000 practice"
  - "team-bank recurrence at this dose: 73.5% of a lane's battles are the first use of their pair (96.2% at A-1's 12M), 17.0% fleet-wide. Common to all three arms; cannot bias a contrast, can bias the level."
  - "the privileged encode is UNPRICED — arms B and C pay a second full 828 encode per learner row; the bound is <= ~3% of wall and the measurement has never been run. Quote it as a bound."
  - "TWO credit-seeking contrasts against one shared control"
  - "FP@20's two standing disclosures, on every FP number, forever: the equivalence test is weakly powered and the point estimate flatters us. Name the budget."
  - "vs-SH is NEVER a ladder number, in either direction. The ~40% GXE conversion is RETIRED."
  - "the vs-SH primary is the weakest axis available at this dose and its bar is 0.025 only if the seed spread is as tight as the banked 100M fleet's; at that fleet's own 2-df CI upper end the bar is ~0.047"

what_this_run_does_not_test:
  - "k = 256. K-1 is PARKED not withdrawn and its MDE is wider than its band. A null here is not evidence about staleness."
  - "the attention/transformer trunk. JOURNEY 11.6, POST-LADDER by the maintainer's 2026-09-11 ruling. Architecture EXPIRES at this run's launch. A null here is not evidence about architecture, and a credit here is not evidence that architecture would not have been better."
  - "depth >= 2. No code exists. P-BS is a DEPTH-1 read with a margin gate."
  - "dose beyond 100M. The measured 50M->100M FINISHED-TO-FINISHED gain is +0.00944 vs SH (cell SN-N). NOT a dose experiment; no branch may be reported as one. [DISTINCT from S-SHAPE, which is the within-run rung curve W_hi 0.77764 vs W_lo 0.74839 = +0.02925, cell SS-CLIMB, and which carries its own mandatory non-comparability sentence. JOURNEY 10 fuses both in one clause; quote them apart.]"
  - "the search budget. Every search number here is depth-1 at the S3 doses. Wang's budget is 160x our wall clock and 250-500x our determinizations. A null on P-BS does not close the budget axis."
  - "the both-seat harvest (IDEAS 4.1). OFF, and refused in code whenever the privileged block is needed."
  - "league composition. pool_size 20, latest_prob 0.8, push_every_updates 5 in all three arms."
  - "whether the privileged block is the RIGHT information. The whole hidden team was worth ~+0.045 EV of return variance and D19 found 88-90% of it recoverable as a deterministic cap mask. Arm C is a variance-reduction hypothesis at scale, not an information one."

ratified_decisions: {}
verdict_authorized: false
launch_authorization: null

launch_commands:
  note: >-
    HANDED OVER — CLAUDE.md rule 4. One command per block, no inline
    comments, state-changing steps separate. The <command>/</command>
    sentinels and the fenced form are in
    docs/proposals/MONSTER_PREREG_NOTES.md; these are the payloads.
    Distinct --seed per lane; distinct seat_tag per arm (in the configs).
    Launch from a CLEAN TREE with the docs committed.
  preflight:
    - "cd /Users/nickgreenquist/Documents/Projects/pokemon-showdown-rl && git status --porcelain && df -h . | tail -1 && vm_stat | head -6"
    - "cd /Users/nickgreenquist/Documents/Projects/pokemon-showdown-rl/showdown && nohup node pokemon-showdown start --no-security >> /Users/nickgreenquist/Documents/Projects/pokemon-showdown-rl/logs/showdown_server.log 2>&1 < /dev/null &"
  wave1:
    width: 6
    stagger_seconds: 90
    lanes:
      - {arm: A, seed: 104, run_name: monster100m_a_s104, config: configs/showdown_monster100m.yaml}
      - {arm: B, seed: 104, run_name: monster100m_b_s104, config: configs/showdown_monster100m_b.yaml}
      - {arm: C, seed: 104, run_name: monster100m_c_s104, config: configs/showdown_monster100m_c.yaml}
      - {arm: A, seed: 112, run_name: monster100m_a_s112, config: configs/showdown_monster100m.yaml}
      - {arm: B, seed: 112, run_name: monster100m_b_s112, config: configs/showdown_monster100m_b.yaml}
      - {arm: C, seed: 112, run_name: monster100m_c_s112, config: configs/showdown_monster100m_c.yaml}
  wave2:
    width: 3
    stagger_seconds: 90
    lanes:
      - {arm: A, seed: 120, run_name: monster100m_a_s120, config: configs/showdown_monster100m.yaml}
      - {arm: B, seed: 120, run_name: monster100m_b_s120, config: configs/showdown_monster100m_b.yaml}
      - {arm: C, seed: 120, run_name: monster100m_c_s120, config: configs/showdown_monster100m_c.yaml}
  per_lane_form: >-
    cd <REPO> && POKEMON_RL_ENCODER_V2=1 POKEMON_RL_ENCODER_IDS=1 nohup
    /opt/anaconda3/envs/pkmn-engine-port/bin/python -m rl.train --config
    <CONFIG> --seed <SEED> --run-name <RUN_NAME> >
