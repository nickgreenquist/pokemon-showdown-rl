  resume_form: >-
    cd <REPO> && POKEMON_RL_ENCODER_V2=1 POKEMON_RL_ENCODER_IDS=1 nohup
    /opt/anaconda3/envs/pkmn-engine-port/bin/python -m rl.train --resume
    runs/<RUN_NAME> > runs/<RUN_NAME>.nohup.log 2>&1 < /dev/null &
