power:
  primary_axis: vs-SH, the locked protocol
  primary_axis_is_the_weakest_available: true
  arithmetic_source: configs/showdown_sp_100m.yaml:141-168 (that pre-reg's own)
  measured_axis_gap: >-
    at p ~= 0.79 against p ~= 0.47, vs-SH needs ~1.56x more TRUE improvement
    to clear the same absolute +0.025 floor. At a matched logit gain of 0.10
    and sigma_seed 0.008, P(credit) is 0.488 off-FP@20 against 0.067 vs-SH.
    That pre-reg concluded, verbatim, that a vs-SH verdict axis "would
    pre-register a near-guaranteed failure sentence", and its item E1
    promoted off-FP@20 FOR THAT ROUND ONLY, noting it "does not carry itself
    forward".
  bar_computed_in_advance:
    n_per_seed: 3000
    k: 3
    p_assumed: 0.79
    se_binomial_per_arm: 0.00429
    se_diff_binomial: 0.00607
    seed_sd_reference: 0.00455      # the banked 100M fleet's own vs-SH s_T
    se_diff_clustered_at_that_sd: 0.00372
    governing: binomial
    two_se_gov: 0.01214
    BAR: 0.025                       # the floor governs
    and_the_seed_sd_is_2df: >-
      the 95% interval on sigma_seed is [0.521, 6.285] x s — a factor of 12.
      At the upper end (0.0286) the clustered se_diff is 0.0234, 2*se_gov is
      0.0467, and credit would require +0.047. BOTH NUMBERS ARE QUOTED
      WHEREVER s_T IS.
  the_two_figures_this_prereg_is_required_to_print:
    P_credit_given_true_plus_0p025_at_k3_n3000: 0.45
    P_credit_gloss: "THE BAR IS A COIN FLIP AT ITS OWN EFFECT SIZE. Raising k is the only thing that moves it, which is what makes the freed-lane branch (RWM-12) a statistical decision and not a tidiness one."
    P_credit_on_vs_SH_at_p_0p789: 0.07
    credit_requires_pooled_at_least: 0.81367     # 0.78867 + 0.025
    already_pre_registered_at: "configs/showdown_sp_100m.yaml:141-145 and :205-213 — this file re-prints the saturation argument rather than discovering it"
    both_figures_ride_every_null_this_run_produces: >-
      a null at a bar with P(credit)=0.45 against its own effect size is a
      statement about the INSTRUMENT at least as much as about the lever,
      and the readout must say so in the same paragraph as the number.
  honest_prior_verbatim: >-
    Unless the next doubling's effect is LARGER than the last, k=3 unpaired
    lands in P3 again — the pre-reg must pair seeds (2.2) or pre-commit a
    descriptive read; §1 is the constraint, not the anneal.
    [docs/IDEAS_POST_100M.md:676-683]
  this_prereg_does_both: "seeds are shared (section (E)); the descriptive reads are pre-committed (section (O))"
  multiplicity_disclosure: >-
    TWO credit-seeking contrasts (P-C, P-BS) are read against ONE shared
    control, so the family-wise probability of a false credit is higher than
    the single-contrast figure the credit line implies. NO alpha adjustment
    is applied — the credit line is a fixed effect-size floor plus a
    2*se_diff rule, not a p-value — and the disclosure rides every credit
    sentence.

five_prereg_rules:
  1_aggregator: >-
    the EQUAL-WEIGHT MEAN of the three per-seed win rates, on EVERY arm, for
    EVERY read, greedy and searched. Never a battle-weighted pool, never a
    subtraction of pools. A between-arm delta is one arm's equal-weight mean
    minus the other's.
  2_no_unnamed_cells: "see `branches`; every boundary assigned, void cells named"
  3_dose_matched: "see `dose`"
  4_credit_line_verbatim: "see `credit_line`"
  5_which_side_each_band_reads: >-
    every between-arm band is TWO-SIDED on the signed delta and the sign is
    reported on every branch including the null ones. The CREDIT cell is the
    positive side only; a symmetric NEGATIVE cell is named on each contrast
    so that "not credited" and "harmful" are never the same sentence.

era_bias_rule:
  binding: true
  measurement: >-
    the SAME three 100M checkpoints, same seed_start, deterministic, read
    one week apart: pooled 0.79589 (banked 2026-09-03) vs 0.78867 (fresh
    2026-09-10), drift -0.00723. The sharper precedent
    (configs/eval/ch3_r4_ensemble_critic.yaml:592): "R2 A0 0.72358 vs R3 A0
    0.70875 — same checkpoints, same seed_start, deterministic, 4x3000, one
    day apart: -0.0148 at ~2.6x its binomial se; teams are server-rolled. A
    frozen comparator carries a bias worth 59% of the floor that no se term
    captures."
  consequences:
    - the three arms are read in ONE post-fleet session, interleaved, never arm-by-arm on different days
    - D-COLL100 re-reads the BANKED checkpoints FRESH in the same session (~6 min); the banked 0.79589 is provenance only
    - no number here is compared to a RESULTS/STATUS figure without a same-session re-read where the checkpoint is on disk

primary:
  P-A:
    statistic: each arm's pooled vs-SH final, locked protocol, 3x3000
    status: REPORTED, NOT GATED
    why_not_gated: "there is no band on an absolute level, and inventing one would be inventing JOURNEY 10's missing exit condition"
    feeds: "step 11's choice of ladder object, which is step 11's"
  P-C:
    contrast: arm C - arm A, GREEDY
    credit_seeking: true
    read: signed delta_C = pooled_C - pooled_A
    sides: two_sided
    se_diff: larger_of_pooled_binomial_and_seed_clustered
    paired: false
    why_unpaired: "C is not init-paired with A; no pairing credit is taken anywhere"
    what_it_is: "IDEAS 4.7, the asymmetric-baseline lever, at 8.3x the dose its kill was vacated at"
  P-ID:
    what: AN IDENTITY ASSERTION. NOT A CONTRAST AND NOT A READ.
    replaces: "the 'P-BA' cell of an earlier draft, which registered arm B against arm A as a greedy contrast"
    why_replaced: >-
      FACT 1 measured that comparison at EXACTLY ZERO. A contrast whose
      value is known in advance to be the integer zero is not a contrast,
      and registering one would manufacture a null result out of an equality.
    under_D1_RIDE: >-
      the combined lane's actor and critic tensors at the 100M rung are
      bitwise equal to a same-seed control's. THE CONTROL IS THE BANKED
      SMOKE PAIR (engine_pe_s66 vs engine_a1b_s66, digest 104a9339eb6a2260
      at ckpt_010500013), not a new lane.
    under_D1_SEPARATE: >-
      monster100m_b_s{s}'s actor and critic tensors are bitwise equal to
      monster100m_a_s{s}'s at EVERY shared rung, all three seeds. A SINGLE
      DIFFERING ELEMENT IS AN R0-CLASS EVENT — the head is not inert, which
      falsifies the arm's premise — and it stops the fleet for diagnosis.
    barred: >-
      NO win-rate comparison between A and B is reported on the greedy axis,
      in either direction, on any branch. If the checkpoints are identical
      then so are their evals, and quoting two draws of one checkpoint as an
      A/B would be quoting eval noise as a lever.
  P-BEV:
    role: ARM B's REGISTERED PRIMARY. AVAILABLE TODAY.
    credit_seeking: true
    on: a MECHANISM, not a win rate
    statistic: priv_eval/ev_mc_advantage
    definition: >-
      the head's EV minus the critic's EV, BOTH against the MONTE-CARLO
      return, on the SAME batch in the SAME pass. It answers the one
      question the head exists to answer: does the privileged view fit the
      same returns better than self.critic does?
    paired: WITHIN A LANE
    why_that_matters: >-
      head and critic are scored on the same rows, in the same update,
      against the same target — the tightest pairing anywhere in this
      project. It consumes NO contrast arm and its power scales with the
      number of LANES carrying the head, not the number of ARMS, which is
      why ALLOC-AB9 does not weaken it.
    read: "per-lane mean over the LAST 5M steps, then the equal-weight mean over lanes; reported with per-lane values and both EV halves"
    sides: two_sided
    no_magnitude_band_is_pre_registered: >-
      this metric has never been measured on a real lane at any dose, there
      is no basis from which to name a floor, and a number invented by a
      drafter is worse than an honest sign test with the spread reported.
    the_sign_test_that_IS_pre_stated:
      B-EV-POS: "lane-mean > 0 on EVERY lane"
      B-EV-NEG: "lane-mean < 0 on EVERY lane"
      B-EV-MIXED: "otherwise (a lane at exactly 0.0 reads here)"
    barred_as_a_verdict_input: priv_eval/explained_variance
  P-BS:
    status: DEFERRED — NOT REGISTERED FOR THIS RUN
    why: >-
      THERE IS NO SEARCH SEAM. `grep -rn priv_eval rl/search/` returns ZERO
      lines, and rl/agents/ppo.py says so itself ("exists to be the SEARCH
      LEAF EVALUATOR later"). Registering a read that cannot be taken would
      leave this run producing an artifact with no consumer.
    the_artifact_survives_the_deferral: >-
      the head is in every checkpoint, so P-BS is recoverable at ANY later
      date at EVAL COST ONLY. It is NOT recoverable if the head is not
      trained now — you cannot bolt an evaluator onto a finished checkpoint,
      exactly as JOURNEY 11.6 says of a trunk. That is the whole reason the
      head rides this run.
    if_the_seam_lands: "a SEPARATE pre-registration, never an amendment to this one"
    sketch_only_not_registered: true
    contrast_if_it_ever_runs: arm B SEARCHED - arm A SEARCHED, at the settled D5 margin delta
    conditional_on_a_build_that_does_not_exist: true
    policy_form: D5-gated depth-1 search (margin_delta), leaf evaluator = arm B's priv_eval_head vs arm A's ordinary critic
    paired: by lane
    why_gated_and_not_bare_search: >-
      bare hard-argmax depth-1 search reads -0.0681 against fresh greedy on
      the banked 100M finals (P-M). The margin gate turned that around: P-G
      came back a HUMP on 2026-09-10 at delta 0.10, 0.82400 against greedy's
      0.78233 on s112, +0.04167. Reading arm B's evaluator against an
      ungated search would measure it against a selector already known to be
      defective.
    dependency: >-
      the D5 delta is not pinned. P-C (delta 0.10 on s104/s120) and P15/P20
      (peak location on s112) were RUNNING when this file was drafted. If
      P-C does not credit, the gated searched form is not a live ladder
      object and P-BS is read at the best delta DESCRIPTIVELY, credit line
      withdrawn (branch B-DESC).
    build_required:
      spec: docs/proposals/privileged_critic_engine_route.md §4.4
      sites: [rl/search/agent.py _critic_fn and _loo_critic_fn,
              rl/search/agent.py _decision_critic,
              rl/search/matrix.py leaf vectorisation,
              rl/search/shadow_battle.py seat-mirrored variant]
      guards_that_will_fire_and_need_rulings:
        - "scripts/ch3_eval.py:345-346 — SF-13 asserts the eval env must not emit info['privileged']. A determinization-sourced block does not violate SF-13's spirit but the assert is literal."
        - "scripts/ch3_eval.py:57-109 _Battle2Sentinel — raises PurityIncident when battle2 is read from any frame under rl/search. A determinization-sourced block never touches battle2; a 'just read seat 2' shortcut is a retraction-grade incident BY CONSTRUCTION."
      named_secondaries_not_assumptions:
        - "the block is RSD-sampled, not true; Monte-Carlo averaged over the determinization axis at n_det 4 (dose M) / 16 (dose L)"
        - "the sampled bench is systematically fresher: max PP, HP 1.0, no status, max DVs"
        - "the aliasing decision must be taken on the MIRRORED active or it is taken on the wrong seat"
      cost_bracket: "dose M is ~18 min per 300-battle chunk today; a second embed_battle per leaf roughly doubles the dominant term (~55% of the stack is the Python leaf encoder) -> ~28 min/chunk; 3 lanes x 3000 x 2 sides = 60 chunks ~ 28 h, parallelisable, post-fleet, never on the critical path"
      not_authorised_here: >-
        this pre-reg does not authorise or specify that build. rl/search/ is
        owned by another session as this is written. If the seam has not
        landed at grade time it is simply NOT RUN — there is no cell for it
        in this pre-reg — and the checkpoints keep the head, so the read is
        recoverable at any later date at eval cost only.
  P-D18:
    role: arm C's MECHANISM read, CO-PRIMARY with P-C
    falsifier_verbatim: >-
      FALSIFIER, PRE-STATED (§12 verbatim): EV jumps but win rate flat or
      negative => the critic fits information the policy cannot exploit and
      the advantage signal degraded — KILL THE RUNG, do not tune around it.
    falsifier_source: configs/showdown_sp_priv12m.yaml:148-151
    d18_measured:
      pooled: 0.5364
      per_seed: [0.5610, 0.5477, 0.4740, 0.5623, 0.5370]
      comparator: 0.5509
      delta: -0.0145
      se_diff_binomial: 0.00664
      se_diff_clustered: 0.02214
      governing: clustered
      two_se: 0.04427
      operative_bar: 0.59517
      z: -0.65
      cell: "FLAT, not letter-negative"
      source: results/d18/grade.txt
    d18_ev_audited_not_quoted:
      d18_last_1M: [0.5972, 0.6150, 0.6206, 0.5972, 0.6040]     # s39-43
      control_last_1M: [0.5751, 0.5572, 0.5657]                  # s26-28
      source: SESSION_LOGS.md:4552-4557 (the 2026-08-16 re-derivation from history.csv)
      correction: >-
        the readout's recorded control band "0.549-0.561" reads slightly low
        against the audit's own windows (0.556-0.575), and the audit says so
        in terms. THE AUDITED NUMBERS ARE THE ONES THIS PRE-REG QUOTES.
        Every D18 lane sat above every control lane in every window tried
        (5-12M, 10-12M, 11-12M).
    vacating_verbatim: >-
      (i) The privileged critic's D18 kill is VACATED AS FINAL — a 12M A/B
      on the pre-batch recipe does not close an axis; the evidence stays in
      §3 and the live item is 4.7 (a 100M+ arm, mechanism co-primary).
    vacating_source: docs/IDEAS_POST_100M.md:26-30
    what_the_vacating_does_not_touch: >-
      the INFORMATION leg. The entire hidden team was worth ~+0.045 EV of
      return variance against a hoped-for ~0.40, and D19 found 88-90% of it
      recoverable as a deterministic cap mask. Arm C is a VARIANCE-REDUCTION
      hypothesis at large batch and long horizon, not an information one.
    mechanism_axis:
      status: REGISTERED — the earlier "D18-REPEAT kill" drafting is WITHDRAWN
      withdrawn_on_two_grounds:
        - "THE WORD 'KILL' IS BARRED FOR THIS ARM. The 2026-09-06 ruling: a small-run null closes nothing and ONLY A MEASURED CEILING KILLS. One 100M fleet at k=3 or k=4 is not a measured ceiling."
        - "THE 'UNCOLLAPSED CRITIC' CONDITION COULD NOT FIRE. The MAXIMUM critic ctx srank99 ever recorded in this project is 25 of 384 (D18 s41); no lane at any dose has exceeded it and the matched-12M controls read 8/14/11. A leg conditioned on a state never observed returns no cell."
      ideas_47_standing_precommitment_verbatim: >-
        D18's falsifier restated verbatim (EV rose on every lane, win rate
        did not) and pre-committed as a NULL branch this time, never a kill.
      what_is_registered_instead: >-
        srank and EV are MECHANISM-MOVED MEASUREMENTS, not gates, and they
        enter the partition as ONE BINARY AXIS crossed with the primary
        delta. MOVED iff BOTH (a) loss/explained_variance over the last 5M
        steps is HIGHER in arm C than in the PAIRED arm-A lane on EVERY seed
        arm C ran, AND (c') critic ctx srank99 strictly GREATER than the
        paired arm-A lane's on EVERY seed arm C ran. NOT-MOVED otherwise;
        PARTIAL is a reporting label inside NOT-MOVED when exactly one leg
        holds, and it changes no action.
      the_asymmetry_is_deliberate: >-
        "moved" is a strong conjunction and "not moved" is everything else,
        so the partition is biased AGAINST the mechanism claim — the
        direction an arm re-opening a vacated null should be biased in.
      why_c_prime_is_there_at_all_given_it_has_never_held: >-
        without it, EV-up-and-win-rate-flat is equally explained by
        representational collapse, which D22 measures as
        training-dynamics-intrinsic rather than information starvation. With
        it as a REPORTED AXIS rather than a GATE, an arm C that moves EV and
        not srank still lands in a NAMED cell (C-FLAT-EVONLY) and still says
        something: it REPLICATES D18's signature at 8.3x the dose under the
        same confound D18 had. A replication, not a closure.
      why_relative_and_not_absolute: "nobody has measured srank at 100M on any checkpoint; an absolute threshold would be a number invented by a drafter"
      instrument:
        stage1: "scripts/d22_collect_obs.py <ckpt> --episodes 200 --out <npz>"
        stage2: "scripts/d22_dormant_rank.py --lanes 104,112,120 --steps 100000000 --run-prefix monster100m_<arm>_s --out results/monster100m/<arm>"
        conditions: "POKEMON_RL_ENCODER_V2=1 POKEMON_RL_ENCODER_IDS=1; SERVER UP; FLEET DOWN (username collision, d22_collect_obs.py:22-26)"
        notes: "privileged handling is automatic (reads cfg.agent.privileged_dim off the checkpoint); overwriting an --out is REFUSED (use --tag or --force)"
      corrections_this_prereg_makes:
        - "D18's readout compared its 12M critics against 50M controls — a cross-budget comparison. The matched-12M rows are in the same CSV and are what this file quotes."
        - "D22's 37.5M-50M critic collapse is 7-13, NOT 9-13 (50M alone: s35 10 / s36 7 / s37 9). The canonical '7-11 of 384' reproduces no single-step row and should carry an 'as recorded' hedge."
      also_run_on_B: >-
        under D1-RIDE there is no separate arm-B checkpoint to run it on —
        the A/B lanes ARE arm A — so the srank leg is two families (A/B and
        C), not three. Under D1-SEPARATE it is run on arm B too and, by
        FACT 1, must return arm A's numbers EXACTLY; a difference there is a
        P-ID failure, not a finding.
  P-EV:
    status: SUPERSEDED BY P-BEV — RETAINED AS A CORRECTION, NOT AS A READ
    what_it_was: >-
      an earlier draft registered priv_eval/explained_variance against
      loss/explained_variance as arm B's descriptive mechanism read.
    why_it_is_gone: >-
      FACT 2. priv_eval/explained_variance scores the head against the GAE
      target, which at lambda 0.95 over ~34 decisions is ~53% the ORDINARY
      CRITIC'S OWN OUTPUT and ~82% of it at the first decision — so the
      "gap" it reports is partly the head agreeing with the thing it is
      supposed to beat. The metric FLATTERS THE HEAD BY CONSTRUCTION. It is
      a DIAGNOSTIC, it is logged, and it is BARRED as a verdict input on
      every branch. The read is P-BEV, on priv_eval/ev_mc_advantage.

anchor_battery:
