                      configs/eval/fp_budget_ladder.yaml (the budget calibration)]
      cost: "3.98 h measured for 3x3000 -> ~12 h for nine lanes"
      standing_disclosures_forever:
        - the equivalence test is weakly powered
        - the point estimate flatters us
      name_the_budget_in_every_quote: true
      fp20_is_an_instrument_not_a_rung: true
    L-CLONE:
      what: BC-clone h2h, 500 battles per arm
      clone: runs/bc_fp_v2r_soft_180k_s0/checkpoint.pt
      clone_sha256: 5e490adecf70b480edcde9a6080ffc34049c16bf77b295c0e2a8bd43299a0683
      runner: scripts/ch3_r4_anchors.py
      cost: "~22 s/lane, ~3.5 min for nine — this leg is free"
      traps:
        - "the clone is an 808-d model served to an 828-d fleet through the cross-encoder shim (fake_spaces takes the checkpoint's own width). It worked on the 100M fleet; if OBS_DIM moves, re-verify the shim before assuming this leg is free."
        - "the tapes predate the FP@20 budget (clone built 2026-08-09; FP@20 adopted 2026-08-23). CLAUDE.md's GEN-4 clause says 'a gen-4 clone of FP@20 tapes'; the gen-1 clause says only 'BC-clone h2h (500)'. The standing gen-1 leg is THIS clone, as used on the 100M fleet. Whether gen 1 owes an FP@20-tape clone is NOT resolved here."
  why_both_legs_and_not_vs_SH_alone: >-
    this project has an ADJUDICATED case of vs-SH alone being misleading:
    CH3 R2's search arm was credited on vs-SH at +0.0693 — the best vs-SH
    number in this repo, all four lanes positive — while going NEGATIVE on
    BC-clone (-0.034) and on Foul Play (-0.020). It was ruled SH-FACING and
    configs/eval/ladder_r1.yaml records "SEARCH IS THE TRAP". A vs-SH-only
    gate would have shipped it. That precedent binds HARDER here than
    anywhere, because P-BS is a search read and this run's object is a
    ladder candidate.
  the_searched_form_gets_the_battery_too: >-
    if step 11's object is the D5-gated searched form, the battery runs on
    THAT form — the policy form must match the rating it is quoted beside.
  banked_100M_battery_for_context_reread_fresh_before_differencing:
    vs_SH_banked: {per_lane: [0.7910, 0.8000, 0.79667], pooled: 0.79589, s_T: 0.00455}
    vs_SH_fresh_2026_09_10: {per_lane: [0.78933, 0.78233, 0.79433], pooled: 0.78867, sd: 0.00603}
    fp20: {per_lane: [0.48633, 0.50167, 0.50733], pooled: 0.49844, s_T: 0.01086}
    clone: {per_lane: [0.912, 0.930, 0.928], pooled: 0.9233}
    correction: >-
      0.3960 is NOT the 100M fleet's FP@20 number. It is the depth-1
      search@M arm on lane s112 at n=1000
      (docs/search_relook/S3_READOUT.md:101-106), against det_blind's 0.4054
      and the banked greedy 0.50167 on the SAME lane at n=3000.

branches:
  boundary_convention: "a delta EXACTLY at +-0.025, or a |delta| EXACTLY equal to 2*se_gov, reads as NOT MEETING that leg. Credit needs both legs strictly met."
  arm_C:
    partition: "(primary delta: POS / NEG / FLAT) x (mechanism: MOVED / NOT-MOVED), 3 x 2, with FLAT/NOT-MOVED sub-labelled by which leg failed. EIGHT NAMED CELLS, all reachable, none unnamed."
    word_kill_does_not_appear: true
    primary_axis:
      POS: "delta_C >= +0.025 AND delta_C >= 2*se_gov"
      NEG: "delta_C <= -0.025 AND |delta_C| >= 2*se_gov"
      FLAT: "everything else"
    C-POS-MOVED: "CREDITED at 100M and the mechanism moved with it. IDEAS 4.7 resolves POSITIVE. Arm C's finals join the step-11 ladder candidates."
    C-POS-NOTMOVED: "CREDITED, mechanism did not move. The credit STANDS — the primary is the verdict axis — and the readout says in terms that the lever paid WITHOUT the mechanism it was hypothesised through. A finding about the hypothesis, not a reason to withhold the credit."
    C-NEG-MOVED: "CREDITED NEGATIVE: the lever HURT, and the critic did fit more while the policy did worse. The strongest form of D18's original signature this run can produce. IDEAS 4.7 resolves NEGATIVE. STILL NOT A KILL — one fleet is not a measured ceiling — and the sentence names lambda 0.95, because 4.7's own hypothesis is lambda 1.0."
    C-NEG-NOTMOVED: "CREDITED NEGATIVE with no mechanism. First diagnosis: the second Rust encode and the init non-pairing, both of which differ between C and A and neither of which is the lever."
    C-FLAT-MOVED: "D18's EXACT SIGNATURE, REPRODUCED AT 8.3x THE DOSE. A NULL, and the most informative one available: EV up on every lane and srank up on every lane while the win rate did not move, at a batch 30x D18's. IDEAS 4.7 does NOT close — it is one fleet — but the replication is banked and the next design must answer it. THE SENTENCE IS 'NULL, D18's signature replicated', never 'killed'."
    C-FLAT-EVONLY: "(a) held, (c') did not — D18's own outcome under D18's own confound. A REPLICATION of the 12M result at 100M. Closes nothing: equally explained by representational collapse."
    C-FLAT-SRONLY: "(c') held, (a) did not — the privileged input de-collapsed the critic without improving its fit. NEVER OBSERVED ANYWHERE; if it happens it is the most surprising result this fleet can produce and is reported as such."
    C-FLAT-NEITHER: "neither leg held. The lever did nothing measurable on any axis. A NULL."
    on_every_C-FLAT_cell: "IDEAS 4.7 STAYS OPEN and its next design is the lambda=1.0 PURE-BASELINE variant 4.7 actually names — not this arm again at more dose."
    on_every_arm_C_cell: "the configuration is NAMED in the sentence: gae_lambda 0.95, update 30,720 steps, k = the seeds arm C ran. A result quoted without that clause reads as answering 4.7 when it answers D18."
  arm_B:
    B-EV-POS: "the privileged view fits the outcome better than the ordinary critic, at 100M, on real rows. The precondition for the deferred search read, banked as such. NOT a win-rate claim and may never be quoted as one."
    B-EV-NEG: "the privileged view fits the outcome WORSE. A finding about the block, and the strongest available argument for NOT building the search seam."
    B-EV-MIXED: "otherwise. Reported with all per-lane values and both EV halves."
    P-BS_is_not_a_cell_of_this_run: "there is no search seam; DEFERRED to its own pre-registration"
    P-ID_is_not_a_cell_either: "it is an assertion. A single differing element between a head-on lane's actor/critic and a same-seed control's is an R0-CLASS EVENT that stops the fleet, not a result."
  fleet:
    M-VOID-K: {rule: "an arm finishes fewer than 3 lanes at the 100M rung", action: "that arm is DESCRIPTIVE ONLY and decides nothing; k<=2 cannot carry a 3-seed aggregator and re-running one lane makes the arm mixed-provenance. Report and relaunch the arm."}
    M-VOID-DOSE: {rule: "a lane's crossing step is more than 250,000 off 100,000,000", action: "not graded at that arm's dose; it is M-VOID-K for that arm. Between 30,720 and 250,000 it is GRADED at its realized step with that step disclosed."}
    M-R0: {rule: "an R0 breach", action: "kills the affected lane or the fleet per the gate. A relaunch after an R0 fix is a fresh fleet and consumes nothing."}
    M-WAVE: {rule: "a lane is lost in wave 1", action: "re-run IN WAVE 2 at wave 2's width, with the width difference disclosed on that lane's row. NEVER re-run alone at width 1 — a solo lane runs 1.9x faster under a different memory and thermal regime than any other lane in the fleet."}
    M-UNRATIFIED: {rule: "a decision in pending_decisions is unanswered at launch time", action: "THE FLEET DOES NOT LAUNCH. The arm list and the lane allocation are not defaults this file may pick."}

r0_gates:
  window: first 250,000 steps of every lane
  all_nine_lanes:
    loss_entropy_band: [1.3, 2.0]                       # KILL FLEET
    clip_frac_nonzero: true                             # KILL FLEET
    aux_illegal_label_frac: 0                           # KILL FLEET
    aux_frame_collision_frac: 0                         # KILL FLEET
    aux_labelled_frac_band: [0.74, 0.88]
    eval_win_rate_open_interval: true
    policy_version_lag_p99_max: 1                       # breach = 3 consecutive rollouts
    eval_no_outcome_key: MUST_BE_ABSENT                 # emitted only when missing>0
    wins_from_returns_equals_eval_win_rate: true
    mask_desyncs: 0
    team_bank_min_pairs: 1000000
    team_bank_sha256_identical_on_all_nine_lanes: true
    first_rung_deadline_minutes: 45
    encoder_stamp: {obs_dim: 828, encoder: v2, set_prior: true, recharge_fix: true,
                    ids: true, aux_label_space: l6, aux_shuffle_labels: false}
    engine_stamp_identical_on_all_nine_lanes: [build_sha, tables_fingerprint, bank_header]
  recorded_as_a_stamp_not_a_gate:
    keys: [collect/battles_in_flight, collect/rooms_tracked, collect/episodes_discarded]
    why: >-
      on this collector battles_in_flight and rooms_tracked ARE the constant
      k and episodes_discarded is a literal 0, so none can be violated. A-1
      dropped them as gates for exactly this reason. RECORDED
      (battles_in_flight == 8 on every lane). A mask-legality error and an
      Outcome::Error both RAISE and kill the lane by construction, which is
      strictly stronger than a gate read after the fact.
      [THE DRAFTING BRIEF ASKED FOR `collect/battles_in_flight == 8` AS A
      GATE; it cannot fire on this path and is a stamp instead.]
  arms_B_and_C:
    R0-B1_block_not_zeros: "abs(x).sum() > 0, x.std() > 0, non-constant columns > PRIV_DIM//4 = 102 (the rule pinned in tests/test_engine_privileged_seam.py:213-214). OBSERVED REFERENCE: 329 of 408 on 1,530 real rows. [The figure 324/408 appears NOWHERE in this repo; 329 is the recorded one and the gate is the >102 rule, not either number.]"
    R0-B2_shape: "batch['privileged'].shape == (n_rows, 408) and n_rows == len(batch['obs']) == lengths.sum()"
    R0-B3_it_is_the_foes_side: "fewer than 8 of the first 256 rows have privileged_block(obs_row) bitwise equal to priv_row"
  arm_B_only:
    R0-B4_shapes_and_sums:
      critic_params: 494849
      critic_ctx_in: 640
      actor_params: 626059
      actor_param_sum_at_seed_104: 442.300      # IDENTICAL to arm A's, to the last float
      priv_eval_head_params: 642305
      priv_eval_ctx_in: 1024
      privileged_block_dim: 408
      action_on_wide_critic: "privileged_dim leaked into the config and the lane is running A+B. KILL THE LANE."
    R0-B5_head_learns_and_the_verdict_metric_exists: >-
      loss/priv_eval_value present from update 1, FINITE on every update and
      FALLING over the first ~10. priv_eval/explained_variance_mc,
      priv_eval/critic_ev_mc and priv_eval/ev_mc_advantage ALL PRESENT from
      update 1 and FINITE — these are the POST-b147f48 keys and their
      ABSENCE means the lane is running the PRE-FIX head, which regressed
      the GAE target and would make P-BEV unreadable. THIS GATE EXISTS
      BECAUSE THE FIX LANDED THE DAY BEFORE THE FLEET. priv_eval/
      explained_variance (the GAE diagnostic) is also present and is NOT
      gated on direction. The 18.92 -> 0.014 / EV -14.5 -> 0.988 offline
      reference is PRE-FIX and is quoted as pre-fix; there is no post-fix
      offline reference yet, so R0-B5 reads presence, finiteness and the
      direction of loss/priv_eval_value only, and the first ~10 updates of
      ev_mc_advantage are RECORDED, not banded.
    R0-B6_actor_did_not_move: "loss/entropy, aux/labelled_frac, aux/illegal_label_frac, loss/clip_frac distributionally indistinguishable from the PAIRED arm-A lane at the same seed over the first 250k"
  arm_C_only:
    R0-C1_shapes_and_sums:
      critic_params: 642305
      critic_ctx_in: 1024
      actor_params: 626059
      actor_param_sum_at_seed_104: 375.635      # vs A/B's 442.300 — the DISCLOSED residue
      privileged_block_dim: 408
      action_on_narrow_critic: "privileged_dim did not take; the lane is arm A with extra collection cost. KILL THE LANE."
      note_on_the_usual_figures: >-
        334.851 -> 410.510 is tests/test_entity_trunk_gen4.py:194-199 AT ITS
        OWN SEED, not this fleet's pair. The residue is real at every seed;
        the numbers are seed-specific and the SIGN is not fixed (the test's
        pair goes up, seed 104's goes down) — which is what "the RNG stream
        moved" means and what "a bigger init" would not.
    R0-C2_ev_rises: "loss/explained_variance present, finite and rising over the first 250k on the WIDE critic. A flat EV in the first updates is D18's 'could not even FIT the privileged signal' branch, worth catching at update 10 rather than at hour 25."
    R0-C3_value_finite: "loss/value finite on every update. The wide critic on the engine route has never taken a live step; this is the gate that says it did."

in_run_gates:
  D-A_anneal: "lr == 2.5e-4 * max(0, 1 - basis/1e8) at the rungs nearest >=4M/25M/50M/100M, every lane, all param groups (arm B's priv_eval group runs at the critic's lr and anneals with it). Breach -> STOP that lane."
  D-B_throughput: "realized dStep/dWall over >=30-min conforming windows post-1M. Expected 1097 +-15% at width 6 -> [933, 1262]; 1387 +-15% at width 3 -> [1179, 1595]. RECORD below 0.90x; STOP-AND-INVESTIGATE below 0.70x sustained over two windows. A window straddling startup invents records."
  D-C_aux: "every 5M: illegal==0, collision==0 (STOP that lane); labelled_frac bin-mean in [0.65, 0.86] RECORD"
  D-D_anchor: "selfplay/winrate_anchor >= 0.75 by 4M each lane (STOP); RECORD below 0.83"
  D-E_memory: "per-lane peak RSS RECORD-ONLY at every D-B reading, NO per-lane threshold at ANY width (the D-E landmine; this fleet changes width mid-run, so a per-lane line would fire on wave 2 by design). RECORD any lane above 3.0 GB. The only STOP is box-level: free+inactive < 2 GiB AND non-zero swapouts, 3 consecutive 5-min polls -> STOP ALL, disclose, resume after. THIS FLEET'S MEMORY IS THE LEAST-MEASURED THING ABOUT IT."
  D-F_disk: "RECORD < 40 GiB free; STOP ALL < 20 GiB. Re-based up from the 100M pre-reg's 30/15 because this fleet writes ~41 GB against that one's ~14."
  D-G_lag: "RECORD lag_p99 >= 2 any rollout; STOP that lane at p99 >= 2 for 3 consecutive rollouts"
  D-H_stall_watch: "a lane can stall ALIVE at ZERO CPU and every pgrep passes forever. Liveness is a CPU-TIME DELTA (`ps -o time=` twice, 15 s apart), never a step count and never a process check. Poll every 15 min per lane. Recover with --resume. A pgrep guard anchors on bin/python."
  D-I_server: "RECORD the Showdown server's CPU-time delta at every D-B reading; a server not advancing while lanes evaluate is the orphaned-room shape. Every seat sends /timer on (start_timer_on_battle_start, default True) — DO NOT REMOVE IT."

contamination_guards:
  both_seat_harvest: OFF            # and REFUSED in code for B/C (ppo.py:856-862)
  d25_opp_action: ON                # MANDATORY in all three arms
  engine_scripted_opponents: UNUSED
  aux_shuffle_labels: absent
  aux_synthetic: absent
  env_kwargs_privileged: ABSENT     # the Node path's second knob; refused on the engine route
  collector_privileged: DOES_NOT_EXIST   # ENGINE_KEYS is strict

oppact_head_mandatory:
  binding: true
  all_three_arms: true
  enforcement_in_code: "rl/train.py:876-884 refuses a launch where env_kwargs.opp_action and agent.aux_oppact_coef disagree"
  why: >-
    rl/search/agent.py:68-70 hard-asserts `agent.aux_head is not None`. A
    checkpoint without aux_oppact_coef > 0 can NEVER be handed to
    SearchAgent — the head's parameters do not exist and cannot be trained
    after the fact. THE WHOLE POINT OF THIS RUN IS AN OBJECT WE CAN SEARCH:
    the margin gate read a HUMP on the 100M finals at +0.04167 over greedy
    on s112, the three-lane confirmation was in flight at drafting, arm B's
    entire read is a searched read, and STATUS's goal change of 2026-09-11
    names search as the axis. A lane launched without it is a dead object.
  launch_blocking: true

preconditions:
  PRE-1: "the oppact head in all three configs; asserted by the launcher and by rl/train.py at launch"
  # --- PRE-2 / PRE-3 live readings, 2026-09-11 night (agent) ----------------
  # R0-C1 VERIFIED AT INIT, seed 104, both configs constructed through
  # rl.train.make_agent: actor_params 626059 (A and C alike), critic_params
  # 494849 (ctx_in 640) for A vs 642305 (ctx_in 1024) for C, privileged_dim and
  # privileged_block_dim both 408 on C. The actor param sum is the SIGNED sum
  # (not sum of |p|, which reads 28514.521/28527.191 and is the wrong
  # statistic): A 442.300, C 375.635 — both reproduce this file exactly,
  # including the DOWNWARD sign that the note_on_the_usual_figures predicts.
  # R0-C1 PASS.
  #
  # PRE-2 IS SATISFIED. The live smoke (monster_c_smoke_s104,
  # configs/showdown_monster100m_c.yaml, seed 104) ran exactly 10 updates on
  # the engine route and was killed, per this precondition. All three gates:
  #
  #   step      loss/value   EV         steps/s
  #   30731     0.116194     -0.43534     745.2
  #   61469     0.067661     +0.21949    1288.2
  #   92231     0.059460     +0.45266    1412.8
  #   122998    0.050604     +0.36659     988.0
  #   153729    0.034715     +0.37566    1529.3
  #   184470    0.073733     +0.38356    1464.0
  #   215281    0.071327     +0.46842    1980.0
  #   246010    0.067205     +0.46739    2243.6
  #   276745    0.061424     +0.45802     385.7
  #   307473    0.059289     +0.43713     403.0
  #
  #   R0-C1 PASS  (shapes and sums, at init — above)
  #   R0-C2 PASS  EV rises -0.43534 -> +0.43713, max +0.46842, plateauing near
  #               0.45. D18's "could not even FIT the privileged signal" branch
  #               DID NOT fire: the wide critic fits the privileged signal on
  #               this route, and it fits it fast.
  #   R0-C3 PASS  loss/value finite on every one of the 10 updates.
  #
  # THE WIDE CRITIC HAS NOW TAKEN A LIVE STEP ON THE ENGINE ROUTE — the thing
  # that had never happened and the whole reason this precondition exists.
  # NOTE THE SCOPE: this says the SEAM WORKS, and nothing whatever about
  # whether privileged information HELPS. It cannot: 10 updates is 307k steps
  # against a 100M arm, EV is not the arm's read, and per the 2026-09-06 ruling
  # a small run closes nothing in either direction. The trailing steps/s (385,
  # 403) are BOX CONTENTION from the concurrent eval fleet, not a lane
  # property, and must not be used as a throughput figure — PRE-10 requires a
  # free box and this smoke deliberately did not have one.
  #
  # PRE-3 CAVEAT, recorded rather than waved: engine_pe_s66 ran the PRE-FIX
  # design-B code, so its head regressed the GAE target. Its BITWISE inertness
  # read is unaffected and is IN HAND (24 rungs, 223 shared tensors /
  # 3,428,015 elements, 0 differing, sha f156f232462e635b at ckpt_012000017) —
  # inertness is a property of the SEAM, not of the target. But R0-B5 (the
  # post-fix metric keys present from update 1) has NOT been shown on a live
  # lane; it is pinned by tests only
  # (tests/test_priv_eval_head.py::test_the_heads_target_is_the_mc_return_at_
  # every_lambda, item 4, which asserts all three keys and their arithmetic on
  # the same update_episodes path). The fleet's own update 1 is where it is
  # confirmed live, and R0-B5 must be READ there rather than assumed.
  PRE-2: "ARM C HAS NEVER RUN ON THIS ROUTE. A live design-A smoke — one lane, ~10 updates, read against R0-C1/C2/C3 and R0-B1/B2/B3, then killed — must PASS before the fleet. Minutes of agent-side work; the difference between a dead seam at update 10 and at hour 25. Config: configs/showdown_monster100m_c.yaml with --run-name monster_c_smoke_s104."
  PRE-3: "the arm-B smoke has read its gates. runs/engine_pe_s66 is LIVE as this is drafted; its R0-B4/B5/B6 read and its BITWISE actor/critic comparison against engine_a1b_s66 must be in hand."
  PRE-4: "the privileged encode is PRICED: scripts/engine_t1.py --leg b twice, flag off then on, ~10 min. Until then the <=3% figure is a BOUND."
  PRE-5: "width measured (unit W-0) and the branch recorded"
  PRE-6: "POKEMON_RL_ENCODER_V2=1 POKEMON_RL_ENCODER_IDS=1 on every lane and every eval; the launcher exports both and refuses if either is unset"
  PRE-7: "the bank exists, holds >= 1,000,000 pairs, sha256 recorded"
  PRE-8: "the tests/test_100m_prereg.py amendment is committed"
  PRE-9: "clean tree, docs committed (CLAUDE.md rule 3). One untracked .md stamps git_dirty on all nine lanes and it cannot be reconstructed afterwards."
  PRE-10: "the box is FREE — no ch3_eval jobs, no train lanes, no calibration jobs, no other agent's queues; a fresh Showdown server started by the launcher; free+inactive >= 14 GiB and >= 60 GiB disk at lane 1"
  PRE-11: "ratification: every RWM-n answered here and verdict_authorized set"
  PRE-12: "the two PENDING DECISIONS are answered, and the lane list and seed list that follow from them are written into this file before lane 1. An unanswered decision is M-UNRATIFIED and THE FLEET DOES NOT LAUNCH — the arm list and the lane allocation are not defaults this file may pick."

env:
  conda: pkmn-engine-port
  python: /opt/anaconda3/envs/pkmn-engine-port/bin/python
  why_not_the_repo_env: >-
    the pkmn_gen1 extension is built there and only there. This is CLAUDE.md
    rule 1's named engine-port exception. Do not install into it and do not
    run these lanes from the analysis env.
  required_env_vars: {POKEMON_RL_ENCODER_V2: "1", POKEMON_RL_ENCODER_IDS: "1"}

freeze_rule_verbatim: >-
  no cell, bar, bar formula, n, aggregator, sidedness, comparator or
  barred-sentence list moves after the FIRST treatment datum on the primary
  axis lands.

peeking:
  no_outcome_based_early_stop_extension_restart_lr_change_config_change_or_lane_replacement: true
  ops_kills_excepted: true
  barred_outright: "ANY checkpoint evaluation — any n, any opponent, any lane — between launch and the last lane's end"
  barred: "extending past 100M mid-run even on a climbing log; that is a NEW pre-registration and a maintainer decision"
  logged_visible_and_not_actionable: [eval/win_rate, rollout/episode_return, loss/explained_variance]
  the_named_temptation: "in-loop eval/win_rate, n=100, se 0.040, 400 readings per lane"
  restated_for_the_peeker: "ONE vs-SH RUNG AT n=3000 IS WORTH +-0.02"
  the_one_exception_and_it_is_not_a_peek: >-
    the R0 and in-run gates are BUILD-FAULT gates on non-outcome metrics,
    pre-stated in full. R0-5 reads eval/win_rate only for presence and
    (0,1), never for level.

post_fleet_schedule_order_frozen:
  steps:
