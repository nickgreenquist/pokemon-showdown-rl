  verdict_input: L-SH only
  anchors_are_never_verdict_inputs: true
  a_missing_leg_is_PENDING_and_the_readme_row_WAITS: true
  legs:
    L-SH:
      what: vs SimpleHeuristicsPlayer, locked protocol, 3x3000 per arm
      cost: ~120 s/lane, ~18 min for nine
    L-FP20:
