# THE MONSTER pre-registration sidecar — the machine-readable half of
# configs/showdown_monster100m.yaml (arm A, and the whole pre-reg), with
# configs/showdown_monster100m_b.yaml and _c.yaml as arms B and C. The
# header is the authority on WHY; this file is the authority on WHAT WAS
# FIXED BEFORE THE RUN. Neither may be edited after launch except to FILL a
# cell marked [FILL AT READOUT].
---
prereg_for:
  - configs/showdown_monster100m.yaml        # arm A, and the prose pre-reg
  - configs/showdown_monster100m_b.yaml      # arm B
  - configs/showdown_monster100m_c.yaml      # arm C
status: >-
  DRAFT 2026-09-10. NOTHING RATIFIED. NO VERDICT AUTHORIZED. NO LAUNCH
  AUTHORIZED. The standing 2-Opus review cycle has NOT run on this file, and
  a pre-reg is an irreversible artifact (memory: design-decisions-two-opus)
  — this one commits ~45 fleet-hours. Every RWM-n below is a
  RECOMMENDATION, never a ruling. The three configs PARSE and PASS
  rl/train.py's launch-time validators (verified 2026-09-10: load_config +
  selfplay_env_kwargs + _async_collector_mode + _engine_collector_checks,
  all three files, in the pkmn-engine-port env with both encoder env vars
  set); that is a syntax-and-guard check, not a licence.
journey_step: "10"
journey_step_title: "Massive gen1 train"
exit_condition_verbatim: null     # JOURNEY 10 STATES NO EXIT CONDITION.
exit_condition_note: >-
  JOURNEY 10 is a completion-shaped step with no gate, no band and no branch
  table. The precedent for this case is configs/showdown_sp_100m.yaml
  ("Exit condition, completion-shaped (SF-17)"). THE RUN IS DONE when all
  nine lanes reach their 100M crossing rung (or the lane-failure rules in
  branches.fleet dispose of them), the post-fleet eval schedule has produced
  the PRIMARY reads with their disclosures, the gen-1 anchor battery's legs
  are reported or marked PENDING, and the readout is committed. Everything
  this pre-reg adds beyond that is ADDITIVE and may never be described as
  the JOURNEY's own gate.
journey_step_verbatim: >-
  The big one, with a recipe validated somewhere the instrument works.


  Step 7.5 is what makes "massive" mean something new: ≈ 30 h a lane for
  250M instead of ≈ 124 h on the Node path, so the horizon that was a 5-day
  fleet becomes an overnight one and 500M is thinkable. S-SHAPE read
  SS-CLIMB at 100M and the last doubling bought +0.00944 finished-to-finished
  vs SH, so dose is the only lever here with a measured monotone curve — and
  it is now the cheap one. The anneal trap still binds: a fresh full-horizon
  run with `lr_anneal_steps == total_steps`, never a warm start off a
  finished checkpoint.
routing: >-
  step 11 (the final gen-1 ladder) is next on EVERY branch. No branch
  reopens step 10; no branch selects the ladder object — that is step 11's,
  and the "11.5 before 11" ruling is owed before it.

credit_line: "a lever is credited iff pooled delta >= +0.025 AND >= 2*se_diff, where se_diff is the LARGER of the pooled-binomial se_diff and the seed-clustered se_diff, the latter computed from the per-seed finals at read time"
credit_line_clustered_formula: "sqrt(s_arm^2/k_arm + s_cmp^2/k_cmp)"
credit_line_bar: "BAR = max(0.025, 2*se_gov)"
credit_line_note: >-
  The canonical prose form (configs/showdown_sp_100m.yaml:59-62) ends with a
  period; the YAML scalar form (configs/eval/search_s3_100m.yaml:184) does
  not. This file carries the scalar form, byte-identical to search_s3's, so
  a grader comparing scalars matches. The header carries the prose form with
  the period. THE ONE-BYTE DIVERGENCE IS A REAL REPO INCONSISTENCY, recorded
  here rather than silently picked.
credits_something: true
credit_seeking_reads: [P-C, P-BEV]     # P-BS is DEFERRED — there is no search seam

measured_facts_that_landed_2026_09_10:
  FACT_1_arm_B_is_bitwise_arm_A:
    measurement: >-
      runs/engine_pe_s66 against runs/engine_a1b_s66 — same seed 66, configs
      differing only in run_name / seat_tag and the two priv_eval keys — at
      ckpt_010500013: 21 IDENTICAL checkpoint rungs INCLUDING the step
      counter, 223 shared tensors / 3,428,015 elements, ZERO DIFFERING,
      digest 104a9339eb6a2260. The PE lane adds only its own 104
      head+optimizer tensors.
    mechanism: >-
      the head takes a SEPARATE autograd.grad over its own parameters AFTER
      the clip is read, and its construction REWINDS the global RNG stream,
      so actor, critic, aux head and every minibatch permutation match.
    consequences:
      - "a greedy A-vs-B comparison is NOT 'a null by design' — it is LITERALLY THE SAME NUMBER, and it must not be registered as a contrast. It is registered as P-ID, an identity ASSERTION."
      - "three of the nine planned lanes were buying duplicate checkpoints. Decision 1 (RWM-11) disposes of that."
    it_falsifies_an_earlier_draft_of_this_prereg: >-
      that draft reasoned that collector/learner interleaving would make an
      arm-B lane drift from its arm-A twin, and proposed |B - A| as the
      engine collector's run-to-run reproducibility floor. The measurement
      says the collector is DETERMINISTIC at a fixed lane seed and policy:
      the battle stream is splitmix64(lane_seed * PHI ^ battle_counter) and
      the pool-member stream is a private np.random.default_rng(seed),
      neither of which reads a clock. There is no interleaving floor, and
      the reasoning that predicted one was wrong.
  FACT_2_arm_B_target_was_wrong_and_is_fixed:
    commit: b147f48
    when: "2026-09-10, in the pre-launch review, BEFORE any lane started"
    what_was_wrong: >-
      the head regressed `flat_targets`, the GAE(lambda) target. At gamma 1
      with a terminal-only reward that decomposes exactly as
      target_t = lam^(N-1-t)*z + (1-lam)*sum_k lam^(k-1) V(s_{t+k}), so at
      the production lambda of 0.95 over a ~34-decision episode only ~0.47
      of the head's target mass (step-weighted) was the game's OUTCOME and
      ~0.53 was the ORDINARY NON-PRIVILEGED CRITIC'S OWN OUTPUT — ~0.82 of
      it at the FIRST decision, which is exactly where the privileged block
      carries the most information. The head existed to beat that critic and
      was being trained to agree with it.
    what_it_does_now: "regresses the MONTE-CARLO RETURN on both drivers"
    verdict_metric: priv_eval/ev_mc_advantage
    verdict_metric_definition: >-
      the head's explained variance MINUS the critic's explained variance,
      BOTH against the MC return, on the SAME batch in the SAME pass
      (rl/agents/ppo.py:1638-1653). The critic's values are recovered exactly
      as flat_targets - flat_advantages, so it costs one forward.
    companion_keys: [priv_eval/explained_variance_mc, priv_eval/critic_ev_mc]
    diagnostic_never_a_verdict_input: priv_eval/explained_variance
    why_that_one_is_barred: >-
      it scores the head against the GAE target, which is ~53% the ordinary
      critic's own output (~82% at the first decision), so it FLATTERS THE
      HEAD BY CONSTRUCTION — a contestant scored against a scorecard
      half-written by its opponent.

pending_decisions:
  DECISION_1_does_B_ride_As_lanes:
    ruling: RWM-11
    state: PENDING RATIFICATION — NOT PICKED HERE
    D1-RIDE:
      what: "priv_eval_dim 408 + priv_eval_coef 0.5 set IN ARM A's OWN config; one set of A/B lanes; THREE LANES FREED"
      licensed_by: "FACT 1 and nothing else — the bitwise smoke IS the control, and a stronger one than a separate arm could be"
      gives_up: "nothing measurable; the only thing a separate arm buys is a live re-demonstration of FACT 1 at 100M, which P-ID buys far more cheaply"
      recommended: true
    D1-SEPARATE:
      what: "arm B keeps its own three lanes (configs/showdown_monster100m_b.yaml, unchanged)"
      cost: "three lanes produce DUPLICATE actor/critic bytes; P-ID becomes a cross-lane bitwise assertion; the allocation branch does not fire"
    the_header_is_complete_under_either: true
  DECISION_2_does_arm_C_run:
    ruling: RWM-13
    state: PENDING RATIFICATION — NOT PICKED HERE
    maintainer_ruled_three_arms: "2026-09-11, 'how could it even hurt'"
    objections_from_both_pre_launch_reviews:
      - "it is D18's EXACT lever at lambda 0.95, and the vacatur named a DIFFERENT one — IDEAS 4.7's live hypothesis is the lambda=1.0 PURE-BASELINE variant at large batch and long horizon"
      - "the variance-reduction channel has ~30x LESS HEADROOM here: a baseline reduces the variance of a gradient ESTIMATE, and this update is 30,720 steps against D18's 1,024"
      - "its falsifier as first drafted CANNOT FIRE: it conditioned on an 'uncollapsed critic', and the MAXIMUM critic ctx srank99 ever recorded in this project is 25 of 384 (D18 s41); no lane at any dose has exceeded it"
    word_kill_is_BARRED_for_this_arm: >-
      per the 2026-09-06 ruling: a small-run null closes nothing, only a
      measured ceiling kills. One fleet at k=3 or k=4 is not a measured
      ceiling. The only verdicts available to arm C are NULL and CREDITED
      NEGATIVE, and every cell in `branches` is written in those words. The
      earlier draft's C-FLAT-KILL cell is REMOVED, not renamed.
    D2-RUN: "arm C runs as configured, under the exhaustive (primary delta) x (mechanism moved) partition in `branches`"
    D2-DROP: "arm C does not run; ALLOC-AB9 fires; IDEAS 4.7 stays open and its next design is the lambda=1.0 pure-baseline variant it actually names"
    D2-REFORM: "arm C runs as 4.7's OWN hypothesis (gae_lambda 1.0 + privileged_dim 408) — but that is TWO levers against arm A and needs a lambda-only control, making the fleet four arms, which does not fit. RECORDED AS CONSIDERED AND NOT RECOMMENDED at this width."
  DECISION_3_the_verdict_axis:
    ruling: RWM-8
    state: PENDING RATIFICATION — NOT PICKED HERE
    see: power

freed_lane_allocation:
  ruling: RWM-12
  fires_only_under: D1-RIDE
  why_more_seeds_is_the_leading_candidate:
    - "THE GOVERNING BAND IS SEED-CLUSTERED. The credit line takes the LARGER of the binomial and the seed-clustered se_diff, and at k=3 the seed-clustered leg is a 2-df estimate whose 95% CI multiplier runs [0.521, 6.285] — a factor of 12. Seeds are the only thing that touches it; battles are not."
    - "THE LADDER OBJECT IS AN ENSEMBLE CANDIDATE. S3's P-E read the LOO-ensemble evaluator at PARTIAL ~+0.012 on a 3-member pool. A 6-member ensemble beats a 3-member one, and this run exists to produce the object step 11 ladders."
  ALLOC-AB5C4:
    fires_if: "arm C stays (D2-RUN)"
    ab_seeds: [104, 112, 120, 128, 136]
    c_seeds: [104, 112, 120, 128]
    lanes: 9
    why: >-
      near-optimal for the C-vs-A contrast (se_clus scales as sqrt(1/5+1/4)
      = 0.671 s against 0.816 s at 3+3) AND it restores the D23-onward
      5x3000 practice on the arm that produces the ladder object. 128 and
      136 are the 100M pre-reg's own ORDERED spares, 8 apart.
  ALLOC-AB9:
    fires_if: "arm C is dropped (D2-DROP)"
    ab_seeds: [104, 112, 120, 128, 136, 144, 152, 160, 168]
    lanes: 9
    what_it_is: >-
      NO credit-seeking greedy contrast exists in that world and the run is
      a PRODUCTION run for the ladder object — which is legitimate and
      should be SAID PLAINLY rather than dressed as an experiment. Arm B's
      mechanism read still fires at full strength, because P-BEV is paired
      WITHIN a lane and needs no contrast arm.
  ALLOC-3x3:
    fires_if: "D1-SEPARATE"
    seeds: [104, 112, 120]
    lanes: 9
    note: "the original three-arm allocation; three of the nine lanes produce duplicate actor/critic bytes"

arms:
  A:
    role: control
    n_lanes: 3
    seeds: [104, 112, 120]
    seat_tag: m10a
    run_dirs: [monster100m_a_s104, monster100m_a_s112, monster100m_a_s120]
    config: configs/showdown_monster100m.yaml
    recipe: configs/showdown_sp_100m.yaml (the R4 recipe)
    privileged_keys: none
    measured_at_seed_104: {actor_params: 626059, actor_param_sum: 442.300,
                           critic_params: 494849, critic_ctx_in: 640,
                           aux_params: 49479, privileged_block_dim: 0}
  B:
    role: privileged EVALUATOR head (design B, built 7d8650e 2026-09-10)
    n_lanes: 3
    seeds: [104, 112, 120]
    seat_tag: m10b
    run_dirs: [monster100m_b_s104, monster100m_b_s112, monster100m_b_s120]
    config: configs/showdown_monster100m_b.yaml
    keys: {priv_eval_dim: 408, priv_eval_coef: 0.5}
    critic: the ORDINARY D18-free critic; advantages and the policy gradient untouched
    init_paired_with_A: true       # the head's construction rewinds the RNG stream
    measured_at_seed_104: {actor_params: 626059, actor_param_sum: 442.300,
                           critic_params: 494849, critic_ctx_in: 640,
                           aux_params: 49479, priv_eval_head_params: 642305,
                           priv_eval_ctx_in: 1024, privileged_block_dim: 408}
  C:
    role: privileged CRITIC (D18's own form; IDEAS 4.7)
    n_lanes: 3
    seeds: [104, 112, 120]
    seat_tag: m10c
    run_dirs: [monster100m_c_s104, monster100m_c_s112, monster100m_c_s120]
    config: configs/showdown_monster100m_c.yaml
    keys: {privileged_dim: 408}
    critic: WIDENED to obs || priv; ctx pooling 5 -> 8 entity slots
    init_paired_with_A: false      # privileged_dim re-rolls the actor at a fixed seed
    measured_at_seed_104: {actor_params: 626059, actor_param_sum: 375.635,
                           critic_params: 642305, critic_ctx_in: 1024,
                           aux_params: 49479, privileged_block_dim: 408}
    never_run_before:
      privileged_dim_on_engine_route: >-
        NO run in this repo has ever done it. All 20 runs/*/config.yaml with
        collector.mode engine were swept; exactly one carries a privileged
        key and it is priv_eval_dim (runs/engine_pe_s66, the design-B smoke).
      privileged_dim_with_aux_oppact: >-
        NO run in this repo has ever done it on ANY route. D18's own config
        (configs/showdown_sp_priv12m.yaml) carries no oppact head; the
        refusal on the combination was removed 2026-09-10.
        docs/proposals/privileged_critic_engine_route.md:711 calls the
        combined build "a NEW object with no golden".

declared_config_differences:
  between_arms: [run_name, env_kwargs.seat_tag, agent.priv_eval_dim,
                 agent.priv_eval_coef, agent.privileged_dim]
  arm_A_vs_R4_recipe: [collector.mode, collector.k, collector.team_bank,
                       collector.min_bank_pairs, collector.learner_seat,
                       collector.concurrency (removed), run_name,
                       env_kwargs.seat_tag]
  verified: >-
    Checked key-by-key on the parsed YAML 2026-09-10: A vs B differs in
    exactly 4 keys, A vs C in exactly 3, A vs configs/showdown_sp_100m.yaml
    in exactly 8. ZERO undeclared differences. The launcher re-runs the
    comparison before lane 1.

collector:
  mode: engine
  k: 8
  k_is_declared_not_assumed: true
  k_reasoning: >-
    k alone is 1.270-1.299x at matched width (maxout.json, widths 1/3/6) —
    ~5 fleet-hours out of ~45, and only on the 34.9% of wall that is
    collection. It costs 13.3-13.8% of every update arriving one version
    stale against 0.436% at k=8 (32-37x), CONCENTRATED ON OPENING PLAY:
    P(lag>=1) is 0.2248 over turns 0-4 against 0.0726 over turns 25+, a
    3.1x gradient across the episode. Stale rows enter through the recorded
    old_logp with no filter and no reweighting, and the PPO clip is already
    saturated on the comparator (clip_frac 0.2264-0.2363 vs clip_eps 0.2).
    K-1 (configs/engine_k256.yaml) is PARKED, not withdrawn, and its own MDE
    (0.032-0.038) is WIDER than its accept band (0.025).
  k256_is_not_licensed_by_this_prereg: true
  team_bank: data/engine/teams_a1_5000000.bin
  team_bank_bytes: 480000262
  min_bank_pairs: 1000000
  learner_seat: p1
  a1_signed_delta_that_travels_forever: -0.00436
  a1_build: bd3d06a
  a1_detail: >-
    A-1 PASS on the fixed build: pooled engine 0.66775 (0.66675 / 0.67183 /
    0.66467) against the banked async 0.67211, n=12,000/seed, band +-0.025,
    -0.59 se on the seed-clustered 0.00736. P-AUC -0.00298 INSIDE
    (secondary). A bare "A-1 passed" is NOT an attribution.
  a1_cannot_say: >-
    "A-1 says nothing about behaviour at 100M+, which is the horizon the
    port exists to buy." This fleet does not retroactively validate A-1;
    D-COLL100 is a descriptive overlay, not a gate.

dose:
  steps_per_lane: 100000000
  lanes: 9
  rung: first_checkpoint_at_or_after_100000000
  matched_across_arms: true
  how_we_would_know: >-
    the realized final step in each lane's meta.yaml and checkpoint
    filename. The banked Node 100M fleet realized 100000027 / 100000008 /
    100000080. A lane more than one update (30,720) off is REPORTED and
    graded at its realized step, never at the nominal; beyond 250,000 (one
    eval interval) it is M-VOID-DOSE.
  anneal_trap:
    total_steps: 100000000
    lr_anneal_steps: 100000000
    fresh_full_horizon: true
    warm_start: FORBIDDEN
    why: >-
      JOURNEY 10, verbatim: "The anneal trap still binds: a fresh
      full-horizon run with lr_anneal_steps == total_steps, never a warm
      start off a finished checkpoint." A warm start would also break the
      anneal basis (anneal_basis = step, rl/train.py:970) and would make the
      arms incomparable, since only one of three could inherit a control's
      weights. A RESUME AFTER A CRASH IS NOT A WARM START and is permitted.
  team_bank_recurrence_at_this_dose:
    battles_per_lane: 3257329          # 100e6 / L-bar 30.70 (the A-1 fleet mean)
    draws_per_pair: 0.6515
    first_use_fraction_per_lane: 0.735  # against 0.962 at A-1's 12M
    first_use_fraction_fleet_wide: 0.170
    realized_L_bar_is_recorded_not_asserted: true
    why_disclosed_not_fixed: >-
      recurrence is COMMON to all three arms, so it cannot bias any
      between-arm contrast — which is what the credit line reads. It CAN
      bias the absolute level and the D-COLL100 overlay, where the Node arm
      effectively never repeats a pair. Restoring A-1's 96% needs ~20M pairs
      = +2.13 GB resident PER LANE, infeasible until the bank is mmap'd.
      See RWM-4.

seeds:
  triple: [104, 112, 120]
  shared_across_all_three_arms: true
  separated_by: env_kwargs.seat_tag (m10a / m10b / m10c)
  rule2_mechanism_checked_in_code: >-
    CLAUDE.md rule 2's mechanism is poke-env deriving seat usernames from
    the globally-seeded `random`. On the engine path NO TRAINING ENV IS
    BUILT (rl/train.py:508-525) and the collector opens no sockets, so the
    only poke-env object per lane is the in-loop EVAL env (rl/train.py:533,
    seat_role "e"), which is 2 usernames. With seat_tag set, rl/envs/make.py:
    41-49 injects explicit AccountConfigurations from seat_names(seed, tag,
    role) = f"as2s{seed}{role}{sha256(tag)[:4]}" + {a,b}, so poke-env's
    global-`random` derivation is NEVER REACHED and rule 2's failure
    mechanism is not present. Without a tag it is, and three arms at one
    seed would collide on the first eval.
  verified_live: >-
    the design-B smoke at seed 66 under seat_tag "pe" is on the server as
    as2s66ecdf6a / as2s66ecdf6b (runs/engine_pe_s66.nohup.log), exactly
    seat_names(66, "pe", "e").
  eighteen_pinned_usernames:
    m10a: [as2s104ec990a, as2s104ec990b, as2s112ec990a, as2s112ec990b, as2s120ec990a, as2s120ec990b]
    m10b: [as2s104e930ba, as2s104e930bb, as2s112e930ba, as2s112e930bb, as2s120e930ba, as2s120e930bb]
    m10c: [as2s104eed0da, as2s104eed0db, as2s112eed0da, as2s112eed0db, as2s120eed0da, as2s120eed0db]
    length: 13          # against SEAT_NAME_MAX 18
    all_distinct: true
  eight_wide_window_does_not_apply: >-
    [seed, seed+7] is a VECTOR-path reservation (make_vec_env seeds sub-env
    i at seed+i). The engine path builds no vector env, so only cfg.seed
    itself is consumed. 104/112/120 are 8 apart anyway; recorded so the
    window is not later treated as a live engine-path constraint.
  why_shared: >-
    (1) it is what seat_tag was built for (IDEAS 2.2: "arms can SHARE a
    seed"); (2) pairing is weakly dominant and the PRIMARY estimator is
    UNPAIRED regardless, so it can only ADD a secondary; (3) the environment
    stream — battle seeds via splitmix64(lane_seed * PHI ^ battle_counter)
    and pool-member draws via np.random.default_rng(seed) — is genuinely
    shared, which no gen-1 A/B in this repo has ever had.
  why_this_triple: >-
    arm A at 104/112/120 is INIT-PAIRED LANE-FOR-LANE with the banked Node
    100M fleet runs/showdown_sp_100m_s{104,112,120} — same recipe, same
    dose, same anneal, different collector. That buys D-COLL100 for zero
    compute, and it cannot be recovered later.
  pairing_credit_taken: false
  pairing_asymmetry:
    A_and_B: init-paired (actor param sum 442.300 identical at seed 104)
    A_and_C: NOT init-paired (375.635 vs 442.300 at seed 104); environment stream still shared
  test_amendment_owed_in_the_ratification_commit:
    file: tests/test_100m_prereg.py
    test: test_seed_windows_disjoint_and_unused
    why: >-
      it enumerates the windows [104..111], [112..119], [120..127] and
      asserts no run dir OTHER than showdown_sp_100m_s{104,112,120} stamps a
      seed inside them. It goes RED the moment lane 1 writes its config. The
      amendment adds the nine monster dirs as the SECOND legal owner, in the
      comment form the 2026-09-01 / 2026-09-09 amendments used.
    lands: the RATIFICATION commit, before launch, never after
    not_the_other_one: >-
      tests/test_ch5_r2_prereg.py::test_seeds_are_window_disjoint_and_unused
      guards 66/75/83 only and is UNAFFECTED by this fleet. (It is the test
      the drafting brief named; it is the wrong one for these seeds.)

cost:
  basis:
    maxout_k8_per_lane_steps_per_sec: {w1: 2390.2, w3: 1620.5, w6: 1282.3}
    maxout_k8_fleet_steps_per_sec: {w1: 2390.2, w3: 4861.4, w6: 7693.6}
    maxout_peak_rss_gb_FLEET_SUM: {w1: 2.263, w3: 7.369, w6: 10.952}
    maxout_conditions: idle box, evals OFF, 200,000 steps per lane per cell
    maxout_max_width_ever_measured: 6
    a1b_whole_lane_steps_per_sec_w3_evals_on: {s66: 1390.03, s75: 1386.79, s83: 1349.49}
    a1b_median: 1386.79
    a1b_realized_metric_median: {s66: 1423.54, s75: 1418.83, s83: 1380.95}
    do_not_use: "time/steps_per_sec — medians 5202-5638 on these lanes, ~3.5x the truth"
    engine_collect_share_of_wall: 0.34873
    cores_per_lane_measured: 1.0199      # results/t1/leg_d.json, 900 s at width 3
  planning_rate_w6_whole_lane: 1097.4    # PROJECTED = 1386.79 * (1282.3/1620.5)
  planning_rate_w6_is_an_upper_bound: >-
    the width ratio is measured with evals OFF, so it does not carry six
    lanes' eval-seat contention on one Showdown server. Upper bound on rate,
    lower bound on hours. The eval term is small (A-1: ~5.5 s per 100-battle
    eval; 400 evals is ~0.61 h/lane) and 12 eval seats is light against the
    Node 100M fleet's 27, but EXPECTED IS NOT MEASURED.
  recommended_structure:
    width: 6
    waves:
      - {name: wave1, seeds: [104, 112], arms: [A, B, C], lanes: 6, width: 6, hours: 25.3}
      - {name: wave2, seeds: [120], arms: [A, B, C], lanes: 3, width: 3, hours: 20.0}
    fleet_hours: 45.3
    waves_are_arm_balanced: true
    why_arm_balanced: >-
      a wave is a shared box condition, so a wave holding unequal numbers of
      each arm CONFOUNDS ARM WITH BOX. Cut by SEED, every wave holds exactly
      one lane of each arm per seed and any wave effect cancels in every
      between-arm contrast. A wave cut BY ARM is BARRED.
  nine_wide_refused:
    on: memory
    box_ram_gb: 24.00
    box_cores: 14                        # Apple M4 Pro, 10 performance + 4 efficiency
    per_lane_rss_gb_measured_w6: 1.825
    nine_lanes_measured_no_growth_gb: 16.4
    comparable_idle_headroom_gb: "11-13 (logs/engine_gates.log, 2026-09-09)"
    growth_unmeasured: >-
      the A-1 lanes ran 2.4-2.6 h. On the Node path a lane grew 2.31 -> 3.21
      GB over 49 h (1.39x, logs/ch5_100m_rss.log, 598 samples). At that
      factor six lanes reach ~15.2 GB and nine reach ~22.8 GB, the whole box.
    named_unlock: >-
      mmap the team bank — MEASURED: 3 processes consume 1.37 GB read and
      0.00 GB mmap'd. Returns 5 x 0.532 = 2.7 GB at width 6. Staged in
      STATUS ("Free wins staged: ... an mmap'd team bank") and NOT
      implemented. If it lands before launch, RE-ASK RWM-3.
    rate_is_extrapolation: "the maxout grid is {1, 3, 6}; nothing above 6 has been measured"
  width_is_measured_at_launch:
    unit: W-0
    what: scripts/engine_maxout.py at k=8, widths 6 and 9, 200,000 steps/lane, idle box, arm-B config
    minutes: 12
    rule: >-
      run 9-wide iff BOTH (a) fleet aggregate at 9 >= 1.10x the fleet
      aggregate at 6 AND (b) fleet peak RSS at 9 <= 14.0 GB. Otherwise the
      6+3 arm-balanced waves. The measured numbers and the branch taken are
