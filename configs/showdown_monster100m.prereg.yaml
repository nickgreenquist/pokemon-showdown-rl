    scripts/engine_gates.sh is the model: a frozen unit order, every unit
    skipped when its output exists, ELAPSED per unit, step 0 refusing while
    anything else owns the box. A monster launcher does not exist yet and
    PRE-1/PRE-5/PRE-6/PRE-9/PRE-10 and the config diff are all things it
    should enforce rather than a human checking by eye. Writing it is part
    of the ratification work, not of this pre-reg.

resume_costs_pre_stated:
  history_splits: >-
    a resume SPLITS the wandb history into two offline runs with OVERLAPPING
    steps and extract_history.py then HARD FAILS. Use
    scripts/merge_history.py; verify segments == resumes + 1 from meta.yaml
    and _step monotone. Every CURVE is affected; no PRIMARY read is, because
    the primary reads are checkpoint evals.
  checkpoint_lags: >-
    checkpoint.pt lags the last logged step by much more than one update (R2
    lost 190,776 and 170,680 steps). Read the real from_step from meta.yaml
    and expect updates_done one short per resume.
  seat_names_survive: >-
    with seat_tag set a resumed lane reconnects under exactly the names it
    died with. A mid-battle kill poisons a username pair for hours; /timer
    on is what bounds it.

readout:
  target: "RESULTS.md addendum, by hand, in ONE commit with the STATUS rewrite and the SESSION_LOGS entry"
  readouts_dir: >-
    a readouts/ file only if the object is laddered. The 100M fleet produced
    NO readouts/ file and its account is RESULTS §18; that precedent is
    followed.

# =====================================================================
# RULINGS WANTED — THE LAST WORD IN THIS FILE, DELIBERATELY.
# NOTHING HERE IS RATIFIED. The fleet does not launch until these are
# answered. Nothing below this block decides anything.
# =====================================================================
rulings_wanted:
  RWM-1:
    topic: seeds shared across arms under distinct seat_tags
    question: >-
      All nine lanes run at seeds 104/112/120, three arms sharing one
      triple, separated by env_kwargs.seat_tag. CLAUDE.md rule 2 says
      concurrent lanes need distinct --seeds INCLUDING ACROSS ARMS. The
      rule's stated MECHANISM is poke-env deriving usernames from the
      globally-seeded `random`; on the engine path no training env exists
      and the only poke-env object is the eval env, whose seats seat_tag
      names explicitly and deterministically (verified live on
      runs/engine_pe_s66). Sharing buys arm-paired training seeds — the
      thing IDEAS 2.2 built seat_tag for and which no gen-1 A/B has ever
      had. Approve the shared triple, or spend nine distinct seeds?
    my_recommendation: >-
      SHARE. The mechanism rule 2 protects against is not present with a
      tag; the pairing is weakly dominant and the PRIMARY estimator is
      unpaired regardless, so it can only add a secondary; and the shared
      environment stream (battle seeds and pool-member draws are functions
      of the lane seed alone) is a real common-random-numbers gain. The
      asymmetry is disclosed: A and B are init-paired, C is not.
  RWM-1b:
    topic: WHICH triple — 104/112/120 rather than fresh seeds
    question: >-
      104/112/120 are the banked Node 100M fleet's seeds. Using them makes
      arm A INIT-PAIRED LANE-FOR-LANE with runs/showdown_sp_100m_s{104,112,
      120} — same recipe, same dose, same anneal, different collector —
      which buys D-COLL100, the 100M reading of the collector delta that A-1
      explicitly could not produce, for the cost of a 6-minute re-read. The
      cost is that tests/test_100m_prereg.py needs the amendment (RWM-2) and
      that "the monster's seeds" and "the 100M fleet's seeds" become the
      same numbers in every future grep.
    my_recommendation: >-
      USE THEM. The overlay cannot be recovered later and it is the one
      thing that speaks to the horizon the port was bought for. The
      ambiguity is a naming inconvenience; the run dirs differ.
  RWM-2:
    topic: the test amendment, and WHICH test
    question: >-
      tests/test_100m_prereg.py::test_seed_windows_disjoint_and_unused goes
      RED the moment lane 1 writes its config: it allows only
      showdown_sp_100m_s{104,112,120} to stamp seeds in [104..127]. The
      amendment adds the nine monster run dirs as the SECOND legal owner and
      belongs in the RATIFICATION commit, not a post-hoc fix. Approve?
      (NOTE: tests/test_ch5_r2_prereg.py::test_seeds_are_window_disjoint_and_unused
      — the test the drafting brief named — guards 66/75/83 and is
      UNAFFECTED. The brief named the wrong guard for these seeds.)
    my_recommendation: approve the amendment, in the ratification commit
  RWM-3:
    topic: fleet width and the wave structure
    question: >-
      The maxout grid is {1, 3, 6} and NOTHING above 6 has been measured.
      Nine-wide is 16.4 GB of the measured, non-growing per-lane RSS against
      11-13 GB of comparable idle headroom on a 24 GB box, before any growth
      (the Node path grew 1.39x over 49 h). The recommendation is 6+3
      ARM-BALANCED waves at ~45.3 h, with a 12-minute W-0 measurement at
      launch and a pre-stated rule that licenses 9-wide only if the
      aggregate is >= 1.10x the 6-wide aggregate AND fleet peak RSS <= 14.0
      GB. STATUS's "~40 h" figure presumes nine-wide.
    my_recommendation: >-
      6+3 arm-balanced waves, with W-0 run and its branch recorded before
      lane 1. If the mmap'd team bank (STATUS "free wins staged") lands
      first, RE-ASK THIS — it returns 2.7 GB at width 6 and changes the
      memory arithmetic and only the memory arithmetic.
  RWM-4:
    topic: the team bank at this dose
    question: >-
      The 5,000,000-pair bank gives 73.5% first-use battles per lane at
      100M, against 96.2% at A-1's 12M — a real degradation of the
      train-on-finite-support property RW-6 bought. Restoring 96% needs ~20M
      pairs = +2.13 GB resident PER LANE, infeasible at width 6 until the
      bank is mmap'd. Keep 5M and disclose, or block the fleet on the mmap
      work and buy 20M?
    my_recommendation: >-
      KEEP 5M AND DISCLOSE. Recurrence is COMMON TO ALL THREE ARMS, so it
      cannot bias any between-arm contrast — which is what the credit line
      reads. It can bias the absolute level and the D-COLL100 overlay, and
      both are descriptive. Blocking a 45-hour fleet on an unbuilt memory
      optimisation to protect a descriptive number is the wrong trade.
  RWM-5:
    topic: arm B's searched read — DEFERRED, and the build it waits on
    question: >-
      NOTHING UNDER rl/search/ KNOWS ABOUT THE PRIVILEGED BLOCK TODAY
      (`grep -rn priv_eval rl/search/` returns zero lines; ppo.py says so
      itself). P-BS is therefore DEFERRED and is NOT a cell of this run; arm
      B's registered primary is P-BEV, the training-time mechanism read,
      which is available today and paired within a lane. The seam is
      specified (docs/proposals/privileged_critic_engine_route.md §4.4: four
      functions plus a seat-mirrored shadow_battle) and two guards in
      scripts/ch3_eval.py will fire and need rulings rather than quiet
      edits. Is the build funded, by whom, and does it gate the fleet?
    my_recommendation: >-
      FUND IT, DO NOT GATE THE FLEET ON IT, AND GIVE IT ITS OWN PRE-REG. The
      head is in every checkpoint, so P-BS is recoverable at any later date
      at eval cost only — which is the whole reason the head rides this run
      — while it is NOT recoverable if the head is not trained now.
      Launching the fleet and building the seam during the ~45 h it runs is
      strictly better than either serialisation.
  RWM-6:
    topic: arm C's pre-fleet smoke
    question: >-
      privileged_dim has NEVER run on the engine route, and privileged_dim +
      aux_oppact_coef has never run anywhere. The refusals that blocked both
      were removed on 2026-09-10. PRE-2 requires a live ~10-update design-A
      smoke before the fleet. Approve the smoke as a hard precondition?
    my_recommendation: >-
      YES, HARD. It is minutes of agent-side work against a 25-hour lane,
      and docs/proposals/privileged_critic_engine_route.md:711 calls the
      combined build "a NEW object with no golden" in terms.
  RWM-7:
    topic: arm C's mechanism axis — confirm the WITHDRAWAL of the kill drafting
    question: >-
      An earlier draft of this pre-reg proposed that EV-up + win-rate-flat +
      an UNCOLLAPSED critic be a KILL WITH A MECHANISM, overriding IDEAS
      4.7's standing "pre-committed as a NULL branch this time, never a
      kill". THAT DRAFTING IS WITHDRAWN on two grounds: the 2026-09-06
      ruling bars "kill" for a single fleet (only a measured ceiling kills),
      and the uncollapsed-critic condition could not fire (max critic ctx
      srank99 ever recorded is 25 of 384). What is registered instead is a
      (primary delta) x (mechanism moved) cross-partition, eight named
      cells, no kill language. Confirm the withdrawal and the partition?
    my_recommendation: >-
      CONFIRM. The withdrawn rule was mine and it was wrong in the same way
      D18's kill was: it would have let one fleet close an axis. The
      replacement keeps the srank leg as a REPORTED AXIS, so an arm C that
      moves EV and not srank still lands in a named cell (C-FLAT-EVONLY)
      and is reported as a REPLICATION of D18 at 8.3x the dose, which is
      worth having and is not a closure.
  RWM-8:
    topic: the verdict AXIS — vs-SH, or promote off-FP@20 as E1 did
    question: >-
      This pre-reg's primary is vs-SH, per CLAUDE.md ("the ONLY verdict
      input"). It is also the weakest axis available at this dose: the 100M
      pre-reg's own arithmetic gives P(credit) 0.488 off-FP@20 against 0.067
      vs-SH at a matched logit gain, and it concluded that a vs-SH verdict
      axis "would pre-register a near-guaranteed failure sentence". Its item
      E1 promoted off-FP@20 for that round only, noting it "does not carry
      itself forward". Promote again for this round, or keep vs-SH and
      disclose the power?
    my_recommendation: >-
      KEEP vs-SH AND DISCLOSE. An underpowered primary whose weakness is
      pre-stated is honest; a second ad-hoc promotion would make "the only
      verdict input" mean nothing, and the FP leg costs ~12 h against vs-SH's
      ~18 min. BUT THE DECISION MUST BE MADE BEFORE LAUNCH — the freeze rule
      makes it unmakeable afterwards, and if the maintainer wants the power,
      this is the only moment.
  RWM-9:
    topic: the fleet's shape, now that FACT 1 has freed three lanes
    question: >-
      SUPERSEDED IN PART BY RWM-11/12/13, and kept because the cost answer
      is still owed. "How could it even hurt" has two measured answers: the
      third arm is +20.0 h of fleet (NOT the +11-15 h STATUS estimates,
      which presumes an unmeasured nine-wide), and at k=3 the primary bar
      has P(credit | true +0.025) = 0.45. FACT 1 then removed the third
      arm's LANES without removing the arm, so the live question is what the
      freed three lanes buy: more seeds on the A/B family (ALLOC-AB5C4), all
      nine on A/B (ALLOC-AB9, if arm C is dropped), or nothing (D1-SEPARATE).
    my_recommendation: >-
      D1-RIDE + ALLOC-AB5C4 if arm C stays; D1-RIDE + ALLOC-AB9 if it does
      not. Either way the three lanes go to SEEDS, because the governing
      band is seed-clustered and seeds are the only thing that touches it.
      Three lanes spent on duplicate checkpoint bytes is the one allocation
      with no argument for it.
  RWM-11:
    topic: DECISION 1 — does arm B ride arm A's lanes?
    question: >-
      FACT 1 measured arm B's actor and critic as BITWISE arm A's: 21
      identical rungs, 223 tensors, 3,428,015 elements, ZERO differing,
      digest 104a9339eb6a2260. So three of the nine planned lanes were
      buying duplicate checkpoint bytes at ~25 h each. D1-RIDE sets
      priv_eval_dim/priv_eval_coef in ARM A's own config — one set of A/B
      lanes, three lanes freed, the banked bitwise smoke as the control.
      D1-SEPARATE keeps arm B's three lanes and P-ID becomes a cross-lane
      bitwise assertion.
    my_recommendation: >-
      D1-RIDE. The bitwise smoke IS the control and it is a stronger one
      than a separate arm could be, because a separate arm differs from A by
      exactly zero and would be reporting that zero at 25 h a lane. Nothing
      measurable is given up; the only thing a separate arm buys is a live
      re-demonstration of FACT 1 at 100M, which P-ID buys far more cheaply.
  RWM-12:
    topic: what the three freed lanes buy
    question: >-
      Fires only under D1-RIDE. The leading candidate is MORE SEEDS, for two
      independent reasons: the governing band is SEED-CLUSTERED and at k=3
      its 2-df CI multiplier runs [0.521, 6.285] (a factor of 12), so seeds
      are the only thing that touches it; and the ladder object is an
      ENSEMBLE candidate — S3's P-E read the LOO-ensemble evaluator at
      PARTIAL ~+0.012 on a 3-member pool, and a 6-member ensemble beats a
      3-member one. Two concrete allocations are written out
      (ALLOC-AB5C4, ALLOC-AB9), both 9 lanes, both ~45.3 h.
    my_recommendation: >-
      MORE SEEDS. ALLOC-AB5C4 if arm C stays (near-optimal for the C-vs-A
      contrast AND it restores the D23-onward 5x3000 practice on the arm
      that produces the ladder object); ALLOC-AB9 if it does not. Spending
      them on more BATTLES instead would be spending them on the leg of the
      credit line that does not govern.
  RWM-13:
    topic: DECISION 2 — does arm C run at all, and in what form?
    question: >-
      The maintainer ruled three arms on 2026-09-11 ("how could it even
      hurt"). Both pre-launch reviews contest arm C: (i) it is D18's EXACT
      lever at lambda 0.95, while IDEAS 4.7's live hypothesis is the
      lambda=1.0 PURE-BASELINE variant; (ii) the variance-reduction channel
      has ~30x less headroom at a 30,720-step update than at D18's 1,024;
      (iii) its falsifier as first drafted could not fire. (iii) is fixed
      here — the partition no longer conditions on an unobserved state and
      the word "kill" is barred per the 2026-09-06 ruling — but (i) and (ii)
      are substantive and are the maintainer's to weigh. D2-RUN /
      D2-DROP / D2-REFORM are all written out.
    my_recommendation: >-
      D2-RUN, WITH THE CONFIGURATION NAMED IN EVERY SENTENCE IT PRODUCES.
      The arm is cheap now that FACT 1 has freed three lanes, and it is the
      only thing in the fleet that can move IDEAS 4.7 at all. But it does
      NOT test what 4.7 names, and the readout must say "lambda 0.95, update
      30,720, k=<n>" in the same breath as the result, or a null here will
      be read as answering 4.7 when it answers D18. If the maintainer wants
      4.7's own question instead, that is D2-REFORM and it needs a
      lambda-only control, which does not fit at this width — so it is a
      separate fleet, not a substitution inside this one.
  RWM-10:
    topic: the 2-Opus review cycle on this file
    question: >-
      Memory design-decisions-two-opus reserves the full cycle for
      irreversible artifacts — pre-regs, bars, published numbers. This is a
      pre-reg committing ~45 fleet-hours and it has had ZERO independent
      review. A-1 ran two (11 MUST + 15 SHOULD, then 11 MUST + 11 SHOULD,
      with four CODE DEFECTS found in the second, one of which would have
      killed a perfect arm at its second update). Fund two reviews before
      ratification?
    my_recommendation: >-
      YES, AND BEFORE ANY RULING ABOVE IS GIVEN. Review 1: repo consistency
      and rule compliance. Review 2: adversarial — construct the false
      credit and the false kill, with the mandate to attack the power
      section (G2), the D18-REPEAT legs, the width and memory arithmetic,
      and the P-BS void cell specifically. A-1's second review changed its
      DESIGN, not just its prose, and this file has more moving parts than
      A-1 did.
