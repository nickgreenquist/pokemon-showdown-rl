  disk:
    rung_checkpoint_bytes: 13779635
    rungs_per_lane: 200
    rungs_total_gb: 24.8
    resume_checkpoint_bytes: 103929979
    history_csv_gb_total: 3.3
    wandb_gb_total: 12.2
    total_gb: 41
