
# SAC on Hopper-v5 — Phase 3 benchmark run. Every number is identical to
# configs/halfcheetah_sac.yaml, which carries the full annotation: recipe
# provenance, the CleanRL-specific knobs, why normalization is off, and the
# anchors with their protocols.
#
# Env note: Hopper genuinely terminates (it falls over), so unlike HalfCheetah
# the (1 - terminated) bootstrap mask is live here — this is the first env in
# the campaign that exercises it at all. Rising rollout/episode_length is the
# early health readout.
#
# Anchor caution: Hopper is the noisiest of the three in the literature.
# Deterministic anchors run 3150-3550 (SpinningUp, Tianshou, the paper) while
# CleanRL's stochastic number is ~2400, and SB3-zoo reports +/-1130 over 150
# episodes of a single run. Our PPO's 2380 training return ties the stochastic
# anchor but sits well under the deterministic ones, so "Hopper is a tie" is
# only true measure-for-measure.
env_id: Hopper-v5
seed: 0
total_steps: 1000000
eval_every: 50000
eval_episodes: 10
run_name: hopper_sac
device: cpu
normalize_obs: false
normalize_reward: false
logger: wandb
agent:
  algo: sac
  hidden_sizes: [256, 256]  # separate actor and twin critics, all this shape
  activation: relu
  q_lr: 1.0e-3              # also the temperature optimizer's lr
  policy_lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  buffer_capacity: 1000000
  learning_starts: 5000     # uniform random actions until here
  policy_frequency: 2
  target_network_frequency: 1
  autotune: true            # target entropy is -act_dim, derived not configured
  alpha: 0.2                # unused while autotune is true
