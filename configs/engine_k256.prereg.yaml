    - "PROGRESS IS A RATE. The comparable completed arm is A-1's own: ~1,500 steps/s per lane at k=8 width 3, so an E256 lane should read roughly 1,950-2,100. Anything near 1,500 means k did not take (K1-VOID-DOSE)"
    - "A RESUME SPLITS THE WANDB HISTORY; extract_history.py HARD-FAILS and merge_history.py is required. Read the real from_step from meta.yaml; expect updates_done one short per resume. The comparator has ZERO resumes, so any resume here is an asymmetry worth disclosing beside D_AUC"
    - "every connecting seat sends /timer on (start_timer_on_battle_start defaults True) — without a timer requester Showdown never ends an abandoned room and the lane wedges forever"

disclosures:
  - "equivalence at this n is WEAKLY POWERED; K-1 is a screen, not an equivalence test"
  - "the screen's resolution floor (MDE 0.032-0.038) is WIDER than its own accept band (0.025); a PASS is not a null and N-K256 carries the INTERVAL, never the point estimate"
  - "the comparator's MEASURED seed sd at n=12,000 is 0.01938, 1.89x the planning model (chi2_2 p = 0.028); both columns are carried on every quote"
  - "K-1 says nothing about behaviour at 100M+, which is the horizon the decision it feeds actually runs at; a 12M null does not close an axis"
  - "the 12M rung is the WORST per-update point for a staleness defect (displacement scales with LR), so this is not an LR blind spot; the accumulation over 8x the horizon is"
  - "k=256 trains OPENING play off-policy and ENDGAME play on-policy by 3.1x; the treatment is structured, not a uniform noise floor"
  - "the PPO clip is the only correction on the stale-row path and it is ALREADY saturated on the comparator (clip_frac ~0.23 against clip_eps 0.2)"
  - "k=256 changes four things, not one: learner carry, opponent-snapshot carry, batch size (+0.41%), and inference batch shape"
  - "the comparator is A-1's own arm; a K-1 PASS licenses k=256 only in conjunction with an A-1 acceptance"
  - "the battle-seed and team-pair stream is COMMON across arms and both evaluate at seed_start 100; no CRN credit is taken and the primary read is unpaired, which makes the quoted se_diff conservative"
  - "the two arms' loggers differ by one commit; the parity read therefore uses _step/episodes_finished, and the ~10% episode-row drop on the comparator side is measured to be length-neutral"
  - "the comparator arm ran at TWO git shas (95e5ec9 for s66/s75, 6e3486a for s83); the diff between them touches no code the lanes execute"

barred_language: [equivalent, "identical (about the RESULT; 'byte-identical' about config bytes is permitted)", "no difference", "the same as k=8", validated, "staleness is harmless", "k=256 costs nothing"]
permitted_language: ["inside the band at |D| = x", "within +-k se_diff", "not distinguishable at this n and k", "screened, not equivalence-tested"]

non_lever_declaration:
  name: N-K256
  rule: >-
    k=256 is declared a NON-LEVER backed by K-1's null. Its SIGNED delta AND ITS
    INTERVAL ride every gen-1 credit sentence produced at k=256, forever, as
    G9's +0.02322 does for async and as A-1's does for the engine collector. A
    bare "K-1 passed" is NOT an attribution, and neither is a bare point
    estimate: a PASS at -0.020 is consistent with a real cost of five points. No
    gen-1 number ever pools across K settings, no gen-1 number produced at k=256
    may be quoted as "k=256 costs nothing", and a result produced at k=256 on
    the engine path carries BOTH non-lever deltas, K-1's and A-1's.

