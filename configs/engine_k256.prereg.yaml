# K-1 pre-registration sidecar — the machine-readable half of
# configs/engine_k256.yaml. The header is the authority on WHY; this file is
# the authority on WHAT WAS FIXED BEFORE THE RUN. Neither may be edited
# after launch except to FILL a cell marked [FILLED <date>].
#
# STATUS: DRAFT, REVIEWED x2, PARKED. Nothing here is ratified, no verdict is
# authorized, and the lanes are not launchable. `rulings_wanted` ends the
# file and nothing below it decides anything. Both reviews are applied and
# tagged [V1-*] (design/provenance) and [V2-*] (mechanism/statistics).
---
prereg_for: configs/engine_k256.yaml
status: >-
  DRAFT, REVIEWED x2 (2026-09-10), PARKED — not ratified; the maintainer was
  advised to run JOURNEY 10 at k=8 because k-alone is 1.30x at matched width
  (five fleet-hours on a 100M x 6-lane monster) and this screen's resolution
  floor (MDE 0.032-0.038) is wider than its own accept band
status_note: >-
  PARKED IS NOT WITHDRAWN. Every gate, band and branch is complete and the
  lanes could start the hour a ruling arrives; what changed is the PRIORITY,
  not the design. See `what_turns_on_it` for the re-priced stake that produced
  the advice, and `power.resolution_floor_vs_band` for the second half of it.
journey_step: "7.5"
exit_condition_verbatim: >-
  A-1 acceptance is the gate — 3 seeds × 12M inside |Δ| < 0.025 of the
  async acceptance fleet, with the signed delta travelling forever after
  as N-COLL's does; outside the band we diagnose parity and do NOT switch.
failure_branch_verbatim: >-
  Pre-decided failure branch. If two diagnosis rounds cannot bring A-1's
  12M read inside |Δ| < 0.025, we KEEP the server path; the sunk cost is
  then the parity harness, which survives as a test suite.
exit_condition_note: >-
  Both quotes are copied byte-for-byte from configs/engine_a1.prereg.yaml,
  which pins them against JOURNEY.md step 7.5 in
  tests/test_engine_a1_prereg.py. K-1 is NOT that gate and does not amend
  it: they are restated because CLAUDE.md requires every header to name its
  journey_step and restate that step's exit condition verbatim, and because
  K-1 borrows JOURNEY 7.5's band, its dose and its signed-delta-travels
  obligation. Anything K-1 adds is ADDITIVE and cannot loosen the band.
why_it_exists_cited_by_sha:                 # [V1-B2]
  a1_header: >-
    configs/engine_a1.yaml, present in HEAD: "A-1 accepts the collector AT
    K = 8. It does NOT accept K = 256, and the production K is T-1(b)'s
    question. Any K > 8 needs its own read before it becomes the training
    default."
  status_at_b1ff2c0_caret: >-
    STATUS.md at b1ff2c0^, next action 3: "Anything that changes LEARNING needs
    its own pre-reg: k 8->256 (staleness)". THIS WORDING IS GONE FROM HEAD —
    b1ff2c0 rewrote the block — so it is cited by sha and NOT quoted as
    current. An earlier draft of this file quoted it as if it were in HEAD.
  status_at_head: >-
    next action 2: "k=256 screen (3 x 12M, ~1.7 h, paired with A-1's own k=8
    lanes) — pre-reg in draft. The 4.035x is at an UNTESTED LEARNING config
    (12.6% of an update is off-policy rows)."
credits_nothing: true
is_equivalence_test: false          # a GROSS-BREAKAGE SCREEN; no TOST is run
supersedes_nothing: true

what_turns_on_it:                           # [V2-14] RE-PRICED AT MATCHED WIDTH
  retracted: >-
    an earlier draft priced this screen with the 4.035x / 2.984x A/B pair and a
    "13.2 h vs 24 h" line. THAT PAIR PRICES THE COLLECTOR, NOT K: 4.035x is the
    engine at its production width against Node and 2.984x is the engine at k=8
    against Node. Neither is a k-alone number.
  k_alone_at_matched_width:                 # results/engine_a1/maxout.json
    width_1: {k8: 2390.2, k256: 3034.7, ratio: 1.270}
    width_3: {k8: 1620.5, k256: 2105.6, ratio: 1.299}
    width_6: {k8: 1282.3, k256: 1665.6, ratio: 1.299}
    abba_ab_width_1: {ratio: 1.352, from: "4.0345 / 2.9839, ab_speed_k256.json / ab_speed_k8.json, evals off"}
  the_2x_is_not_k: >-
    the headline 2.06x fleet gain factors as 1.299 (k) x 1.582 (width 3 -> 6),
    and width is FREE — a lane is a SEED, width does not change learning, and it
    needs no screen.
  the_stake: >-
    at the shape STATUS.md proposes for JOURNEY 10 (100M x 2 arms x 3 seeds =
    6 lanes at width 6): 21.7 h at k=8 against 16.7 h at k=256. FIVE FLEET
    HOURS. That is what this screen buys, and it is why the advice is to run
    JOURNEY 10 at k=8 and park this file rather than spend ~1.9 h of fleet plus
    a ratification cycle to chase it.

precondition:
  P1_no_time_budgeted_eval_in_flight:
    state_at_drafting: BREACHED
    inventory_taken: "2026-09-10, this session — RE-CHECK AT LAUNCH; a process list is a snapshot and this one will be stale"
    what_was_running: >-
      five python processes under a `search_s3_queue` shell, including
      scripts/ch3_fp_h2h.py --prereg configs/eval/search_s3_100m_offfp.yaml,
      which runs Foul Play at search_time_ms 20, plus three scripts/ch3_eval.py
      jobs and a Showdown server.
    rule: >-
      K-1's lanes do not launch while any TIME-BUDGETED eval is in flight. A
      fixed-time search budget under CPU contention buys FEWER ROLLOUTS, so a
      three-lane training fleet silently WEAKENS the opponent in someone else's
      in-flight anchor and INFLATES their win rate. It contaminates their
      number, not ours. The box is 14 cores / 24 GB and has the capacity; the
      hazard is arithmetic, not resources. A win-rate eval with no time budget
      is a throughput question and is RWK-6's to weigh.
  P2_a1_rulings:
    state_at_drafting: OPEN (RW-1..RW-10)
    rule: >-
      K-1 does not need A-1 graded to be well posed — it asks whether k=256
      reproduces k=8 ON THE ENGINE PATH, which is well posed whatever A-1
      concludes. The dependency runs one way and the K1-PASS branch encodes it
      as a CONJUNCTION. BUT RW-1 is the ruling that CREATED K-1: if RW-1 branch
      (b) is taken ("run A-1 at 256, declare K part of the treatment"), K-1 is
      SUPERSEDED rather than re-scoped and this file is withdrawn, not amended.
      RWK-1.
  P3_build_identity:
    rule: >-
      the E256 lanes must launch from a tree whose rl/ differs from the
      comparator's by the logging commit and NOTHING else, and whose installed
      pkmn_gen1 stamps the comparator's engine block field for field. See
      build_identity_gate. RWK-7.
  P4_grader_and_test_must_exist:            # [V1-M6]
    state_at_drafting: NEITHER EXISTS
    rule: >-
      the RATIFICATION COMMIT lands BOTH, before launch. Neither is written by
      this pre-reg.
    owed:
      - path: scripts/engine_k256_grade.py
        must: >-
          read only committed files; compute D_K and the three D_AUC legs;
          refuse without `verdict_authorized: true`; and SHA-STAMP every E256
          eval JSON and checkpoint it reads into its output, so a graded number
          can be traced to the bytes it came from.
      - path: tests/test_engine_k256_prereg.py
        must: >-
          in the shape of tests/test_engine_a1_prereg.py — the loader would
          accept the config; the arms differ only where declared; no open ruling
          is quietly answered; the verbatim quotes match JOURNEY.
    not_a_substitute: >-
      scripts/engine_a1_grade.py takes --prereg and --banked and could be a
      starting point, but it hard-codes A-1's BASE_AUC and disclosure strings. A
      K-1 grade computed by it is NOT trusted.
  P5_runner_must_exist:                     # [V1-B4]
    state_at_drafting: DOES NOT EXIST
    rule: >-
      either scripts/engine_k256_gates.sh or an --arm-parameterised
      scripts/engine_gates.sh. NAMED AS OWED; not written by this pre-reg.
    must_encode:
      a_120s_hold: >-
        HOLD EACH LANE 120 s AFTER ITS RUNG CHECKPOINT BEFORE THE KILL. This is
        a silent data-loss bug otherwise: rl/train.py writes the crossing
        checkpoint BEFORE that step's eval, so a lane killed the moment
        ckpt_0120*.pt appears LOSES THE 48th IN-LOOP BUCKET — exactly the bucket
        D_AUC's last-24 leg needs. scripts/engine_gates.sh:252-255 already does
        this for A-1; measured time/eval_sec ~5.1 s, so 120 s is a ~23x margin.
      b_bank: ">= 1,000,000 pair floor, and a bank sha256 equality check against the comparator"
      c_seats: "seat_tag k256 and a DISTINCT --seed per lane"
      d_eval: >-
        n=12,000, --opponent heuristics, seed_start 100, writing
        results/engine_k256/rung12m_s<seed>.json

arms:
  E256: {n_lanes: 3, seeds: [66, 75, 83], collector: engine, k: 256, compute: NEW}
  E8:   {n_lanes: 3, seeds: [66, 75, 83], collector: engine, k: 8,   compute: BANKED_FREE,
         run_dirs: [runs/engine_a1_s66, runs/engine_a1_s75, runs/engine_a1_s83]}
  node_arm_is_not_an_arm_and_is_not_reported:      # [V1-M3]
    rule: >-
      the banked Node async fleet is A-1's comparator. Its pooled number is one
      of the two OPERANDS of A-1's P-END read, and putting it in this file would
      place BOTH operands of another gate's verdict in a third gate's artifact,
      where a later reader can subtract them without noticing which pre-reg
      authorised the subtraction. K-1 therefore reports NO Node number at all —
      not as a "descriptive" row, not as provenance context, and not as a
      derived delta from which the operand could be recovered. A-1's delta
      belongs to A-1's artifacts and travels with A-1's sentences.
    an_earlier_draft: >-
      carried a `D-NODE` secondary read quoting the Node pooled figure "beside
      the arms, never subtracted". That is removed: beside is close enough.
  comparator_rationale: >-
    comparing E256 against the banked NODE arm would measure the collector AND
    the concurrency together, which is the confound A-1 exists to avoid.
    Against A-1's ENGINE arm, k is the ONLY declared delta: same collector,
    same seeds, same box, same team bank file, same recipe, same rung, same
    eval instrument at the same n.

