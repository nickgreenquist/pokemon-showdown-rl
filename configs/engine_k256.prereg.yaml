  rule: >-
    every E256 lane's meta.yaml `engine` block must equal the comparator's
    field for field. Not a new mechanism: rl/train.py already refuses a RESUME
    whose engine block moved, because "a resumed lane must play the same game".
    K-1 applies the same test ACROSS ARMS, which is where it bites.
  expected:
    engine_sha: 9b88fd6c5467f703c38951d5b2e8a660314d410b
    engine_options: {showdown: true, log: false, chance: false, calc: false}
    zig_version: "0.16.0"
    crate_version: "0.1.0"
    team_bank_sha256: 7b0d4c9e93a36aea01a6af828b77eb2f7a34e48209092e96931a8f51ff62209d
    team_bank_pairs: 5000000
    team_bank_ps_commit: 59da482eabc87245eb62313593e468e81ca537d9
    tables_fingerprint: d2ba00c2ef52ba332cf80b9a6bbbf1ea7f85bb3610c63b86f10521186ce1f640
  expires_if_the_engine_build_moves:    # [V1-M5]
    rule: >-
      a K-1 result is a statement about THIS engine build. If A-1's parity
      diagnosis — A-1a or any later round — changes `engine_sha`, a banked K-1
      PASS is VOID and k=256 is RE-SCREENED, not carried forward.
    why: >-
      the staleness path runs through the collector's own drain and episode
      bookkeeping, which is exactly the code such a fix would touch.
  team_bank_verified_this_session: >-
    data/engine/teams_a1_5000000.bin carries header sha256 7b0d4c9e93... — byte
    for byte the payload the comparator stamped. The FILE's own sha256 is
    86f60956ae241f2f115561b6ce0869475856ba146893e994374936d3959e2a26 and is a
    DIFFERENT quantity: rl/envs/engine_bank.py hashes the PAYLOAD. Recorded
    because an earlier reading this session mistook the two for a bank swap.
  consequence: >-
    RW-6's train-on-finite-support asymmetry is IDENTICAL on both arms and
    cancels out of this comparison entirely. The one confound A-1 had to buy
    its way out of is free here.
  must_not_land_between_the_arms:
    scorer_ctx_factorization: >-
      recorded as "verified to 3e-07", which is NOT bit-identical, and REVERTED
      once on a bit-exact pin. A numerics change between the arms is a second
      treatment and K-1 would stop measuring k.
    mmap_team_bank: SAFE (memory only; the bank bytes and its sha are unchanged)

dose:
  steps: 12000000
  rung: first_checkpoint_at_or_after_12000000    # crossing rung; overshoot recorded
  matched: true
  how_we_would_know: >-
    the realized crossing step in each lane's meta.yaml and CHECKPOINT FILENAME,
    against the comparator's 12000008 / 12000019 / 12000031. A lane more than
    one update (30,720 steps) off is REPORTED and its realized step used, never
    the nominal; beyond 250,000 (one eval interval) it is a different dose and
    the cell is K1-VOID-K.
  anneal_trap:
    total_steps: 50000000
    lr_anneal_steps: 50000000
    why_verbatim_from_a1: >-
      A 12M budget with lr_anneal_steps == total_steps would anneal the
      engine arm to ~0 while the banked arm sits at 1.9e-4 at the same
      rung, comparing LR schedules rather than collectors. G9's verbatim
      obligation, restated.
    substitution_for_k1: >-
      one word and it changes nothing: it is the E8 ENGINE arm that sits at
      2.5e-4 * (1 - 12/50) = 1.9e-4 at the same rung, and a 12M horizon here
      would compare LR SCHEDULES rather than K. rl/train.py:425-438 permits
      anneal >= total (it refuses only 0 < anneal < total_steps), so this is a
      header line and needs no code change.
  hours_projected: [1.699, 1.836]       # per lane, route (i); see ops.cost

treatment:                              # what k=256 actually changes
  mechanism: >-
    the engine steps k battles in lockstep and drains WHOLE FINISHED EPISODES,
    so at a drain the k battles in flight carry their collected steps into the
    NEXT update, where they arrive one policy version stale.
  carry_fraction:                       # [V1-M1, V2] TWO derivations, both recorded
    retracted: >-
      an earlier draft used k * Lbar / 2, the mean age of a UNIFORMLY-sampled
      point in an episode of MEAN length. That is the wrong expectation: a drain
      lands in an episode with probability proportional to that episode's
      LENGTH, so the constant is the length-biased mean age E[L^2]/(2E[L]).
    method_1_length_biased_age:
      constant: {length_biased_age: 16.725, lbar_over_2: 15.166, ratio: 1.103}
      k8:   {steps: 133.8,  fraction: 0.00436}
      k256: {per_lane: [0.1394, 0.1407, 0.1347], fleet: 0.1383, steps: 4281}
      recomputed_this_session: >-
        over rows at _step <= 12,000,000 the age is 16.598, k=8 is 0.432% and
        the k=256 fleet is 13.83% — inside the quoted range; the difference is
        which episode rows fall in the window.
    method_2_drain_cadence_simulation:
      k256: {per_lane: [0.1340, 0.1349, 0.1291], fleet: 0.133}
      method: direct simulation of the drain cadence against the same length distribution
    quote_the_range: "13.3-13.8% at k=256 against ~0.4% at k=8"
    ratio: "32-37x depending on the k=8 estimator"
    ratio_note: >-
      the length-biased formula and the simulation disagree slightly more at
      k=8, where a slot runs ~127 episodes per update, than at k=256, where it
      runs ~4.
    drifts_with_training: >-
      14.85% over 0-3M against 13.58 / 13.81 / 13.63% over the later quarters,
      because Lbar itself drifts. "DOSE-INDEPENDENT" IS TRUE ONLY AT FIXED
      LBAR and an earlier draft overstated it.
  prefix_carry:                         # [V2-1] which rows go stale, not just how many
    p_lag_ge_1_by_within_episode_position:
      k256: {turns_0_4: 0.2248, turns_5_9: 0.1836, turns_10_14: 0.1426,
             turns_15_19: 0.1045, turns_20_24: 0.0763, turns_25_plus: 0.0726}
      k8:   {turns_0_4: 0.0062, turns_25_plus: 0.0019}
    mechanism: >-
      a row early in an episode has more episode left, so a drain boundary is
      likelier to fall after it and hold it.
    consequence: >-
      k=256 TRAINS OPENING PLAY OFF-POLICY AND ENDGAME PLAY ON-POLICY, by 3.1x
      across the episode. A structured, non-uniform treatment, not a uniform
      noise floor — exactly the shape that could move opening-phase behaviour
      (lead choice, early switching) without moving a win rate much.
    read_through: [loss/clip_frac, loss/approx_kl]
    not_claimed_away: true
  how_a_stale_row_enters_ppo:           # [V2-2]
    path: >-
      through the RECORDED old_logp with NO filter and NO reweighting:
      rl/agents/ppo.py:1163-1165 tensorises batch["old_logp"] as collected, and
      :1332-1334 feeds it straight to clipped_surrogate_loss. The PPO clip is
      the ONLY correction in the path.
    the_clip_is_already_saturated_on_the_comparator:
      loss_approx_kl_per_update: [0.0396, 0.0381, 0.0359]
      loss_clip_frac_per_update: [0.2363, 0.2338, 0.2264]
      clip_eps: 0.2
      arithmetic: >-
        log(1.2) = 0.182, and a one-update policy displacement is rms |log r|
        ~ 0.28 — a carried row's importance ratio typically lands OUTSIDE the
        clip, where its gradient is zeroed rather than corrected.
    pre_registered_prediction: >-
      at k=256 loss/clip_frac RISES and loss/approx_kl RISES. Both become parity
      overlays WITH A STATED DIRECTION rather than open-ended series.
    the_informative_null: >-
      clip_frac UNCHANGED beside a delivered dose (p99 at 1) is a CONTRADICTION
      — the rows say they are stale and the loss says they are on-policy — and
      it costs a diagnosis round.
  k_is_four_changes:                    # [V2-4]
    retracted: >-
      an earlier draft said "what moves is the CARRY FRACTION and only that".
    i_learner_carry: "13.3-13.8% of rows one version stale against ~0.4%, structured by within-episode position"
    ii_opponent_snapshot_carry: >-
      the same factor. An episode spans 0.253 updates at k=256 against 0.0079 at
      k=8, so against push_every_updates 5 roughly 2.7 in-flight battles per push
      are seated on a pool member that has just been evicted, against 0.08 at
      k=8. QUANTIFIED, NEGLIGIBLE, NOT ABSENT — recorded so it is not discovered
      later as an unnamed confound.
    iii_batch_size: >-
      mean realized update 30,866 rows against the comparator's MEASURED 30,739
      (+0.41%), because more episodes complete in the poll that crosses the
      budget. ~1.6 fewer updates to the rung, minibatch 257 against 256.
    iv_inference_batch_shape: >-
      8 rows per forward against 256, a floating-point reduction-order change.
      Nothing here claims byte-identical rows and A-1a's row-parity language
      does not apply.
    nothing_else: >-
      distinct episodes per update is 30,720 / Lbar either way (1,013 measured
      at k=8, ~1,015 at k=256), the battle seeds and team pairs are the COMMON
      stream (see power.common_streams), and the recipe is byte-identical.

power:
  planning_sigma: 0.01499              # REUSED, not re-derived
  planning_sigma_source: scripts/engine_a1_sigma.py -> results/engine_a1/sigma.json
  planning_sigma_df: 4
  planning_sigma_ci95: [0.0090, 0.0431]
  planning_sigma_fleets:
    - {fleet: showdown_sp_batch50m, k: 3, sd: 0.01732}
    - {fleet: showdown_sp_batch50m_async, k: 3, sd: 0.01221}
  regime_definition: annealed with <50% of the LR schedule consumed at the 12M rung
  why_it_transfers: >-
    K-1's arms are the same recipe at the same rung holding the same ~76% of
    base LR. Nothing about raising k changes the reference class.
  eval_n_per_seed: 12000               # BOTH arms; the comparator is ALREADY at this n
  eval_n_costs_nothing_here: >-
    A-1's review 2 found ~71% of the regime-matched variance is EVAL-REPLICATE
    noise (replicate sd 0.01262 at n=3,000 = 1.47x binomial, docs/landmines.md;
    residual training-seed sd 0.00809) and bought precision with battles. K-1
    inherits it at zero cost.
  derivation_note: >-
    the first three rows scale that decomposition as 1/sqrt(n) on the replicate
    term only and reproduce A-1's own n=12,000 row exactly. The fourth row is
    NOT a model — it is the comparator's own measured spread.
  band_at_n12000:                      # [V1-M2, V2-7]
    - {basis: regime-matched, sigma_at_n3000: 0.01499, sigma_eff: 0.01026, se_diff: 0.00838,
       band_in_se: 2.98, p_fail_given_null: 0.003, mde_80: 0.0320, p_pass_given_D_0p05: 0.001}
    - {basis: all-12M-fleets, sigma_at_n3000: 0.03411, sigma_eff: 0.03231, se_diff: 0.02638,
       band_in_se: 0.95, p_fail_given_null: 0.343, mde_80: 0.0472, p_pass_given_D_0p05: 0.169}
    - {basis: CI-upper-end,   sigma_at_n3000: 0.04309, sigma_eff: 0.04168, se_diff: 0.03403,
       band_in_se: 0.73, p_fail_given_null: 0.463, mde_80: 0.0536, p_pass_given_D_0p05: 0.218}
    - {basis: MEASURED-E8-seed-sd, sigma_eff: 0.01938, se_diff: 0.01582,
       band_in_se: 1.58, p_fail_given_null: 0.114, mde_80: 0.0383, p_pass_given_D_0p05: 0.057,
       p_fail_given_D_0p02: 0.378}
  mde_recomputation_note: >-
    an independent recomputation this session lands the three MODEL MDEs at
    0.0320 / 0.0469 / 0.0523 against the reviewed 0.0320 / 0.0472 / 0.0536 —
    intermediate rounding in sigma_eff, and it moves no decision. The reviewed
    values are the ones tabulated.
  measured_seed_sd:                    # [V2-7] the honest column
    value: 0.01938
    vs_model: 1.89x the 0.01026 the decomposition predicts
    chi2_2_p: 0.028
    reading: >-
      not comfortably attributable to a 3-seed sd being noisy. Either the
      regime-matched planning constant understates this recipe's seed spread, or
      these three lanes were unlucky. K-1 CANNOT TELL WHICH AT k=3, so both
      columns are carried on every quote. Which is the planning basis is RWK-3's.
  resolution_floor_vs_band:
    band: 0.025
    mde_80_range: [0.0320, 0.0383]
    statement: >-
      the band is 0.025 and the MDE at 80% power runs 0.0320 (planning) to
      0.0383 (measured). A screen whose smallest reliably-detectable effect is
      LARGER than the difference it calls acceptable can only catch GROSS
      breakage — which is what it is named for, and why a PASS may not be read
      as a null. This is half the reason the file is PARKED.
  a_pass_is_not_a_null_verbatim: >-
    A PASS is not a null. If D_K lands at -0.020 the screen passes, and what
    JOURNEY step 10 inherits is a k=256 setting whose true 12M cost is somewhere
    in [-0.051, +0.011] at the comparator's own measured seed sd (0.01938 at
    n=12,000), or [-0.036, -0.004] at the planning constant — i.e. at the
    planning constant a PASS at -0.020 is 2.4 se from zero and excludes it.
    N-K256's disclosure therefore carries the INTERVAL, never the point
    estimate, and no gen-1 number produced at k=256 may be quoted as "k=256
    costs nothing".
  band_must_not_be_widened: >-
    at |D| < 0.05 a real 0.05 staleness defect passes half the time, which is
    the wrong trade for a screen whose entire job is catching silent breakage.
  what_it_cannot_resolve:
    - "12M is not 100M, and the decision K-1 feeds is a 100M+ train. The per-update carry fraction is roughly dose-stable, but its CUMULATIVE effect over 8x the horizon is not measured and cannot be. THIS IS THE REAL BLIND SPOT"
    - "K-1 is a win-rate read; staleness that changes the trajectory without changing the 12M endpoint is what the descriptive reads are for, and they are descriptive"
    - "a small real regression: at the measured seed sd the screen FAILS a true 0.02 defect only 38% of the time"
  lr_direction_is_not_a_blind_spot:    # [V2-10]
    retracted: >-
      an earlier draft called "~76% of base LR still live at the rung" a blind
      spot.
    correct_direction: >-
      the parameter displacement a stale gradient causes scales WITH the LR, so
      the 12M rung is the WORST per-update point on the whole schedule and K-1
      reads the treatment where it bites hardest. What 12M cannot bound is the
      accumulation over 8x the horizon.
  common_streams:                      # [V2-12]
    battle_and_team_stream: COMMON ACROSS ARMS
    source: >-
      engine/pkmn_gen1/src/env.rs:968-980 — battle_seed =
      splitmix64(lane_seed * PHI ^ battle_counter); team pair =
      splitmix64(battle_seed ^ 1) % bank.pairs(). A function of
      (lane_seed, battle_counter) and NOTHING ELSE, so at a given battle index
      both arms play the SAME battle seed off the SAME team pair from the SAME
      bank, and both arms run ~1,015 battles per update.
    retracted: >-
      an earlier draft said "the engine draws a fresh battle seed per battle",
      which reads as if the battle stream diverged between arms. It does not.
    what_does_diverge:
      - "the torch stream, from the first poll: an 8-row forward and a 256-row forward consume different call counts and shapes"
      - "the self-play pool's member-draw offset, since draws happen per battle START and the start cadence differs"
    eval_side_crn: >-
      both arms evaluate at seed_start 100, so the EVAL side also has common
      random numbers across arms. That makes the unpaired se_diff CONSERVATIVE
      rather than wrong.
    pairing_credit_taken: false
    why_recorded: >-
      so that nobody later reads the seed reuse as a paired estimator and
      quietly narrows the interval. The aggregator is the equal-weight mean of
      the three PER-SEED SIGNED DELTAS, which is ARITHMETICALLY IDENTICAL to the
      difference of the two arms' equal-weight means, and the UNPAIRED se_diff
      is the one quoted. A-1's refutation of pairing on these seeds stands and
      is not re-litigated (+0.856 on the endpoint, -0.996 on the AUC).

primary:
  P-K:
    statistic: pooled vs-SH win rate at the 12M crossing rung, locked protocol at n=12,000
    aggregator: equal_weight_mean_of_per_seed_signed_deltas
    read: "signed D_K = mean_s( win_256(s) - win_8(s) ), s in {66, 75, 83}"
    band: 0.025
    sides: two_sided
    pass_rule_depends_on_se: false     # fixed magnitude, JOURNEY 7.5's, which K-1 borrows
    comparator_reevaluated: false      # already at n=12,000 on this instrument
    always_reported_with_it: >-
      the 95% interval at BOTH the planning constant and the comparator's
      measured seed sd. The point estimate is never quoted alone.
    required_cross_checks: >-
      wins_from_returns == eval/win_rate and mask_desyncs == 0 on every arm-E256
      eval JSON; eval/no_outcome ABSENT.
    protocol_deviations_disclosed:
      - "an INTERMEDIATE RUNG, not the locked protocol's final checkpoint (the only rung the comparator has)"
      - "3 seeds pooled, not the 5 every arm from D23 on has used (5 do not exist on the comparator side)"
      - "n RAISED to 12,000/seed on both arms — conservative, and the same direction as the 5x3000 deviation"

secondary_descriptive_only:
  D_AUC:                                # [V2-9] THREE numbers, not one
    status: SECONDARY under RW-8, which K-1 inherits rather than reopens
    can_fail_k1: false
    legs:
      - {name: D_AUC(48), rungs: 1-48, comparator_mean: 0.63764, comparator_seed_sd: 0.01029}
      - {name: D_AUC(first-24), rungs: 1-24, comparator_mean: 0.61472, comparator_seed_sd: 0.01000}
      - {name: D_AUC(last-24), rungs: 25-48, comparator_mean: 0.66056, comparator_seed_sd: 0.01069}
    sign_convention: "each leg is a signed delta E256 - E8; NEGATIVE MEANS E256 WORSE"
    bucket_rule: floor(_step / 250000) in 1..48, one row per bucket
    source: history.csv, or history_merged.csv if the lane resumed
    denominator_check: >-
      a lane whose merged history yields a count != 48 is REPORTED and
      re-extracted, never graded on a different denominator.
    why_three: >-
      the split is the only instrument here that can see COMPOUNDING. A
      first-half delta inside +-0.010 beside a second-half delta outside it is
      the signature of a defect that accumulates — precisely the shape the 12M
      endpoint cannot rule out for a 100M run.
    rw8_does_not_transfer: >-
      RW-8's "the AUC is 3.5% WIDER than the endpoint" was measured on the NODE
      arm. ON THIS ARM THE AUC IS TIGHTER: comparator seed sds 0.01029 / 0.01000
      / 0.01069 against the ENDPOINT's 0.01938 — 1.88x. It stays SECONDARY
      anyway, because RW-8's other ground (a gated read would make wandb history
      a verdict input) is unchanged.
    consequence_has_a_threshold: >-
      |D_AUC| >= 0.025 on ANY of the three legs costs A DIAGNOSIS ROUND before
      the switch. Never a verdict input. An earlier draft required a round for a
      "breach" without defining breach; that consequence-without-a-threshold is
      removed.
  other_reads:
    - per-seed signed deltas, with signs (interpretable for diagnosis, NOT a paired estimator)
    - "DIRECTIONAL OVERLAYS per the pre-registered prediction: loss/clip_frac and loss/approx_kl, both PREDICTED TO RISE, reported against the comparator's measured 0.2363/0.2338/0.2264 and 0.0396/0.0381/0.0359 at matched steps. clip_frac unchanged beside a delivered dose costs a diagnosis round"
    - "the staleness trajectory: collect/policy_version_lag_p99 and _max per update, the (f0, f1, f2) triple, and the realized carry against the predicted 13.3-13.8%"
    - "NOTE: the realized carry is NOT directly logged today — rl/train.py:1057-1060 emits only p99 and max. Reported as those proxies plus the prediction. Whether to add collect/policy_version_lag_frac_nonzero before launch is RWK-5"
    - "parity: Lbar via _step/collect/episodes_finished (NOT the episode_length series); aux/labelled_frac, aux/switch_frac, aux/aliased_frac; loss/entropy, loss/explained_variance overlays at matched steps. No bands; DIAGNOSTIC"
    - "throughput realized: per-lane steps/s and hours to the rung against the projection. NEVER a verdict input — a faster arm that trains a different agent is worth nothing"
anchor_battery_fires: false
anchor_battery_why_not: >-
  K-1 credits nothing, lands no README row and is not a headline-grade result,
  so CLAUDE.md's anchor battery does not apply. If K-1 passes and a later gen-1
  headline is produced at k=256, THAT result carries the full battery.

branches:
  K1-PASS:
    rule: "|D_K| < 0.025"
    conditional_on_a1: true             # [V1-B5]
    action: >-
      A K-1 PASS LICENSES k=256 ONLY IF A-1 SEPARATELY ACCEPTS THE ENGINE
      COLLECTOR. The two gates are CONJUNCTIVE and K-1 cannot stand alone: it
      compares an engine arm against an engine arm, so if A-1 fails, BOTH
      settings are rejected together and the gen-1 path stays on Node — a k=256
      PASS says nothing about a collector that was not accepted. On the
      conjunction, k=256 becomes the gen-1 training default at fleet width <= 6
      (the widths max-out measured) and JOURNEY step 10 may run at k=256. THE
      SIGNED DELTA AND ITS INTERVAL ARE RECORDED AND TRAVEL FOREVER (N-K256) ON
      EITHER BRANCH OF THE CONJUNCTION. Adoption remains a maintainer decision,
      not an automatic consequence.
  K1-FAIL-NEG:
    rule: "D_K <= -0.025 (E256 worse)"
    action: >-
      the monster train runs at K = 8, and k=256 stays a THROUGHPUT-ONLY setting:
      A/B harnesses, smokes, max-out sweeps, anything where no learning is kept.
      PRE-DECIDED; a near-miss does not reopen it.
  K1-FAIL-POS:
    rule: "D_K >= +0.025 (E256 better)"
    action: >-
      SAME ACTION as K1-FAIL-NEG — the monster train runs at K = 8. Accepting
      "better" would be a one-sided read, and a 2.5-point gain from staleness
      alone is far likelier to be a defect in the read than a free lunch. It is
      REPORTED as the interesting result it would be and earns a diagnosis
      round, not an adoption.
  boundary: "|D_K| exactly 0.025 reads as OUTSIDE (fails)"
  K1-VOID-K: >-
    fewer than 3 E256 lanes reach the 12M rung -> DESCRIPTIVE ONLY; K-1 does not
    decide. k<=2 cannot carry a 3-seed aggregator and refilling one lane makes a
    mixed-provenance fleet. Report and relaunch.
  K1-VOID-DOSE: >-
    the dose-delivery partition says the treatment did not land: f1 + f2 < 0.90,
    or collect/battles_in_flight != 256. Reported as the full (f0, f1, f2)
    triple. VOID, never a PASS.
  K1-R0: >-
    an R0 breach kills the fleet. A relaunch after an R0 fix does NOT consume a
    diagnosis round: rounds are for a COMPLETED read outside the band, never for
    a fleet that produced no read.
  K1-RUNG: >-
    a lane whose crossing rung is more than one update (30,720 steps) off
    12,000,000 is still GRADED at its realized step, with that step disclosed
    beside the number. Beyond 250,000 steps it is K1-VOID-K instead — a
    different dose, not an overshoot.
  diagnosis_rounds: 1
  diagnosis_rounds_note: >-
    JOURNEY 7.5's two rounds are A-1's, not K-1's, and K-1 does not spend them.
    K-1 gets ONE because its failure branch is CHEAP: k=8 is a working, screened
    setting and the whole cost of failing is five fleet hours on a 100M x 6-lane
    monster. Whether that is right is RWK-8's.
  diagnosis_order_if_negative:
    - "staleness itself at an intermediate K (k=32 or k=64, ONE lane) — separates 'staleness hurts' from '13.5% is too much'. Descriptive; adopting an intermediate K as production needs its own pre-reg [RWK-8]"
    - "the update seam and the prefix channel: loss/clip_frac and loss/approx_kl against the predicted rise, and the per-position carry against the prefix table. Cheap, no training"
    - "GAE on held episodes — carried rows are not truncated (episodes_discarded is a literal 0) but are advantaged and valued under a policy one version old. Read loss/explained_variance against the comparator"
  diagnosis_order_if_positive:
    - "the read itself — re-draw one lane's eval at a fresh seed_start. ONE rung at n=3,000 is worth +-0.02 in this repo's record; at 12,000 it is smaller but not zero, and the comparator's measured seed sd is 1.89x the model"
    - "information leak — re-audit the encoder against invariant I1 for anything k-dependent"
    - "staleness as a genuine regulariser: a REAL mechanism and a finding, but it does not change the action"

r0_gates:
  window_steps: 250000                 # NOT 200k
  window_why: >-
    eval_every is 250,000, so eval/win_rate CANNOT BE OBSERVED AT ALL inside
    200k and a 200k window would have shipped a gate that can never fire.
  inherited_from: configs/engine_a1.yaml
  loss_entropy_band: [1.3, 2.0]
  clip_frac_nonzero: true
  clip_frac_note: >-
    a LIVENESS gate, not a level gate; the LEVEL is a directional overlay under
    secondary, per the pre-registered prediction.
  aux_illegal_label_frac: 0
  aux_frame_collision_frac: 0
  aux_labelled_frac_band: [0.74, 0.88]   # the metric is `labelled_frac`; a gate on the similarly named `label_present_frac` would kill a perfect lane [A-1 R2-M2]
  eval_win_rate_open_interval: true      # read at the 250k rung
  eval_no_outcome_key: MUST_BE_ABSENT
  team_bank_min_pairs: 1000000
  team_bank_sha256_must_equal_comparator: true
  staleness_gate:                        # [V1-B3, V2-11]
    metric_semantics: >-
      collect/policy_version_lag_p99 is a PER-ROW lag percentile computed at the
      drain (rl/train.py:1040, logged :1057-1060).
    why_rebased: >-
      A-1's gate was "p99 <= 1; breach = 3 consecutive rollouts", and ON THE
      COMPARATOR IT MEASURED 0.0 ON EVERY UPDATE — 432 / 434 / 410 update rows,
      min 0, max 0 — while lag_max read 1.0 on 99.77% of them. That is the 0.4%
      carry: fewer than 1% of rows stale, so the 99th percentile is 0. At k=256,
      13.3-13.8% of rows are stale and p99 rises to 1 BY CONSTRUCTION. A-1's
      gate would not fire; A-1's EXPECTATION would have a reader call a
      delivered treatment a breach. Re-basing is not a loosening.
    partition:
      definition: "f0 / f1 / f2 = fraction of post-250k update rows with p99 == 0 / == 1 / >= 2. These three exhaust the space."
      dose_landed: "f1 + f2 >= 0.90"
      otherwise: "K1-VOID-DOSE, reported as the full triple (f0, f1, f2), never as a PASS"
      why_f1_plus_f2: >-
        a single ~1,000-turn battle legitimately puts one update's p99 at 2,
        which the design predicts on ~0.8% of updates; an `f1 >= 0.90` rule
        would have counted those against the dose.
      f2_reported_separately: >-
        on every branch, because the triple distinguishes the two failure modes:
        f0 large means K DID NOT TAKE (the lane is running k=8 under a k=256
        filename), f2 large means SOMETHING ELSE IS STALE (rows surviving two
        boundaries at a rate the design does not predict).
      first_update_note: >-
        p99 == 0 is EXPECTED on update 1 — nothing is in flight before the first
        drain — which is why the fractions are measured AFTER 250,000 steps and
        not from the first row.
    breach: "p99 >= 2 on THREE CONSECUTIVE rollouts"
    breach_consecutive_clause_is_load_bearing: >-
      isolated p99 == 2 updates ARE predicted at ~0.8%, so a single-update rule
      would false-kill a correct lane.
    lag_max: "REPORTED, NEVER GATED. It reaches 8 on such an update and sits near 2 typically; the rise is expected."
  dose_delivery_second_leg:
    battles_in_flight: 256               # comparator reads a constant 8
    readable_at_update_1: true
    rationale_corrected: >-
      an earlier draft had this backwards. rl/train.py:921 DEFAULTS k to 256, so
      a config that silently fell back to the default would give 256, not 8. The
      gate is worth having because THE CONSTANT IS THE TREATMENT — this is the
      one place a k OTHER than 256 (a typo, a stale --config, a resumed run dir
      from the wrong arm) becomes visible, and it becomes visible immediately.
  episodes_discarded:                    # [V1-M4]
    status: REPORTED, NEVER GATED
    why: >-
      it is a HARD-CODED LITERAL 0u64 on this path
      (engine/pkmn_gen1/src/pyencode.rs:547), so it cannot fail and a gate on it
      would be theatre. Its only use is as a BUILD-IDENTITY TELL: a non-zero
      value means the running extension is not the build this pre-reg pins,
      which the engine block should have caught first.

contamination_guards:
  both_seat_harvest: OFF
  d18_privileged_block: OFF_BY_ABSENCE   # agent.privileged_dim unset; rl/train.py:821-834 (A-1 cites 803-816; the block moved)
  engine_scripted_opponents: UNUSED      # verdict denominator is the server's SH
  d25_opp_action: ON                     # the comparator has it; removing it would be the treatment
  oppact_head_on: >-
    also STATUS.md action 0: rl/search/agent.py:68 hard-asserts
    `agent.aux_head is not None`, so a checkpoint trained without it can never
    be searched. K-1's lanes are 12M throwaways and this does not bind them, but
    the SETTING K-1 licenses is the one the monster train inherits.
  declared_config_differences: [collector.k, run_name, env_kwargs.seat_tag]
  byte_identity_verified: >-
    the parsed diff against configs/engine_a1.yaml is EXACTLY
    {collector.k, run_name, env_kwargs.seat_tag} — checked at drafting, zero
    undeclared differences. FIVE further lines differ in COMMENT TEXT ONLY and
    no value (total_steps, collector.mode, collector.team_bank,
    collector.min_bank_pairs, agent.lr_anneal_steps).

estimator:
  pass_rule: fixed_magnitude_band        # does not depend on an se
  se_quoted_for_power: unpaired_two_fleet_larger_of_binomial_or_seed_clustered
  deviation_disclosed: >-
    the same one A-1 discloses under RW-3: JOURNEY 7.5 reads the band against a
    pooled number as if it were KNOWN, ignoring the comparator's own 3-seed
    spread. The PASS RULE is unchanged; only the honesty of the power statement
    is.

ops:
  env: /opt/anaconda3/envs/pkmn-engine-port/bin/python
  env_note: >-
    the ONLY env carrying pkmn_gen1, and the env CLAUDE.md rule 1's fleet
    exception names. Nothing is installed into it for this run.
  required_env_vars: [POKEMON_RL_ENCODER_V2=1, POKEMON_RL_ENCODER_IDS=1]
  required_env_vars_why: >-
    read at import (rl/envs/showdown.py:118, :131); they are what makes OBS_DIM
    828 — the comparator's own stamp. Without them the lane builds a different
    width and no checkpoint compares.
  seat_tag: k256                         # distinct from A-1's `a1`, the A/B's `ab*`, the search fleet's `s3*`
  seeds: [66, 75, 83]                    # DISTINCT --seed per lane (CLAUDE.md rule 2)
  stagger_sec: 90
  hold_after_rung_sec: 120               # P5(a) — or the 48th in-loop bucket is lost
  detached: true
  resume_safe: true                      # --resume runs/<dir>
  server_required: true                  # the in-loop evals go through poke-env
  cost:
    comparator_measured:
      per_lane_hours: [2.2004, 2.1700, 2.3076]
