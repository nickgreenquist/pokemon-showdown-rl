# =====================================================================
# RULINGS WANTED — THE LAST WORD IN THIS FILE, DELIBERATELY.
# NOTHING HERE IS RATIFIED. K-1 does not launch until these are answered.
# The file is PARKED, so these are owed only if it is un-parked.
# =====================================================================
rulings_wanted:
  RWK-1:
    topic: may the comparator be A-1's ENGINE arm, and does a PASS depend on A-1?
    question: >-
      K-1 reads E256 against A-1's k=8 engine arm, which makes k the only
      declared delta. Option (a) yes, and the K1-PASS branch is CONJUNCTIVE on
      A-1's acceptance as now written — "does k=256 reproduce k=8 ON THE ENGINE
      PATH" is well posed whatever A-1 concludes, and if A-1 fails both settings
      are rejected together. Option (b) no — wait for A-1's verdict before
      running K-1 at all. NOTE the coupling: if RW-1 branch (b) is taken ("run
      A-1 at 256"), K-1 is SUPERSEDED rather than re-scoped and this file should
      be withdrawn, not amended.
    my_recommendation: (a), with the conjunction written into the branch
  RWK-2:
    topic: n per seed, and whether the comparator may be reused as-read
    question: >-
      Both arms read at n=12,000/seed. The comparator is ALREADY at that n on
      that instrument (results/engine_a1/rung12m_s*.json), so this side is free
      and no re-evaluation is proposed. Confirm the reuse, or require a fresh
      comparator eval at a new seed_start so both sides are drawn this week?
    my_recommendation: >-
      reuse as read. A re-draw would ADD eval-replicate variance to the
      comparator rather than remove it, and the checkpoints are sha-pinned.
  RWK-3:
    topic: the read, its band, and WHICH SIGMA IS THE PLANNING BASIS
    question: >-
      Confirm K-1 is a GROSS-BREAKAGE SCREEN at |D| < 0.025, two-sided, NOT an
      equivalence test and NOT a widened band. And rule on the planning basis:
      the regime-matched 0.01499 (band 2.98 se, false alarm 0.3%, MDE 0.0320) or
      the comparator's OWN MEASURED seed sd 0.01938 (band 1.58 se, false alarm
      11.4%, MDE 0.0383), which is 1.89x the model at chi2_2 p = 0.028. The
      all-fleet 0.03411 and the CI upper end 0.04309 are tabulated as the
      conservative alternatives.
    my_recommendation: >-
      confirm the screen and the band; carry BOTH sigma columns on every quote
      rather than choosing, because at k=3 the data cannot distinguish "the
      planning constant understates this recipe" from "these three lanes were
      unlucky". If one must be chosen for the power statement, the MEASURED
      0.01938 is the honest one.
  RWK-4:
    topic: seed reuse and the test amendment
    question: >-
      K-1 reuses seeds 66/75/83 for net-init comparability (NO variance credit
      claimed). tests/test_ch5_r2_prereg.py:346-350 admits three owners and turns
      RED when lane 1 writes its run dir. Approve engine_k256_s{s} as a FOURTH
      legal owner in the ratification commit, or run K-1 on fresh seeds outside
      every reserved window?
    my_recommendation: >-
      approve the amendment. Fresh seeds would cost the lane-for-lane net-init
      match that makes the per-seed diagnosis read interpretable, and buy
      nothing, since no pairing credit is taken either way.
  RWK-5:
    topic: a new metric for the realized carry
    question: >-
      The treatment's DOSE is the fraction of rows arriving one version stale.
      Today only p99 and max are logged (rl/train.py:1057-1060), and p99
      saturates at 1 — enough to say the treatment landed, not enough to say it
      landed at 13.3-13.8%. A one-line addition beside them
      (`collect/policy_version_lag_frac_nonzero = float((lag > 0).mean())`)
      would measure it directly. It is a NEW metric name and CLAUDE.md locks the
      metric list, so it is a ruling, not housekeeping. Add it before launch, or
      run on the two proxies plus the prediction?
    my_recommendation: >-
      ADD IT. It is logged from the update path beside the existing collect/*
      keys, costs nothing, and it converts "the treatment landed" from an
      inference into a measurement — which is the whole point of a dose-delivery
      gate. It would also let the two carry derivations (13.3% vs 13.8%) be
      settled by observation instead of arbitration. If declined, K1-VOID-DOSE
      stands on the (f0, f1, f2) triple and battles_in_flight alone.
  RWK-6:
    topic: run ordering against a live time-budgeted eval
    question: >-
      When K-1 is un-parked, does it wait for every time-budgeted eval to drain?
      A fixed-time search under contention makes weaker decisions, so a
      three-lane training fleet would INFLATE someone else's in-flight anchor.
    my_recommendation: >-
      WAIT. K-1's numbers are unaffected — the damage is entirely to the OTHER
      measurement, which is a live pre-registered anchor, and there is no way to
      disclose it back into validity afterwards.
  RWK-7:
    topic: the build between the arms
    question: >-
      The comparator ran at 95e5ec9 / 6e3486a (one tree); `git diff 95e5ec9..HEAD
      -- rl/ engine/` is one logging commit, which K-1 REQUIRES (the old logger
      would discard most rollout/* rows at k=256). The two staged "free wins" are
      the scorer ctx factorization ("verified to 3e-07", NOT bit-identical,
      already reverted once on a bit-exact pin) and an mmap'd bank (memory only).
      Confirm the scorer change does NOT land before K-1's lanes.
    my_recommendation: >-
      pin the tree. The mmap'd bank is safe and may land; the scorer
      factorization must not, or K-1 stops measuring k.
  RWK-8:
    topic: how many diagnosis rounds, and what a k-ladder may decide
    question: >-
      K-1 as written gets ONE diagnosis round (JOURNEY 7.5's two are A-1's), and
      names a k=32/64 lane as the first diagnosis if D_K is negative. Two
      decisions: is one round right given the failure branch is cheap (five fleet
      hours on a 100M x 6-lane monster)? And may a diagnosis lane at an
      intermediate K be ADOPTED as the production setting, or does any
      intermediate K need its own pre-reg?
    my_recommendation: >-
      one round, and an intermediate K needs its own pre-reg. A single
      descriptive lane cannot carry a learning decision — the same substitution
      both A-1 reviews rejected for A-1a.
  RWK-9:
    topic: job ownership under CLAUDE.md rule 4
    question: >-
      Projected fleet wall is ~1.84-1.89 h on an idle box against the twin arm's
      MEASURED 2.359 h. That straddles rule 4's 2 h line for TRAINING. Agent-run,
      or handed over?
    my_recommendation: >-
      treat as "2-5 h ask first" and hand the commands over, the way A-1's
      sidecar answered rule 4 explicitly. The estimate is within 6% of the line
      and the box will not be idle.
  RWK-10:
    topic: what a PASS actually licenses
    question: >-
      On the conjunction with A-1, does a K-1 PASS license k=256 for the MONSTER
      TRAIN only, or as the gen-1 training default for every subsequent run? And
      at what fleet width — max-out measured 1, 3 and 6, and width does NOT
      change learning ("a lane is a SEED"), but K-1 measures at width 3 only.
    my_recommendation: >-
      the gen-1 training default at fleet width <= 6, with N-K256's signed delta
      AND INTERVAL travelling forever. Width is not a learning axis (each lane is
      an independent seed) so it does not need re-screening, but the width K-1
      measured at should be stated beside any quote, as every throughput figure
      in this chapter already is.
  RWK-11:
    topic: is the screen worth running at all, given the re-priced stake?
    added: 2026-09-10, after both reviews
    question: >-
      The two reviews together produce a question neither was asked: k-alone is
      1.299x at matched width, the stake on a 100M x 6-lane monster is five fleet
      hours, and the screen's resolution floor (MDE 0.032-0.038) is WIDER than
      its accept band (0.025) — so a PASS cannot establish that k=256 is cheap,
      only that it is not grossly broken. Run K-1 anyway, run JOURNEY 10 at k=8
      and drop it, or park it against a future horizon where the stake is larger
      (a 250M or 500M fleet, where five hours becomes fifteen or thirty)?
    my_recommendation: >-
      PARK, which is the state this file is now in. Run JOURNEY 10 at k=8: five
      hours is not worth an un-interpretable PASS on the run that produces the
      headline number, and the failure mode is asymmetric — a k=8 monster costs
      five hours, a k=256 monster with an undetected -0.02 staleness cost is
      unrecoverable and would contaminate every gen-1 sentence downstream of it.
      Un-park when the horizon is long enough that the stake exceeds the risk.
