# IN-RUN GATES:
#   D-A anneal liveness at the rungs nearest >= 5M / 25M / 50M, every
#       lane, both param groups. EXACT FORM (sync, closed): with u the
#       number of completed updates at that rung, x = (u × 19,968) /
#       5e7, lr == 5.8884e-5 × (8x + 1)^-1.5 to 1e-12 relative (the
#       schedule is applied at the START of update u+1 from steps_seen =
#       u × 19,968; the checkpoint's optimizer param_groups carry the
#       last applied value). Breach -> STOP that lane.
#   D-B throughput: REALIZED dStep/dWall (seat-1 steps) over >= 30-min
#       conforming windows post-1M. Expected ≈ 290 steps/s ± 15% ->
#       [245, 335] PROVISIONAL (the solo smoke's whole-run rate at 3
#       updates with the suite running beside it; 3-wide is UNKNOWN and
#       the gen-1 sync precedent lost ~30% at fleet width -> the band is
#       re-based from the fleet's first conforming windows, disclosed). RECORD
#       < 0.85× expected; STOP-AND-INVESTIGATE < 0.5× sustained 2
#       windows. Progress is a RATE, never an ETA.
#   D-C in-loop eval/win_rate (n = 100, se 0.05, 200 readings/lane): logged,
#       visible, NOT ACTIONABLE; no mid-run curve appears in the readout
#       except through S-SHAPE at n = 1000.
#   D-D selfplay/winrate_latest: at pool_size 1 the sole member IS the
#       previous update's policy, so the series reads ~0.5 by construction
#       — RECORD-only, named so nobody reads a plateau into it.
#   D-E memory: per-lane peak RSS RECORD-ONLY; no per-lane threshold at
#       any width (lanes finish hours apart and the last runs solo). The
#       only STOP is box-level: free+inactive < 2 GiB AND non-zero
#       swapouts, 3 consecutive 5-min polls -> STOP ALL, disclose, resume.
#   D-F disk: RECORD < 30 GiB; STOP ALL < 15 GiB.
#   H1  harvest health every rung: rows ratio in [0.7, 1.3], version_lag_max
#       <= 2, dropped < 1%, discarded == 0 — RECORD a breach; STOP that
#       lane at 3 consecutive rungs outside.
#   K6  loss/entropy: 3-lane median < 0.15 for 2 consecutive readings
#       BEFORE 25M -> STOP that lane (carried from R2/100M; gen 4 has no
#       floor of its own — PROVISIONAL, re-based at 5M from the fleet's
#       own minima, disclosed).
#   T2  3-lane median clip_frac >= 0.90 ×3 consecutive -> STOP AND REPORT,
#       never adjust (clip 0.0829 is 2.4× tighter than 0.2; expect a
#       higher clip_frac than gen 1's 0.03–0.28 — RECORD its first-250k
#       band and re-base T2 only if the fleet sits above 0.5 healthily).
#   T3  3-lane median approx_kl >= 0.5 ×3, or ANY non-finite loss/* ->
#       STOP.
#   COMPLETION: step == 50,000,000 exactly (sync); ckpt_050000000.pt IS
#       the completion rung and the PRIMARY's checkpoint.
#
# PEEKING / STOPPING POLICY (ruled): NO outcome-based early stop,
# extension, restart, lr change, config change or lane replacement (ops
# kills and the ORDERED spare protocol excepted). BARRED OUTRIGHT: any
# checkpoint evaluation — any n, any opponent, any lane — between launch
# and the last lane's end (steals CPU from the throughput read; an FP
# eval inflates a time-budgeted opponent's thinking budget; peeks the
# verdict axis). The ONE exception, pre-committed: the CLONE's tape
# collection and fit may run alongside the fleet (it is not an
# evaluation of any lane), with its s/battle logged so the fleet's D-B
# windows that overlap it are marked NON-CONFORMING. BARRED: extending
# past 50M mid-run even on a climbing log — that is a NEW pre-reg.
# Restated for the peeker: one vs-SH rung at n = 3000 is worth ±0.02.
#
# LANE-FAILURE RULE: lanes are independent; the fleet does NOT wait. A
# dead lane resumes with `--resume runs/<dir>` (read the REAL from_step
# from meta.yaml — checkpoint.pt lags the last logged step by far more
# than one update; expect updates_done one short per resume). A resume
# SPLITS the wandb history (extract_history.py HARD-FAILS: merge
# pre-resume rows _step < from_step + the whole post-resume run, verify
# monotonicity, into history_merged.csv before quoting ANY history
# statistic). A resume also LOSES the open seat-2 battles' harvested rows
# (nothing of the harvest is checkpointed; ≤ one rollout's worth) —
# disclosed per resume. A lane that cannot be resumed is reported as-is;
# at k <= 2 the primary is DESCRIPTIVE ONLY (cell K).
#
# OPS (maintainer launches; agent babysits, reads out):
#   scripts/gen4_wang50m_wave.sh — the ch5_100m_wave.sh pattern: preflight
#   (R0-h..l), three SYNC lanes staggered 60 s, `nohup caffeinate -dims …
#   < /dev/null &` (stdin REQUIRED: zsh job control suspends the launch
#   otherwise), per-lane logs logs/gen4_wang50m_lane_s<seed>.log, watch
#   loop with the CPU-DELTA stall check (`ps -o time=` twice, 15 s apart —
#   pgrep never catches alive-at-zero-CPU) and bounded auto-resume (3
#   zero-deltas -> resume, 3 retries/lane), RSS + box sampling. NO
#   encoder env vars exported. Every seat sends /timer on (the orphaned-
#   room deadlock; the env default). WALL CLOCK PLAN: 5e7 / 290 steps/s
#   = 47.9 h/lane solo; at a gen-1-like 3-wide loss (~30%) ≈ 60–70 h,
#   lanes concurrent -> 2–3 days; the post-fleet schedule adds ≈ 8 h
#   (below). A PLAN, never progress — progress is D-B's rate.
#
# POST-FLEET SCHEDULE, ORDER FROZEN (agent-side, detached, resume-safe,
# rate-readable; NOTHING evaluates while any lane trains):
#   1 vs-SH finals 3 × 3000 (PRIMARY; the smoke's eval ran 10 battles in
#     0.47 s -> ≈ 0.05 s/battle -> ≈ 3 min/lane; re-read at n = 20 first)
#     -> 2 L2 FP@20 3 × 250 (15
#     min) -> 3 L1 MDT 3 × 500 -> 4 S-SHAPE 10 rungs × 3 × 1000 -> 5 L3
#     FP@500 3 × 250 (5.5 h) -> 6 L4 clone h2h 3 × 500 (iff the clone
#     validated; else PENDING) -> 7 the Q38 pin -> 8 readout: RESULTS
#     addendum + README row (WAITS for every leg) + STATUS + SESSION_LOGS
#     in ONE commit; the milestone and step-5 branches read off THIS
#     header, never decided after.
#
# BUILD ITEMS (HANDOFF §2.2; each LANDED before this draft, with its
# commit, or named PENDING with its fallback):
#   BI-G4-1 both-seat harvest        LANDED 66746dc (7 offline + 2 live tests)
#   BI-G4-2 entity trunk layout arg  LANDED ec39268 (gen-1 bit-identity pinned)
#   BI-G4-3 pinned gen-4 hash gate   LANDED 3a5df5b
#   BI-G4-4 clone-leg threading      LANDED (make_bc_dataset / tape_to_dataset
#           --gen 4 / train_bc / eval_checkpoint gen-4 loader + Gen4PoolPlayer
#           cross-play; the chain ran end to end 2026-09-05)
#   BI-G4-5 the gen-4 BC clone       PENDING: tapes (2.4 h) + fit + validate,
#           alongside the fleet. Fallback: L4 reads PENDING, the README row
#           WAITS (never dropped — ruling 4).
#   BI-G4-6 value_clip_eps (SB3 form)  LANDED 526f839
#   BI-G4-7 lr_schedule power          LANDED 526f839
#   BI-G4-8 scripts/gen4_wang50m_wave.sh + tests/test_gen4_prereg.py —
#           land WITH this header's commit (R0-a needs the test; the
#           launch needs the script). Fallback: none — mechanical.
#
# RULINGS WANTED AT RATIFICATION (recommendations first; the maintainer
# decides, agents advise):
#   RW-1 the step-5 threshold: carry 0.756 AS RULED (recommended — it is
#        what three docs say and the read is insensitive at 0.001), or
#        re-pin to the arithmetic 0.757.
#   RW-2 the trunk widths: OURS at the ratified gen-1 widths (recommended
#        — one architecture across the gen-1 return and the gen-4
#        chapter; Wang's 256/896 do not map onto an entity trunk), or a
#        width sweep as a later lever.
#   RW-3 update-size matching: TOTAL rows ≈ 39,936 (recommended — that is
#        the batch his optimiser saw), or seat-1 rows = 39,936 (doubling
#        the update and halving the update count at fixed steps).
#   RW-4 L3 (FP@500) on all three lanes (recommended, 5.5 h detached) or
#        one lane.
#   RW-5 launch ownership: hand-over (> 5 h; recommended per rule 4) —
#        the agent babysits and reads out.
# =====================================================================
env_id: ShowdownGen4-v0
seed: 200                   # lanes 2/3 via --seed 208 / 216; spares 224/232/240
total_steps: 50000000       # seat-1 decisions; seat 2 adds ≈ the same (D-DOSE: 2/3 of Wang's ≈ 75M per seat)
eval_every: 250000          # in-loop eval/win_rate n=100 — D-C: visible, not actionable
eval_episodes: 100
num_envs: 8                 # x rollout_steps 2496 = 19,968 seat-1 rows per update
torch_threads: 1
checkpoint_every: 500000    # 100 crossing rungs/lane, all retained until the readout (R0-g)
run_name: gen4_wang50m_s200 # lanes 2/3 via --run-name
logger: wandb
eval_win_rate: true
selfplay:
  opponent: self
  eval_opponent: heuristics # stock SH, the locked protocol's anchor (D-SH)
  pool_size: 1              # NO pool — the mirror (ruling 1); our pool/league is a held-back lever
  push_every_updates: 1     # the member during rollout k = the learner at rollout k's start
  latest_prob: 1.0
  harvest_both_seats: true  # BI-G4-1: seat 2's episodes join every update (Wang §3.1)
agent:
  algo: ppo
  trunk: entity_deepsets
  trunk_kwargs:
    layout: gen4            # BI-G4-2: layout v0.1 tuples + item/ability id tables
    species_vocab: 301      # the pinned vocab + row 0 (asserted at construction)
    move_vocab: 183
    item_vocab: 41
    ability_vocab: 102
    embed_dim: 64           # the ratified gen-1 widths (RW-2)
    entity_dim: 128
    pool: max
    ctx_sizes: [384, 384]
    scorer_sizes: [256]
    value_sizes: [384, 384]
  hidden_sizes: [512, 512]  # unread by the entity trunk; the gen-1 convention, kept for form
  lr: 5.8884e-5             # 10^-4.23 (Table A.3)
  lr_anneal_steps: 50000000 # == total_steps (R0-b); x = steps_seen / this
  lr_schedule: power        # lr0 / (8x + 1)^1.5 (thesis §3.1.4), floor lr0/27 at x = 1
  lr_power_a: 8.0
  lr_power_b: 1.5
  gamma: 0.9999
  gae_lambda: 0.754
  rollout_steps: 2496       # 8 x 2496 = 19,968 seat-1 rows (+ seat 2 ≈ 39,936 total = his 78 x 512)
  epochs: 7
  minibatches: 39           # 39,936 / 39 = 1,024 = his batch_size, over the seat-1 + seat-2 union
  clip_eps: 0.0829
  value_clip_eps: 0.0184    # BI-G4-6: SB3 clip_range_vf, SB3's form
  entropy_coef: 0.0588
  value_coef: 0.4375
  max_grad_norm: 0.543
# The machine-readable half — barred_language, the thresholds, the seeds,
# the arithmetic and ratified_decisions — lives in the SIDECAR
# configs/gen4_wang50m.prereg.yaml (a training Config accepts no extra
# keys; the ladder pre-regs have their own loader). tests/test_gen4_prereg.py
# asserts the sidecar against this file and this header's text.
