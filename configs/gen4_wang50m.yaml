#
# R0 — PER-LANE, FIRST 250K STEPS (PROVISIONAL BANDS — every number below
# is a smoke reading at 3 updates, RE-BASED from lane 1's own first 250k
# under the G9-VALIDATION RULE with the violation disclosed; a breach
# before re-basing is INVESTIGATED, not acted on):
#   R0-1 loss/entropy in [1.3, 2.1] (smoke 1.821 -> 1.806 over 3 updates;
#        10 actions -> ln 10 = 2.303 is the unmasked ceiling, and the
#        entropy is of the MASKED distribution, so ~1.8 is near-uniform
#        over the ~7 legal actions; the ent coef 0.0588 holds it high
#        early). Breach -> INVESTIGATE before re-basing.
#   R0-2 loss/clip_frac > 0.0 on every update (a bit-exact 0.0 across
#        7 × 40 minibatches means a frozen actor, a zero lr or a broken
#        ratio — epoch 1's seat-1 ratio is exactly 1 by construction, the
#        other six epochs and seat 2's recorded old_logp are not [R1-14])
#        KILL LANE.
#   R0-3 harvest/rows_this_update / harvest/seat1_rows in [0.7, 1.3] on
#        every update after the first (the first update's harvest is
#        short: only battles that finished inside it); harvest/version_
#        lag_max <= 2; harvest/rows_dropped / rows < 1%; harvest/discarded
#        == 0; harvest/empty RECORD, investigate above 1% of episodes
#        [R1-16]. The harvest keys are ABSENT (not zero) on an update with
#        no finished seat-2 episode [R2-S11]: absence after update 1 is
#        itself a KILL. Breach -> KILL LANE (the mirror is broken).
#   R0-4 eval/win_rate present, in [0, 1) at the first eval; breach ->
#        INVESTIGATE, never KILL (a 0.00 first reading is a weak policy,
#        not a broken lane) [R2-S3].
#   R0-5 ops deadline: the first ckpt_*.pt (step 500,000) on disk within
#        60 min of that lane's launch (500k / 290 steps/s = 29 min solo;
#        3-wide slower), else kill THAT lane,
#        investigate, relaunch fresh (a startup wedge, not a result).
#   R0-6 no non-finite loss/* (one reading suffices) KILL LANE.
# NO THROUGHPUT CELL IN R0 (startup windows invent records); rate is
# D-B's on conforming windows only.
#
# IN-RUN GATES:
#   D-A anneal liveness at the rungs nearest >= 5M / 25M / 50M, every
#       lane, both param groups. EXACT FORM (sync, closed) [R1-1]: with u
#       the checkpoint's own `updates` field (PPOAgent.state_dict), the
#       last schedule applied was from steps_seen = (u − 1) × 19,968 —
#       `_optimize` reads self.updates BEFORE incrementing it at the end
#       of the update — so x = ((u − 1) × 19,968) / 5e7 and the stored
#       optimizer lr == 5.8884e-5 × (8x + 1)^-1.5 to 1e-12 relative (the
#       u × 19,968 form is off by one update: −0.27% at 5M, −0.05% at 50M,
#       and would STOP every lane). Breach -> STOP that lane.
#   D-B throughput: REALIZED dStep/dWall (seat-1 steps) over >= 30-min
#       conforming windows post-1M. TWO references [R1-7]: solo 296 (the
#       smoke, suite running beside it — a lower bound) and FLEET-WIDTH
#       expected ≈ 0.7 × 290 ≈ 203 steps/s (the gen-1 sync precedent lost
#       ~30% 3-wide) -> PROVISIONAL band [173, 234]; RECORD < 0.85 × 203
#       = 173; STOP-AND-INVESTIGATE < 0.5 × 203 = 102 sustained 2 windows;
#       re-based from the fleet's first conforming windows, disclosed.
#       Progress is a RATE, never an ETA.
#   D-C in-loop eval/win_rate (n = 100, se 0.05, 200 readings/lane): logged,
#       visible, NOT ACTIONABLE; no mid-run curve appears in the readout
#       except through S-SHAPE at n = 1000.
#   D-D selfplay/winrate_latest, selfplay/winrate_anchor and
#       selfplay/anchor_games: at pool_size 1 push() replaces the sole
#       member, so stats[0] IS stats[-1] — all three series describe the
#       previous update's policy and read ~0.5 by construction; the
#       forgetting detector DOES NOT EXIST on this arm [R2-S10]. RECORD-only,
#       named so nobody reads a plateau into it.
#   D-E memory: per-lane peak RSS RECORD-ONLY; no per-lane threshold at
#       any width (lanes finish hours apart and the last runs solo). The
#       only STOP is box-level: free+inactive < 2 GiB AND swapouts DELTA
#       > 0 between consecutive polls (vm_stat's counter is cumulative —
#       the script logs the delta [R2-M7]), 3 consecutive 5-min polls ->
#       STOP ALL, disclose, resume.
#   D-F disk: RECORD < 30 GiB; STOP ALL < 15 GiB.
#   H1  harvest health every rung: rows ratio in [0.7, 1.3], version_lag_max
#       <= 2, dropped < 1%, discarded == 0 — RECORD a breach; STOP that
#       lane at 3 consecutive rungs outside.
#   K6  loss/entropy: EACH LANE'S OWN < 0.15 for 2 consecutive readings
#       BEFORE 25M -> STOP that lane [R1-8: a fleet median cannot select a
#       lane] (carried from R2/100M; gen 4 has no floor of its own —
#       PROVISIONAL, re-based at 5M from the fleet's own minima, disclosed).
#   T2  EACH LANE'S OWN clip_frac >= 0.90 ×3 consecutive -> STOP that lane
#       AND REPORT, never adjust (clip 0.0829 is 2.4× tighter than 0.2;
#       expect a higher clip_frac than gen 1's 0.03–0.28 — RECORD its
#       first-250k band and re-base T2 only if the fleet sits above 0.5
#       healthily; the smoke's 0.05 → 0.02 was read in a colder lr regime,
#       R2-S9).
#   T3  EACH LANE'S OWN approx_kl >= 0.5 ×3, or ANY non-finite loss/* (one
#       reading suffices) -> STOP that lane [R1-8].
#   COMPLETION: step == 50,000,000 exactly (sync); ckpt_050000000.pt IS
#       the completion rung and the PRIMARY's checkpoint.
#
# PEEKING / STOPPING POLICY (ruled): NO outcome-based early stop,
# extension, restart, lr change, config change or lane replacement (ops
# kills and the ORDERED spare protocol excepted). BARRED OUTRIGHT: any
# checkpoint evaluation — any n, any opponent, any lane — between launch
# and the last lane's end (steals CPU from the throughput read; an FP
# eval inflates a time-budgeted opponent's thinking budget; peeks the
# verdict axis). The ONE exception, pre-committed: the CLONE's tape
# collection and fit may run alongside the fleet (it is not an
# evaluation of any lane), with its s/battle logged so the fleet's D-B
# windows that overlap it are marked NON-CONFORMING. BARRED: extending
# past 50M mid-run even on a climbing log — that is a NEW pre-reg.
# Restated for the peeker: one vs-SH rung at n = 3000 is worth ±0.02.
#
# LANE-FAILURE RULE: lanes are independent; the fleet does NOT wait. A
# dead lane resumes with `--resume runs/<dir>` (read the REAL from_step
# from meta.yaml — checkpoint.pt lags the last logged step by far more
# than one update; expect updates_done one short per resume). A resume
# SPLITS the wandb history (extract_history.py HARD-FAILS: merge
# pre-resume rows _step < from_step + the whole post-resume run, verify
# monotonicity, into history_merged.csv before quoting ANY history
# statistic). A resume also LOSES the open seat-2 battles' harvested rows
# (nothing of the harvest is checkpointed; ≤ one rollout's worth) —
# disclosed per resume. A lane that cannot be resumed is reported as-is;
# at k <= 2 the primary is DESCRIPTIVE ONLY (cell K).
#
# OPS (maintainer launches; agent babysits, reads out):
#   GATE OWNERSHIP [R2-S8]: the SCRIPT owns preflight (R0-a/c/d/h/i/j/k1/l),
#   the CPU-delta stall check, auto-resume, the RSS / box / swapouts-delta
#   / disk sampling and the completion rung; the AGENT owns every METRIC
#   gate (R0-1..6, H1, K6, T2, T3, D-A, D-B, D-C, D-D) by reading each
#   lane's offline wandb history (scripts/extract_history.py; after a
#   resume, through history_merged.csv) and R0-5 from the watch log's
#   `latest=` field. A "launched pid N" line is NOT liveness (the launcher-
#   liveness landmine): the next `kill -0` five minutes later is, and the
#   retry counter bounds a dying launch [R2-S16].
#   scripts/gen4_wang50m_wave.sh — the ch5_100m_wave.sh pattern: preflight
#   (R0-a..d, h..l), three SYNC lanes staggered 60 s, `nohup caffeinate -dims …
#   < /dev/null &` (stdin REQUIRED: zsh job control suspends the launch
#   otherwise), per-lane logs logs/gen4_wang50m_lane_s<seed>.log, watch
#   loop with the CPU-DELTA stall check (`ps -o time=` twice, 15 s apart —
#   pgrep never catches alive-at-zero-CPU) and bounded auto-resume (3
#   zero-deltas -> resume, 3 retries/lane), RSS + box sampling. NO
#   encoder env vars exported. Every seat sends /timer on (the orphaned-
#   room deadlock; the env default). WALL CLOCK PLAN: 5e7 / 290 steps/s
#   = 47.9 h/lane solo; at a gen-1-like 3-wide loss (~30%) ≈ 60–70 h,
#   lanes concurrent -> 2–3 days; the post-fleet schedule adds ≈ 8 h
#   (below). A PLAN, never progress — progress is D-B's rate.
#
# POST-FLEET SCHEDULE, ORDER FROZEN (agent-side, detached, resume-safe,
# rate-readable; NOTHING evaluates while any lane trains):
#   1 vs-SH finals 3 × 3000 (PRIMARY; the smoke's eval ran 10 battles in
#     0.47 s, but those were ~20-decision losing battles — a final
#     checkpoint plays 40–70 decisions, so budget 8–10 min/lane [R1-17];
#     re-read at n = 20 first) -> 2 L2 FP@20 3 × 250 (15 min, sequential)
#     -> 3 L1 MDT 3 × 500 -> 4 S-SHAPE 10 rungs × 3 × 1000 (≈ 1.25 h)
#     -> 5 L3 FP@500 3 × 5 chunks × 50 (5.5 h sequential) -> 6 L4 clone
#     h2h 3 × 500 (iff the clone validated; else PENDING) -> 7 the Q38
#     pin -> 8 readout: RESULTS
#     addendum + README row (WAITS for every leg) + STATUS + SESSION_LOGS
#     in ONE commit; the milestone and step-5 branches read off THIS
#     header, never decided after.
#
# BUILD ITEMS (HANDOFF §2.2; each LANDED before this draft, with its
# commit, or named PENDING with its fallback):
#   BI-G4-1 both-seat harvest        LANDED 66746dc (7 offline + 2 live tests)
