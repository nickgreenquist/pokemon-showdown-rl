# decides, agents advise):
#   RW-1 the step-5 threshold: carry 0.756 AS RULED (recommended — it is
#        what three docs say and the read is insensitive at 0.001), or
#        re-pin to the arithmetic 0.757 (one se of the §3.1.2 validation
#        n = 200), or re-pin to 0.773 (one se at Table 4.1's implied
