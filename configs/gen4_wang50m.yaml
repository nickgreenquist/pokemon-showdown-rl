#           encoder, action space and network — so "his recipe as he ran it" on our trunk is a recipe TRANSPLANT,
#           not a controlled reproduction. Disclosed, never modelled.
#   D-COLL  his collection is non-lockstep per-worker buffers; ours is the lockstep sync vector loop (8 envs) with
#           seat-2 episodes joined whole at each update. Within-rollout staleness: a seat-2 battle spanning two
