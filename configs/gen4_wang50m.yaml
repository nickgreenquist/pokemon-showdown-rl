#   gates must PASS (G5 is gen-1 only; the Hidden-Power / happiness
#   suffixes are normalised by teacher_move_id — measured 2026-09-05:
#   53/53 rows, GATES PASS on the 3-battle smoke). Fit: `scripts/train_bc.py
