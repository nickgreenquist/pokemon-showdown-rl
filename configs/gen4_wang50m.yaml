#           D-NET: our old_logp for seat 1 is recomputed at update start (exact, lockstep), seat 2's is recorded;
#           our minibatch advantage normalisation is per minibatch (SB3's default, same); our −1e8 mask sentinel vs
#           his −inf; our critic is a separate stack (his shares a backbone); ours takes ~2.5% of its gradient
#           steps on a ≤38-row trailing slice at the full lr (the 40th slice, [R1-2]) where his batch divided exactly.
