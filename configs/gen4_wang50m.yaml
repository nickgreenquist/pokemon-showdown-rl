#           poke-env's 10 positional slots. Not reconcilable without a new head; disclosed.
#   D-ENC   his observation (Tables A.1/A.2: one-hot durations, binned HP, floor(pp^(1/3))) vs our layout v0.1
#           (scalar counters — Q49, the one unsupported choice, kept for the first fleet). Disclosed.
