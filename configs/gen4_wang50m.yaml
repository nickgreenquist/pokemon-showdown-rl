#   vs-SH n = 1000 (a clone that scores below MDT's placement is reported
#   and still used — L4 is a style-free anchor, not a strength claim).
#   Teacher budget named in every quote: FP@20. Ready by the readout or L4
#   reads PENDING.
#
# ---------------------------------------------------------------------
