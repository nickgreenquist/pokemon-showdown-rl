env_id: Showdown-v0
seed: 57
total_steps: 12000000
eval_every: 100000          # struct12m cadence VERBATIM — the 5-seed
eval_episodes: 100          # comparator was run at it (C7)
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_sp_actpred12m_placebo_s57
logger: wandb
eval_win_rate: true
env_kwargs:
  opp_action: true         # unchanged from the treatment arm (R0-P3)
selfplay:
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 150
  latest_prob: 0.8
agent:
  algo: ppo
  trunk: entity_deepsets
  aux_oppact_coef: 0.1     # IDENTICAL to the treatment arm — frozen
  aux_label_space: l6
  aux_shuffle_labels: true # THE ONE LEVER (P1). Everything else in
                           # this body is byte-identical to
                           # showdown_sp_actpred12m.yaml (R0-P3 diffs
                           # it mechanically before launch).
  aux_scorer_sizes: [96]
  aux_head_gain: 0.01
  aux_max_grad_norm: 0.5
  trunk_kwargs:
    species_vocab: 152
    move_vocab: 166
    embed_dim: 64
    entity_dim: 128
    pool: max
    ctx_sizes: [384, 384]
    scorer_sizes: [256]
    value_sizes: [384, 384]
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  lr_anneal_steps: 0
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 128
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
