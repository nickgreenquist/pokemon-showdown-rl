# P1. PERMUTATION SEMANTICS — WITHIN-ALLOW-CLASS, VALID ROWS, PER ROLLOUT
# ---------------------------------------------------------------------
# Uniform random permutation of `target` WITHIN exact-`allow`
# equivalence classes (6-bit key), over VALID rows only, whole rollout
# batch (128 x 8 = 1024 rows, always full). Invalid rows never donate
# or receive. Implemented as
# rl/networks/opp_action.py::shuffle_within_allow(target, allow, valid,
# generator), with the legality assert (allow.gather on valid all-true)
# a structural invariant of the function itself.
# PRESERVED EXACTLY: `valid` bitwise (hence aux_cross_entropy's
# denominator and the effective aux batch); legality of every trained
# label (donor and receiver share one allow vector); the global AND
# per-class label multisets (hence P(y|allow) w.r.t. the block's own
# empirical law); params 675,538; coef 0.1; decoupled clip 0.5; cadence;
# optimizer groups.
# DESTROYED: the obs-conditional law — exact w.r.t. the block's own
# empirical class-conditional multiset. RESIDUAL, disclosed (review R1):
# sampling WITHOUT replacement leaves an O(1/n_class) finite-block
# correlation (a row from a switch-heavy battle is slightly likelier to
# receive SWITCH; ~25 of ~830 rows in the dominant class come from the
# row's own battle). Magnitude ~0.1-3%, far below R-4's resolution;
# R-4(1)'s g_P is the catch-all.
# MATCH FRACTION IS NOT RETAINED INFORMATION: 0.243-0.330 of labels are
# unchanged by the permutation (the chance rate, closed form
# sum_c p_c sum_y q^2). The match event is invisible to the head; its
# conditional law is P(y|allow) either way. Do not read a third of
# labels surviving as a third of the signal surviving.
# DEVIATION FROM §12's RATIFIED TEXT, NAMED: §12 promised "same gradient
# magnitude". That cannot be delivered by ANY zero-information placebo:
# at the placebo head's floor its expected trunk gradient is ZERO-MEAN
# (minibatch noise), while the treatment's has a coherent component —
# equal norms are not equal dose, in either direction. The arm is
# shape-, count-, marginal-, coefficient- and cadence-matched; magnitude
# is MEASURED (P3), not matched. Bears on how B4 and the a-fortiori
# clause may be read.
# REJECTED, with the killing reason: global permutation (0.42-0.93% of
# rows land on -1e8 logits -> ~1e8 CE terms, silent today);
# permute-then-drop (shrinks valid count, selectively drifts the SWITCH
# marginal); resample-from-allow (marginal + dose drift); iid resample
# (breaks multiset preservation); DERANGEMENT (anti-information — an
# adversarial arm, not a placebo); fixed class relabeling (a bijection
# preserves everything); feature-row shuffling (second actor pass,
# +25% update, touches the policy path).
# IDENTITY ROWS (class < 2 valid rows in the block keeps its true
# label): measured mean 0.013-0.077%, worst full block 0.217%; their
# info ~0.0008 nats. Recorded as aux/shuffle_identity_frac,
# record-and-investigate above 0.01 whole-run mean (14-50x headroom).
# THE ESCALATION CLAUSE IS DELETED (review R1-13: cross-class swaps
# violate the per-class-multiset invariant, "smallest superset" does
# not give mutual legality, and a mid-run switch is a second lever).
