# =====================================================================
# THE 100M RUN — SYNC FALLBACK BRANCH. Committed WITH showdown_sp_100m
# .yaml (2026-09-01) so the G9-FAIL / G8-STOP branch needs no launch-time
# edit. THE PRE-REGISTRATION IS THE ASYNC FILE'S HEADER; this file exists
# only to make that header's launch branch executable. Deltas vs the
# async file: no collector block (the sync vector loop — bit-identical
# to the control's collection path), run_name suffix _sync. On this
# branch: A-COLL is VOID by construction (N-TIMER's disclosure still
# travels); D-A and the completion check revert to their exact closed
# forms; the async-only gates (R0-3/R0-4/R0-7, D-G/D-H/D-I) drop; D-B's
# expectation is the Stage-1 sync projection (~480 3-wide), floors
# unchanged. Seeds/run names: 104/112/120, showdown_sp_100m_sync_sN.
# =====================================================================
env_id: Showdown-v0
seed: 104                  # lanes 2/3 via --seed 112 / 120 (ADJ-1)
total_steps: 100000000     # THE LEVER (L1)
eval_every: 250000         # unchanged (S3); 400 evals ~ 0.58 h/lane
eval_episodes: 100
num_envs: 8                # x rollout_steps = the 30,720-step update budget
torch_threads: 1
checkpoint_every: 500000   # unchanged (S4); 200 rungs/lane
run_name: showdown_sp_100m_sync_s104   # lanes 2/3 via --run-name
logger: wandb
eval_win_rate: true
env_kwargs:
  opp_action: true
selfplay:
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 5
  latest_prob: 0.8
agent:
  algo: ppo
  trunk: entity_deepsets
  aux_oppact_coef: 0.1
  aux_label_space: l6
  aux_scorer_sizes: [96]
  aux_head_gain: 0.01
  aux_max_grad_norm: 0.5
  trunk_kwargs:
    species_vocab: 152
    move_vocab: 166
    embed_dim: 64
    entity_dim: 128
    pool: max
    ctx_sizes: [384, 384]
    scorer_sizes: [256]
    value_sizes: [384, 384]
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  lr_anneal_steps: 100000000  # LEVER-COUPLED (R0-b: == total_steps)
  gamma: 1.0
  gae_lambda: 0.95
  rollout_steps: 3840
  epochs: 4
  minibatches: 120
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
