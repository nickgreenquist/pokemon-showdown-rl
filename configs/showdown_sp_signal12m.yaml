# ---------------------------------------------------------------------
# ENTROPY: entropy_coef STAYS 0.01 (a deliberate deviation from H&L)
# ---------------------------------------------------------------------
# H&L use NO entropy bonus. We keep 0.01. Reasons, in order:
#   1. It is not part of the SIGNAL design. Discount and shaping define
#      the objective; the entropy bonus is a regularizer on the optimizer.
#      This rung is about the objective.
#   2. It would be a THIRD simultaneous change, in a bundle already
#      carrying two, at a budget where each cell costs ~7 h.
#   3. The repo's standing entropy alarm (median < 0.15) is calibrated AT
#      entropy_coef 0.01; dropping it invalidates the gate and its
#      predecessors. The preview's trace (1.88 -> ~0.40, never near 0.15)
#      is the reference curve we want to keep reading against.
#   4. Scale asymmetry: H&L chose no-entropy at 2-3e8 decisions. At 12M
#      (1/20th of that) premature determinism is the larger risk, not
#      excess exploration.
#   5. The change is a no-op in relative terms anyway: advantages are
#      z-scored PER MINIBATCH, so the entropy term's weight against the
#      surrogate is invariant to the discount change — there is no
#      "gamma 0.95 makes 0.01 too strong" effect to correct for.
# PRE-DECLARED FOLLOW-UP "SIGNAL-b" (entropy_coef 0, one 12M lane set,
# seeds from the next free block): runs ONLY if (a) this rung credits and
# the maintainer buys fidelity, or (b) K1 fires. Never both directions,
# never as a rescue of a null.
#
# OTHER H&L SETTINGS DELIBERATELY NOT ADOPTED (recorded so the deviation
# list is complete, all from expts/01.json): gae_lambda 0.9 (we hold 0.95
# — lambda interacts with gamma and would widen the bundle to three;
# note gamma*lam is already 0.9025 here vs their 0.855), clip 0.1 (we
# hold 0.2), epochs 6 (we hold 4), minibatch 8192 (we run 1024/update in
# 4 minibatches of 256), weight_decay 2e-6 (we hold 0), no grad clip (we
# hold max_grad_norm 0.5), constant lr 2e-4 (we hold the preview's flat
# 2.5e-4). These are the optimizer's shape, not the signal; changing them
# is a separate, later, and much less interesting rung.
#
# ---------------------------------------------------------------------
# BUDGET AND SEEDS
# ---------------------------------------------------------------------
# 12M x 3 lanes at the preview's measured 537/535/535 steps/s median
# (3-wide) = 6.2 h; with the <=15% shaping budget, ~6.4-7.1 h wall.
# Finals eval 3 x 1000 battles ~1 h. Optional escalation +2 h.
# SEEDS 23/24/25 (0-22 are claimed: 0-2 lra, 3-5 lra12m, 6-8 Arm B,
# 9 smoke, 10-12 sp12m_v2, 13 sp smoke, 14-16/17-19/20-22 reserved by the
# warmrl draft). Seed 29 for the R0-2 live smoke. Distinct seeds are
# MANDATORY across lanes AND arms — poke-env derives usernames from the
# global `random` stream and a collision kills the loser at first reset
# with a misleading "Agent is not challenging".
#
# CODE THAT MUST LAND (and be committed) BEFORE LAUNCH:
#   1. `hl_shaping` kwarg on ShowdownSingles + ShowdownEnv; the cursor
#      dict + reset() clear; the 5-term mapping above.
#   2. `--no-shaping` on scripts/eval_checkpoint.py.
#   3. Test stub attrs (_replay_data, player_role) + an offline unit test
#      that IS R0-2(a).
#   Commit docs and code BEFORE launching; launch from a clean tree —
#   launches stamp git_dirty and one untracked file flips it.
#
# Launch (server on :8000 with simulator: 4; 3 lanes, staggered starts;
# verify each lane by battle PROGRESS):
#   POKEMON_RL_ENCODER_V2=1 WANDB_MODE=offline python -m rl.train \
#     --config configs/showdown_sp_signal12m.yaml --seed N \
#     --run-name showdown_sp_signal12m_sN
env_id: Showdown-v0
seed: 23
total_steps: 12000000
eval_every: 100000
eval_episodes: 100
num_envs: 8
torch_threads: 1
checkpoint_every: 200000
run_name: showdown_sp_signal12m_s23
logger: wandb
eval_win_rate: true
env_kwargs:
  hl_shaping: 1.0        # TREATMENT 2/2: scale on H&L's 5-term zero-sum
                         # event shaping (1.0 = their magnitudes verbatim).
                         # faint_shaping stays absent/0.0 — Arm B is closed.
selfplay:                # identical to showdown_sp12m_v2.yaml
  opponent: self
  eval_opponent: heuristics
  pool_size: 20
  push_every_updates: 150
  latest_prob: 0.8
agent:
  algo: ppo
  hidden_sizes: [512, 512]
  lr: 2.5e-4
  lr_anneal_steps: 0
  gamma: 0.95            # TREATMENT 1/2: H&L (expts/01.json). Was 1.0.
  gae_lambda: 0.95       # held at the preview's value; H&L use 0.9
  rollout_steps: 128     # 8 envs x 128 = 1024 per update, the Phase 4 cadence
  epochs: 4
  minibatches: 4
  clip_eps: 0.2
  entropy_coef: 0.01     # deliberate deviation from H&L's 0; see ENTROPY
  value_coef: 0.5
  max_grad_norm: 0.5
