# ---------------------------------------------------------------------
# THE TREATMENT (a two-part BUNDLE, deliberately not splittable — see
# "WHY BUNDLED" below)
# ---------------------------------------------------------------------
#
#   1. gamma 1.0 -> 0.95
#   2. hl_shaping 0.0 -> 1.0: the 5-term ZERO-SUM event shaping, applied
#      per seat from protocol events, antisymmetric by construction.
#
# Provenance: `docs/prior_work/README.md` H&L entry (VERIFIED 2026-08-07) and
# the code it names — `yuzeh/metagrok`, cloned at
# /Users/nickgreenquist/Documents/Projects/metagrok, MIT. The constants
# are `expts/01.json` verbatim; the attribution rule is
# `metagrok/pkmn/reward_shaper.py::NewRewardShaper` with zero_sum=True,
# read line by line this session. Neither the magnitudes nor the signs
# are in the paper — they exist only in that code.
#
# EXACT EVENT -> REWARD MAPPING (ours, per step, from OUR seat's view;
# `who` = battle.player_role in {"p1","p2"}; a protocol line is a split
# message ["", tag, "p1a: Snorlax", ...] so index 1 is the tag and index
# 2 is the named Pokemon; v = +1 if index 2 startswith `who`, else -1):
#
#     tag                 w          reward contribution = hl_shaping*w*v
#     |faint|             -0.0125    our mon faints -0.0125; theirs +0.0125
#     |-fail|             -0.0050    named on us -0.005; on them +0.005
#     |-supereffective|   -0.0025    SE hit on us -0.0025; on them +0.0025
#     |-resisted|         +0.0025    we resisted +0.0025; they resisted -0.0025
#     |-immune|           +0.0050    we were immune +0.005; they were -0.005
#
# ANTISYMMETRY IS EXACT AND IS THE WHOLE SAFETY ARGUMENT. One protocol
# line contributes +hl_shaping*w to the named side and -hl_shaping*w to
# the other — the same float, negated. In mirror self-play both seats run
# this identical rule, so no policy can farm the shaping: every +delta it
# harvests hands -delta to a copy of itself. Per-episode, summed over both
# seats, the shaping is exactly 0.0 (IEEE 754: negation and addition are
# sign-symmetric, so seat 2's partial sums are the exact negatives of seat
# 1's given the same event order). That is R0-2 below, and it is a
# property we can ASSERT rather than argue.
#
# ---------------------------------------------------------------------
# WHERE IT LIVES, AND WHY IT IS IMPLEMENTABLE PER STEP (checked against
# installed poke-env 0.15.0 this session)
# ---------------------------------------------------------------------
#
# New env kwarg on ShowdownSingles: `hl_shaping: float = 0.0` (a SCALE on
# the table above; 1.0 = H&L magnitudes, 0.0 = off and bit-for-bit the
# current reward path). Threaded through ShowdownEnv exactly like
# `faint_shaping`, set from `env_kwargs:` in the config. The two shaping
# levers are independent and MUTUALLY EXCLUSIVE in practice: faint_shaping
# stays 0.0 here (Arm B is closed).
#
#   (a) THE EVENTS ARE VISIBLE, AND ONLY HERE. `-supereffective`,
#       `-resisted`, `-fail` and `-immune` are ALL in poke-env's
#       MESSAGES_TO_IGNORE — they are recoverable from NOWHERE in the
#       parsed battle state. `AbstractBattle._replay_data`
#       (abstract_battle.py:146) is appended as the FIRST line of
#       `parse_message` (:566), BEFORE the ignore filter, so all four are
#       in it. This is the core finding of
#       docs/prior_work/HISTORY_FEATURES_DESIGN.md, and this rung is its first
#       consumer. `|faint|` is not ignored, but reading it from the same
#       log keeps ONE code path and one attribution rule.
#   (b) BOTH SEATS ARE SCORED EVERY STEP. poke-env's PokeEnv.step calls
#       `calc_reward(battle1)` AND `calc_reward(battle2)` (env.py:458-459)
#       on every step; SingleAgentWrapper simply discards seat 2's. So the
#       zero-sum property is directly instrumentable in-process — no
#       second env, no offline reconstruction.
#   (c) NO DOUBLE-COUNTING ACROSS THE WAIT PUMP. ShowdownEnv.step absorbs
#       wait states in a loop and SUMS the rewards (~6.4% of raw steps).
#       Implementation is a per-battle CURSOR — `self._event_cursor:
#       dict[object, int]`, identity-keyed on the battle object exactly
#       like `_faint_potential`, advanced to `len(_replay_data)` on every
#       call and cleared in `reset()`. Each event is therefore consumed
#       exactly once per seat regardless of pumping, and the two seats'
#       potentials/cursors cannot fuse (both battles share a battle_tag;
#       identity keying is the existing, correct choice).
#   (d) TERMINAL FRAME IS INCLUDED. `battle_queue.race_get` returns only
#       after the frame is parsed, so the deciding `|faint|` is already in
#       `_replay_data` when the terminal `calc_reward` runs. R0-2 is what
#       proves this rather than asserting it.
#   (e) `_replay_data` also receives ["", "tie"] and ["", "win", name]
#       (:1259, :1326). Neither collides with the five tags; entries
#       shorter than 3 fields are skipped.
#   (f) TEST STUBS. tests' reward-only stub battles must gain explicit
#       `_replay_data = []` and `player_role = "p1"` attributes — read
#       directly, never getattr-defaulted (the HISTORY_FEATURES rule).
#
# RECORDED QUIRK, REPRODUCED VERBATIM ON PURPOSE: Showdown's `|-fail|`
# names the Pokemon the failed action was AIMED AT. When our status move
# fails against an already-statused opponent, the line names THEM, and
# H&L's rule pays US +0.005 for our own move failing. We reproduce it
# unchanged — fidelity to the one verified recipe is the point of this
# rung, and the term stays exactly zero-sum so it cannot be farmed in
# mirror play. Counted as S6 below; correcting it is a legal follow-up
# ONLY if this arm credits.
#
# ---------------------------------------------------------------------
# WHY BUNDLED, AND WHY gamma 0.95 ALONE WOULD BE A STRICT DOWNGRADE
# ---------------------------------------------------------------------
#
# Measured on the preview's own histories: mean episode length over the
# last 40 logged rungs is 26.4 / 27.0 / 27.7 decisions (s10/s11/s12). At
# gamma 1.0 the terminal +-1 reaches V(s_0) at full strength. At gamma
# 0.95 it arrives as 0.95^27 ~ 0.25 — a 4x attenuation of the ONLY signal
# the preview had. Running gamma 0.95 without dense shaping would test a
# strictly worse configuration and tell us nothing about H&L. The two
# changes are one design: the discount shortens the credit window and the
# event terms fill it. The bundle is the hypothesis.
#
# Effective credit horizon: gamma*lam goes 0.95 -> 0.9025, i.e. ~20 ->
# ~10 decisions of exponentially-weighted credit — roughly one third of a
# battle instead of two thirds.
#
# BUNDLING CAVEAT, house rule (same words as the preview): a positive
# result DEMONSTRATES, it does not ATTRIBUTE. Attribution ablations
# (gamma-only, shaping-only) are paid for only on success.
#
# ---------------------------------------------------------------------
# WHY ARM B'S NULL DOES NOT CONTRADICT THIS
# ---------------------------------------------------------------------
#
# Arm B (showdown_faint6m, SCREENED OUT 2026-08-06 at delta -0.0004) and
# this rung differ in all four load-bearing respects:
#
#   1. FORM. Arm B was POTENTIAL-BASED with Phi(terminal) := 0, so the
#      whole episode's shaping telescopes to exactly zero — policy
#      invariant by Ng et al. 1999, by construction. That cancellation is
#      precisely WHY it could not change the optimum, and the recorded
#      diagnosis ("potential-based shaping ~linear in already-encoded
#      features is inert; Phi = 0.6*(obs[2]-obs[1])") is the mechanism.
#      H&L's terms do NOT cancel: they are a genuine change to the
#      objective, not a re-timing of credit.
#   2. DISCOUNT. Arm B ran at gamma 1.0, where the telescoping is exact.
#      Here gamma 0.95 makes the near-term event terms the DOMINANT
#      component of V near the start of a battle (~0.25 of terminal signal
#      left at t=0; see above).
#   3. INFORMATION CONTENT. Arm B's single term was faints — fully
#      encoded, hence inert by its own rule. Four of these five terms are
#      events our encoder CANNOT see at all (they are in
#      MESSAGES_TO_IGNORE). Honest qualifier: SE/resisted/immune against
#      the opponent's ACTIVE are partly predictable from the damage
#      multipliers v2 already encodes; the incoming direction (their move,
#      possibly unrevealed) and `-fail` are not predictable at all. So
#      "not encoded" is partial, not total — weaker than Arm B's fully
#      linear case, which is the point.
#   4. OPPONENT. Arm B trained vs SimpleHeuristics, where a non-cancelled
#      shaping is farmable and the trade-down failure mode is real (a
#      clean-sweeping 48%-win policy outscoring a trading 50%-win one).
#      Mirror self-play with an antisymmetric term removes that failure
#      mode by symmetry rather than by cancellation. This is the
#      substitution that makes a non-policy-invariant shaping safe here
#      and would not have been safe there.
#
# ---------------------------------------------------------------------
# gamma 0.95: CONSEQUENCES FOR THE BUFFER, GAE AND THE VALUE HEAD
# ---------------------------------------------------------------------
#
#   - compute_gae (rl/buffers/rollout.py) takes gamma as an argument and
#     needs no change: delta_t = r_t + gamma*V(s')*(1-terminated) - V(s),
#     chained by gamma*lam. Termination zeroes the bootstrap, so the +-1
#     still lands undiscounted on the final row and is discounted backward
#     from there. Nothing in the buffer assumes gamma == 1.
#   - VALUE TARGET BOUND. Targets stop being the exact +-1 of every prior
#     Showdown run. Formal bound |V| <= 1 + s_max/(1-gamma) where s_max is
#     the max per-step shaping; a pathological step (double faint + SE +
#     immune) is ~0.035, giving |V| <= ~1.7 in the limit. From MEASURED
#     event rates (HISTORY_FEATURES: SE 4-7%/decision, fail ~7%; total
#     faints ~8-10 per decided battle) the realistic per-episode shaping
#     magnitude is ~0.05-0.15, so |V| <~ 1.15 and the un-normalized value
#     loss inflates by <~15% against value_coef 0.5 — inside noise. This
#     is the quantitative reason this shaping is SAFE where an uncancelled
#     potential form at gamma 1.0 (the ~2.5x inflation the Arm-B docstring
#     warns about) would not have been. value_coef stays 0.5.
#   - EXPLAINED VARIANCE should get EASIER, not harder: the target now
#     carries within-episode signal instead of one terminal bit. Recorded
#     as a pre-stated prediction (S2); a WORSE EV than the preview at
#     matched steps is a mechanism finding worth reporting.
#   - ROLLOUT/EPISODE_RETURN NO LONGER EQUALS THE OUTCOME. It becomes
#     outcome + (undiscounted sum of shaped terms), so a win logs ~+1.05
#     and a loss ~-1.05. Across the mirror population the shaping is
#     zero-sum and seat assignment is symmetric, so its MEAN stays ~0 and
#     `rollout/episode_return` remains comparable to the preview in mean
#     but not per-episode. Both facts are gated (R0-3).
#
# ---------------------------------------------------------------------
# EVAL PURITY — THE SIGN-BUG LANDMINE, RESTATED FOR SHAPED REWARDS
# ---------------------------------------------------------------------
#
# `eval/win_rate` comes from env-supplied info["outcome"] in {-1,0,+1} and
# NEVER from the sign of the return — the measured landmine is that a
# reward-sign inversion would report 100% and pass its own detector.
# info["outcome"] is computed by `battle_outcome()` from battle.won/lost
# and is structurally immune to anything shaping does. Likewise
# `selfplay/winrate_anchor` and `winrate_latest`: PoolPlayer.report_outcome
# is fed info["outcome"], so R1 stays comparable to the preview.
#
# WHAT SHAPING DOES BREAK: eval_checkpoint.py's `wins_from_returns` /
# `ties_from_returns` cross-check — the repo's standing guard against
# exactly that sign bug. Under shaping, returns are no longer +-1 and
# `ties_from_returns` collapses toward 0, so the guard would fire
# spuriously and, worse, would be ignored as expected noise. RESTORE IT
# rather than lose it:
#
#   REQUIRED CODE (small, pre-declared): `--no-shaping` on
#   scripts/eval_checkpoint.py, which sets cfg.env_kwargs["hl_shaping"]=0
#   before make_eval_env. EVERY locked-protocol eval in this rung runs
#   with it. Then returns are +-1 again, `win_rate` and
#   `wins_from_returns` must agree EXACTLY as in every prior run, and the
#   headline number is produced by an eval env that is bit-for-bit the
#   preview's. Shaping never touches a reported number.
#   (make_eval_env cannot express this via extra_env_kwargs — it asserts
#   no overlap with config-derived kwargs — and eval_checkpoint.py takes
#   its config from the checkpoint, so the flag is the minimal seam.)
#   In-training evals keep shaping on and their eval/return_mean is
#   therefore NOT comparable across the treatment boundary; only
#   eval/win_rate is read.
#
