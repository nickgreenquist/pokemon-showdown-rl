
# SAC on Walker2d-v5 — Phase 3 benchmark run. Every number is identical to
# configs/halfcheetah_sac.yaml, which carries the full annotation.
#
# Env note: like Hopper, Walker2d terminates, so the bootstrap mask is live.
# Anchors are the widest-spread of the three (2711-5007 across sources) and
# v4->v5 transfer is directional only: v5 fixed the right foot's friction from
# 0.9 to 1.9, which is also why our PPO's 1.36x over its own anchor is
# confounded rather than a finding.
env_id: Walker2d-v5
seed: 0
total_steps: 1000000
eval_every: 50000
eval_episodes: 10
run_name: walker2d_sac
device: cpu
normalize_obs: false
normalize_reward: false
logger: wandb
agent:
  algo: sac
  hidden_sizes: [256, 256]  # separate actor and twin critics, all this shape
  activation: relu
  q_lr: 1.0e-3              # also the temperature optimizer's lr
  policy_lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  buffer_capacity: 1000000
  learning_starts: 5000     # uniform random actions until here
  policy_frequency: 2
  target_network_frequency: 1
  autotune: true            # target entropy is -act_dim, derived not configured
  alpha: 0.2                # unused while autotune is true
