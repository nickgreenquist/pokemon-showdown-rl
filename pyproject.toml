[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-showdown-rl"
version = "0.1.0"
description = "RL agent for Pokemon Showdown Gen 1 random battles, played via poke-env against a local Showdown server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.13.0",
    # Env driver for the capstone task: battle-protocol client/env layer over a
    # local Node.js Showdown server (vendored at showdown/, gitignored).
    "poke-env==0.15.0",
    "numpy==2.5.1",
    "wandb==0.28.1",       # default logger (offline by default)
    "tensorboard==2.21.0", # offline fallback logger
    "pyyaml==6.0.3",
    # Imported directly by scripts/record.py (frame annotation + GIF encode).
    "pillow==12.3.0",
    # --- Inherited from the predecessor repo (deep-rl-from-scratch) ---
    # Spine pruned 2026-08-05 to what the capstone uses: classic-control
    # (CartPole/Pendulum — PPO harness tests + DESIGN.md's Arm C spine gate)
    # and MinAtar (same gate). DQN/SAC/MuJoCo/box2d/toy-text/open_spiel went
    # with the spine; Connect 4 survives only as the two-player test fixture
    # for the self-play harness tests.
    "gymnasium[classic-control]==1.3.0",
    "minatar==1.0.15",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["rl*"]
