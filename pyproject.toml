[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# NOTE: the chapter-3 search line needs poke-engine (gen1 source build) —
# deliberately NOT listed here (maintainer ruling 2026-08-21): see
# requirements-search.txt for the exact install command and why.
[project]
name = "pokemon-showdown-rl"
version = "0.1.0"
description = "RL agent for Pokemon Showdown Gen 1 random battles, played via poke-env against a local Showdown server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.13.0",
    # Env driver for the capstone task: battle-protocol client/env layer over a
    # local Node.js Showdown server (vendored at showdown/, gitignored).
    "poke-env==0.15.0",
    "numpy==2.5.1",
    "wandb==0.28.1",       # default logger (offline by default)
    "tensorboard==2.21.0", # offline fallback logger
    "pyyaml==6.0.3",
    # --- Inherited from the predecessor repo (deep-rl-from-scratch) ---
    # Spine pruned 2026-08-05, and again 2026-08-29 (maintainer-ruled,
    # CLEANUP A3): MinAtar and the continuous-PPO track retired — Arm C is
    # PARKED and DESIGN.md is SPENT, so the spine gate they served is dead.
    # classic-control stays (CartPole is the cheap discrete harness fixture;
    # Pendulum backs the normalize-wrapper tests); Connect 4 survives as the
    # in-process two-player test fixture. The minatar_*.yaml configs are kept
    # as provenance for the banked anneal negative but can no longer run here.
    "gymnasium[classic-control]==1.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# Human-replay corpus survey (DESIGN.md §4 Track 1 / §10). Only needed to run
# scripts/corpus_survey.py, which downloads and measures the single
# gen1randombattle parquet from HolidayOugi/pokemon-showdown-replays at a
# pinned revision. Not needed by rl/ or by the test suite.
corpus = [
    "huggingface-hub==1.26.0", # pinned-revision download of one parquet file
    "pyarrow==25.0.0",         # read that parquet without pandas in the loop
    "hf-xet==1.6.0",           # Xet-backed transfer for the 200 MB file
]

[tool.setuptools.packages.find]
include = ["rl*"]

[tool.pytest.ini_options]
# `live_server`: the test opens a websocket to the local Showdown server on
# :8000 (each such test also carries the skipif(_server_up()) guard, so it
# skips without one). Deselect the whole class with `-m "not live_server"` —
# needed whenever a server is up for a training fleet that must not be touched.
markers = [
    "live_server: needs a Showdown server on localhost:8000 (skips without one)",
]
