[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-showdown-rl"
version = "0.1.0"
description = "RL agent for Pokemon Showdown Gen 1 random battles, played via poke-env against a local Showdown server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.13.0",
    # Env driver for the capstone task: battle-protocol client/env layer over a
    # local Node.js Showdown server (vendored at showdown/, gitignored).
    "poke-env==0.15.0",
    "numpy==2.5.1",
    "wandb==0.28.1",       # default logger (offline by default)
    "tensorboard==2.21.0", # offline fallback logger
    "pyyaml==6.0.3",
    # Imported directly by scripts/record.py (frame annotation + GIF encode).
    "pillow==12.3.0",
    # --- Inherited from the predecessor repo (deep-rl-from-scratch) ---
    # The rl/ package still carries that project's spine (DQN, SAC, Connect 4,
    # MinAtar, MuJoCo envs) and its tests, copied wholesale. These pins exist
    # only because that code imports them; prune them together with the spine.
    # box2d (LunarLander) needs swig at install time: brew install swig
    "gymnasium[classic-control,toy-text,box2d,mujoco]==1.3.0",
    "minatar==1.0.15",
    "mujoco==3.10.0",
]

[project.optional-dependencies]
# open_spiel is a dev-only differential-test oracle for the inherited Connect 4
# spine tests (tests/test_connect4_oracle.py); prunes with the spine.
dev = ["pytest==9.1.1", "open_spiel==2.0.1"]

[tool.setuptools.packages.find]
include = ["rl*"]
